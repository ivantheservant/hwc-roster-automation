<script>
  /* ============================================================
   * 第四十一輪批次 B 組：〔檢查我的改動〕＋〔請系統幫我調整〕
   * ============================================================
   *
   * Ivan 講嘅缺口：
   *   「我改完之後，需要檢查我嘅改動有冇違反好重要嘅規則（一粒檢查掣），
   *     同埋一粒掣俾系統調整成張表。幹事可以喺一張新嘅工作表睇系統建議
   *     嘅版本，再撳一粒掣接受。亦都可以直接喺嗰張建議版本上再改，
   *     然後再撳『調整』，重複到滿意為止。」
   *
   * ⚠️ 呢個唔係由零做。系統本來就有 `FineTune.gs` 嗰條路
   *（`proposeMinimalFix()` 最小改動修復）。呢一組係**把佢接上主流程**。
   *
   * ⚠️ 載入次序：要排喺 `ScriptZone1` 之後——會叫 `openSaveAndConfirm()`。
   */

  /* ── 一、〔檢查我的改動〕：唯讀 ──────────────────────────── */

  function openCheckMyChanges() {
    runAction('檢查你的改動', async () => {
      const r = await callServer('apiCheckMyChanges', currentQuarterId);
      if (!r.ok) {
        openModal('檢查我的改動', [para(r.message)],
          [button('知道了', () => closeModal(), '')]);
        return;
      }
      renderCheckResult(r);
    });
  }

  function renderCheckResult(r) {
    const nodes = [];

    // ⚠️ 一定要講明呢粒掣**乜都唔會改**。唔講嘅話，
    // 幹事撳完唔敢再撳第二次，驚改咗啲嘢。
    // ⚠️ 第四十二輪批次 E 組：零改動嗰陣兩句自相矛盾——
    //「你改的 **0 格**全部沒有問題，可以儲存。」跟住「你還沒有改過任何一格。」
    // 一格都冇改，根本冇嘢可以儲存。呢個係「一個數字係 0 嗰陣，
    // 文案讀落合唔合理」嗰條問題——每一句由數字砌出嚟嘅字都要問一次。
    const noChange = r.changes.length === 0;
    nodes.push(make('div', { className: 'statuscard' }, [
      make('div', {
        text: noChange
          ? '你還沒有改過任何一格。'
          : (r.allClear
            ? ('你改的 ' + r.changes.length + ' 格全部沒有問題，可以儲存。')
            : '下面幾項要看一看。'),
        className: 'statuscard-title'
      }),
      make('div', {
        text: '這一粒掣只看，不會改動任何東西。',
        className: 'statuscard-sub'
      })
    ]));

    // ── 改了哪幾格 ──────────────────────────────────────────
    if (r.changes.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('你改了這 ' + r.changes.length + ' 格')
      ]);
      r.changes.forEach((c) => {
        box.appendChild(make('div', {
          text: humanDate(c.serviceDate) + '　' + c.postNameTC
            + (Number(c.slotIndex) > 1 ? (' ' + c.slotIndex) : '')
            + '　' + c.fromName + ' → ' + c.toName,
          className: 'ok-line'
        }));
      });
      nodes.push(box);
    } else {
      // ⚠️ 上面張狀態卡已經講咗同一句。喺度再講一次，
      // 讀落好似系統講咗兩件唔同嘅事。改成講返「噉點做」。
      nodes.push(para('去〔查看／修改職事表〕在表上改，改完回來再撳這一粒。', 'muted'));
    }

    // ── 名字認不出 ──────────────────────────────────────────
    if (r.unresolved.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.unresolved.length + ' 格的名字系統認不出'),
        make('div', {
          text: '這幾格在儲存的時候會被擋住。到時那個畫面有〔立即加入這個人〕。',
          className: 'muted'
        })
      ]);
      r.unresolved.forEach((u) => {
        box.appendChild(make('div', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC
            + '　你打了「' + u.text + '」'
            + (u.expectedText ? ('，本來應該是「' + u.expectedText + '」') : ''),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    // ── 違反規則 ────────────────────────────────────────────
    if (r.violations.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.violations.length + ' 格違反了規則')
      ]);
      r.violations.forEach((v) => {
        // 用返共通嗰個人話轉換——規則代號對幹事嚟講同一串亂碼冇分別。
        box.appendChild(make('div', {
          text: humanViolationLine({
            serviceDate: v.serviceDate, postNameTC: v.postNameTC,
            slotIndex: v.slotIndex, personName: v.personName,
            ruleId: v.ruleId, reason: v.reason
          }),
          className: 'vio-row'
        }));
      });
      box.appendChild(make('div', {
        text: '撳〔請系統幫我調整〕，系統會嘗試用最少的改動修好這幾格。',
        className: 'muted'
      }));
      nodes.push(box);
    }

    // ── 空格 ────────────────────────────────────────────────
    if (r.blanks.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.blanks.length + ' 格還沒有人'),
        make('div', {
          text: '講員／翻譯／獻花那幾欄不算在內——它們本來就留給你自己填。',
          className: 'muted'
        })
      ]);
      r.blanks.forEach((b) => {
        box.appendChild(make('div', {
          text: humanDate(b.serviceDate) + '　' + b.postNameTC
            + (Number(b.slotIndex) > 1 ? (' ' + b.slotIndex) : ''),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    openModal('檢查我的改動', nodes, [
      button('知道了', () => closeModal(), ''),
      button('請系統幫我調整', () => { closeModal(); openBuildSuggestion(); }, 'secondary')
    ]);
  }

  /* ── 二、〔請系統幫我調整〕：產生建議版本 ─────────────────── */

  /**
   * ⚠️ 第四十五輪批次：**呢個函式唔可以直接做點擊處理。**
   *
   * `button()` 做嘅係 `addEventListener('click', onClick)`，所以直接綁嘅話，
   * `startFrom` 收到嘅係一個 **MouseEvent**，而佢會原封不動傳落
   * `apiBuildSuggestion` 做第 1 個參數 ⇒
   *
   *     Failed due to illegal value in property: 1
   *
   * 現場就係噉樣爆嘅（`ScriptMainFlow.html` 嗰粒
   * `stepButton('請系統幫我調整', openBuildSuggestion, …)`）。
   * 而 `1` 就係參數索引——後端一次都冇被叫到。
   *
   * 綁掣一律用 `() => openBuildSuggestion()`。
   * `tools/lint-handler-args.js` 會擋住直接綁。
   *
   * @param {string=} startFrom 幹事喺「用邊一張做起點」小窗揀嘅答案
   * @param {string[]=} allowKeys 第四十六輪批次 C3 組：幹事**明確勾咗**
   *   准系統調整嗰幾格。冇傳 ⇒ 一格都唔准動。
   */
  function openBuildSuggestion(startFrom, allowKeys) {
    // ⚠️ 保底：就算將來有人再直接綁，都唔會送一個事件物件上去。
    // 呢個唔係用嚟代替上面嗰條規矩——`sanitizeServerArgs_()` 會照樣
    // 喺送出之前擋住，而 lint 會喺 commit 之前擋住。三層都要有，
    // 因為呢一個 bug 上一輪令我查錯咗成個後端。
    const from = (typeof startFrom === 'string') ? startFrom : '';
    runAction('系統調整中，請稍候', async () => {
      const r = await callServerMutating(
        'apiBuildSuggestion', currentQuarterId, from,
        Array.isArray(allowKeys) ? allowKeys : []);
      // ⚠️ 第四十二輪批次 A 組：兩張表都改過 ⇒ **問返幹事**，
      // 唔可以靜靜揀一張。揀錯嗰張就等於靜靜丟咗佢一批改動，
      // 而佢完全唔會知。
      if (r.needsChoice) { renderStartPointChoice(r); return; }
      if (!r.ok) {
        // 認唔出嘅名字要擋——理由同儲存嗰條路一樣。
        showErrorModal('請系統幫我調整', new Error(r.message));
        return;
      }
      renderSuggestionResult(r);
    });
  }

  function renderStartPointChoice(r) {
    openModal('要用哪一張做起點', [
      para(r.message),
      make('div', { className: 'sec' }, [
        sectionTitle('兩個選擇'),
        make('div', {
          text: '・職事表「' + r.gridSheetName + '」——你平時改的那一張',
          className: 'ok-line'
        }),
        make('div', {
          text: '・建議表「' + r.suggestionSheetName + '」——上一次系統做給你那一張',
          className: 'ok-line'
        })
      ]),
      // ⚠️ 一定要講明「另一張唔會計」。唔講嘅話佢會以為系統會夾埋兩邊。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '選了其中一張，另一張上面的改動這一次不會計算在內。'
            + '兩張都不會被刪走，你可以先開來看清楚，再回來撳。',
          className: 'lines'
        })
      ])
    ], [
      button('用職事表', () => { closeModal(); openBuildSuggestion('GRID'); }, ''),
      button('用建議表', () => { closeModal(); openBuildSuggestion('SUGGESTION'); }, 'secondary'),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  function renderSuggestionResult(r) {
    const link = make('a', { text: '開啟建議版本（' + r.sheetName + '）', className: 'bigLink' });
    link.href = r.url;
    link.target = '_blank';
    link.rel = 'noopener';

    // ⚠️ 第四十二輪批次 B 組：`systemCount === 0` 嗰陣**唔可以**淨係寫
    //「藍色格 ＝ 系統建議改的（0 格）」。嗰句要幹事自己推理，
    // 而佢推理嘅結果多數係「系統壞咗」——Ivan 現場就係噉。
    // 直接講結論：你改嘅嘢冇違反規則，系統唔使動。
    // ⚠️ 第四十三輪批次 C1：呢三個數字**一定要讀 `colourCounts`**，
    // 唔可以讀 `manualCount`／`systemCount`。
    //
    // 現場：對話框報「黃色格 1 格／藍色格 1 格」，而張表上一格黃色都冇。
    // 成因係同一格既俾幹事改過、又俾系統再改一次——兩個數字各自算啱咗，
    // 而上色嗰段只上得到一種。`colourCounts` 係**上色嗰陣順手數嘅**，
    // 所以佢報幾多格，表上就一定有幾多格。
    const cc = r.colourCounts
      || { manual: 0, system: 0, both: 0, manualViolation: 0 };
    const colourBox = make('div', { className: 'sec' }, [
      sectionTitle('那張表上面的顏色')
    ]);
    const colourLine = function (text, n) {
      // 0 格嗰啲唔畫出嚟——一行「0 格」要幹事自己推理，
      // 而佢推理嘅結果多數係「系統壞咗」。
      if (n <= 0) return;
      colourBox.appendChild(make('div', { text: text + '（' + n + ' 格）',
        className: 'ok-line' }));
    };
    colourLine('黃色格 ＝ 你自己改過的', cc.manual);
    colourLine('藍色格 ＝ 系統建議改的', cc.system);
    colourLine('紫色格 ＝ 你改過，而系統又再改了一次', cc.both);
    // 第四十六輪批次 C4 組：第四種顏色。
    colourLine('橙色格 ＝ 你改過、違反了規則，而系統沒有動它', cc.manualViolation);

    if (cc.system === 0 && cc.both === 0) {
      colourBox.appendChild(make('div', {
        text: '你改的都沒有違反規則，系統不需要調整任何東西——所以沒有藍色格。',
        className: 'ok-line strong'
      }));
    } else {
      colourBox.appendChild(make('div', {
        text: '系統改過的格，把滑鼠停在上面會見到它為甚麼改。',
        className: 'muted'
      }));
    }
    colourBox.appendChild(make('div', {
      text: '那一張表同正式職事表一樣有下拉選單，你可以直接在上面改。',
      className: 'muted'
    }));

    // ── 第四十六輪批次 C3 組：你改的、違反規則、系統沒有動 ──────
    //
    // ⚠️ Ivan 嘅原則：**系統改壞幹事親手做嘅決定，比排錯更差。**
    // 佢改一格，係因為佢知道一啲系統唔知道嘅事。所以系統唔會自己改走，
    // 改為列出嚟問佢——而且**預設全部唔勾**。
    //
    // 預設勾好就等於系統仍然喺度替佢決定，只係多咗一個佢唔會細睇嘅畫面。
    const untouched = r.untouchedManual || [];
    const allowSelected = {};
    let blockedBox = null;
    if (untouched.length > 0) {
      blockedBox = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('你改的 ' + untouched.length + ' 格違反了規則，系統沒有動它們'),
        make('div', {
          text: '系統不會自己改走你親手做的決定。要它一併調整的，'
            + '在下面勾選，然後撳〔准系統調整我勾了的〕。',
          className: 'muted'
        })
      ]);
      untouched.forEach((u) => {
        const line = make('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = false;   // ⚠️ 預設不勾
        cb.addEventListener('change', () => { allowSelected[u.key] = cb.checked; });
        line.appendChild(cb);
        line.appendChild(make('span', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC
            + (Number(u.slotIndex) > 1 ? (' ' + u.slotIndex) : '')
            + '　' + u.personName + '——' + u.reason
        }));
        blockedBox.appendChild(line);
      });
    }

    const nodes = [
      make('div', { text: '建議版本已經做好', className: 'ok-head' }),
      // ⚠️ 第四十二輪批次 A 組：起點要寫出嚟，俾佢一眼核對得到。
      // 唔講嘅話，「系統有冇計我啱啱改嗰幾格」呢條問題佢答唔到。
      make('div', { text: r.startNote || '', className: 'ok-line strong' }),
      link,
      colourBox,
      // ⚠️ 第四十二輪批次 A 組：呢一段以前係**假嘅**。
      // 系統當時只會用第一次嗰個快照，幹事之後改嘅嘢完全冇計。
      // 而佢照住呢句去做，即係介面呃咗佢。
      // 而家真係做得到，`tests/suggestion_start_point.test.js` 釘住。
      para('你可以直接在那張表上再改，改完回來再撳一次〔請系統幫我調整〕，'
        + '系統會重新讀那一張表做起點再算一次。可以重複到你滿意為止。'),
      para('如果你改的是正式那一張職事表（不是建議表），系統就會用正式那一張做起點。'
        + '兩張都改過的話，它會先問你要用哪一張。', 'muted')
    ];

    // ── 第四十三輪批次 D 組：填唔到嗰啲空格 ─────────────────
    //
    // ⚠️ 淨係講「仲有 N 格填唔到」，幹事下一步做乜都唔知。
    // 逐格講，而且講**點解**——佢要知道係「去加一個人」
    // 定係「去改一改不能服侍的日期」。
    if (r.unfillable && r.unfillable.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.unfillable.length + ' 格系統仍然找不到人'),
        make('div', {
          text: '講員／翻譯／獻花那幾欄不算在內——它們本來就留給你自己填。',
          className: 'muted'
        })
      ]);
      r.unfillable.forEach((u) => {
        box.appendChild(make('div', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC
            + (Number(u.slotIndex) > 1 ? (' ' + u.slotIndex) : '')
            + '　' + u.reason,
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    // ⚠️ 有上限嗰陣**一定要講**。靜靜做一半，幹事會以為淨返嗰啲
    // 係「系統睇過但搞唔掂」，而其實係系統根本冇睇過。
    if (r.gapCapped) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這一季有 ' + r.gapCount + ' 格排不出，一次過全部處理會太慢，'
            + '所以系統這一次只試了前面一批。接受之後再撳一次，它會繼續處理餘下的。',
          className: 'lines'
        })
      ]));
    }
    // ⚠️ 系統調整完仍然違反規則嘅格**一定要講出嚟**。
    // 唔講嘅話，幹事會以為「系統調整過 ＝ 一定冇問題」，然後直接接受，
    // 而嗰幾格其實仲係壞嘅。
    if (r.remaining && r.remaining.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('系統改完之後，這 ' + r.remaining.length + ' 格仍然違反規則'),
        make('div', {
          text: '系統找不到任何合資格又沒有衝突的人可以換。要你自己決定。',
          className: 'muted'
        })
      ]);
      r.remaining.forEach((v) => {
        box.appendChild(make('div', {
          text: humanViolationLine({
            serviceDate: v.serviceDate, postNameTC: v.postNameTC,
            slotIndex: v.slotIndex, personName: v.personName,
            ruleId: v.ruleId, reason: v.reason
          }),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    // ⚠️ C3 組嗰段擺喺最後——佢係一個**要佢答**嘅問題，
    // 唔應該混喺上面幾段報告中間。
    if (blockedBox) nodes.push(blockedBox);

    const acts = [
      button('接受這個建議版本', () => openAcceptSuggestion(), ''),
      button('放棄，回到我自己那一版', () => openDiscardSuggestion(), 'secondary'),
      button('稍後再決定', () => closeModal(), 'secondary')
    ];
    if (untouched.length > 0) {
      // 〔准系統調整我勾了的〕＝ 用同一個起點再算一次，
      // 但今次帶住「呢幾格准動」。**唔勾就一格都唔會動。**
      acts.unshift(button('准系統調整我勾了的', () => {
        const allow = Object.keys(allowSelected).filter((k) => allowSelected[k] === true);
        if (allow.length === 0) {
          setStatus('你一格都沒有勾。系統不會動你改過的任何一格。', true);
          return;
        }
        closeModal();
        // 起點用返呢一次嗰個，唔可以由頭再問一次——
        // 佢啱啱先答過，再問一次只會令佢以為系統唔記得咗。
        openBuildSuggestion(r.startSource, allow);
      }, ''));
      acts.push(button('保持原狀', () => closeModal(), 'secondary'));
    }
    openModal('系統建議版本', nodes, acts);
  }

  /* ── 三、接受／放棄 ─────────────────────────────────────── */

  function openAcceptSuggestion() {
    openConfirm({
      title: '接受這個建議版本',
      bodyNodes: [
        para('會把建議表上的內容儲存成新一版。'),
        para('儲存之後那張建議表會清走——不清走的話會積落一堆，'
          + '下一次你分不清哪一張是最新的。', 'muted')
      ],
      confirmLabel: '接受並儲存',
      cancelLabel: '返回',
      onConfirm: () => {
        closeModal();
        runAction('儲存中，請稍候', async () => {
          const r = await callServerMutating('apiAcceptSuggestion', currentQuarterId);
          resetMainFlowState();
          // ⚠️ 第四十二輪批次 D 組：唔可以淨係講「2 格改動」。
          // 一個數字證明唔到系統動嗰兩格就係佢改嗰兩格。
          // 用返共用元件——同〔儲存我的修改〕嗰邊同一份碼。
          const nodes = [
            make('div', { text: r.message, className: 'ok-head' })
          ].concat(savedChangeNodes(r.savedChanges, r.cellCount)).concat([
            para('第 ' + r.baseVersionNo + ' 版原封不動保留，可以隨時對照。', 'muted')
          ]);
          if (r.publishFailed) {
            nodes.push(make('div', { className: 'warnbox' }, [
              make('div', {
                text: '版本已經儲存好了，但公開連結未能更新（' + r.publishError + '）。'
                  + '收到連結的人現在會看到舊內容。',
                className: 'lines'
              })
            ]));
          } else {
            nodes.push(make('div', {
              text: '公開連結已經更新——連結地址不變。', className: 'ok-line'
            }));
          }
          openModal('已接受建議版本', nodes,
            [button('知道了', () => closeModalAndRefresh(), '')]);
        });
      }
    });
  }

  function openDiscardSuggestion() {
    openConfirm({
      title: '放棄建議版本',
      bodyNodes: [
        para('會刪走那張建議表。'),
        para('你自己那一版（職事表上的內容）一格都不會改動。', 'muted')
      ],
      confirmLabel: '放棄建議',
      cancelLabel: '返回',
      danger: true,
      onConfirm: () => {
        closeModal();
        runAction('放棄建議版本', async () => {
          const r = await callServerMutating('apiDiscardSuggestion', currentQuarterId);
          resetMainFlowState();
          openModal('已放棄', [
            make('div', { text: r.message, className: 'ok-line' })
          ], [button('知道了', () => closeModalAndRefresh(), '')]);
        });
      }
    });
  }
</script>
