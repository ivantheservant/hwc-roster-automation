<script>
  /* ============================================================
   * 第四十一輪批次 B 組：〔檢查我的改動〕＋〔請系統幫我調整〕
   * ============================================================
   *
   * Ivan 講嘅缺口：
   *   「我改完之後，需要檢查我嘅改動有冇違反好重要嘅規則（一粒檢查掣），
   *     同埋一粒掣俾系統調整成張表。幹事可以喺一張新嘅工作表睇系統建議
   *     嘅版本，再撳一粒掣接受。亦都可以直接喺嗰張建議版本上再改，
   *     然後再撳『調整』，重複到滿意為止。」
   *
   * ⚠️ 呢個唔係由零做。系統本來就有 `FineTune.gs` 嗰條路
   *（`proposeMinimalFix()` 最小改動修復）。呢一組係**把佢接上主流程**。
   *
   * ⚠️ 載入次序：要排喺 `ScriptZone1` 之後——會叫 `openSaveAndConfirm()`。
   */

  /* ── 一、〔檢查我的改動〕：唯讀 ──────────────────────────── */

  function openCheckMyChanges() {
    runAction('檢查你的改動', async () => {
      const r = await callServer('apiCheckMyChanges', currentQuarterId);
      if (!r.ok) {
        openModal('檢查我的改動', [para(r.message)],
          [button('知道了', () => closeModal(), '')]);
        return;
      }
      renderCheckResult(r);
    });
  }

  function renderCheckResult(r) {
    const nodes = [];

    // ⚠️ 一定要講明呢粒掣**乜都唔會改**。唔講嘅話，
    // 幹事撳完唔敢再撳第二次，驚改咗啲嘢。
    // ⚠️ 第四十二輪批次 E 組：零改動嗰陣兩句自相矛盾——
    //「你改的 **0 格**全部沒有問題，可以儲存。」跟住「你還沒有改過任何一格。」
    // 一格都冇改，根本冇嘢可以儲存。呢個係「一個數字係 0 嗰陣，
    // 文案讀落合唔合理」嗰條問題——每一句由數字砌出嚟嘅字都要問一次。
    const noChange = r.changes.length === 0;
    nodes.push(make('div', { className: 'statuscard' }, [
      make('div', {
        text: noChange
          ? '你還沒有改過任何一格。'
          : (r.allClear
            ? ('你改的 ' + r.changes.length + ' 格全部沒有問題，可以儲存。')
            : '下面幾項要看一看。'),
        className: 'statuscard-title'
      }),
      make('div', {
        text: '這一粒掣只看，不會改動任何東西。',
        className: 'statuscard-sub'
      })
    ]));

    // ── 改了哪幾格 ──────────────────────────────────────────
    if (r.changes.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('你改了這 ' + r.changes.length + ' 格')
      ]);
      r.changes.forEach((c) => {
        box.appendChild(make('div', {
          text: humanDate(c.serviceDate) + '　' + c.postNameTC
            + (Number(c.slotIndex) > 1 ? (' ' + c.slotIndex) : '')
            + '　' + c.fromName + ' → ' + c.toName,
          className: 'ok-line'
        }));
      });
      nodes.push(box);
    } else {
      // ⚠️ 上面張狀態卡已經講咗同一句。喺度再講一次，
      // 讀落好似系統講咗兩件唔同嘅事。改成講返「噉點做」。
      nodes.push(para('去〔查看／修改職事表〕在表上改，改完回來再撳這一粒。', 'muted'));
    }

    // ── 第七十五輪批次 CE／CF 組：逐格確認 ─────────────────────
    //
    // 名單上找不到的名字：〔加入名單〕或 ☐「這一季臨時幫手，不加入名單」；
    // 違反規則的格：☐「保留我的安排，系統不要調整」（預設唔勾，即時記住）。
    // 同〔儲存〕確認畫面用同一個元件（`buildDecisionSections()`，Script.html）。
    const decisions = buildDecisionSections(
      { names: r.unresolved || [], rules: r.violations || [] },
      { onAddPerson: (u) => openAddUnresolvedPerson(u, openCheckMyChanges) });
    decisions.nodes.forEach((n) => nodes.push(n));
    if ((r.violations || []).length > 0) {
      nodes.push(make('div', {
        text: '撳〔請系統幫我調整〕：系統只會調整沒有勾的違反規則格和空格，勾了的不會動。',
        className: 'muted'
      }));
    }

    // ── 空格 ────────────────────────────────────────────────
    if (r.blanks.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.blanks.length + ' 格還沒有人'),
        make('div', {
          text: '講員／翻譯／獻花那幾欄不算在內——它們本來就留給你自己填。',
          className: 'muted'
        })
      ]);
      r.blanks.forEach((b) => {
        box.appendChild(make('div', {
          text: humanDate(b.serviceDate) + '　' + b.postNameTC
            + (Number(b.slotIndex) > 1 ? (' ' + b.slotIndex) : ''),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    openModal('檢查我的改動', nodes, [
      button('知道了', () => closeModal(), ''),
      button('請系統幫我調整', () => { closeModal(); openBuildSuggestion(); }, 'secondary')
    ]);
  }

  /* ── 二、〔請系統幫我調整〕：產生建議版本 ─────────────────── */

  /**
   * ⚠️ 第四十五輪批次：**呢個函式唔可以直接做點擊處理。**
   *
   * `button()` 做嘅係 `addEventListener('click', onClick)`，所以直接綁嘅話，
   * `startFrom` 收到嘅係一個 **MouseEvent**，而佢會原封不動傳落
   * `apiBuildSuggestion` 做第 1 個參數 ⇒
   *
   *     Failed due to illegal value in property: 1
   *
   * 現場就係噉樣爆嘅（`ScriptMainFlow.html` 嗰粒
   * `stepButton('請系統幫我調整', openBuildSuggestion, …)`）。
   * 而 `1` 就係參數索引——後端一次都冇被叫到。
   *
   * 綁掣一律用 `() => openBuildSuggestion()`。
   * `tools/lint-handler-args.js` 會擋住直接綁。
   *
   * @param {string=} startFrom 幹事喺「用邊一張做起點」小窗揀嘅答案
   * @param {string[]=} allowKeys 第四十六輪批次 C3 組：幹事**明確勾咗**
   *   准系統調整嗰幾格。冇傳 ⇒ 一格都唔准動。
   */
  function openBuildSuggestion(startFrom, allowKeys) {
    // ⚠️ 保底：就算將來有人再直接綁，都唔會送一個事件物件上去。
    // 呢個唔係用嚟代替上面嗰條規矩——`sanitizeServerArgs_()` 會照樣
    // 喺送出之前擋住，而 lint 會喺 commit 之前擋住。三層都要有，
    // 因為呢一個 bug 上一輪令我查錯咗成個後端。
    const from = (typeof startFrom === 'string') ? startFrom : '';
    // 第八十二輪批次 IB 組（Ivan 手動測試 C）：唔使先撳〔檢查我的改動〕——有未決定嘅項目
    //（未勾嘅違反規則格、名單上找不到嘅名）就先出「調整之前」視窗，用**同一個**勾選元件；冇就直接開始。
    // 由「用邊一張做起點」小窗返嚟（`from` 有值）⇒ 已經決定過，直接開始。
    if (from) { runBuildSuggestion(from, false); return; }
    runAction('讀取你的改動', async () => {
      const pre = await callServer('apiCheckMyChanges', currentQuarterId);
      if (pre && pre.ok && Number(pre.undecidedCount) > 0) { renderBeforeAdjust(pre); return; }
      runBuildSuggestion('', true);
    });
  }

  /**
   * 第八十二輪批次 IB 組：「調整之前」——同〔檢查我的改動〕同一個勾選元件（`buildDecisionSections()`）。
   * @param {Object} pre `apiCheckMyChanges` 嘅結果
   */
  function renderBeforeAdjust(pre) {
    const nodes = [buildWillHandleSection(pre.willHandle)];
    nodes.push(make('div', {
      text: '下面幾項你還沒有決定。勾了「保留我的安排」或「這一季臨時幫手」的格，系統不會調整；沒有勾的，系統會試著調整。',
      className: 'warn-head'
    }));
    const decisions = buildDecisionSections(
      { names: pre.unresolved || [], rules: pre.violations || [] },
      { onAddPerson: (u) => openAddUnresolvedPerson(u, () => openBuildSuggestion()) });
    decisions.nodes.forEach((n) => nodes.push(n));
    openModal('調整之前', nodes, [
      button('開始調整', () => { closeModal(); runBuildSuggestion('', false); }, ''),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  /**
   * 第八十二輪批次 IB 組：「這一次會處理」——調整之前視窗同結果窗共用。
   * @param {Object=} w 後端 `buildAdjustWillHandle_()` 嘅結果
   * @returns {Node}
   */
  function buildWillHandleSection(w) {
    const d = w || {};
    const box = make('div', { className: 'sec' }, [sectionTitle('這一次會處理')]);
    const cellText = (c) => humanDate(c.serviceDate) + '　' + c.postNameTC + (Number(c.slotIndex) > 1 ? (' ' + c.slotIndex) : '');
    const changes = d.gridChanges || [];
    box.appendChild(make('div', { text: '・你在表上改了 ' + changes.length + ' 格', className: 'ok-line' }));
    changes.forEach((c) => box.appendChild(make('div', {
      text: '　　' + cellText(c) + '　' + c.fromName + ' → ' + c.toName, className: 'vio-row' })));
    const un = d.unavailableCells || [];
    if (un.length > 0) {
      box.appendChild(make('div', {
        text: '・「不能服侍的日期」令這一版 ' + un.length + ' 格的人那一日不能服侍（系統會換人）', className: 'ok-line' }));
      un.forEach((c) => box.appendChild(make('div', {
        text: '　　' + cellText(c) + '　' + (c.personName || ''), className: 'vio-row' })));
    }
    const wt = d.weights || {};
    if (wt.error) {
      box.appendChild(make('div', { text: '・排表偏好：這一次讀不到（' + wt.error + '），系統不會按偏好微調。', className: 'vio-row' }));
    } else if (Number(wt.count) > 0) {
      box.appendChild(make('div', {
        text: '・排表偏好：這一季有 ' + wt.count + ' 項生效中的偏好（系統會按它微調；做不到的會寫明）', className: 'ok-line' }));
      (wt.items || []).forEach((i) => box.appendChild(make('div', {
        text: '　　' + i.personName + '的' + i.postNameTC + '：' + (Number(i.adjust) > 0 ? '多' : '少') + Math.abs(Number(i.adjust)) + ' 次'
          + (i.target === null || i.target === undefined ? '' : '（目標 ' + i.target + ' 次）'),
        className: 'vio-row' })));
    }
    if (Number(d.blankCount) > 0) {
      box.appendChild(make('div', { text: '・空格 ' + d.blankCount + ' 格（系統會試填）', className: 'ok-line' }));
    }
    return box;
  }

  function runBuildSuggestion(from, showWillHandle) {
    runAction('系統調整中，請稍候', async () => {
      // 第七十五輪批次 CF 組：「准系統調整我勾了的」拿走——系統只會調整**冇勾**「保留我的安排」嘅格，
      // 後端自己讀逐格決定。第 3 個參數照送空陣列（後端已經唔用）。
      const r = await callServerMutating(
        'apiBuildSuggestion', currentQuarterId, from, []);
      // ⚠️ 第四十二輪批次 A 組：兩張表都改過 ⇒ **問返幹事**，
      // 唔可以靜靜揀一張。揀錯嗰張就等於靜靜丟咗佢一批改動，
      // 而佢完全唔會知。
      if (r.needsChoice) { renderStartPointChoice(r); return; }
      if (!r.ok) {
        // 認唔出嘅名字要擋——理由同儲存嗰條路一樣。
        showErrorModal('請系統幫我調整', new Error(r.message));
        return;
      }
      renderSuggestionResult(r, showWillHandle);
    });
  }

  function renderStartPointChoice(r) {
    openModal('要用哪一張做起點', [
      para(r.message),
      make('div', { className: 'sec' }, [
        sectionTitle('兩個選擇'),
        make('div', {
          text: '・職事表「' + r.gridSheetName + '」——你平時改的那一張',
          className: 'ok-line'
        }),
        make('div', {
          text: '・建議表「' + r.suggestionSheetName + '」——上一次系統做給你那一張',
          className: 'ok-line'
        })
      ]),
      // ⚠️ 一定要講明「另一張唔會計」。唔講嘅話佢會以為系統會夾埋兩邊。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '選了其中一張，另一張上面的改動這一次不會計算在內。'
            + '兩張都不會被刪走，你可以先開來看清楚，再回來撳。',
          className: 'lines'
        })
      ])
    ], [
      button('用職事表', () => { closeModal(); openBuildSuggestion('GRID'); }, ''),
      button('用建議表', () => { closeModal(); openBuildSuggestion('SUGGESTION'); }, 'secondary'),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  function renderSuggestionResult(r, showWillHandle) {
    const link = make('a', { text: '開啟建議版本（' + r.sheetName + '）', className: 'bigLink' });
    link.href = r.url;
    link.target = '_blank';
    link.rel = 'noopener';

    // ⚠️ 第四十二輪批次 B 組：`systemCount === 0` 嗰陣**唔可以**淨係寫
    //「藍色格 ＝ 系統建議改的（0 格）」。嗰句要幹事自己推理，
    // 而佢推理嘅結果多數係「系統壞咗」——Ivan 現場就係噉。
    // 直接講結論：你改嘅嘢冇違反規則，系統唔使動。
    // ⚠️ 第四十三輪批次 C1：呢三個數字**一定要讀 `colourCounts`**，
    // 唔可以讀 `manualCount`／`systemCount`。
    //
    // 現場：對話框報「黃色格 1 格／藍色格 1 格」，而張表上一格黃色都冇。
    // 成因係同一格既俾幹事改過、又俾系統再改一次——兩個數字各自算啱咗，
    // 而上色嗰段只上得到一種。`colourCounts` 係**上色嗰陣順手數嘅**，
    // 所以佢報幾多格，表上就一定有幾多格。
    const cc = r.colourCounts
      || { manual: 0, system: 0, both: 0, manualViolation: 0 };
    const colourBox = make('div', { className: 'sec' }, [
      sectionTitle('那張表上面的顏色')
    ]);
    const colourLine = function (text, n) {
      // 0 格嗰啲唔畫出嚟——一行「0 格」要幹事自己推理，
      // 而佢推理嘅結果多數係「系統壞咗」。
      if (n <= 0) return;
      colourBox.appendChild(make('div', { text: text + '（' + n + ' 格）',
        className: 'ok-line' }));
    };
    colourLine('黃色格 ＝ 你自己改過的', cc.manual);
    colourLine('藍色格 ＝ 系統建議改的', cc.system);
    colourLine('紫色格 ＝ 你改過，而系統又再改了一次', cc.both);
    // 第四十六輪批次 C4 組：第四種顏色。
    colourLine('橙色格 ＝ 你改過、違反了規則，而系統沒有動它', cc.manualViolation);
    // 第八十二輪批次 IC 組：第五種顏色。
    colourLine('綠色格 ＝ 系統按排表偏好微調的', cc.weight || 0);

    if (cc.system === 0 && cc.both === 0 && !(cc.weight > 0)) {
      colourBox.appendChild(make('div', {
        text: '你改的都沒有違反規則，系統不需要調整任何東西——所以沒有藍色格。',
        className: 'ok-line strong'
      }));
    } else {
      colourBox.appendChild(make('div', {
        text: '系統改過的格，把滑鼠停在上面會見到它為甚麼改。',
        className: 'muted'
      }));
    }
    colourBox.appendChild(make('div', {
      text: '那一張表同正式職事表一樣有下拉選單，你可以直接在上面改。',
      className: 'muted'
    }));

    // ── 第七十五輪批次 CF 組：系統冇動嘅格 ───────────────────────
    //
    // 只會係「你勾咗保留我的安排」或者「已放行」嘅格（其餘違反規則嘅格系統會試住調整）。
    // 舊嘅「准系統調整我勾了的」勾選框拿走——意思同新嘅勾選框相反，兩樣並存會令人撈亂。
    const untouched = r.untouchedManual || [];
    let blockedBox = null;
    if (untouched.length > 0) {
      blockedBox = make('div', { className: 'sec' }, [
        sectionTitle('系統沒有動這幾格（' + untouched.length + ' 格）'),
        make('div', {
          text: '你勾了「保留我的安排，系統不要調整」或者已經放行。要系統調整的話，'
            + '回〔檢查我的改動〕取消那一格的勾，再撳一次〔請系統幫我調整〕。',
          className: 'muted'
        })
      ]);
      untouched.forEach((u) => {
        blockedBox.appendChild(make('div', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC
            + (Number(u.slotIndex) > 1 ? (' ' + u.slotIndex) : '')
            + '　' + u.personName + '——' + u.reason
            + (u.released ? ('（已放行' + (u.releasedVersionNo === null || u.releasedVersionNo === undefined
              ? '' : '，第 ' + u.releasedVersionNo + ' 版') + '）') : '（你勾了保留）'),
          className: 'vio-row'
        }));
      });
    }

    // 第七十五輪批次 CE 組：未決定嘅名——系統冇郁嗰幾格，唔再因為佢哋而整個拒絕
    const undecided = r.undecidedNames || [];
    let undecidedBox = null;
    if (undecided.length > 0) {
      undecidedBox = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('名單上找不到、你還沒有決定的名字（' + undecided.length + ' 個）'),
        make('div', {
          text: '這幾格系統沒有動。去〔檢查我的改動〕選〔加入名單〕或者勾「這一季臨時幫手」。',
          className: 'muted'
        })
      ]);
      undecided.forEach((u) => {
        undecidedBox.appendChild(make('div', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC + '　「' + u.text + '」',
          className: 'vio-row'
        }));
      });
    }

    const nodes = [make('div', { text: '建議版本已經做好', className: 'ok-head' })];
    // 第八十二輪批次 IB 組：冇「調整之前」視窗嗰陣，結果窗最上面講「這一次會處理」
    if (showWillHandle && r.willHandle) nodes.push(buildWillHandleSection(r.willHandle));
    nodes.push(
      // ⚠️ 第四十二輪批次 A 組：起點要寫出嚟，俾佢一眼核對得到。
      // 唔講嘅話，「系統有冇計我啱啱改嗰幾格」呢條問題佢答唔到。
      make('div', { text: r.startNote || '', className: 'ok-line strong' }),
      link);
    // 第八十二輪批次 IB 組：你人手改過的格——逐格寫結果（包括冇違規、系統冇動嘅）
    const outcomes = r.manualOutcomes || [];
    if (outcomes.length > 0) {
      const box = make('div', { className: 'sec' }, [sectionTitle('你人手改過的格（' + outcomes.length + ' 格）')]);
      outcomes.forEach((o) => box.appendChild(make('div', {
        text: humanDate(o.serviceDate) + '　' + o.postNameTC + (Number(o.slotIndex) > 1 ? (' ' + o.slotIndex) : '')
          + '　' + o.fromName + ' → ' + o.toName + '：' + o.text,
        className: o.outcome === 'SYSTEM_CHANGED' || o.outcome === 'UNFIXABLE' ? 'vio-row strong' : 'vio-row'
      })));
      nodes.push(box);
    }
    // 第八十二輪批次 IC 組：按排表偏好微調了 M 格；做不到的寫明
    const wt = r.weightTune || {};
    if ((wt.moves || []).length > 0 || (wt.unmet || []).length > 0 || wt.error) {
      const box = make('div', { className: 'sec' }, [sectionTitle('按排表偏好微調了 ' + (wt.moves || []).length + ' 格')]);
      (wt.moves || []).forEach((m) => box.appendChild(make('div', {
        text: humanDate(m.serviceDate) + '　' + m.postNameTC + (Number(m.slotIndex) > 1 ? (' ' + m.slotIndex) : '')
          + '　' + m.fromName + ' → ' + m.toName + '（' + m.label + '）',
        className: 'ok-line'
      })));
      (wt.unmet || []).forEach((t) => box.appendChild(make('div', { text: '做不到：' + t, className: 'vio-row' })));
      if (wt.error) box.appendChild(make('div', { text: '排表偏好這一次讀不到（' + wt.error + '），沒有按偏好微調。', className: 'vio-row' }));
      nodes.push(box);
    }
    nodes.push(colourBox);
    nodes.push(
      // ⚠️ 第四十二輪批次 A 組：呢一段以前係**假嘅**。
      // 系統當時只會用第一次嗰個快照，幹事之後改嘅嘢完全冇計。
      // 而佢照住呢句去做，即係介面呃咗佢。
      // 而家真係做得到，`tests/suggestion_start_point.test.js` 釘住。
      para('你可以直接在那張表上再改，改完回來再撳一次〔請系統幫我調整〕，'
        + '系統會重新讀那一張表做起點再算一次。可以重複到你滿意為止。'),
      para('如果你改的是正式那一張職事表（不是建議表），系統就會用正式那一張做起點。'
        + '兩張都改過的話，它會先問你要用哪一張。', 'muted'));

    // ── 第四十三輪批次 D 組：填唔到嗰啲空格 ─────────────────
    //
    // ⚠️ 淨係講「仲有 N 格填唔到」，幹事下一步做乜都唔知。
    // 逐格講，而且講**點解**——佢要知道係「去加一個人」
    // 定係「去改一改不能服侍的日期」。
    if (r.unfillable && r.unfillable.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.unfillable.length + ' 格系統仍然找不到人'),
        make('div', {
          text: '講員／翻譯／獻花那幾欄不算在內——它們本來就留給你自己填。',
          className: 'muted'
        })
      ]);
      r.unfillable.forEach((u) => {
        box.appendChild(make('div', {
          text: humanDate(u.serviceDate) + '　' + u.postNameTC
            + (Number(u.slotIndex) > 1 ? (' ' + u.slotIndex) : '')
            + '　' + u.reason,
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    // ⚠️ 有上限嗰陣**一定要講**。靜靜做一半，幹事會以為淨返嗰啲
    // 係「系統睇過但搞唔掂」，而其實係系統根本冇睇過。
    if (r.gapCapped) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這一季有 ' + r.gapCount + ' 格排不出，一次過全部處理會太慢，'
            + '所以系統這一次只試了前面一批。接受之後再撳一次，它會繼續處理餘下的。',
          className: 'lines'
        })
      ]));
    }
    // ⚠️ 系統調整完仍然違反規則嘅格**一定要講出嚟**。
    // 唔講嘅話，幹事會以為「系統調整過 ＝ 一定冇問題」，然後直接接受，
    // 而嗰幾格其實仲係壞嘅。
    if (r.remaining && r.remaining.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('系統改完之後，這 ' + r.remaining.length + ' 格仍然違反規則'),
        make('div', {
          text: '系統找不到任何合資格又沒有衝突的人可以換。要你自己決定。',
          className: 'muted'
        })
      ]);
      r.remaining.forEach((v) => {
        box.appendChild(make('div', {
          text: humanViolationLine({
            serviceDate: v.serviceDate, postNameTC: v.postNameTC,
            slotIndex: v.slotIndex, personName: v.personName,
            ruleId: v.ruleId, reason: v.reason
          }),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    if (undecidedBox) nodes.push(undecidedBox);
    if (blockedBox) nodes.push(blockedBox);

    const acts = [
      button('接受這個建議版本', () => openAcceptSuggestion(), ''),
      button('放棄，回到我自己那一版', () => openDiscardSuggestion(), 'secondary'),
      button('稍後再決定', () => closeModal(), 'secondary')
    ];
    openModal('系統建議版本', nodes, acts);
  }

  /* ── 三、接受／放棄 ─────────────────────────────────────── */

  function openAcceptSuggestion() {
    openConfirm({
      title: '接受這個建議版本',
      bodyNodes: [
        para('會把建議表上的內容儲存成新一版。'),
        para('儲存之後那張建議表會清走——不清走的話會積落一堆，'
          + '下一次你分不清哪一張是最新的。', 'muted')
      ],
      confirmLabel: '接受並儲存',
      cancelLabel: '返回',
      onConfirm: () => {
        closeModal();
        runAction('儲存中，請稍候', async () => {
          const r = await callServerMutating('apiAcceptSuggestion', currentQuarterId);
          resetMainFlowState();
          // ⚠️ 第四十二輪批次 D 組：唔可以淨係講「2 格改動」。
          // 一個數字證明唔到系統動嗰兩格就係佢改嗰兩格。
          // 用返共用元件——同〔儲存我的修改〕嗰邊同一份碼。
          const nodes = [
            make('div', { text: r.message, className: 'ok-head' })
          ].concat(savedChangeNodes(r.savedChanges, r.cellCount)).concat([
            para('第 ' + r.baseVersionNo + ' 版原封不動保留，可以隨時對照。', 'muted')
          ]);
          // 第七十八輪批次 FB 組：舊表還原唔到要講（同〔儲存〕完成窗同一支）
          const restoreWarn = baseSheetRestoreWarning(r);
          if (restoreWarn) nodes.push(restoreWarn);
          if (r.publishFailed) {
            nodes.push(make('div', { className: 'warnbox' }, [
              make('div', {
                text: '版本已經儲存好了，但公開連結未能更新（' + r.publishError + '）。'
                  + '收到連結的人現在會看到舊內容。',
                className: 'lines'
              })
            ]));
          } else {
            nodes.push(make('div', {
              text: '公開連結已經更新——連結地址不變。', className: 'ok-line'
            }));
          }
          openModal('已接受建議版本', nodes,
            [button('知道了', () => closeModalAndRefresh(), '')]);
        });
      }
    });
  }

  function openDiscardSuggestion() {
    openConfirm({
      title: '放棄建議版本',
      bodyNodes: [
        para('會刪走那張建議表。'),
        para('你自己那一版（職事表上的內容）一格都不會改動。', 'muted')
      ],
      confirmLabel: '放棄建議',
      cancelLabel: '返回',
      danger: true,
      onConfirm: () => {
        closeModal();
        runAction('放棄建議版本', async () => {
          const r = await callServerMutating('apiDiscardSuggestion', currentQuarterId);
          resetMainFlowState();
          openModal('已放棄', [
            make('div', { text: r.message, className: 'ok-line' })
          ], [button('知道了', () => closeModalAndRefresh(), '')]);
        });
      }
    });
  }
</script>
