<script>
  /* ============================================================
   * 第二十七輪批次階段 F：區四——進階功能
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第五節。
   *
   * ⚠️ **本輪只搬七個工具上嚟，唔係全部八十幾個選單項目。**
   * 理由寫喺 docs/系統範圍稽核.md：其餘嗰批係診斷／維護工具，
   * 使用者係 Ivan 或者 IT，唔係幹事。搬上嚟只會令幹事喺一堆
   * 佢一世都唔會撳嘅嘢入面搵佢真正要撳嗰粒。
   */

  function renderZone4(d) {
    const body = clear(el('zone4Body'));

    body.appendChild(renderRollbackEntry());
    // 第二十六輪批次階段 A2-4：掣 2 嘅錯誤訊息會指去呢度，所以一定要有。
    body.appendChild(renderRepublishEntry(d));

    body.appendChild(make('div', { className: 'sec' }, [
      sectionTitle('職事表工具'),
      // 第七十五輪批次 CA 組：〔重新生成初稿（覆蓋式）〕〔匯出規則審閱表〕搬咗去「常用設定」。
      // 第四十一輪批次 A 組：名單下拉選單而家全自動——每一張新 grid
      // 都會有，改完事奉人員名單亦都會自動再跑一次。
      // 呢粒掣係**手動補救**：萬一自動嗰次設唔到（最常見係工作表被保護），
      // 仲有一條路，唔使等下一次建立版本。
      zone4Row('更新名單選單',
        '在最新一版職事表重新設定每個崗位那一欄的下拉選單。'
          + '正常情況下系統會自動做，這裡是萬一自動那次失敗時的補救。',
        () => openApplyDropdowns(), false),
      zone4Row('核對職事表',
        '逐格檢查有沒有違反規則，只看不改。',
        () => openVerifyRoster(), false),
      zone4Row('列出待補格子',
        '列出所有還沒有填人的格子，按崗位分類。',
        () => openPendingCells(), false),
      zone4Row('草稿覆核報告（給堂委看）',
        '產生一份給堂委看的文字報告：這一版排了誰、有什麼要留意。',
        () => openDraftReviewReport(), false),
      // 第七十五輪批次 CA 組：由「開季前準備」搬落嚟（唔係常用功能）
      zone4Row('名單檢查',
        '只看：列出名單上可能有問題的人（例如沒有電郵、沒有任何崗位）。',
        () => openPeopleHints(), false)
    ]));

    body.appendChild(make('div', { className: 'sec' }, [
      sectionTitle('PDF 與補寄'),
      zone4Row('匯出職事表 PDF',
        '把整季的職事表匯出成一份 PDF。',
        () => openExportPdf(), false),
      zone4Row('產生個人 PDF',
        '為每一位有服侍的人產生一份標示了他名字的 PDF。',
        () => openPersonalPdf(), false),
      zone4Row('補寄未收到的人',
        '上次寄到一半中斷的話，用這個只寄給還沒收到的人。',
        () => openMakeupSend(), false)
    ]));

    body.appendChild(make('div', { className: 'sec' }, [
      sectionTitle('規則審閱'),
      make('div', {
        text: '堂委填好規則審閱表之後（匯出在「常用設定」），在這裡讀回系統。',
        className: 'muted'
      }),
      zone4Row('匯入規則審閱表', '讀回堂委填好的那一份，逐條給你接受或拒絕。',
        () => openRuleImport(), false)
    ]));

    // 第六十七輪批次 AF 組：把人手編好嘅整季匯入系統
    body.appendChild(make('div', { className: 'sec' }, [
      sectionTitle('匯入人手編好的職事表'),
      make('div', {
        text: '這一季已經用舊方法（直接在試算表）排好了？先建一張匯入表，把舊表整塊貼進去，'
          + '再撳「檢查並匯入」。匯入會建立一個新版本（沒有版本就是第 0 版），之後照常用介面。',
        className: 'muted'
      }),
      zone4Row('建立匯入表',
        '在這個試算表新增「' + '匯入_' + currentQuarterId + '」：一行一個崗位位置、一欄一個主日，每格有名單選單。',
        () => openCreateImportSheet(), false),
      zone4Row('檢查並匯入',
        '讀匯入表、逐格認名字、檢查規則，確認之後匯入成為版本。',
        () => openImportRoster(), false)
    ]));

    // 第六十七輪批次 AJ 組：系統出問題時怎樣做（三個位置嘅連結由後端讀出，唔寫死）
    body.appendChild(make('div', { className: 'sec' }, [
      sectionTitle('系統出問題時'),
      zone4Row('系統出問題時怎樣做',
        '去哪裡找最新版（公開連結、完整版 PDF、可編輯副本）、怎樣自己手動繼續、改完怎樣回到系統。',
        () => openRecoveryHelp(), false)
    ]));

    body.appendChild(make('p', {
      text: '其餘工具（體檢、上線前檢查、匯出關鍵狀態等）請用試算表上方的選單。',
      className: 'muted'
    }));
  }

  /* ── 第六十七輪批次 AF 組：匯入人手編好嘅職事表 ──────────────── */

  function openCreateImportSheet() {
    runAction('建立匯入表', async () => {
      const r = await callServerMutating('apiCreateImportSheet', currentQuarterId);
      const link = make('a', { text: '開啟「' + r.sheetName + '」', className: 'bigLink' });
      link.href = r.url;
      link.target = '_blank';
      link.rel = 'noopener';
      openModal('匯入表', [
        make('div', { text: r.created ? '已經建好了' : '這一季已經有一張匯入表，直接用它', className: 'ok-head' }),
        para('一行一個崗位位置（' + r.rowCount + ' 行）、一欄一個主日（' + r.dateCount + ' 個）。'
          + '灰色「—」的格是那一週不設那個崗位，不用填'
          + (r.naCount > 0 ? '（共 ' + r.naCount + ' 格）' : '') + '。'),
        link,
        para('每格有名單選單，但直接貼上名單以外的名字也可以——「檢查並匯入」會逐個列出來。'
          + '講員、翻譯、獻花照舊自己填。', 'muted'),
        para('在你撳「檢查並匯入」並且打字確認之前，系統一格派工都不會變。', 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  function openImportRoster() {
    runAction('讀取匯入表', async () => {
      const plan = await callServer('apiCheckImportSheet', currentQuarterId);
      renderImportPlan(plan);
    });
  }

  /**
   * 檢查結果：認唔出 ⇒ 擋；硬規則 ⇒ 要打字放行；空格、灰格有名、自由文字 ⇒ 只講。
   * 放行紀錄由後端用 AG 組格式寫（`logHardViolationRelease_()`），之後儲存同一狀態唔使再打字。
   */
  function renderImportPlan(plan) {
    const nodes = [];
    const cellLabel = (c) => humanDate(c.serviceDate) + '　' + (c.postNameTC || c.postId)
      + (Number(c.slotIndex) > 1 && !/\s\d+$/.test(String(c.postNameTC || '')) ? (' ' + c.slotIndex) : '');

    nodes.push(para('匯入表「' + plan.sheetName + '」：填了 ' + plan.filledCount + ' 格。'
      + (plan.hasVersion
        ? '這一季現時最新是第 ' + plan.latestVersionNo + ' 版；匯入會建立第 ' + plan.versionNoToCreate + ' 版，舊版本全部保留。'
        : '這一季還沒有任何版本；匯入會建立第 0 版。')));

    if (plan.unresolved.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + plan.unresolved.length + ' 個名字系統認不出——處理好之前不會匯入'),
        make('div', { text: '認不出而照樣匯入，等於那一格靜靜變成空白。', className: 'muted' })
      ]);
      plan.unresolved.forEach((u) => {
        const item = make('div', { className: 'prop' });
        item.appendChild(make('div', { text: cellLabel(u) + '　你貼了：「' + u.text + '」', className: 'prop-head' }));
        item.appendChild(row([
          // 同儲存確認嗰粒係同一個對話框（ScriptZone1.html）；加完自動重新檢查
          button('立即加入這個人', () => openAddUnresolvedPerson(u, openImportRoster), '')
        ]));
        box.appendChild(item);
      });
      nodes.push(box);
      openModal('檢查匯入表', nodes, [
        button('我改好了，再檢查一次', () => openImportRoster(), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
      return;
    }

    if (plan.filledCount === 0) {
      nodes.push(para('匯入表一格都沒有填。先把人手職事表貼進去。', 'muted'));
      openModal('檢查匯入表', nodes, [button('知道了', () => closeModal(), '')]);
      return;
    }

    const v = plan.violations || { real: [], released: [], structural: [], semiHard: [] };
    if (v.real.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + v.real.length + ' 格違反了一定要遵守的規則'),
        make('div', {
          text: '人手安排可以違反規則，但要你打字放行。放行之後系統整季記住，之後儲存同一安排不用再打字。',
          className: 'muted'
        })
      ]);
      v.real.forEach((x) => {
        box.appendChild(make('div', { text: cellLabel(x) + '　' + (x.personName || x.personId) + '——' + (x.reason || plainRuleText(x.ruleId)), className: 'vio-row' }));
      });
      nodes.push(box);
    }
    if (v.released.length > 0) {
      const box = make('div', { className: 'sec' }, [
        make('div', { text: '這一季有 ' + v.released.length + ' 格是你之前已經放行的違反規則安排，不用再放行。', className: 'muted' })
      ]);
      nodes.push(box);
    }
    if (v.semiHard.length > 0) {
      const box = make('div', { className: 'sec' }, [sectionTitle('提醒（不阻擋）：' + v.semiHard.length + ' 格')]);
      v.semiHard.forEach((x) => {
        box.appendChild(make('div', { text: cellLabel(x) + '　' + (x.personName || x.personId) + '——' + (x.reason || plainRuleText(x.ruleId)), className: 'vio-row' }));
      });
      nodes.push(box);
    }

    // 空格：AH 組同一支畫法
    const blanks = plan.blankCells || [];
    buildSendWarningNodes({
      blank: { count: blanks.length, items: blanks.slice(0, 10), moreCount: Math.max(0, blanks.length - 10) },
      released: { count: 0, items: [], moreCount: 0 }, error: ''
    }).forEach((n) => nodes.push(n));

    if ((plan.ignoredNa || []).length > 0) {
      const box = make('div', { className: 'warnbox' }, [
        make('div', { text: '有 ' + plan.ignoredNa.length + ' 個灰色「—」格填了名字。那幾週不設那個崗位，匯入時會忽略它們。', className: 'warn-head' })
      ]);
      plan.ignoredNa.forEach((c) => box.appendChild(make('div', { text: cellLabel(c) + '　「' + c.text + '」', className: 'vio-row' })));
      nodes.push(box);
    }
    if ((plan.freeText || []).length > 0) {
      nodes.push(para('講員／翻譯／獻花那幾欄有 ' + plan.freeText.length + ' 格是名單以外的名字（例如客席講員），會照樣收進去。', 'muted'));
    }

    // 第四點：這一季在系統外已經寄過嗎？預設「未寄過」
    let sentExternally = false;
    const askBox = make('div', { className: 'sec' }, [sectionTitle('這一季已經寄給全體了嗎？')]);
    [
      [false, '未寄過', '匯入之後這一季是「草稿」，照常寄審閱或正式發出。'],
      [true, '已經在系統外寄給全體', '匯入之後記成「已正式發出」。系統不會再寄一次整季；之後改動只會寄給有改動的人。']
    ].forEach((opt) => {
      const line = make('label', { className: 'radio-row' });
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'import-sent';
      input.checked = sentExternally === opt[0];
      input.addEventListener('change', () => { if (input.checked) sentExternally = opt[0]; });
      line.appendChild(input);
      line.appendChild(make('span', { text: opt[1] }));
      askBox.appendChild(line);
      askBox.appendChild(make('div', { text: '　　' + opt[2], className: 'muted' }));
    });
    nodes.push(askBox);

    // 打字確認（有硬規則違反就係放行字）
    const typing = make('div', { className: 'confirm-typing' });
    typing.appendChild(make('p', {
      text: (plan.needsRelease ? '要放行上面那幾格並匯入，' : '要匯入成為新版本，') + '請在下面輸入「' + plan.confirmText + '」。'
    }));
    const typed = document.createElement('input');
    typed.type = 'text';
    typing.appendChild(typed);
    nodes.push(typing);

    openModal('檢查匯入表', nodes, [
      button(plan.needsRelease ? '放行並匯入' : '匯入', () => {
        if (String(typed.value || '').trim() !== plan.confirmText) {
          setStatus('請先輸入「' + plan.confirmText + '」。', true);
          return;
        }
        runAction('匯入中', async () => {
          const r = await callServerMutating('apiImportRosterExecute', currentQuarterId, {
            confirmText: String(typed.value || '').trim(), sentExternally: sentExternally
          });
          resetMainFlowState();
          renderImportDone(r);
        });
      }, ''),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  function renderImportDone(r) {
    const nodes = [make('div', { text: '已匯入', className: 'ok-head' }), para(r.message)];
    const link = make('a', { text: '開啟第 ' + r.versionNo + ' 版（' + r.sheetName + '）', className: 'bigLink' });
    link.href = r.url;
    link.target = '_blank';
    link.rel = 'noopener';
    nodes.push(link);
    if (r.releasedCount > 0) nodes.push(make('div', { text: '已放行 ' + r.releasedCount + ' 格違反規則的安排，系統整季記住。', className: 'ok-line' }));
    if (r.blankCount > 0) nodes.push(make('div', { text: '這一版還有 ' + r.blankCount + ' 格沒有人。', className: 'ok-line' }));
    if (r.externalRows > 0) nodes.push(make('div', { text: '已為 ' + r.externalRows + ' 位有服侍的人記下「已在系統外收到」，沒有寄任何電郵。', className: 'ok-line' }));
    nodes.push(make('div', {
      text: r.publishFailed ? ('公開連結未能更新（' + r.publishMessage + '）。') : '公開連結已經更新。',
      className: r.publishFailed ? 'err-text' : 'ok-line'
    }));
    openModal('匯入完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
  }

  /**
   * 第六十七輪批次 AJ 組：「系統出問題時怎樣做」——重點＋三個位置嘅實際連結。
   * 全文喺公開 repo 嘅 `docs/系統出問題時手動繼續.md`；呢度只係重點。
   */
  function openRecoveryHelp() {
    runAction('讀取位置', async () => {
      const r = await callServer('apiGetRecoveryLinks', currentQuarterId);
      const nodes = [
        para('系統壞了、或者一時打不開的時候，這一季的最新版在三個地方都有。'
          + '先看這三個位置，不用急著改任何東西。'),
        make('div', { className: 'sec' }, [sectionTitle('三個位置')])
      ];
      const place = (title, link, note) => {
        const box = make('div', { className: 'vio-row' });
        box.appendChild(make('div', { text: title, className: 'strong' }));
        if (link && link.url) {
          const a = make('a', { text: '開啟', className: 'sheetlink' });
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener';
          box.appendChild(a);
        }
        if (link && link.folderUrl && link.folderUrl !== link.url) {
          const f = make('a', { text: '開啟資料夾', className: 'sheetlink' });
          f.href = link.folderUrl;
          f.target = '_blank';
          f.rel = 'noopener';
          box.appendChild(f);
        }
        box.appendChild(make('div', { text: note || '', className: 'muted' }));
        return box;
      };
      nodes.push(place('一、公開連結試算表（唯讀）', r.publicLink, r.publicLink.note));
      nodes.push(place('二、完整版 PDF', r.fullPdf, r.fullPdf.note));
      nodes.push(place('三、可編輯的試算表副本', r.editableCopy, r.editableCopy.note));
      const guideLine = make('div', { text: r.guideSentence || '', className: 'muted' });
      if (r.guideUrl) {
        const g = make('a', { text: '開啟使用指南', className: 'sheetlink' });
        g.href = r.guideUrl;
        g.target = '_blank';
        g.rel = 'noopener';
        guideLine.appendChild(g);
      }
      nodes.push(make('div', { className: 'sec' }, [
        sectionTitle('怎樣手動繼續'),
        make('div', { text: '1. 開「可編輯副本」最新一份（沒有的話，用公開連結試算表「檔案 ▸ 建立副本」）。', className: 'lines' }),
        make('div', { text: '2. 在副本上直接改格子，改完自己寄給義工或印出來。系統裡的版本不會跟著變。', className: 'lines' }),
        make('div', { text: '3. 系統回復之後，用「進階與診斷 ▸ 匯入人手編好的職事表」把副本讀回系統，之後照常用介面。', className: 'lines' }),
        // 第七十輪批次 AW 組：幹事打唔開 repo，唔再叫佢睇 docs/…。
        // 有 USER_GUIDE_URL ⇒ 連結；冇 ⇒ 指南章名。
        guideLine
      ]));
      // 第七十五輪批次 CK 組：〔建立可編輯副本〕由第 4 步〔下載及匯出〕搬到呢度。
      // 走嘅仍然係 `runEditableCopy()`（ScriptSendPaper.html）→ `apiCreateEditableRosterCopy()`，
      // 同正式發出之後自動建立嗰份係同一支。
      nodes.push(make('div', { className: 'sec' }, [
        sectionTitle('建立一份新的可編輯副本'),
        make('div', {
          text: '把最新版本的職事表（連格式和本季服侍次數統計）複製成一份獨立的 Google 試算表，'
            + '放在 Drive 的「' + currentQuarterId + '／可編輯副本」資料夾。只是快照，之後系統再改動不會更新它。',
          className: 'muted'
        })
      ]));
      openModal('系統出問題時怎樣做', nodes, [
        button('建立可編輯副本', () => runEditableCopy(), 'secondary'),
        button('知道了', () => closeModal(), '')
      ]);
    });
  }

  /**
   * 重新發佈公開連結（第二十六輪批次階段 A2-4 加入，本輪由共通層搬過嚟）。
   * 掣 2 嘅錯誤訊息會指去呢度，所以一定要有。
   * @param {?Object} d 狀態快取
   */
  function renderRepublishEntry(d) {
    const box = make('div', { className: 'act' });
    const link = (d && d.publicLink) || {};
    // ⚠️ 三種狀態要分得開。`checkFailed`（查不到）**唔可以**寫成
    // 「還沒有公開連結」——嗰個係一個肯定句，而我哋根本冇查到。
    const desc = link.checkFailed
      ? '現在查不到這一季有沒有公開連結。'
      : (link.hasLink
        ? '這一季已經有公開連結。內容有改動時，撳這裡可以重新發佈一次。'
        : '這一季還沒有公開連結。寄給堂委之前一定要先發佈。');

    box.appendChild(make('div', { className: 'act-main' }, [
      make('div', { text: '重新發佈公開連結', className: 'act-name' }),
      make('div', { text: desc, className: 'act-desc' })
    ]));
    box.appendChild(button('發佈', () => {
      runAction('發佈公開連結', async () => {
        const res = await callServerMutating('apiRepublishPublicLink', currentQuarterId);
        if (!res.ok) { showErrorModal('重新發佈公開連結', new Error(res.message)); return; }
        setStatus('公開連結已經發佈好了（第 ' + res.versionNo + ' 版）。');
      });
    }, ''));
    return box;
  }

  /** 區四一行：名、一句說明、右邊一粒掣。 */
  function zone4Row(name, desc, onClick, danger) {
    const box = make('div', { className: 'act' });
    box.appendChild(make('div', { className: 'act-main' }, [
      make('div', { text: name, className: 'act-name' }),
      make('div', { text: desc, className: 'act-desc' })
    ]));

  function versionSelect(versions) {

  /** 把後端回嘅「一節一節」文字報告畫出嚟。 */
  function renderReportSections(title, res) {
    if (!res.ok) { showErrorModal(title, new Error(res.message)); return; }
    const nodes = [];
    (res.sections || []).forEach((s) => {
      const box = make('div', { className: 'sec' }, [sectionTitle(s.heading)]);
      (s.lines || []).forEach((line) => {
        box.appendChild(make('div', { text: line, className: 'vio-row' }));
      });
      if ((s.lines || []).length === 0) {
        box.appendChild(make('div', { text: '（沒有）', className: 'muted' }));
      }
      nodes.push(box);
    });
    if (nodes.length === 0) nodes.push(make('div', { text: '沒有內容。', className: 'muted' }));
    openModal(title, nodes, [button('關閉', () => closeModal(), '')]);
  }

        //
        // 主流程嗰粒「生成」會問（見 `ScriptZone1.html` 嘅
        // `openGenerateDraft()`），但呢一粒係區四嘅覆蓋式重做，本身
        // 已經要打字確認。喺一個打字確認之上再疊一個彈窗，只會令人

        para('會用「現在」那一份名單來排。要先改名單的話，'

        // ⚠️ 第二十八輪批次階段 C4：本來寫 `res.violationCount`，
        // 而 `apiGenerateRoster()` 根本冇呢個欄位——畫面永遠印

  /**
   * 「進階與診斷 ▸ 產生個人 PDF」。⚠️ 第六十六輪批次 AC／AD 組：完成窗同正式發出、補寄
   * 一樣經 `describePdfBatchOutcome_()`（ScriptZone1.html）——有失敗就唔准出「已完成 N / N」。
   */
  function runPersonalPdfTool(versionNo) {
    return runAction('產生個人 PDF，請稍候', async () => {
      let guard = 0;
      let last = null;
      const tally = newPdfBatchTally_();
      for (;;) {
        guard++;
        if (guard > 40) {
          throw new Error('產生個人 PDF 的次數超出預期，已停下來避免無限重試。'
            + '請重新整理再試一次。');
        }
        last = await callServerMutating('apiGeneratePersonalPdfBatch', currentQuarterId, versionNo);
        if (!last.ok) { showErrorModal('產生個人 PDF', new Error(last.message)); return; }
        addPdfBatchResult_(tally, last);
        if (last.done) break;
        setStatus('產生個人 PDF：' + pdfBatchTallyDone_(tally) + ' / ' + tally.total + ' 份…');
      }
      // 「略過已存在」一定要出數字。唔出嘅話，幹事會以為
      // 「明明有 57 人，點解只新產生咗 3 個」。
      const outcome = describePdfBatchOutcome_(tally, true, '');
      const buttons = outcome.kind === 'FAILED'
        ? [button('再試失敗的 ' + outcome.failedCount + ' 份', () => { closeModal(); runPersonalPdfTool(versionNo); }, ''),
          button('完成', () => closeModalAndRefresh(), 'secondary')]
        : [button('完成', () => closeModalAndRefresh(), '')];
      openModal(outcome.kind === 'FAILED' ? outcome.title : '產生完成', outcome.nodes, buttons);
    });
  }

  /**

   * @param {string} stage
   * @returns {void}
   */
  function openMakeupPreview(stage) {

      renderMakeupPlan(stage, plan);
    });

  /**
   * ⚠️⚠️ 第六十五輪批次 W 組：補寄目標當中有人未有可用嘅個人 PDF ⇒
   * **唔畀〔確定補寄〕**，就地畀〔現在就產生個人 PDF〕（只為呢幾位）。
   *
   * 現場（回歸測試 R1.4、R4.21）：預覽 53 位，撳〔確定補寄〕之後只寄出 4 封，
   * 其餘 49 位因為冇第 3 版 PDF 而 `ERROR_PDF_MISSING`，完成窗淨係出綠色。
   *
   * @param {string} stage
   * @param {{count: number, absentCount: number, staleCount: number, names: string[]}} gaps
   * @param {number} versionNo
   * @returns {void}
   */
  function openMakeupPdfGapBlock(stage, gaps, versionNo) {
    const nodes = [
      errorPart(ERR_LABEL_WHAT,
        gaps.count + ' 位還沒有第 ' + versionNo + ' 版的個人 PDF'
        + (gaps.staleCount > 0
          ? ('（' + gaps.absentCount + ' 位還沒有、' + gaps.staleCount
            + ' 位的是內容改動之前產生的，已經過期）') : '')
        + '。不先產生的話，補寄時這幾位會收不到信。'),
      errorPart('現在的情況', '沒有寄出任何電郵。')
    ];
    if (gaps.names && gaps.names.length > 0) {
      const list = make('div', { className: 'sec' });
      gaps.names.forEach((n) => list.appendChild(make('div', { text: n, className: 'vio-row' })));
      if (gaps.count > gaps.names.length) {
        list.appendChild(make('div', {
          text: '……另有 ' + (gaps.count - gaps.names.length) + ' 位', className: 'muted'
        }));
      }
      nodes.push(list);
    }
    nodes.push(para('撳下面那一粒，只為這 ' + gaps.count + ' 位產生。人數多的時候要跑幾分鐘，'
      + '而且可能會分幾次跑完——畫面會自己接住跑，不要關掉視窗。', 'muted'));
    openModal('補寄：還沒有個人 PDF', nodes, [
      button('現在就產生個人 PDF', () => runMakeupPdfBatch(stage), ''),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  /**
   * 只為補寄缺件嗰幾位產生個人 PDF；做完行返轉頭去補寄確認。
   * 迴圈係同正式發出共用嗰支 `runPdfBatchToCompletion()`（ScriptZone1.html）。
   * @param {string} stage
   * @returns {void}
   */
  function runMakeupPdfBatch(stage) {
    runPdfBatchToCompletion({
      callBatch: () => callServerMutating('apiMakeupGenerateMissingPdfs', currentQuarterId, stage),
      onContinue: () => runMakeupPdfBatch(stage),
      doneText: '現在可以回到補寄確認。',
      backLabel: '回到補寄確認',
      onBack: () => { closeModal(); openMakeupPreview(stage); }
    });
  }

  /**
   * ⚠️ 第六十五輪批次 W 組：補寄完成窗。**任何一個失敗數 ＞0 都唔可以淨係出綠色。**
   * @param {Object} res `apiMakeupSendExecute()` 嘅結果
   * @returns {Element[]}
   */
  function buildMakeupResultNodes(res) {
    const failed = Number(res.failed) || 0;
    const errorPdf = Number(res.errorPdf) || 0;
    const missing = Number(res.errorPdfMissing) || 0;
    const problems = failed + errorPdf + missing;
    const nodes = [
      make('div', {
        text: res.isDryRun ? '測試模式：沒有真的寄出任何電郵。' : '已經補寄。',
        className: problems > 0 ? 'muted' : 'ok-line'
      }),
      make('div', {
        text: '寄出 ' + res.sent + ' 封　模擬 ' + res.dryRun + ' 封　'
          + '查無電郵略過 ' + res.skipped + ' 位',
        className: problems > 0 ? 'lines' : 'ok-line'
      }),
      make('div', {
        text: '失敗 ' + failed + '　PDF 失敗 ' + errorPdf + '　PDF 缺件 ' + missing,
        className: problems > 0 ? 'err-text' : 'muted'
      })
    ];
    if (missing > 0) {
      nodes.push(make('div', {
        text: missing + ' 位因為沒有個人 PDF 而沒有寄出。先產生個人 PDF，再補寄一次。',
        className: 'err-text'
      }));
    }
    if (failed + errorPdf > 0) {
      nodes.push(make('div', {
        text: (failed + errorPdf) + ' 位寄送失敗。再補寄一次會只寄給還沒有收到的人。',
        className: 'err-text'
      }));
    }
    return nodes;
  }

  /**
   * 第六十三輪批次 Q 組：冇電郵嘅人另外一段列（唔可以淨係一個數字）。
   * @param {Object[]} rows plan.cannotSend
   * @returns {?Element}
   */
  function makeupCannotSendBox(rows) {
    if (!rows || rows.length === 0) return null;
    const box = make('div', { className: 'sec' }, [
      sectionTitle('這 ' + rows.length + ' 位沒有電郵，補寄一樣寄不到，請另外通知')
    ]);
    rows.forEach((r) => {
      box.appendChild(make('div', { text: r.nameTC, className: 'vio-row muted' }));
    });
    return box;
  }

  function renderMakeupPlan(stage, plan) {
    if (!plan.ok) { showErrorModal('補寄未收到的人', new Error(plan.message)); return; }
    // ⚠️ 第六十五輪批次 W 組：有人未有可用嘅個人 PDF ⇒ 先產生，唔畀〔確定補寄〕
    if (plan.pdfGaps && plan.pdfGaps.count > 0) {
      openMakeupPdfGapBlock(stage, plan.pdfGaps, plan.versionNo);
      return;
    }
    if (plan.people.length === 0) {
      const nodes = [
        make('div', { text: '這一次所有人都已經收到了，不用補寄。', className: 'ok-line' })
      ];
      const noEmail = makeupCannotSendBox(plan.cannotSend);
      if (noEmail) nodes.push(noEmail);
      openModal('補寄未收到的人', nodes, [button('知道了', () => closeModal(), '')]);
      return;
    }

    // 第六十三輪批次 Q 組：講明寄第幾版、附甚麼——
    // 唔講嘅話，幹事唔知收件人會收到乜。
    const what = make('div', { className: 'sec' }, [
      make('div', { text: '會寄第 ' + plan.versionNo + ' 版（現時最新一版）。', className: 'ok-line' })
    ]);
    if (plan.attachLabel) what.appendChild(make('div', { text: '附件：' + plan.attachLabel, className: 'muted' }));
    what.appendChild(make('div', {
      text: '任何一版收過都算已經收到；收過舊版而之後有改動的人，要用區一的「改動後重發」。',
      className: 'muted'
    }));

    const list = make('div', { className: 'sec' }, [
      sectionTitle('這 ' + plan.people.length + ' 位還沒有收到')
    ]);
    plan.people.forEach((p) => {
      list.appendChild(make('div', {
        text: p.nameTC + (p.isListRecipient ? '（名單收件人）' : '')
          + (p.hasEmail ? '' : '（沒有電郵，會略過）'),
        className: p.hasEmail ? 'vio-row' : 'vio-row muted'
      }));
    });
    const noEmailBox = makeupCannotSendBox(plan.cannotSend);

    openConfirm({
      title: '補寄未收到的人',
      bodyNodes: [
        what,
        list
      ].concat(noEmailBox ? [noEmailBox] : []).concat([
        make('div', { className: 'sec' }, [
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會再寄給已經收到的人', className: 'vio-row' }),
          make('div', { text: '・不會改動職事表任何一格', className: 'vio-row' }),
          make('div', { text: '・不會推前這一季的進度', className: 'vio-row' })
        ])
      ]),
      confirmLabel: '確定補寄',
      onConfirm: () => runAction('寄送中，請稍候', async () => {
        const res = await callServerMutating('apiMakeupSendExecute', currentQuarterId, stage);
        // 第六十五輪批次 W 組：後端都擋（預覽之後先至有人個 PDF 唔見咗／過期）
        if (!res.ok && res.pdfGapBlocked && res.pdfGaps) {
          openMakeupPdfGapBlock(stage, res.pdfGaps, plan.versionNo);
          return;
        }
        if (!res.ok) { showErrorModal('補寄未收到的人', new Error(res.message)); return; }
        openModal('補寄完成', buildMakeupResultNodes(res),
          [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }

  function openRuleExport() {

      bodyNodes: [
        para('會在 Drive 的 RuleReview 資料夾建立一份新的試算表。'),
        make('div', { className: 'sec' }, [
          sectionTitle('那份表裡面：'),
          make('div', { text: '・每一條規則一行，用一句人話說明它在做什麼', className: 'vio-row' }),
          make('div', { text: '・小數一律換算成「13 個主日之中大約幾多次」', className: 'vio-row' }),
          make('div', { text: '・堂委只需要填黃色那兩欄：「堂委決定」和「備註」', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會改動系統現時任何一條規則', className: 'vio-row' })
        ])
      ],
      confirmLabel: '確定匯出',
      onConfirm: () => runAction('匯出中', async () => {
        const res = await callServerMutating('apiExportRuleReviewSheet');
        if (!res.ok) { showErrorModal('匯出規則審閱表', new Error(res.message)); return; }
        const nodes = [
          make('div', { text: '已建立：' + res.fileName, className: 'ok-line' }),
          make('div', { text: '共 ' + res.ruleCount + ' 條規則。', className: 'lines' })
        ];
        if (res.fileUrl) {
          const a = document.createElement('a');
          a.href = res.fileUrl;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = '開啟這份審閱表';
          a.className = 'bigLink';
          nodes.push(a);
        }
        nodes.push(para('把這條連結給堂委。他們填好之後，回來撳「匯入規則審閱表」。'));
        openModal('匯出完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }

  /** 匯入：三欄對照，逐條接受或拒絕（同掣 1 同一個模式）。 */
  let ruleImportDecisions = {};

  function openRuleImport() {
    runAction('讀取審閱表', async () => {
      const data = await callServer('apiListRuleReviewSheets');
      if (!data.ok) { showErrorModal('匯入規則審閱表', new Error(data.message)); return; }
      if (data.files.length === 0) {
        openModal('匯入規則審閱表', [
          para('RuleReview 資料夾裡面還沒有任何審閱表。請先撳「匯出規則審閱表」。')
        ], [button('知道了', () => closeModal(), '')]);
        return;
      }
      const sel = document.createElement('select');
      data.files.forEach((f) => {
        const o = document.createElement('option');
        o.value = f.fileId;
        o.textContent = f.label;
        sel.appendChild(o);
      });
      openModal('匯入規則審閱表', [
        para('只會讀「堂委決定」和「備註」兩欄，其餘一律忽略——'
          + '就算他們在表上改了規則名或者現時設定，也不會進入系統。'),
        make('div', { className: 'prop-head' }, [make('span', { text: '哪一份' }), sel])
      ], [
        button('讀入並比對', () => runAction('比對中', async () => {
          const plan = await callServer('apiRuleReviewImportPlan', sel.value);
          renderRuleImportPlan(sel.value, plan);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  function renderRuleImportPlan(fileId, plan) {
    if (!plan.ok) { showErrorModal('匯入規則審閱表', new Error(plan.message)); return; }
    ruleImportDecisions = {};

    const nodes = [];

    // 硬規則：只記錄，永不改。呢個係一條**唔可以由堂委表改動**嘅界線。
    if (plan.hardNotes.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('一定要遵守的規則（' + plan.hardNotes.length + ' 條有意見）'),
        make('div', {
          text: '這一組不會被匯入改動，系統只會把堂委的意見記進紀錄。'
            + '要改的話，要另外開會決定，然後由開發者改。',
          className: 'muted'
        })
      ]);
      plan.hardNotes.forEach((h) => {
        box.appendChild(make('div', {
          text: h.ruleText + '　堂委：' + h.decision
            + (h.note ? '（' + h.note + '）' : ''),
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    if (plan.changes.length === 0) {
      nodes.push(make('div', {
        text: '沒有任何一條目標值需要改動。', className: 'ok-line'
      }));
      openModal('匯入規則審閱表', nodes, [button('關閉', () => closeModal(), '')]);
      return;
    }

    const list = make('div', { className: 'sec' }, [
      sectionTitle('這 ' + plan.changes.length + ' 條目標值有改動'),
      make('div', {
        text: '逐條決定要不要接受。預設全部不接受——你要主動勾。',
        className: 'muted'
      })
    ]);
    plan.changes.forEach((c) => {
      const key = c.ruleId;
      ruleImportDecisions[key] = false;
      const box = make('div', { className: 'prop' });
      box.appendChild(make('div', { text: c.ruleText, className: 'prop-head' }));
      box.appendChild(make('div', { text: '現時：' + c.currentText, className: 'vio-row' }));
      box.appendChild(make('div', { text: '堂委決定：' + c.decisionText, className: 'vio-row' }));
      box.appendChild(make('div', {
        text: '換算成系統的值：' + c.currentValue + ' → ' + c.newValue,
        className: 'vio-row muted'
      }));
      if (c.note) box.appendChild(make('div', { text: '備註：' + c.note, className: 'muted' }));

      const label = make('label', { className: 'check-row' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', () => { ruleImportDecisions[key] = cb.checked; });
      label.appendChild(cb);
      label.appendChild(make('span', { text: '接受這一條' }));
      box.appendChild(label);
      list.appendChild(box);
    });
    nodes.push(list);

    openConfirm({
      title: '匯入規則審閱表',
      bodyNodes: nodes,
      confirmLabel: '套用我勾了的',
      onConfirm: () => runAction('套用中', async () => {
        const accepted = Object.keys(ruleImportDecisions).filter((k) => ruleImportDecisions[k]);
        const res = await callServerMutating('apiRuleReviewImportExecute', fileId, accepted);
        if (!res.ok) { showErrorModal('匯入規則審閱表', new Error(res.message)); return; }
        openModal('匯入完成', [
          make('div', { text: '改了 ' + res.applied + ' 條規則設定。', className: 'ok-line' }),
          make('div', {
            text: '另外記錄了 ' + res.notedOnly + ' 條意見（一定要遵守的規則，不會自動改）。',
            className: 'ok-line'
          }),
          para('改動要下一次生成初稿才會生效，現有的職事表不會自己變。')
        ], [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }
</script>
