<script>
  /* ============================================================
   * 第二十五輪批次階段 E：區三——名單維護
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第四節。本輪做三個畫面，
   * 按幹事實際使用頻率排：不能服侍日期 > 人員與電郵 > 崗位資格。
   * 身分／個人崗位排除留下一輪。
   *
   * ⚠️ 呢一區係第一次由 Web 介面寫入**真實會友資料**。
   * 之前全部寫入都只碰職事表（可以重新生成）；名單改壞咗係改壞真人資料。
   * 所以每一個寫入動作前面都有一個確認畫面，列明「會改動幾多行」。
   */

  function renderZone3() {
    const body = clear(el('zone3Body'));
    body.appendChild(para('這裡改的是真實的會友資料。每一個改動都會記錄下來，'
      + '而且系統不會刪走任何一行——不再服侍的人是「停用」，不是刪除。'));
    body.appendChild(row([
      button('不能服侍的日期', () => openUnavailable(), ''),
      button('人員與電郵', () => openPeople(), ''),
      button('崗位資格', () => openEligibility(), ''),
      button('排表偏好', () => openWeights(), ''),
      button('身分（堂委／執事）', () => openRoles(), ''),
      button('暫時不做某崗位', () => openExclusions(), '')
    ]));
  }

  /* ============================================================
   * 畫面一：不能服侍的日期（規格 4.1）
   * ============================================================ */

  let unavailableData = null;

  function openUnavailable(keyword) {
    runAction('讀取不能服侍的日期', async () => {
      unavailableData = await callServer('apiListUnavailable', currentQuarterId, keyword || '');
      renderUnavailable(keyword || '');
    });
  }

  function renderUnavailable(keyword) {
    const nodes = [
      // 規格 4.1：呢句一定要有。唔講嘅話幹事會以為填個時間就得。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統沒有「上半場不在」這種概念。填了就代表整日不能服侍。',
          className: 'warn-head'
        })
      ]),
      peopleSearchBox(keyword, (k) => openUnavailable(k))
    ];

    nodes.push(row([button('＋ 新增一筆', () => openUnavailableEditor(null), '')], 'row-right'));

    if (unavailableData.current.length === 0) {
      nodes.push(make('div', { text: '目前沒有生效中的紀錄。', className: 'muted' }));
    } else {
      const box = make('div', { className: 'sec' }, [sectionTitle('生效中')]);
      unavailableData.current.forEach((r) => box.appendChild(unavailableRow(r)));
      nodes.push(box);
    }

    // 過期嘅摺埋，**唔刪**——刪咗就冇咗紀錄。
    if (unavailableData.past.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('已過去（' + unavailableData.past.length + ' 筆，保留紀錄，不會刪走）')
      ]);
      unavailableData.past.forEach((r) => {
        const line = unavailableRow(r);
        line.className += ' is-off';
        box.appendChild(line);
      });
      nodes.push(box);
    }

    openModal('不能服侍的日期', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  function unavailableRow(r) {
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', {
      text: r.personName + '　' + r.dateFrom + ' 至 ' + r.dateTo
        + '　' + (r.appliesTo === 'ALL' ? '全部崗位' : '指定崗位：' + r.postIds.join('、')),
      className: 'prop-head'
    }));
    if (r.reason) box.appendChild(make('div', { text: '原因：' + r.reason, className: 'muted' }));
    box.appendChild(row([button('修改', () => openUnavailableEditor(r), 'link')], 'row-right'));
    return box;
  }

  /** 新增／修改嘅編輯畫面。`existing` 為 null 就係新增。 */
  function openUnavailableEditor(existing) {
    const e = existing || {};

    const personSel = document.createElement('select');
    unavailableData.people.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      if (e.personId === p.personId) o.selected = true;
      personSel.appendChild(o);
    });

    const fromInput = dateInput(e.dateFrom || '');
    const toInput = dateInput(e.dateTo || '');

    const appliesSel = document.createElement('select');
    [['ALL', '全部崗位'], ['POSTS', '指定崗位']].forEach(([v, t]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      if ((e.appliesTo || 'ALL') === v) o.selected = true;
      appliesSel.appendChild(o);
    });

    const postBox = make('div', { className: 'prop-opts' });
    const postInputs = [];
    unavailableData.posts.forEach((p) => {
      const label = make('label', { className: 'check-row inline' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = (e.postIds || []).indexOf(p.postId) !== -1;
      cb.dataset.postId = p.postId;
      postInputs.push(cb);
      label.appendChild(cb);
      label.appendChild(make('span', { text: p.postNameTC }));
      postBox.appendChild(label);
    });
    // 只有揀「指定崗位」先開放勾——揀「全部崗位」時仲勾住幾個，
    // 幹事會以為嗰幾個有特別意思。
    const syncPostBox = () => { postBox.hidden = appliesSel.value !== 'POSTS'; };
    appliesSel.addEventListener('change', syncPostBox);
    syncPostBox();

    const reasonInput = document.createElement('input');
    reasonInput.type = 'text';
    reasonInput.autocomplete = 'off';
    reasonInput.value = e.reason || '';
    reasonInput.placeholder = '原因（例如：外遊）';

    const impactBox = make('div', { className: 'sec' });

    const collect = () => ({
      unavailableId: e.unavailableId || '',
      quarterId: currentQuarterId,
      personId: personSel.value,
      dateFrom: fromInput.value.trim(),
      dateTo: toInput.value.trim(),
      appliesTo: appliesSel.value,
      postIds: postInputs.filter((c) => c.checked).map((c) => c.dataset.postId),
      reason: reasonInput.value.trim()
    });

    const nodes = [
      make('div', { className: 'prop-head' }, [
        make('span', { text: '誰' }), personSel,
        make('span', { text: '由' }), fromInput,
        make('span', { text: '至' }), toInput
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '適用於' }), appliesSel
      ]),
      postBox,
      make('div', { className: 'prop-head' }, [
        make('span', { text: '原因' }), reasonInput
      ]),
      para('日期請用 2026-11-08 這種寫法（年-月-日）。'
        + '「11/8」這種寫法系統不接受——因為分不出是 11 月 8 日還是 8 月 11 日。', 'muted'),
      impactBox
    ];

    openModal(existing ? '修改不能服侍的日期' : '新增不能服侍的日期', nodes, [
      button('先看影響', () => {
        runAction('計算影響', async () => {
          const res = await callServer('apiPreviewUnavailableImpact', collect());
          renderUnavailableImpact(impactBox, res);
        });
      }, 'secondary'),
      button('儲存', () => {
        runAction('計算影響', async () => {
          const preview = await callServer('apiPreviewUnavailableImpact', collect());
          if (!preview.ok) { showErrorModal('不能服侍的日期', new Error(preview.message)); return; }
          confirmSaveUnavailable(collect(), preview, personSel.options[personSel.selectedIndex].textContent);
        });
      }, ''),
      button('取消', () => renderUnavailable(''), 'secondary')
    ]);
  }

  function renderUnavailableImpact(node, res) {
    clear(node);
    if (!res.ok) {
      node.appendChild(make('div', { text: res.message, className: 'vio vio-hard' }));
      return;
    }
    node.appendChild(make('div', {
      text: res.coveredDates.length === 0
        ? '這個日期範圍沒有蓋住本季任何一個主日。'
        : '這個日期範圍蓋住本季 ' + res.coveredDates.length + ' 個主日：'
          + res.coveredDates.join('、'),
      className: 'lines'
    }));

    // 規格 4.1：已經被排咗嘅話要紅字，而且要講明「加咗都唔會自動改」。
    if (res.conflicts.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', { text: '他在這幾格已經被排了：', className: 'vio-head' }));
      res.conflicts.forEach((c) => {
        box.appendChild(make('div', {
          text: c.serviceDate + '　' + c.postNameTC, className: 'vio-row'
        }));
      });
      box.appendChild(make('div', {
        text: '加了這一筆之後，現有的職事表不會自己改。'
          + '要撳「儲存並確認」系統才會重新檢查。',
        className: 'vio-row'
      }));
      node.appendChild(box);
    }
  }

  function confirmSaveUnavailable(payload, preview, personName) {
    const bodyNodes = [
      para('會改動 1 行。'),
      make('div', { className: 'sec' }, [
        make('div', { text: personName + '　' + preview.dateFrom + ' 至 ' + preview.dateTo, className: 'vio-row' }),
        make('div', {
          text: payload.appliesTo === 'ALL' ? '全部崗位' : '指定崗位：' + payload.postIds.join('、'),
          className: 'vio-row'
        }),
        make('div', {
          text: '蓋住本季 ' + preview.coveredDates.length + ' 個主日'
            + (preview.conflicts.length > 0 ? '，其中 ' + preview.conflicts.length + ' 格他已經被排了' : ''),
          className: 'vio-row'
        })
      ])
    ];
    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: bodyNodes,
      confirmLabel: '確定儲存',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveUnavailable', payload);
          if (!res.ok) { showErrorModal('不能服侍的日期', new Error(res.message)); return; }
          setStatus(res.created ? '已加入。' : '已更新。');
          unavailableData = await callServer('apiListUnavailable', currentQuarterId, '');
          renderUnavailable('');
        });
      }
    });
  }

  /* ============================================================
   * 畫面二：人員與電郵（規格 4.2）
   * ============================================================ */

  let peopleData = null;

  function openPeople(keyword) {
    runAction('讀取名單', async () => {
      peopleData = await callServer('apiListPeople', keyword || '');
      renderPeople(keyword || '');
    });
  }

  function renderPeople(keyword) {
    const nodes = [
      peopleSearchBox(keyword, (k) => openPeople(k)),
      para('停用一個人不會刪走他，也不會影響已經排好的職事表——'
        + '只是之後不會再被自動排入。'),
      // 第二十七輪批次階段 E：HWCAS 補電郵搬咗上嚟，做成
      // 「預覽差異 → 逐行勾選 → 套用」。**絕對唔可以整批自動套用。**
      make('div', {
        text: '「從出席系統補電郵」會先給你看差異，逐行勾選之後才寫入。預設全部不勾。',
        className: 'muted'
      })
    ];

    nodes.push(row([
      button('＋ 新增一位', () => openAddPerson(), ''),
      button('別名', () => openAliases(), 'secondary'),
      button('從出席系統補電郵', () => openHwcas(), 'secondary')
    ], 'row-right'));

    // 「共 N 位」要保留——幹事用嚟核對人數。
    nodes.push(make('div', {
      text: '共 ' + peopleData.total + ' 位' + (keyword ? '（符合搜尋）' : ''),
      className: 'muted'
    }));
    // ⚠️ 第二十六輪批次階段 D2：一開畫面**唔再**把 89 位全部展開成編輯卡。
    //
    // Ivan 實測：想改一個人嘅電郵，要碌過 89 張卡。
    // 而且同「不能服侍的日期」風格唔一致——嗰個畫面用精簡清單 ＋
    // 「修改」連結，撳咗先展開，做得啱。呢度跟返同一個模式。
    peopleData.people.forEach((p) => nodes.push(personSummaryRow(p)));

    openModal('人員與電郵', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  /** 精簡一行：名、編號、英文名、電郵、右邊一條「修改」。 */
  function personSummaryRow(p) {
    const box = make('div', { className: 'prop' + (p.active ? '' : ' is-off') });
    const head = make('div', { className: 'prop-head' });
    head.appendChild(make('span', { text: p.nameTC || '（沒有中文名）' }));
    head.appendChild(make('span', { text: p.personId, className: 'idtag' }));
    if (p.nameEN) head.appendChild(make('span', { text: p.nameEN, className: 'muted' }));
    if (p.hasEmail) {
      head.appendChild(make('span', { text: p.email, className: 'muted' }));
    } else {
      head.appendChild(make('span', { text: '沒有電郵，正式發出會略過', className: 'tag tag-bad' }));
    }
    if (!p.active) head.appendChild(make('span', { text: '已停用', className: 'tag' }));
    if (p.duplicateNameCount > 1) {
      head.appendChild(make('span', { text: '名單上有 ' + p.duplicateNameCount + ' 個同名', className: 'tag' }));
    }
    box.appendChild(head);

    const slot = make('div', {});
    box.appendChild(slot);
    box.appendChild(row([button('修改', () => {
      if (slot.firstChild) { clear(slot); return; }   // 再撳一次收埋
      slot.appendChild(personEditor(p));
    }, 'link')], 'row-right'));
    return box;
  }

  /** 撳「修改」之後先展開嘅編輯欄位。 */
  function personEditor(p) {
    const box = make('div', { className: 'prop-opts' });

    // ⚠️ 標題（名／PersonID／標籤）已經喺 personSummaryRow() 顯示咗，
    // 呢度唔重複——重複嘅話幹事會以為展開咗第二個人。
    // PersonID 由頭到尾都係灰字標籤，唔係輸入格：佢係全系統嘅外鍵，
    // 改一個就會令嗰個人喺歷史紀錄入面「消失」。
    const nameInput = textField(p.nameTC, '中文名');
    const enInput = textField(p.nameEN, '英文名');
    const memberInput = textField(p.memberNo, '會友編號（5 位數字）');
    const emailInput = textField(p.email, '電郵');
    const maxInput = textField(p.maxPerQuarter, '每季上限（可留空）');

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '中文名' }), nameInput,
      make('span', { text: '英文名' }), enInput
    ]));
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '會友編號' }), memberInput,
      make('span', { text: '電郵' }), emailInput,
      make('span', { text: '每季上限' }), maxInput
    ]));
    if (p.emailSource) {
      box.appendChild(make('div', {
        text: '電郵來源：' + p.emailSource + (p.emailVerifiedAt ? '（' + p.emailVerifiedAt + '）' : ''),
        className: 'muted'
      }));
    }

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = p.active;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', { text: '啟用' }));
    box.appendChild(activeLabel);

    box.appendChild(row([
      button('儲存這一位', () => {
        const payload = {
          personId: p.personId,
          nameTC: nameInput.value.trim(),
          nameEN: enInput.value.trim(),
          memberNo: memberInput.value.trim(),
          email: emailInput.value.trim(),
          maxPerQuarter: maxInput.value.trim(),
          active: activeCb.checked
        };
        const warn = [];
        if (p.active && !activeCb.checked) {
          warn.push('設為停用之後，這個人不會再被自動排入職事表。'
            + '已經排好的職事表不受影響。');
        }
        if (p.email && payload.email !== p.email) {
          warn.push('電郵由「' + p.email + '」改成「' + (payload.email || '（空白）') + '」。');
        }
        if (!p.email && payload.email) warn.push('補上了電郵，之後正式發出會寄給他。');

        openConfirm({
          title: '確定要儲存嗎',
          bodyNodes: [para('會改動 1 行：' + (payload.nameTC || p.personId) + '。')]
            .concat(warn.map((w) => make('div', { text: w, className: 'vio vio-warn' }))),
          confirmLabel: '確定儲存',
          onConfirm: () => { savePersonWithEmailCheck(payload); }
        });
      }, ''),
      button('重新產生連結', () => confirmReissueToken(p), 'secondary')
    ], 'row-right'));

    return box;
  }

  function confirmReissueToken(p) {
    openConfirm({
      title: '重新產生個人專屬連結',
      bodyNodes: [
        para('會改動 1 行：' + p.nameTC + '。'),
        make('div', { className: 'vio vio-hard' }, [
          make('div', {
            text: '他手上那條舊連結會即刻失效，打不開。'
              + '要等下一次正式發出（或者改動後重發）他才會收到新連結。',
            className: 'vio-row'
          })
        ])
      ],
      requireTyping: true,
      typingHint: '這個動作不可逆，舊連結無法復原。確定的話，請在下面輸入「'
        + CONFIRM_PHRASE + '」兩個字：',
      confirmLabel: '確定重新產生',
      danger: true,
      onConfirm: () => {
        runAction('重新產生中', async () => {
          const res = await callServerMutating('apiReissueToken', p.personId);
          if (!res.ok) { showErrorModal('重新產生連結', new Error(res.message)); return; }
          setStatus('已為 ' + (res.nameTC || p.nameTC) + ' 產生新連結。');
          peopleData = await callServer('apiListPeople', '');
          renderPeople('');
        });
      }
    });
  }

  function openAddPerson() {
    const nameInput = textField('', '中文名（必填）');
    const enInput = textField('', '英文名');
    const memberInput = textField('', '會友編號（5 位數字，可留空）');
    const emailInput = textField('', '電郵（可留空）');

    openModal('新增一位', [
      para('編號由系統自動編，不用你填。'),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '中文名' }), nameInput,
        make('span', { text: '英文名' }), enInput
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '會友編號' }), memberInput,
        make('span', { text: '電郵' }), emailInput
      ])
    ], [
      button('加入', () => {
        runAction('加入中', async () => {
          const res = await callServerMutating('apiAddPerson', {
            nameTC: nameInput.value.trim(),
            nameEN: enInput.value.trim(),
            memberNo: memberInput.value.trim(),
            email: emailInput.value.trim()
          });
          if (!res.ok) { showErrorModal('新增人員', new Error(res.message)); return; }
          setStatus('已加入 ' + res.nameTC + '（' + res.personId + '）。');
          if (res.duplicateWarning) setStatus(res.duplicateWarning, true);
          peopleData = await callServer('apiListPeople', '');
          renderPeople('');
        });
      }, ''),
      button('取消', () => renderPeople(''), 'secondary')
    ]);
  }

  /* ── 別名（NameAlias）───────────────────────────────────── */

  function openAliases() {
    runAction('讀取別名', async () => {
      const data = await callServer('apiListAliases');
      renderAliases(data);
    });
  }

  function renderAliases(data) {
    const nodes = [
      para('同一個人因為異體字或者輸入法寫成兩個名（例如「恒」與「恆」），'
        + '在這裡告訴系統它們是同一個人。'),
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '名字相似不代表是同一個人。只有你確定是同一位，才在這裡加。',
          className: 'warn-head'
        })
      ])
    ];

    (data.aliases || []).forEach((a) => {
      nodes.push(make('div', { className: 'prop' + (a.active ? '' : ' is-off') }, [
        make('div', { text: '「' + a.alias + '」＝ ' + a.personName, className: 'prop-head' })
      ]));
    });
    if ((data.aliases || []).length === 0) {
      nodes.push(make('div', { text: '目前沒有登記任何別名。', className: 'muted' }));
    }

    const aliasInput = textField('', '別名（另一種寫法）');
    const personSel = document.createElement('select');
    (peopleData ? peopleData.people : []).forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      personSel.appendChild(o);
    });

    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('新增一個別名'),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '別名' }), aliasInput,
        make('span', { text: '＝' }), personSel
      ])
    ]));

    openModal('別名', nodes, [
      button('加入別名', () => {
        const alias = aliasInput.value.trim();
        if (!alias) { setStatus('請先填別名。', true); return; }
        openConfirm({
          title: '確定要加入嗎',
          bodyNodes: [para('會改動 1 行：「' + alias + '」＝ '
            + personSel.options[personSel.selectedIndex].textContent + '。')],
          confirmLabel: '確定加入',
          onConfirm: () => {
            runAction('加入中', async () => {
              const res = await callServerMutating('apiSaveAlias', {
                alias: alias, personId: personSel.value, active: true
              });
              if (!res.ok) { showErrorModal('別名', new Error(res.message)); return; }
              setStatus('已加入。');
              openAliases();
            });
          }
        });
      }, ''),
      button('返回', () => renderPeople(''), 'secondary')
    ]);
  }

  /* ============================================================
   * 畫面三：崗位資格矩陣（規格 4.4）
   * ============================================================ */

  let eligData = null;
  let eligChanges = {};      // `personId|postId` → true/false
  let eligPostFilter = '';   // 空 = 全部崗位

  function openEligibility() {
    runAction('讀取崗位資格', async () => {
      eligData = await callServer('apiGetEligibilityMatrix');
      eligChanges = {};
      eligPostFilter = '';
      renderEligibility('');
    });
  }

  /**
   * ⚠️ 渲染策略（約 90 人 × 16 崗位 = 1440 格）
   *
   * **一次過畫 1440 個 checkbox 太笨重**（DOM 好慢，而且幹事要橫向捲
   * 十幾欄先搵到一個崗位）。所以預設**按崗位分頁**：一次睇一個崗位嘅
   * 全部人，再加姓名搜尋。
   *
   * 但**統計數字一律用後端喺完整資料上面計嗰個**——分頁只影響畫幾多格，
   * 唔會影響「合資格 N 人」。如果統計跟住分頁走，個數字就會係
   * 「當前頁嘅 N 人」，即係一個錯數，而幹事完全睇唔出。
   */
  function renderEligibility(keyword) {
    const nodes = [
      // 規格 4.4：呢句一定要有。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統只會排曾任該崗位的人。新人一定要在這裡加，系統不會自己擴充。',
          className: 'warn-head'
        })
      ])
    ];

    // 崗位選擇：兼顧「搵得到」同「唔好一次畫晒」。
    const postSel = document.createElement('select');
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '── 揀一個崗位 ──';
    postSel.appendChild(allOpt);
    eligData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      // 第二十六輪批次階段 D1：thin 由後端計，而後端已經排除咗唔自動排
      // 嘅崗位（講員／翻譯／獻花）——嗰幾個合資格 0 人係正常而且正確。
      o.textContent = p.postNameTC + '（合資格 ' + p.eligibleCount + ' 人'
        + (p.thin ? '，太少' : '')
        + (p.autoAssigned === false ? '，不自動排' : '') + '）';
      if (eligPostFilter === p.postId) o.selected = true;
      postSel.appendChild(o);
    });
    postSel.addEventListener('change', () => {
      eligPostFilter = postSel.value;
      renderEligibility(keyword);
    });

    nodes.push(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel
    ]));

    // 人數太少嘅崗位一覽——**唔理揀咗邊個崗位都顯示**，
    // 因為呢個係「成盤數有冇問題」嘅訊號，唔應該要逐個崗位撳先見到。
    const thin = eligData.posts.filter((p) => p.thin);
    if (thin.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', {
        text: '有 ' + thin.length + ' 個崗位的合資格人數少於 '
          + eligData.thinThreshold + ' 人：',
        className: 'vio-head'
      }));
      thin.forEach((p) => box.appendChild(make('div', {
        text: p.postNameTC + '：' + p.eligibleCount + ' 人', className: 'vio-row'
      })));
      nodes.push(box);
    }

    if (!eligPostFilter) {
      nodes.push(make('div', {
        text: '揀一個崗位，就會列出全部人，逐個勾。',
        className: 'muted'
      }));
    } else {
      nodes.push(peopleSearchBox(keyword, (k) => renderEligibility(k)));
      const post = eligData.posts.filter((p) => p.postId === eligPostFilter)[0];
      const list = make('div', { className: 'sec' }, [
        sectionTitle(post.postNameTC + '：現時合資格 ' + post.eligibleCount + ' 人')
      ]);

      const k = String(keyword || '').trim().toLowerCase();
      eligData.people.forEach((person) => {
        if (k && (person.nameTC + ' ' + person.nameEN + ' ' + person.personId)
          .toLowerCase().indexOf(k) === -1) return;

        const key = person.personId + '|' + eligPostFilter;
        const cell = eligData.cells[key] || { eligible: false, historicalCount: 0 };
        const current = Object.prototype.hasOwnProperty.call(eligChanges, key)
          ? eligChanges[key] : cell.eligible;

        const label = make('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = current;
        cb.addEventListener('change', () => {
          // 改返做原本嘅值就當冇改過——確認畫面唔應該報一個
          // 「勾咗再取消勾」嘅假改動。
          if (cb.checked === cell.eligible) delete eligChanges[key];
          else eligChanges[key] = cb.checked;
          renderEligibilityFooter();
        });
        label.appendChild(cb);
        label.appendChild(make('span', {
          text: person.nameTC + (person.active ? '' : '（已停用）')
        }));
        label.appendChild(make('span', {
          text: cell.historicalCount > 0 ? '做過 ' + cell.historicalCount + ' 次' : '未做過',
          className: 'muted'
        }));
        label.appendChild(make('span', {
          text: '合共 ' + person.postCount + ' 個崗位', className: 'muted'
        }));
        list.appendChild(label);
      });
      nodes.push(list);
    }

    nodes.push(make('div', { id: 'eligFooter', className: 'sec' }));

    openModal('崗位資格', nodes, [
      button('儲存改動', () => confirmEligibilityBatch(), ''),
      button('關閉', () => closeModalAndRefresh(), 'secondary')
    ]);
    renderEligibilityFooter();
  }

  function renderEligibilityFooter() {
    const node = el('eligFooter');
    if (!node) return;
    clear(node);
    const summary = summariseEligChanges();
    node.appendChild(make('div', {
      text: summary.total === 0
        ? '未有任何改動。'
        : '未儲存的改動：新增 ' + summary.added + ' 項資格、取消 ' + summary.removed + ' 項資格。',
      className: summary.total === 0 ? 'muted' : 'ok-line strong'
    }));
  }

  function summariseEligChanges() {
    let added = 0;
    let removed = 0;
    Object.keys(eligChanges).forEach((k) => {
      if (eligChanges[k]) added++; else removed++;
    });
    return { added: added, removed: removed, total: added + removed };
  }

  function confirmEligibilityBatch() {
    const summary = summariseEligChanges();
    if (summary.total === 0) { setStatus('未有任何改動。'); return; }

    const nameById = {};
    eligData.people.forEach((p) => { nameById[p.personId] = p.nameTC; });
    const postById = {};
    eligData.posts.forEach((p) => { postById[p.postId] = p.postNameTC; });

    const list = make('div', { className: 'sec' });
    Object.keys(eligChanges).forEach((k) => {
      const parts = k.split('|');
      list.appendChild(make('div', {
        text: (eligChanges[k] ? '＋ ' : '－ ') + (nameById[parts[0]] || parts[0])
          + '　' + (postById[parts[1]] || parts[1]),
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: [
        para('會新增 ' + summary.added + ' 項資格、取消 ' + summary.removed + ' 項資格。'),
        list,
        para('取消資格不會刪走那一行，做過的次數會保留。', 'muted')
      ],
      confirmLabel: '確定儲存',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const changes = Object.keys(eligChanges).map((k) => {
            const parts = k.split('|');
            return { personId: parts[0], postId: parts[1], eligible: eligChanges[k] };
          });
          const res = await callServerMutating('apiSaveEligibilityBatch', changes);
          if (!res.ok) { showErrorModal('崗位資格', new Error(res.message || '儲存失敗')); return; }
          setStatus('已新增 ' + res.added + ' 項、取消 ' + res.removed + ' 項。');
          eligData = await callServer('apiGetEligibilityMatrix');
          eligChanges = {};
          renderEligibility('');
        });
      }
    });
  }

  /**
   * 第二十六輪批次階段 D3：儲存人員資料，電郵格式唔啱就再確認一次。
   *
   * ⚠️ **唔阻擋**——世上有奇怪但合法嘅地址，擋錯咗幹事就完全入唔到。
   * 但要有一個位攔一攔：實測撞到一個結尾多咗句號嘅電郵，
   * 嗰位弟兄姊妹**永遠收唔到通知**，而畫面睇落完全正常。
   */
  function savePersonWithEmailCheck(payload) {
    runAction('儲存中', async () => {
      const res = await callServerMutating('apiSavePerson', payload);
      if (res.ok) {
        setStatus('已儲存。');
        peopleData = await callServer('apiListPeople', '');
        renderPeople('');
        return;
      }
      if (!res.needsEmailConfirm) {
        showErrorModal('人員與電郵', new Error(res.message));
        return;
      }
      openConfirm({
        title: '電郵格式看起來不對',
        bodyNodes: [
          make('div', { className: 'warnbox' }, [
            make('div', { text: res.message, className: 'warn-head' }),
            make('div', { text: '你填的是：' + res.email, className: 'lines' })
          ]),
          para('常見的打錯：結尾多了一個句號、中間有兩個句號、有多餘的空格。', 'muted')
        ],
        confirmLabel: '仍然儲存',
        onConfirm: () => {
          // 帶住 confirmedBadEmail 再送一次——後端見到就唔會再攔。
          savePersonWithEmailCheck(Object.assign({}, payload, { confirmedBadEmail: true }));
        }
      });
    });
  }

  /* ============================================================
   * 畫面四：排表偏好（規格 4.6，第二十六輪批次階段 C4）
   * ============================================================ */

  let weightData = null;
  let weightChanges = {};
  let weightPostFilter = '';

  function openWeights() {
    runAction('讀取排表偏好', async () => {
      weightData = await callServer('apiGetPersonPostWeightMatrix', currentQuarterId);
      weightChanges = {};
      weightPostFilter = '';
      renderWeights();
    });
  }

  function renderWeights() {
    const nodes = [
      // 規格 4.6：呢句一定要有。冇咗嘅話，幹事會以為「少一次」＝「唔俾佢做」，
      // 然後去取消佢嘅資格——嗰個係一件完全唔同、而且好難復原嘅事。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這裡只影響「誰做多少次」。不會影響誰有資格做，'
            + '也不會令系統違反任何規則。',
          className: 'warn-head'
        })
      ]),
      para('「多一次」的意思是「這一季比系統原本會派的多大約一次」，'
        + '不是「一定多一次」——系統仍然要先滿足所有規則。', 'muted')
    ];

    // 查不到用人量就講出嚟。唔講嘅話，畫面上「冇黃字」會被理解成
    // 「檢查過，冇人接近上限」——同「根本冇檢查過」意思完全相反。
    if (!weightData.loadAvailable) {
      nodes.push(make('div', {
        text: weightData.loadUnavailableReason
          + '（生成初稿之後回來看，這裡就會標出誰加了也不會生效。）',
        className: 'muted'
      }));
    }

    if (weightData.invalid && weightData.invalid.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', {
        text: '有 ' + weightData.invalid.length + ' 行的數值超出範圍，這幾行完全沒有生效：',
        className: 'vio-head'
      }));
      weightData.invalid.forEach((b) => box.appendChild(make('div', {
        text: b.personId + '　' + b.postId + '　' + b.reason, className: 'vio-row'
      })));
      nodes.push(box);
    }

    const postSel = document.createElement('select');
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '── 揀一個崗位 ──';
    postSel.appendChild(allOpt);
    weightData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      o.textContent = p.postNameTC + '（' + p.people.length + ' 人有資格）';
      if (weightPostFilter === p.postId) o.selected = true;
      postSel.appendChild(o);
    });
    postSel.addEventListener('change', () => {
      weightPostFilter = postSel.value;
      renderWeights();
    });
    nodes.push(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel
    ]));

    if (!weightPostFilter) {
      nodes.push(make('div', {
        text: '揀一個崗位，就會列出有資格做那個崗位的人。',
        className: 'muted'
      }));
    } else {
      const post = weightData.posts.filter((p) => p.postId === weightPostFilter)[0];
      const list = make('div', { className: 'sec' }, [sectionTitle(post.postNameTC)]);
      // ⚠️ 只列**有該崗位資格**嘅人（後端已經篩好）——
      // 90 × 16 個空下拉係一幅噪音，幹事會搵唔到想改嗰個。
      if (post.people.length === 0) {
        list.appendChild(make('div', {
          text: '這個崗位還沒有任何人有資格。要先去「崗位資格」加人。',
          className: 'muted'
        }));
      }
      post.people.forEach((person) => list.appendChild(weightRow(post, person)));
      nodes.push(list);
    }

    nodes.push(make('div', { id: 'weightFooter', className: 'sec' }));
    openModal('排表偏好', nodes, [
      button('儲存改動', () => confirmWeightBatch(), ''),
      button('關閉', () => closeModalAndRefresh(), 'secondary')
    ]);
    renderWeightFooter();
  }

  function weightRow(post, person) {
    const key = person.personId + '|' + post.postId;
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', { text: person.nameTC, className: 'prop-head' }));

    // ⚠️ 下拉用人話，**唔俾幹事打數字**——打錯一個負號就完全相反，
    // 而「多一次」同「少一次」睇落只差一個字。
    const sel = document.createElement('select');
    weightData.choices.forEach((c) => {
      const o = document.createElement('option');
      o.value = String(c.adjust);
      o.textContent = c.label;
      if (c.adjust === person.adjust) o.selected = true;
      sel.appendChild(o);
    });

    const reasonInput = textField(person.reason, '原因（必填，例如：堂委 2026-08 決議）');

    const sync = () => {
      const adjust = Number(sel.value);
      if (adjust === person.adjust) delete weightChanges[key];
      else weightChanges[key] = { adjust: adjust, reason: reasonInput.value.trim() };
      renderWeightFooter();
    };
    sel.addEventListener('change', sync);
    reasonInput.addEventListener('input', sync);

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '偏好' }), sel,
      make('span', { text: '原因' }), reasonInput
    ]));
    if (person.adjust !== 0) {
      box.appendChild(make('div', {
        text: '目前生效中。揀「一般（預設）」就會解除（記錄會保留，不會刪走）。',
        className: 'muted'
      }));
    }

    // ⚠️ 第二十七輪批次階段 B2：撞到每季上限嘅話，即場講。
    //
    // 離線驗收撞到：四行偏好之中兩行「冇變」，因為嗰兩位已經到咗
    // `MaxPerQuarter`，而偏好係軟嘅，唔會突破上限。機制係啱嘅，
    // 但幹事揀咗「多一次」而乜都冇發生，佢只會覺得「呢個功能壞咗」，
    // 然後去做啲更危險嘅嘢（例如去改人哋嘅崗位資格）。
    //
    // `quarterLoad` 係 null ＝ **查不到**（未揀季度／未有版本／讀取失敗），
    // 唔係「冇接近上限」。查不到就唔講——講「他還沒有接近上限」等於
    // 話「已經檢查過」，而根本冇檢查過。
    const load = person.quarterLoad;
    if (load && load.near) {
      box.appendChild(make('div', {
        text: load.atLimit
          ? '這位這一季已經排滿每季上限（' + load.limit + ' 次，已排 ' + load.count
            + ' 次），加「多一次」不會生效——系統不會為了偏好而超出上限。'
          : '這位已經接近每季上限（' + load.limit + ' 次，已排 ' + load.count
            + ' 次），加「多一次」可能不會生效。',
        className: 'link-warn'
      }));
    }
    return box;
  }

  function renderWeightFooter() {
    const node = el('weightFooter');
    if (!node) return;
    clear(node);
    const summary = summariseWeightChanges();
    node.appendChild(make('div', {
      text: summary.total === 0
        ? '未有任何改動。'
        : '未儲存的改動：新增 ' + summary.added + ' 項偏好、解除 ' + summary.released + ' 項偏好。',
      className: summary.total === 0 ? 'muted' : 'ok-line strong'
    }));
  }

  function summariseWeightChanges() {
    let added = 0;
    let released = 0;
    Object.keys(weightChanges).forEach((k) => {
      if (weightChanges[k].adjust === 0) released++; else added++;
    });
    return { added: added, released: released, total: added + released };
  }

  function confirmWeightBatch() {
    const summary = summariseWeightChanges();
    if (summary.total === 0) { setStatus('未有任何改動。'); return; }

    // 每一項偏好都要填原因——三個月之後，冇原因嘅偏好冇人記得點解。
    const missing = Object.keys(weightChanges).filter((k) => {
      return weightChanges[k].adjust !== 0 && !weightChanges[k].reason;
    });
    if (missing.length > 0) {
      setStatus('有 ' + missing.length + ' 項未填原因。每一項偏好都要填原因才可以儲存。', true);
      return;
    }

    const list = make('div', { className: 'sec' });
    Object.keys(weightChanges).forEach((k) => {
      const parts = k.split('|');
      const c = weightChanges[k];
      const choice = weightData.choices.filter((x) => x.adjust === c.adjust)[0];
      list.appendChild(make('div', {
        text: parts[0] + '　' + parts[1] + '　→ ' + (choice ? choice.label : c.adjust)
          + (c.reason ? '（' + c.reason + '）' : ''),
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: [
        para('會新增 ' + summary.added + ' 項偏好、解除 ' + summary.released + ' 項偏好。'),
        list,
        para('解除不會刪走那一行——系統只是記下「由今天起不再生效」，'
          + '之後仍然查得到當時是怎樣決定的。', 'muted')
      ],
      confirmLabel: '確定儲存',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const changes = Object.keys(weightChanges).map((k) => {
            const parts = k.split('|');
            return {
              personId: parts[0], postId: parts[1],
              adjust: weightChanges[k].adjust,
              // 解除唔需要新原因（原本嗰行嘅原因照樣留喺表上）
              reason: weightChanges[k].reason || '解除偏好'
            };
          });
          const res = await callServerMutating('apiSavePersonPostWeightBatch', changes);
          if (!res.ok) { showErrorModal('排表偏好', new Error(res.message || '儲存失敗')); return; }
          setStatus('已新增 ' + res.added + ' 項、解除 ' + res.released + ' 項。');
          weightData = await callServer('apiGetPersonPostWeightMatrix', currentQuarterId);
          weightChanges = {};
          renderWeights();
        });
      }
    });
  }


  /* ============================================================
   * 畫面五：身分（堂委／執事）（規格 4.3，第二十七輪批次階段 C）
   * ============================================================
   *
   * ⚠️ 呢個畫面平時幾乎唔會用。真正會用到嘅時刻只有一個：**換屆**。
   * 所以整個畫面嘅重心係嗰粒「換屆」掣，唔係逐行編輯。
   */

  let rolesData = null;

  function openRoles(keyword) {
    runAction('讀取身分名單', async () => {
      rolesData = await callServer('apiListRoles', keyword || '');
      renderRoles(keyword || '');
    });
  }

  function renderRoles(keyword) {
    const nodes = [];

    if (!rolesData.sheetExists) {
      nodes.push(make('div', { className: 'vio vio-hard' }, [
        make('div', {
          text: '身分名單（Roles）這張工作表還沒有建立，所以現在沒有任何人有身分。',
          className: 'vio-head'
        }),
        make('div', {
          text: '請先用試算表選單「維護 ▸ 補建身分名單工作表」。'
            + '在建立之前，「報告限堂委」「當值堂委限堂委或執事」這兩條規則不會生效。',
          className: 'vio-row'
        })
      ]));
    }

    // 規格 4.3：呢段字逐字照抄，唔可以改寫成「摘要版」。
    // 換屆做錯嘅後果係**追溯**性嘅——舊季度嘅職事表會突然變成違規，
    // 而嗰啲季度早就寄咗信、印咗 PDF。所以要把「點解」寫足。
    nodes.push(make('div', { className: 'warnbox' }, [
      make('div', { text: '換屆時不要刪除舊的行。', className: 'warn-head' }),
      make('div', {
        text: '撳「換屆」，輸入卸任日期，系統會把所有現任的行填上「生效至」＝卸任日期，'
          + '然後你再逐個加入新一屆。',
        className: 'lines'
      }),
      make('div', {
        text: '這樣做的原因：舊季度的職事表不會因為今日換屆而被追溯判成違規。',
        className: 'lines'
      })
    ]));

    nodes.push(row([
      button('換屆', () => openTermChange(), 'danger'),
      button('＋ 新增一行', () => openRoleEditor(), '')
    ], 'row-right'));

    nodes.push(peopleSearchBox(keyword, (k) => openRoles(k)));
    nodes.push(make('div', {
      text: '目前在任共 ' + rolesData.currentCount + ' 項身分（判斷基準日：' + rolesData.today + '）。',
      className: 'muted'
    }));

    if (rolesData.people.length === 0) {
      nodes.push(make('div', {
        text: keyword ? '沒有符合搜尋的人。' : '名單上還沒有任何身分紀錄。',
        className: 'muted'
      }));
    }
    // 按人分組——一個人可以同時是堂委又是執事，或者卸任後再連任。
    rolesData.people.forEach((p) => nodes.push(rolePersonRow(p)));

    nodes.push(make('div', { id: 'roleOverview', className: 'sec' }));

    openModal('身分（堂委／執事）', nodes, [
      button('檢查名單', () => loadRoleOverview(), 'secondary'),
      button('關閉', () => closeModalAndRefresh(), '')
    ]);
  }

  /** 一個人一行，下面列出佢全部身分行。同「不能服侍的日期」一樣嘅精簡清單風格。 */
  function rolePersonRow(p) {
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: p.nameTC }),
      make('span', { text: p.personId, className: 'idtag' })
    ]));

    p.rows.forEach((r) => {
      const line = make('div', { className: 'prop-opts' + (r.current ? '' : ' is-off') });
      const head = make('div', {});
      head.appendChild(make('span', { text: r.roleLabel }));
      if (r.unknownRoleCode) {
        // 認唔出嘅身分代號**一定要標出嚟**：打錯字嘅話，
        // 嗰條規則會靜靜失效，而畫面上睇落完全正常。
        head.appendChild(make('span', {
          text: '這個身分代號系統不認得，等於沒有身分', className: 'tag tag-bad'
        }));
      }
      head.appendChild(make('span', {
        text: '　' + (r.effectiveFrom || '（一直以來）') + ' 至 '
          + (r.effectiveTo || '現在'),
        className: 'muted'
      }));
      head.appendChild(make('span', {
        text: r.current ? '在任' : '已卸任／未生效', className: 'tag'
      }));
      if (!r.active) head.appendChild(make('span', { text: '已停用', className: 'tag' }));
      line.appendChild(head);
      if (r.notes) line.appendChild(make('div', { text: '備註：' + r.notes, className: 'muted' }));

      const slot = make('div', {});
      line.appendChild(slot);
      line.appendChild(row([button('修改', () => {
        if (slot.firstChild) { clear(slot); return; }   // 再撳一次收埋
        slot.appendChild(roleEditorFields(p, r));
      }, 'link')], 'row-right'));
      box.appendChild(line);
    });

    return box;
  }

  /** 撳「修改」之後先展開嘅欄位。 */
  function roleEditorFields(person, existing) {
    const e = existing || {};
    const box = make('div', { className: 'prop-opts' });

    const roleSel = document.createElement('select');
    rolesData.roleChoices.forEach((c) => {
      const o = document.createElement('option');
      o.value = c.roleCode;
      // ⚠️ 畫面永遠顯示中文，`value` 先係英文碼。幹事唔應該見到英文代號。
      o.textContent = c.label;
      if (e.roleCode === c.roleCode) o.selected = true;
      roleSel.appendChild(o);
    });

    const fromInput = dateInput(e.effectiveFrom || '');
    const toInput = dateInput(e.effectiveTo || '');
    const notesInput = textField(e.notes, '備註（可留空）');

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = e.active !== false;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', { text: '啟用（取消勾選＝這一行不算數；不會刪除）' }));

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '身分' }), roleSel,
      make('span', { text: '生效日' }), fromInput,
      make('span', { text: '生效至' }), toInput
    ]));
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '備註' }), notesInput
    ]));
    box.appendChild(activeLabel);
    box.appendChild(make('div', {
      text: '「生效日」留空＝一直以來都是。「生效至」留空＝仍然在任。'
        + '卸任時填「生效至」，不要刪除整行。',
      className: 'muted'
    }));

    box.appendChild(row([button('儲存這一行', () => {
      const payload = {
        roleAssignmentId: e.roleAssignmentId,
        personId: person.personId,
        roleCode: roleSel.value,
        effectiveFrom: fromInput.value.trim(),
        effectiveTo: toInput.value.trim(),
        notes: notesInput.value.trim(),
        active: activeCb.checked
      };
      const label = roleSel.options[roleSel.selectedIndex].textContent;
      const warn = [];
      if (!e.effectiveTo && payload.effectiveTo) {
        warn.push('填了「生效至」＝ ' + payload.effectiveTo
          + '，代表他在那一日之後不再是' + label + '。那一日之前的職事表不受影響。');
      }
      if (e.active !== false && !activeCb.checked) {
        warn.push('取消「啟用」＝這一行完全不算數（連過去也不算）。'
          + '如果只是卸任，應該填「生效至」而不是取消啟用。');
      }
      openConfirm({
        title: '確定要儲存嗎',
        bodyNodes: [para('會改動 1 行：' + person.nameTC + '　' + label + '。')]
          .concat(warn.map((w) => make('div', { text: w, className: 'vio vio-warn' }))),
        confirmLabel: '確定儲存',
        onConfirm: () => runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveRole', payload);
          if (!res.ok) { showErrorModal('身分', new Error(res.message)); return; }
          setStatus('已儲存。');
          openRoles('');
        })
      });
    }, '')], 'row-right'));

    return box;
  }

  /** 新增一行（要先揀人）。 */
  function openRoleEditor() {
    const personSel = document.createElement('select');
    rolesData.allPeople.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      personSel.appendChild(o);
    });

    const roleSel = document.createElement('select');
    rolesData.roleChoices.forEach((c) => {
      const o = document.createElement('option');
      o.value = c.roleCode;
      o.textContent = c.label;
      roleSel.appendChild(o);
    });

    const fromInput = dateInput('');
    const toInput = dateInput('');
    const notesInput = textField('', '備註（可留空）');

    openModal('新增一行身分', [
      make('div', { className: 'prop-head' }, [
        make('span', { text: '誰' }), personSel,
        make('span', { text: '身分' }), roleSel
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '生效日' }), fromInput,
        make('span', { text: '生效至' }), toInput,
        make('span', { text: '備註' }), notesInput
      ]),
      para('新一屆通常只需要填「生效日」（就職日），「生效至」留空。', 'muted'),
      para('日期請用 2026-11-08 這種寫法（年-月-日）。', 'muted')
    ], [
      button('加入', () => {
        const name = personSel.options[personSel.selectedIndex].textContent;
        const label = roleSel.options[roleSel.selectedIndex].textContent;
        openConfirm({
          title: '確定要加入嗎',
          bodyNodes: [
            para('會加入 1 行：' + name + '　' + label + '。'),
            para('生效日：' + (fromInput.value.trim() || '（留空＝一直以來都是）')
              + '　生效至：' + (toInput.value.trim() || '（留空＝仍然在任）'))
          ],
          confirmLabel: '確定加入',
          onConfirm: () => runAction('加入中', async () => {
            const res = await callServerMutating('apiAddRole', {
              personId: personSel.value,
              roleCode: roleSel.value,
              effectiveFrom: fromInput.value.trim(),
              effectiveTo: toInput.value.trim(),
              notes: notesInput.value.trim()
            });
            if (!res.ok) { showErrorModal('身分', new Error(res.message)); return; }
            setStatus('已加入 ' + res.nameTC + '　' + res.roleLabel + '。');
            openRoles('');
          })
        });
      }, ''),
      button('取消', () => renderRoles(''), 'secondary')
    ]);
  }

  /* ── 換屆（批次動作）───────────────────────────────────── */

  function openTermChange() {
    const dateIn = dateInput('');
    openModal('換屆', [
      make('div', { className: 'warnbox' }, [
        make('div', { text: '換屆時不要刪除舊的行。', className: 'warn-head' }),
        make('div', {
          text: '撳「換屆」，輸入卸任日期，系統會把所有現任的行填上「生效至」＝卸任日期，'
            + '然後你再逐個加入新一屆。',
          className: 'lines'
        }),
        make('div', {
          text: '這樣做的原因：舊季度的職事表不會因為今日換屆而被追溯判成違規。',
          className: 'lines'
        })
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '卸任日期' }), dateIn
      ]),
      para('下一步會列出全部會被填上「生效至」的行，讓你逐個看過再決定。', 'muted')
    ], [
      button('看看會改哪幾行', () => runAction('計算中', async () => {
        const plan = await callServer('apiRolesTermChangePlan', dateIn.value.trim());
        renderTermChangePlan(plan);
      }), ''),
      button('取消', () => renderRoles(''), 'secondary')
    ]);
  }

  function renderTermChangePlan(plan) {
    if (!plan.ok || plan.blocked) {
      showErrorModal('換屆', new Error(plan.message));
      return;
    }
    if (plan.rows.length === 0) {
      openModal('換屆', [
        para('沒有任何現任的身分行需要處理——每一行都已經有「生效至」了。'),
        para('如果這一屆已經換過，直接用「＋ 新增一行」加入新一屆就可以。', 'muted')
      ], [button('知道了', () => renderRoles(''), '')]);
      return;
    }

    // 規格 4.3：**逐行列出全部**，唔可以只講數目。
    // 呢一步係幹事唯一一次可以用人眼確認「係咪真係想改咁多人」嘅關口。
    const list = make('div', { className: 'sec' }, [
      sectionTitle('這 ' + plan.rows.length + ' 行會填上「生效至」＝ ' + plan.endDate)
    ]);
    plan.rows.forEach((r) => {
      list.appendChild(make('div', {
        text: r.nameTC + '　' + r.roleLabel + '　'
          + (r.effectiveFrom ? '由 ' + r.effectiveFrom + ' 起' : '（一直以來）'),
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '換屆（會改動 ' + plan.rows.length + ' 行）',
      bodyNodes: [
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', {
            text: '・把上面 ' + plan.rows.length + ' 行的「生效至」填成 ' + plan.endDate,
            className: 'vio-row'
          }),
          make('div', { text: '・逐行記入紀錄（誰、什麼身分、哪一日卸任）', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會刪除任何一行', className: 'vio-row' }),
          make('div', { text: '・不會加入新一屆（那一步要你逐個加）', className: 'vio-row' }),
          make('div', { text: '・不會改動任何已經生成的職事表', className: 'vio-row' })
        ]),
        para('那一日之前的職事表完全不受影響——這正是不刪行的原因。')
      ],
      requireTyping: true,
      typingHint: '這個動作會一次改動 ' + plan.rows.length + ' 行。確定的話，'
        + '請在下面輸入「' + CONFIRM_PHRASE + '」兩個字：',
      confirmLabel: '確定換屆',
      danger: true,
      onConfirm: (typed) => runAction('換屆中', async () => {
        const res = await callServerMutating('apiRolesTermChangeExecute', plan.endDate, typed);
        if (!res.ok) { showErrorModal('換屆', new Error(res.message)); return; }
        const nodes = [
          make('div', {
            text: '已把 ' + res.written + ' 行的「生效至」填成 ' + res.endDate + '。',
            className: 'ok-line'
          })
        ];
        // 搵唔返嗰啲一定要報出嚟——靜靜略過就係「做咗一半但報告話全部成功」。
        if (res.failed.length > 0) {
          nodes.push(make('div', { className: 'warnbox' }, [
            make('div', {
              text: '有 ' + res.failed.length + ' 行找不到，沒有改到：',
              className: 'warn-head'
            }),
            make('div', { text: res.failed.join('、'), className: 'lines' }),
            make('div', {
              text: '可能是剛才有人在試算表改動過。請重新整理再看一次。',
              className: 'lines'
            })
          ]));
        }
        nodes.push(para('下一步：用「＋ 新增一行」逐個加入新一屆。'));
        openModal('換屆完成', nodes, [button('完成', () => openRoles(''), '')]);
      })
    });
  }

  /* ── 唯讀提示：身分總覽 ─────────────────────────────────── */

  function loadRoleOverview() {
    runAction('檢查名單', async () => {
      const res = await callServer('apiRoleOverview');
      const node = el('roleOverview');
      if (!node) return;
      clear(node);
      if (!res.ok) {
        node.appendChild(make('div', { text: res.message, className: 'err-text' }));
        return;
      }
      node.appendChild(sectionTitle('名單檢查（唯讀）'));
      res.rows.forEach((r) => {
        node.appendChild(make('div', {
          text: r.section + '　' + r.item + '　' + r.value
            + (r.note ? '　（' + r.note + '）' : ''),
          className: 'vio-row'
        }));
      });
    });
  }


  /* ============================================================
   * 畫面六：暫時不做某崗位（規格 4.5，第二十七輪批次階段 D）
   * ============================================================ */

  let exclusionData = null;

  function openExclusions(keyword) {
    runAction('讀取個人崗位限制', async () => {
      exclusionData = await callServer('apiListExclusions', keyword || '');
      renderExclusions(keyword || '');
    });
  }

  function renderExclusions(keyword) {
    const nodes = [];

    if (!exclusionData.sheetExists) {
      nodes.push(make('div', { className: 'vio vio-hard' }, [
        make('div', {
          text: '個人崗位排除（PersonPostExclusions）這張工作表還沒有建立。',
          className: 'vio-head'
        }),
        make('div', {
          text: '請先用試算表選單「維護 ▸ 補建身分名單工作表」（它會一併建立這一張）。',
          className: 'vio-row'
        })
      ]));
    }

    // 規格 4.5：呢兩句一定要有，而且要逐字照抄。
    //
    // 混淆呢兩件事嘅後果：幹事想「呢半年唔好排佢做主席」，
    // 就會去取消佢主席嘅資格——而嗰個係「以後永遠唔會排佢」，
    // 而且日後想恢復嗰陣，「佢做過幾多次」呢個歷史已經斷咗。
    nodes.push(make('div', { className: 'warnbox' }, [
      make('div', { text: '崗位資格 = 這個人從來沒做過這個崗位。', className: 'warn-head' }),
      make('div', { text: '暫時不做 = 這個人做得到，但這一段時間不排他。', className: 'warn-head' })
    ]));

    nodes.push(row([
      button('＋ 新增一條', () => openExclusionEditor(null), '')
    ], 'row-right'));
    nodes.push(peopleSearchBox(keyword, (k) => openExclusions(k)));

    if (exclusionData.current.length === 0) {
      nodes.push(make('div', { text: '目前沒有生效中的限制。', className: 'muted' }));
    } else {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('生效中（' + exclusionData.current.length + ' 條）')
      ]);
      exclusionData.current.forEach((r) => box.appendChild(exclusionRow(r, false)));
      nodes.push(box);
    }

    // 已解除嘅摺入一節，**唔刪**——要睇得返「嗰段時間確實生效過」。
    if (exclusionData.lifted.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('已解除（' + exclusionData.lifted.length + ' 條，保留紀錄，不會刪走）')
      ]);
      exclusionData.lifted.forEach((r) => box.appendChild(exclusionRow(r, true)));
      nodes.push(box);
    }

    openModal('暫時不做某崗位', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  function exclusionRow(r, isLifted) {
    const box = make('div', { className: 'prop' + (isLifted ? ' is-off' : '') });
    const head = make('div', { className: 'prop-head' });
    head.appendChild(make('span', { text: r.nameTC }));
    head.appendChild(make('span', { text: '　' + r.postNameTC }));
    if (r.unknownPost) {
      // 崗位表冇呢個代號 ⇒ 呢條限制根本唔會生效，而畫面睇落完全正常。
      head.appendChild(make('span', {
        text: '崗位表沒有這個代號，這一條不會生效', className: 'tag tag-bad'
      }));
    }
    if (!r.active) head.appendChild(make('span', { text: '已停用', className: 'tag' }));
    box.appendChild(head);

    box.appendChild(make('div', {
      text: (r.effectiveFrom || '（即時生效）') + ' 至 '
        + (r.effectiveTo || '仍然生效') + '　原因：' + r.reason,
      className: 'muted'
    }));

    const slot = make('div', {});
    box.appendChild(slot);

    const buttons = [button('修改', () => {
      if (slot.firstChild) { clear(slot); return; }
      slot.appendChild(exclusionEditorFields(r));
    }, 'link')];
    // 已解除嘅唔會再有「解除」掣——按落去只會令人以為要再解除一次。
    if (!isLifted) buttons.unshift(button('解除限制', () => openLiftExclusion(r), ''));
    box.appendChild(row(buttons, 'row-right'));
    return box;
  }

  /** 解除：直接彈日期選擇，預設今日（規格 4.5）。 */
  function openLiftExclusion(r) {
    const dateIn = dateInput(exclusionData.today);
    openModal('解除限制', [
      para('解除的意思是「由這一日起，可以再排他做這個崗位」。'),
      make('div', { className: 'sec' }, [
        make('div', { text: r.nameTC + '　' + r.postNameTC, className: 'vio-row' }),
        make('div', { text: '原因：' + r.reason, className: 'vio-row' }),
        make('div', {
          text: '生效期間：' + (r.effectiveFrom || '（即時生效）') + ' 至 仍然生效',
          className: 'vio-row'
        })
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '解除日' }), dateIn
      ]),
      // 解除做成「填日期」而唔係「刪行」／「取消啟用」嘅原因，一定要講。
      // 唔講嘅話，下一個人會覺得「刪咗佢乾淨啲」。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統只會填上「解除日」，不會刪走這一行，也不會把它設成停用。',
          className: 'warn-head'
        }),
        make('div', {
          text: '這樣舊季度的職事表仍然看得出「那一段時間確實不應該排他」。'
            + '如果刪走或者停用，舊季度就會變成「當時本來可以排他」，那是錯的。',
          className: 'lines'
        })
      ])
    ], [
      button('確定解除', () => {
        openConfirm({
          title: '確定要解除嗎',
          bodyNodes: [
            para('會改動 1 行：' + r.nameTC + '　' + r.postNameTC + '。'),
            para('「解除日」會填成 ' + (dateIn.value.trim() || '（空白）')
              + '，其餘欄位一格都不會改。')
          ],
          confirmLabel: '確定解除',
          onConfirm: () => runAction('解除中', async () => {
            const res = await callServerMutating('apiLiftExclusion',
              r.exclusionId, dateIn.value.trim());
            if (!res.ok) { showErrorModal('解除限制', new Error(res.message)); return; }
            setStatus('已解除（解除日 ' + res.effectiveTo + '）。');
            openExclusions('');
          })
        });
      }, ''),
      button('取消', () => renderExclusions(''), 'secondary')
    ]);
  }

  /** 撳「修改」之後先展開嘅欄位。 */
  function exclusionEditorFields(r) {
    const box = make('div', { className: 'prop-opts' });

    const postSel = document.createElement('select');
    exclusionData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      o.textContent = p.postNameTC;
      if (r.postId === p.postId) o.selected = true;
      postSel.appendChild(o);
    });

    const reasonInput = textField(r.reason, '原因（必填）');
    const fromInput = dateInput(r.effectiveFrom || '');
    const toInput = dateInput(r.effectiveTo || '');
    const notesInput = textField(r.notes, '備註（可留空）');

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = r.active !== false;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', {
      text: '啟用（取消勾選＝這一行由頭到尾都不算數；只是解除的話請用「解除限制」）'
    }));

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel,
      make('span', { text: '原因' }), reasonInput
    ]));
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '生效日' }), fromInput,
      make('span', { text: '解除日' }), toInput,
      make('span', { text: '備註' }), notesInput
    ]));
    box.appendChild(activeLabel);

    box.appendChild(row([button('儲存這一條', () => {
      const payload = {
        exclusionId: r.exclusionId,
        personId: r.personId,
        postId: postSel.value,
        reason: reasonInput.value.trim(),
        effectiveFrom: fromInput.value.trim(),
        effectiveTo: toInput.value.trim(),
        notes: notesInput.value.trim(),
        active: activeCb.checked
      };
      const warn = [];
      if (r.active !== false && !activeCb.checked) {
        warn.push('取消「啟用」＝這一行由頭到尾都不算數（連過去的季度也會變成'
          + '「當時本來可以排他」）。如果只是想解除，請用「解除限制」填日期。');
      }
      openConfirm({
        title: '確定要儲存嗎',
        bodyNodes: [para('會改動 1 行：' + r.nameTC + '　'
          + postSel.options[postSel.selectedIndex].textContent + '。')]
          .concat(warn.map((w) => make('div', { text: w, className: 'vio vio-warn' }))),
        confirmLabel: '確定儲存',
        onConfirm: () => runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveExclusion', payload);
          if (!res.ok) { showErrorModal('暫時不做某崗位', new Error(res.message)); return; }
          setStatus('已儲存。');
          openExclusions('');
        })
      });
    }, '')], 'row-right'));

    return box;
  }

  /** 新增一條。 */
  function openExclusionEditor() {
    const personSel = document.createElement('select');
    exclusionData.people.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      personSel.appendChild(o);
    });

    const postSel = document.createElement('select');
    exclusionData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      o.textContent = p.postNameTC;
      postSel.appendChild(o);
    });

    const reasonInput = textField('', '原因（必填，例如：膝傷，暫時不能站）');
    const fromInput = dateInput('');
    const toInput = dateInput('');

    openModal('新增一條限制', [
      make('div', { className: 'warnbox' }, [
        make('div', { text: '崗位資格 = 這個人從來沒做過這個崗位。', className: 'warn-head' }),
        make('div', { text: '暫時不做 = 這個人做得到，但這一段時間不排他。', className: 'warn-head' })
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '誰' }), personSel,
        make('span', { text: '崗位' }), postSel
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '原因' }), reasonInput
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '生效日' }), fromInput,
        make('span', { text: '解除日' }), toInput
      ]),
      para('「生效日」留空＝即時生效。「解除日」留空＝暫時無限期'
        + '（日後解除時再填，不要刪除整行）。', 'muted'),
      para('原因一定要填。三個月之後，沒有原因的限制沒有人記得為什麼，'
        + '也就沒有人夠膽解除它。', 'muted')
    ], [
      button('加入', () => {
        const name = personSel.options[personSel.selectedIndex].textContent;
        const post = postSel.options[postSel.selectedIndex].textContent;
        openConfirm({
          title: '確定要加入嗎',
          bodyNodes: [
            para('會加入 1 行：這一段時間不排 ' + name + ' 做「' + post + '」。'),
            para('生效日：' + (fromInput.value.trim() || '（留空＝即時生效）')
              + '　解除日：' + (toInput.value.trim() || '（留空＝暫時無限期）')),
            para('已經生成的職事表不會自己改。要撳「儲存並確認」系統才會重新檢查。', 'muted')
          ],
          confirmLabel: '確定加入',
          onConfirm: () => runAction('加入中', async () => {
            const res = await callServerMutating('apiAddExclusion', {
              personId: personSel.value,
              postId: postSel.value,
              reason: reasonInput.value.trim(),
              effectiveFrom: fromInput.value.trim(),
              effectiveTo: toInput.value.trim()
            });
            if (!res.ok) { showErrorModal('暫時不做某崗位', new Error(res.message)); return; }
            setStatus('已加入。');
            openExclusions('');
          })
        });
      }, ''),
      button('取消', () => renderExclusions(''), 'secondary')
    ]);
  }


  /* ============================================================
   * 從出席系統補電郵（規格 4.2，第二十七輪批次階段 E）
   * ============================================================
   *
   * ⚠️⚠️ **預設全部唔勾。** 配對錯咗嘅後果係把甲嘅電郵寫入乙嘅資料，
   * 之後乙收到甲嘅職事表，而甲永遠收唔到——而畫面上完全睇唔出。
   */

  let hwcasData = null;
  let hwcasChecked = {};

  function openHwcas() {
    runAction('讀取出席系統資料', async () => {
      hwcasData = await callServer('apiHwcasPreview');
      hwcasChecked = {};
      renderHwcas();
    });
  }

  function renderHwcas() {
    // Config 未設定：講人話，唔可以彈一個「Config 的 X 未設定」出嚟。
    if (!hwcasData.ok && hwcasData.notConfigured) {
      openModal('從出席系統補電郵', [
        make('div', { className: 'warnbox' }, [
          make('div', { text: hwcasData.message, className: 'warn-head' })
        ]),
        para('設定好之後回來重新整理這一頁。', 'muted')
      ], [button('知道了', () => renderPeople(''), '')]);
      return;
    }
    if (!hwcasData.ok) {
      showErrorModal('從出席系統補電郵', new Error(hwcasData.message));
      return;
    }

    const nodes = [
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '出席系統是靠姓名對人的。對錯了就會把甲的電郵寫進乙的資料，'
            + '之後乙收到甲的職事表，而甲永遠收不到。',
          className: 'warn-head'
        }),
        make('div', {
          text: '所以這裡預設全部不勾。請逐個看過再勾。',
          className: 'lines'
        })
      ]),
      make('div', {
        text: '共 ' + hwcasData.counts.total + ' 行　可以套用 '
          + hwcasData.counts.canApply + ' 行　需要特別小心 '
          + hwcasData.counts.needsCare + ' 行　沒有改動 '
          + hwcasData.counts.noChange + ' 行',
        className: 'muted'
      })
    ];

    const applicable = hwcasData.rows.filter((r) => r.canApply);
    const risky = hwcasData.rows.filter((r) => !r.canApply && r.riskLevel === 'HIGH');
    const nothing = hwcasData.rows.filter((r) => !r.canApply && r.riskLevel !== 'HIGH');

    if (applicable.length === 0) {
      nodes.push(make('div', { text: '沒有任何一行可以套用。', className: 'muted' }));
    } else {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('可以套用（' + applicable.length + ' 行）'),
        make('div', {
          text: '勾了才會寫入。不勾就完全不動。',
          className: 'muted'
        })
      ]);
      applicable.forEach((r) => box.appendChild(hwcasRow(r, true)));
      nodes.push(box);
    }

    if (risky.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('系統不敢自己決定（' + risky.length + ' 行，不能勾）'),
        make('div', {
          text: '這幾行要你自己在名單裡處理：加別名、新增人員，或者確認是不是同一位。',
          className: 'muted'
        })
      ]);
      risky.forEach((r) => box.appendChild(hwcasRow(r, false)));
      nodes.push(box);
    }

    if (nothing.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('沒有改動（' + nothing.length + ' 行）')
      ]);
      nothing.forEach((r) => {
        box.appendChild(make('div', {
          text: r.rosterName + '　' + (r.noChange ? '電郵跟現在的一樣' : '出席系統那邊沒有電郵'),
          className: 'vio-row muted'
        }));
      });
      nodes.push(box);
    }

    nodes.push(make('div', { id: 'hwcasFooter', className: 'sec' }));

    openModal('從出席系統補電郵', nodes, [
      button('套用勾了的', () => confirmHwcasApply(), ''),
      button('返回', () => renderPeople(''), 'secondary')
    ]);
    renderHwcasFooter();
  }

  function hwcasRow(r, selectable) {
    const box = make('div', { className: 'prop' + (selectable ? '' : ' is-off') });

    const head = make('div', { className: 'prop-head' });
    if (selectable) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      // ⚠️ **預設唔勾。** 呢一行係整個畫面最重要嘅一行。
      cb.checked = false;
      cb.addEventListener('change', () => {
        if (cb.checked) hwcasChecked[r.personId] = true;
        else delete hwcasChecked[r.personId];
        renderHwcasFooter();
      });
      head.appendChild(cb);
    }
    head.appendChild(make('span', { text: r.rosterName || '（名單上沒有對應的人）' }));
    head.appendChild(make('span', { text: '　出席系統：' + r.hwcasName, className: 'muted' }));
    if (r.memberNo) head.appendChild(make('span', { text: '　編號 ' + r.memberNo, className: 'muted' }));
    box.appendChild(head);

    box.appendChild(make('div', {
      text: '出席系統的電郵：' + (r.hwcasEmail || '（空白）'),
      className: 'vio-row'
    }));
    box.appendChild(make('div', {
      text: '現在系統裡的電郵：' + (r.existingEmail || '（空白）'),
      className: 'vio-row'
    }));

    // 名字相似但唔同人 ⇒ 紅色警告（規格 4.2）。
    if (r.riskLevel === 'HIGH') {
      const warn = make('div', { className: 'vio vio-hard' });
      r.warnings.forEach((w) => warn.appendChild(make('div', { text: w, className: 'vio-row' })));
      box.appendChild(warn);
    } else if (r.warnings.length > 0) {
      r.warnings.forEach((w) => box.appendChild(make('div', { text: w, className: 'link-warn' })));
    }
    if (r.note) box.appendChild(make('div', { text: r.note, className: 'muted' }));

    return box;
  }

  function renderHwcasFooter() {
    const node = el('hwcasFooter');
    if (!node) return;
    clear(node);
    const n = Object.keys(hwcasChecked).length;
    node.appendChild(make('div', {
      text: n === 0 ? '未勾任何一行。' : '已勾 ' + n + ' 行。',
      className: n === 0 ? 'muted' : 'ok-line strong'
    }));
  }

  function confirmHwcasApply() {
    const ids = Object.keys(hwcasChecked);
    if (ids.length === 0) { setStatus('未勾任何一行。', true); return; }

    const byId = {};
    hwcasData.rows.forEach((r) => { byId[r.personId] = r; });

    const list = make('div', { className: 'sec' });
    ids.forEach((id) => {
      const r = byId[id];
      if (!r) return;
      list.appendChild(make('div', {
        text: r.rosterName + '　' + (r.existingEmail || '（空白）') + ' → ' + r.hwcasEmail,
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '確定要套用嗎',
      bodyNodes: [
        para('會改動 ' + ids.length + ' 行。'),
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', { text: '・寫入電郵，並記下來源是出席系統、核對日期是今日', className: 'vio-row' }),
          make('div', { text: '・逐行記入紀錄', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會改動出席系統（那邊一律唯讀）', className: 'vio-row' }),
          make('div', { text: '・不會動你沒有勾的行', className: 'vio-row' }),
          make('div', { text: '・不會寄出任何電郵', className: 'vio-row' })
        ])
      ],
      confirmLabel: '確定套用',
      onConfirm: () => runAction('套用中', async () => {
        const res = await callServerMutating('apiHwcasApplySelected', ids);
        if (!res.ok) { showErrorModal('從出席系統補電郵', new Error(res.message)); return; }
        const nodes = [
          make('div', { text: '已寫入 ' + res.written + ' 行。', className: 'ok-line' })
        ];
        // 略過嘅一定要講——「勾咗 10 個，寫咗 7 個，冇人知」係最差嘅結果。
        if (res.skipped.length > 0) {
          const box = make('div', { className: 'warnbox' }, [
            make('div', {
              text: '有 ' + res.skipped.length + ' 行沒有寫入：',
              className: 'warn-head'
            })
          ]);
          res.skipped.forEach((s) => box.appendChild(make('div', {
            text: (s.nameTC || s.personId) + '：' + s.reason, className: 'lines'
          })));
          nodes.push(box);
        }
        openModal('套用完成', nodes, [button('完成', () => openPeople(''), '')]);
      })
    });
  }

  /* ============================================================
   * 區三共用小元件
   * ============================================================ */

  /** 搜尋格（中文名／英文名／PersonID）。 */
  function peopleSearchBox(keyword, onSearch) {
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.value = keyword || '';
    input.placeholder = '搜尋姓名或編號';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') onSearch(input.value.trim());
    });
    return make('div', { className: 'prop-head' }, [
      make('span', { text: '搜尋' }), input,
      button('搜尋', () => onSearch(input.value.trim()), 'secondary'),
      button('全部', () => onSearch(''), 'link')
    ]);
  }

  function textField(value, placeholder) {
    const input = document.createElement('input');
    input.type = 'text';
    // 姓名／電郵格一律關掉瀏覽器自動填充——唔關嘅話 Chrome 會彈出
    // 使用者自己嘅通訊錄，幹事會以為係系統建議（見階段 B2）。
    input.autocomplete = 'off';
    input.name = 'hwc-roster-field';
    input.value = value || '';
    input.placeholder = placeholder || '';
    return input;
  }

  function dateInput(value) {
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.className = 'inp-date';
    input.value = value || '';
    input.placeholder = 'yyyy-MM-dd';
    return input;
  }
</script>
