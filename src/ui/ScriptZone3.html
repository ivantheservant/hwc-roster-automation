<script>
  /* ============================================================
   * 第二十五輪批次階段 E：區三——名單維護
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第四節。本輪做三個畫面，
   * 按幹事實際使用頻率排：不能服侍日期 > 人員與電郵 > 崗位資格。
   * 身分／個人崗位排除留下一輪。
   *
   * ⚠️ 呢一區係第一次由 Web 介面寫入**真實會友資料**。
   * 之前全部寫入都只碰職事表（可以重新生成）；名單改壞咗係改壞真人資料。
   * 所以每一個寫入動作前面都有一個確認畫面，列明「會改動幾多行」。
   */

  /**
   * 第七十五輪批次 CA 組：呢一區由「名單維護」改成**「常用設定」**。
   *
   * Ivan 手動測試 A：
   *   ・〔人員與電郵〕〔身分（堂委／執事）〕⇒ 直接開試算表嗰張工作表改（新分頁）
   *   ・加〔固定收件人／管理員電郵〕（EmailRecipients）
   *   ・〔匯出規則審閱表〕〔重新生成初稿（覆蓋式）〕由進階與診斷搬上嚟
   *   ・〔崗位資格〕〔暫時不做某崗位〕拿走入口（`PersonPostExclusions` 資料照留、排表照守）
   *   ・〔不能服侍的日期〕搬去「開季前準備」；〔排表偏好〕搬去主流程第 2 步
   *
   * ⚠️ 三條工作表網址由後端 `buildDashboardState_().settingsLinks` 實時砌（試算表 ID 同 gid
   * 都唔寫死）。搵唔到嗰張表 ⇒ 灰掣＋原因，**唔會畫一條去錯地方嘅連結**。
   * ⚠️ 一律 `target=_blank`：唔可以取代幹事介面嗰個分頁。
   * @param {Object=} d dashboard 狀態
   */
  function renderZone3(d) {
    const body = clear(el('zone3Body'));
    const links = (d && d.settingsLinks) || {};
    // 第七十七輪批次 EF 組（Ivan）：〔人員與電郵〕拿走——姓名同電郵由出席系統讀取（EG 組），唔應該再有人手輸入；
    // 「Active 改成 FALSE」嗰句唔再適用。`NameMapping` 嘅 MaxPerQuarter／Active 由管理員直接喺試算表改。
    body.appendChild(para('人員和電郵由出席系統讀取，這裏不用改。'
      + '身分和固定收件人在試算表那一張工作表改（會在新分頁打開）。'));
    body.appendChild(row([
      settingsSheetLink('身分（堂委／執事）', links.roles, 'Roles'),
      settingsSheetLink('固定收件人／管理員電郵', links.recipients, 'EmailRecipients')
    ]));
    // 第八十二輪批次 II 組（Ivan 決定）：〔重新生成初稿（覆蓋式）〕拿走——整季重來用〔整季清走重來〕（IJ 組）
    // 第八十二輪批次 IJ 組：〔整季清走重來〕（紅色危險掣）；受保護季度 ⇒ 灰掣＋原因
    const reset = (d && d.quarterReset) || { blocked: true, reason: '暫時無法確定這一季可不可以重設。按「重新整理」再試。' };
    const resetRow = zone4Row('整季重設',
      // 第八十五輪批次 LB 組（回歸時發現）：說明跟從「保留人手加入的資料」
      '把這一季重設為「還未生成初稿」（連第 0 版、派工紀錄、寄出紀錄、逐格決定等一併清除），'
        + '之後可以重新生成。人手加入的不能服侍日期、每週標題、合堂主日會保留，修改申報變回未處理；'
        + '人員資料、名單、規則、Config 一律不會改動。',
      () => openQuarterResetFromDashboard(), true);
    if (reset.blocked) {
      const b = findChildByTag(resetRow, 'BUTTON');
      if (b) { b.disabled = true; b.title = reset.reason || ''; }
      resetRow.appendChild(make('div', { text: reset.reason || '', className: 'step-why' }));
    }
    body.appendChild(make('div', { className: 'sec' }, [
      zone4Row('匯出規則審閱表', '把系統現時的規則設定變成一份人看得懂的試算表，給堂委逐條決定。',
        () => openRuleExport(), false),
      resetRow
    ]));
  }

  /** 搵第一個 tagName 符合嘅子孫。 */
  function findChildByTag(node, tag) {
    if (!node) return null;
    if (node.tagName === tag) return node;
    const kids = node.children || [];
    for (let i = 0; i < kids.length; i++) {
      const hit = findChildByTag(kids[i], tag);
      if (hit) return hit;
    }
    return null;
  }

  /**
   * 第八十二輪批次 IJ 組：〔整季清走重來〕——同試算表選單「重設季度測試資料」同一支後端。
   * 先列確認清單（`apiQuarterResetPlan`，只讀），已正式發出就最上面紅框；要打「確認重設」先清。
   */
  function openQuarterResetFromDashboard() {
    runAction('讀取確認清單', async () => {
      const p = await callServer('apiQuarterResetPlan', currentQuarterId);
      if (p.blocked) {
        openModal('整季重設', [make('div', { text: p.blockedReason || '這一季不可以重設。', className: 'err-text' })],
          [button('知道了', () => closeModal(), '')]);
        return;
      }
      const nodes = [];
      if (p.officialSent) {
        nodes.push(make('div', { className: 'vio vio-hard' }, [
          make('div', { text: p.officialSentWarning, className: 'vio-head' })
        ]));
      }
      nodes.push(para('會把「' + p.quarterLabel + '」重設為「還未生成初稿」（連第 0 版一併清除）。'
        + '除了 PDF（移到垃圾桶）之外，清除的部分無法復原；人手加入的資料會保留。', 'strong'));
      // 第八十五輪批次 LB 組：確認窗分兩段——「會清除」和「會保留（人手加入）」
      nodes.push(sectionTitle('會清除'));
      const list = make('div', { className: 'sec' });
      (p.lines || []).forEach((l) => list.appendChild(make('div', { text: l || '　', className: 'vio-row' })));
      nodes.push(list);
      nodes.push(sectionTitle('會保留（人手加入）'));
      const keptList = make('div', { className: 'sec' });
      (p.keptLines || []).forEach((l) => keptList.appendChild(make('div', { text: l || '　', className: 'vio-row' })));
      nodes.push(keptList);
      if (p.nothingToDo) {
        nodes.push(para('這一季沒有找到任何可以清理的東西，不需要執行。', 'muted'));
        openModal('整季重設：' + p.quarterLabel, nodes, [button('知道了', () => closeModal(), '')]);
        return;
      }
      openConfirm({
        title: '整季重設：' + p.quarterLabel,
        bodyNodes: nodes,
        requireTyping: true,
        typingPhrase: p.confirmText || '確認重設',
        confirmLabel: '確定重設',
        danger: true,
        onConfirm: (typed) => runAction('重設中，請稍候', async () => {
          const r = await callServerMutating('apiQuarterResetExecute', currentQuarterId, typed);
          openModal('整季重設', [
            make('div', {
              text: r.ok ? ('已重設「' + p.quarterLabel + '」。現在是「還未生成初稿」，可以在第 1 步重新生成。')
                : ('中途失敗：' + (r.error || '') + '　部分內容可能已經被清除，請看 AuditLog。'),
              className: r.ok ? 'ok-line' : 'err-text'
            })
          // 第八十三輪批次 JE 組：同〔重新整理〕同一條路整頁重畫（唔使幹事自己撳）
          ], [button('完成', () => refreshLikeButton(), '')]);
        })
      });
    });
  }

  /**
   * 第七十七輪批次 EF 組：常用設定**預設展開**——載入、重新整理、換季度之後都係展開，而且每次重畫
   *（同開季前準備 `renderZone2Head()` 同一個做法：`setZoneOpen()` 直接開 ⇒ 要自己 `markZoneLoaded()`）。
   * @param {Object} d dashboard 狀態
   */
  function renderZone3Always(d) {
    setZoneOpen('zone3Head', 'zone3Body', true);
    markZoneLoaded('zone3Body');
    renderZone3(d);
  }

  /**
   * 常用設定入面「在新分頁開某一張工作表」嘅掣。
   * @param {string} label 掣上嘅字
   * @param {string} url 後端砌好嘅網址；空 ⇒ 灰掣
   * @param {string} sheetName 工作表名（只用嚟寫原因）
   * @returns {Node}
   */
  function settingsSheetLink(label, url, sheetName) {
    // 第八十七輪批次 NB 組：只可查看的人沒有主試算表的存取權 ⇒ 灰色按鈕
    if (viewOnly_) return markViewOnlyBlocked_(button(label, () => {}, 'secondary'));
    if (!url) {
      const b = button(label, () => {}, 'secondary');
      b.disabled = true;
      b.title = '找不到「' + sheetName + '」這一張工作表，或者暫時讀不到它的位置。按「重新整理」再試。';
      return b;
    }
    const a = make('a', { text: label, className: 'bigLink' });
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }

  /* ============================================================
   * 畫面一：不能服侍的日期（規格 4.1）
   * ============================================================ */

  let unavailableData = null;
  /**
   * 第七十五輪批次 CM 組：「顯示其他季度和已取消的」。**預設唔勾**——
   * 只顯示同揀咗嘅季度重疊、而且生效中嘅紀錄。
   * Ivan：重設之後見到一堆紀錄，以為係測試資料冇清，其實係其他季度嘅。
   */
  let unavailableShowAll_ = false;

  function openUnavailable(keyword, keepShowAll) {
    if (!keepShowAll) unavailableShowAll_ = false;
    runAction('讀取不能服侍的日期', async () => {
      unavailableData = await callServer('apiListUnavailable', currentQuarterId, keyword || '');
      renderUnavailable(keyword || '');
    });
  }

  /**
   * 第七十五輪批次 CM 組：新增時嘅預設日期一定落喺呢一季之內。
   * 今日喺季度入面 ⇒ 今日；否則 ⇒ 季度第一日。讀唔到季度 ⇒ 空白（照舊）。
   * @param {Object} data `apiListUnavailable` 嘅結果
   * @returns {string} yyyy-MM-dd 或空字串
   */
  function defaultUnavailableDate(data) {
    const s = data && data.quarterStart;
    const e = data && data.quarterEnd;
    if (!s || !e) return '';
    const t = data.today || '';
    return (t >= s && t <= e) ? t : s;
  }

  function renderUnavailable(keyword) {
    const nodes = [
      // 規格 4.1：呢句一定要有。唔講嘅話幹事會以為填個時間就得。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統沒有「上半場不在」這種概念。填了就代表整日不能服侍。',
          className: 'warn-head'
        })
      ]),
      peopleSearchBox(keyword, (k) => openUnavailable(k, true))
    ];

    nodes.push(row([button('＋ 新增一筆', () => openUnavailableEditor(null), '')], 'row-right'));

    // ── 第七十五輪批次 CM 組：預設只顯示呢一季 ───────────────────
    const showAll = unavailableShowAll_;
    const qs = unavailableData.quarterStart || '';
    const qe = unavailableData.quarterEnd || '';
    const inQ = (r) => r.inQuarter !== false;
    const current = showAll ? unavailableData.current : unavailableData.current.filter(inQ);
    const hiddenCount = showAll ? 0
      : (unavailableData.current.length - current.length)
        + (unavailableData.cancelled || []).length + unavailableData.past.length;

    const toggleLine = make('label', { className: 'check-row' });
    const toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.checked = showAll;
    toggle.addEventListener('change', () => {
      unavailableShowAll_ = !!toggle.checked;
      renderUnavailable(keyword);
    });
    toggleLine.appendChild(toggle);
    toggleLine.appendChild(make('span', { text: '顯示其他季度和已取消的' }));
    nodes.push(toggleLine);

    const scope = (qs && qe) ? ('這一季（' + qs + ' 至 ' + qe + '）') : '這一季';
    if (current.length === 0) {
      nodes.push(make('div', {
        text: showAll ? '目前沒有生效中的紀錄。' : (scope + '沒有生效中的紀錄。'),
        className: 'muted'
      }));
    } else {
      const box = make('div', { className: 'sec' }, [
        sectionTitle(showAll ? '生效中（全部季度）' : ('生效中：' + scope))
      ]);
      current.forEach((r) => box.appendChild(unavailableRow(r)));
      nodes.push(box);
    }
    if (hiddenCount > 0) {
      nodes.push(make('div', {
        text: '另有 ' + hiddenCount + ' 筆是其他季度、已過去或已取消的紀錄，沒有顯示（勾上面那一格就會列出）。',
        className: 'muted'
      }));
    }
    if (!showAll) {
      openModal('不能服侍的日期', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
      return;
    }

    // 第三十四輪批次乙3：已取消嘅獨立一組。
    // ⚠️ 修正之前呢啲行係**混喺「生效中」裡面**——排表引擎已經忽略咗佢哋，
    // 但幹事見到佢哋列喺生效中，會以為一條已經取消嘅限制仍然生效。
    if ((unavailableData.cancelled || []).length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('已取消（' + unavailableData.cancelled.length
          + ' 筆，排表不會理會，保留紀錄，不會刪除）')
      ]);
      unavailableData.cancelled.forEach((r) => {
        const line = unavailableRow(r, { cancelled: true });
        line.className += ' is-off';
        box.appendChild(line);
      });
      nodes.push(box);
    }

    // 過期嘅摺埋，**唔刪**——刪咗就冇咗紀錄。
    if (unavailableData.past.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('已過去（' + unavailableData.past.length + ' 筆，保留紀錄，不會刪除）')
      ]);
      unavailableData.past.forEach((r) => {
        const line = unavailableRow(r);
        line.className += ' is-off';
        box.appendChild(line);
      });
      nodes.push(box);
    }

    openModal('不能服侍的日期', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  function unavailableRow(r, opts) {
    const o = opts || {};
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', {
      text: r.personName + '　' + r.dateFrom + ' 至 ' + r.dateTo
        + '　' + (r.appliesTo === 'ALL' ? '全部崗位' : '指定崗位：' + r.postIds.join('、'))
        + (o.cancelled ? '　（已取消）' : ''),
      className: 'prop-head'
    }));
    if (r.reason) box.appendChild(make('div', { text: '原因：' + r.reason, className: 'muted' }));

    const actions = [button('修改', () => openUnavailableEditor(r), 'link')];
    // ─────────────────────────────────────────────────────────────
    // 第三十四輪批次乙2：**加返「取消這一筆」。**
    //
    // `apiSaveUnavailable()` 一直都支援 `active: false`（寫 Status=CANCELLED），
    // 但呢個畫面由頭到尾冇任何方法把 `active` 送成 `false`
    // ——後端有能力，介面上到唔到。對比「暫時不做某崗位」有〔解除限制〕、
    // 「身分」有換屆同生效至，只有呢一頁漏咗。
    //
    // 實務上好重要：不能服侍日期係義工最常反口嘅嘢，幹事本來只能開試算表
    // 自己改 `Status`。
    // ─────────────────────────────────────────────────────────────
    if (!o.cancelled) {
      actions.push(button('取消這一筆', () => confirmCancelUnavailable(r), 'link danger'));
    }
    box.appendChild(row(actions, 'row-right'));
    return box;
  }

  /**
   * 乙2：取消一筆之前要確認——因為佢會影響排表
   *（嗰個人由「唔可以派」變返「可以派」）。
   */
  function confirmCancelUnavailable(r) {
    openModal('取消這一筆不能服侍的日期', [
      make('div', {
        text: r.personName + '　' + r.dateFrom + ' 至 ' + r.dateTo,
        className: 'prop-head'
      }),
      para('取消之後，排表就會當這個人在這段日期可以服侍。', ''),
      para('這一筆不會被刪除，只會標示為「已取消」，之後仍然查得到。', 'muted'),
      // ⚠️ 用 `vio vio-warn`（本檔案既有慣例），唔可以自己作一個 `warn` class
      // ——Style.html 冇一條淨係 `.warn` 嘅規則，寫咗會完全冇效果，
      // 變成一句「應該扎眼但其實同普通字一樣」嘅警告。
      make('div', {
        text: '現有版本不會自己變。要重新檢查，按「儲存」。',
        className: 'vio vio-warn'
      })
    ], [
      button('確定取消這一筆', () => {
        runAction('取消中', async () => {
          // ⚠️ 一定要用 `callServerMutating()`——取消一筆會改動資料，
          // 而且會影響排表（嗰個人由「唔可以派」變返「可以派」），
          // 所以區一嘅狀態卡同四粒掣都要跟住重新整理。
          // 用 `callServer()` 會被唯讀白名單擋住（有測試守住呢條規則）。
          const res = await callServerMutating('apiSaveUnavailable', {
            unavailableId: r.unavailableId,
            quarterId: currentQuarterId,
            personId: r.personId,
            dateFrom: r.dateFrom,
            dateTo: r.dateTo,
            appliesTo: r.appliesTo,
            postIds: r.postIds || [],
            reason: r.reason || '',
            active: false
          });
          if (!res.ok) { showErrorModal('不能服侍的日期', new Error(res.message)); return; }
          // 列表要即時反映——重新讀，唔係喺前端自己刪走一行。
          unavailableData = await callServer('apiListUnavailable', currentQuarterId, '');
          openUnavailable('', true);
        });
      }, 'danger'),
      button('不要取消', () => openUnavailable('', true), 'secondary')
    ]);
  }

  /** 新增／修改嘅編輯畫面。`existing` 為 null 就係新增。 */
  function openUnavailableEditor(existing) {
    const e = existing || {};

    const personSel = document.createElement('select');
    unavailableData.people.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      if (e.personId === p.personId) o.selected = true;
      personSel.appendChild(o);
    });

    // 第七十五輪批次 CM 組：新增時預設日期落喺呢一季之內
    const fromInput = dateInput(e.dateFrom || (existing ? '' : defaultUnavailableDate(unavailableData)));
    const toInput = dateInput(e.dateTo || (existing ? '' : defaultUnavailableDate(unavailableData)));

    const appliesSel = document.createElement('select');
    [['ALL', '全部崗位'], ['POSTS', '指定崗位']].forEach(([v, t]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      if ((e.appliesTo || 'ALL') === v) o.selected = true;
      appliesSel.appendChild(o);
    });

    const postBox = make('div', { className: 'prop-opts' });
    const postInputs = [];
    unavailableData.posts.forEach((p) => {
      const label = make('label', { className: 'check-row inline' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = (e.postIds || []).indexOf(p.postId) !== -1;
      cb.dataset.postId = p.postId;
      postInputs.push(cb);
      label.appendChild(cb);
      label.appendChild(make('span', { text: p.postNameTC }));
      postBox.appendChild(label);
    });
    // 只有揀「指定崗位」先開放勾——揀「全部崗位」時仲勾住幾個，
    // 幹事會以為嗰幾個有特別意思。
    //
    // ⚠️ 第三十四輪批次乙1：本來淨係設 `hidden`，但 `.prop-opts` 有
    // `display: flex`，class 選擇器蓋過咗瀏覽器嘅 `[hidden] { display: none }`
    // ——即係**完全冇收起過**。實測：揀「全部崗位」同時勾咗「讀經」，
    // 寫入嘅係 `AppliesTo=ALL`、`PostIDs` 空白，個勾零作用零提示。
    //
    // Style.html 加咗一條總規則令 `[hidden]` 真係收起。呢度再加一層：
    // 逐個 checkbox `disabled`。**兩層都要**——CSS 嗰層日後再被蓋過嘅話，
    // disabled 仍然令佢撳唔到、而且明顯係灰色。
    const syncPostBox = () => {
      const off = appliesSel.value !== 'POSTS';
      postBox.hidden = off;
      postInputs.forEach((cb) => { cb.disabled = off; });
    };
    appliesSel.addEventListener('change', syncPostBox);
    syncPostBox();

    const reasonInput = document.createElement('input');
    reasonInput.type = 'text';
    reasonInput.autocomplete = 'off';
    reasonInput.value = e.reason || '';
    reasonInput.placeholder = '原因（例如：外遊）';

    const impactBox = make('div', { className: 'sec' });

    const collect = () => ({
      unavailableId: e.unavailableId || '',
      quarterId: currentQuarterId,
      personId: personSel.value,
      dateFrom: fromInput.value.trim(),
      dateTo: toInput.value.trim(),
      appliesTo: appliesSel.value,
      // ⚠️ 第三十四輪批次乙1：揀「全部崗位」時**一定要送空陣列**。
      // 後端本來就會忽略佢（寫入 PostIDs 空白），但送一份會被靜靜丟棄嘅
      // 資料上去，就係「畫面同實際寫入唔一致」嘅來源——
      // 「先看影響」嗰個預覽亦都會照住一份唔會生效嘅資料去算。
      postIds: appliesSel.value === 'POSTS'
        ? postInputs.filter((c) => c.checked).map((c) => c.dataset.postId)
        : [],
      reason: reasonInput.value.trim()
    });

    const nodes = [
      make('div', { className: 'prop-head' }, [
        make('span', { text: '誰' }), personSel,
        make('span', { text: '由' }), fromInput,
        make('span', { text: '至' }), toInput
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '適用於' }), appliesSel
      ]),
      postBox,
      make('div', { className: 'prop-head' }, [
        make('span', { text: '原因' }), reasonInput
      ]),
      para('日期請用 2026-11-08 這種寫法（年-月-日）。'
        + '「11/8」這種寫法系統不接受——因為分不出是 11 月 8 日還是 8 月 11 日。', 'muted'),
      impactBox
    ];

    openModal(existing ? '修改不能服侍的日期' : '新增不能服侍的日期', nodes, [
      button('先看影響', () => {
        runAction('計算影響', async () => {
          const res = await callServer('apiPreviewUnavailableImpact', collect());
          renderUnavailableImpact(impactBox, res);
        });
      }, 'secondary'),
      button('儲存', () => {
        runAction('計算影響', async () => {
          const preview = await callServer('apiPreviewUnavailableImpact', collect());
          if (!preview.ok) { showErrorModal('不能服侍的日期', new Error(preview.message)); return; }
          confirmSaveUnavailable(collect(), preview, personSel.options[personSel.selectedIndex].textContent);
        });
      }, ''),
      button('取消', () => renderUnavailable(''), 'secondary')
    ]);
  }

  function renderUnavailableImpact(node, res) {
    clear(node);
    if (!res.ok) {
      node.appendChild(make('div', { text: res.message, className: 'vio vio-hard' }));
      return;
    }
    node.appendChild(make('div', {
      text: res.coveredDates.length === 0
        ? '這個日期範圍沒有涵蓋本季任何一個主日。'
        : '這個日期範圍涵蓋本季 ' + res.coveredDates.length + ' 個主日：'
          + res.coveredDates.join('、'),
      className: 'lines'
    }));

    // 規格 4.1：已經被排咗嘅話要紅字，而且要講明「加咗都唔會自動改」。
    if (res.conflicts.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', { text: '他在這幾格已經被排了：', className: 'vio-head' }));
      res.conflicts.forEach((c) => {
        box.appendChild(make('div', {
          text: c.serviceDate + '　' + c.postNameTC, className: 'vio-row'
        }));
      });
      box.appendChild(make('div', {
        text: '加了這一筆之後，現有的職事表不會自己改。'
          + '要按「儲存」系統才會重新檢查。',
        className: 'vio-row'
      }));
      node.appendChild(box);
    }
  }

  function confirmSaveUnavailable(payload, preview, personName) {
    const bodyNodes = [
      para('會改動 1 行。'),
      make('div', { className: 'sec' }, [
        make('div', { text: personName + '　' + preview.dateFrom + ' 至 ' + preview.dateTo, className: 'vio-row' }),
        make('div', {
          text: payload.appliesTo === 'ALL' ? '全部崗位' : '指定崗位：' + payload.postIds.join('、'),
          className: 'vio-row'
        }),
        make('div', {
          text: '涵蓋本季 ' + preview.coveredDates.length + ' 個主日'
            + (preview.conflicts.length > 0 ? '，其中 ' + preview.conflicts.length + ' 格他已經被排了' : ''),
          className: 'vio-row'
        })
      ])
    ];
    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: bodyNodes,
      confirmLabel: '確定儲存',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveUnavailable', payload);
          if (!res.ok) { showErrorModal('不能服侍的日期', new Error(res.message)); return; }
          setStatus(res.created ? '已加入。' : '已更新。');
          unavailableData = await callServer('apiListUnavailable', currentQuarterId, '');
          renderUnavailable('');
        });
      }
    });
  }

  /* 第七十七輪批次 EF 組：畫面二「人員與電郵」整個拿走（Ivan：姓名同電郵由出席系統讀取，唔應該再有人手輸入）。 */

  /* ============================================================
   * 畫面三：崗位資格矩陣（規格 4.4）
   * ============================================================ */

  let eligData = null;
  let eligChanges = {};      // `personId|postId` → true/false
  let eligPostFilter = '';   // 空 = 全部崗位

  function openEligibility() {
    runAction('讀取崗位資格', async () => {
      eligData = await callServer('apiGetEligibilityMatrix');
      eligChanges = {};
      eligPostFilter = '';
      renderEligibility('');
    });
  }

  /**
   * ⚠️ 渲染策略（約 90 人 × 16 崗位 = 1440 格）
   *
   * **一次過畫 1440 個 checkbox 太笨重**（DOM 好慢，而且幹事要橫向捲
   * 十幾欄先搵到一個崗位）。所以預設**按崗位分頁**：一次睇一個崗位嘅
   * 全部人，再加姓名搜尋。
   *
   * 但**統計數字一律用後端喺完整資料上面計嗰個**——分頁只影響畫幾多格，
   * 唔會影響「合資格 N 人」。如果統計跟住分頁走，個數字就會係
   * 「當前頁嘅 N 人」，即係一個錯數，而幹事完全睇唔出。
   */
  function renderEligibility(keyword) {
    const nodes = [
      // 規格 4.4：呢句一定要有。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統只會排曾任該崗位的人。新人一定要在這裏加，系統不會自己擴充。',
          className: 'warn-head'
        })
      ])
    ];

    // 崗位選擇：兼顧「搵得到」同「唔好一次畫晒」。
    const postSel = document.createElement('select');
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '── 選一個崗位 ──';
    postSel.appendChild(allOpt);
    eligData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      // 第二十六輪批次階段 D1：thin 由後端計，而後端已經排除咗唔自動排
      // 嘅崗位（講員／翻譯／獻花）——嗰幾個合資格 0 人係正常而且正確。
      o.textContent = p.postNameTC + '（合資格 ' + p.eligibleCount + ' 人'
        + (p.thin ? '，太少' : '')
        + (p.autoAssigned === false ? '，不自動排' : '') + '）';
      if (eligPostFilter === p.postId) o.selected = true;
      postSel.appendChild(o);
    });
    postSel.addEventListener('change', () => {
      eligPostFilter = postSel.value;
      renderEligibility(keyword);
    });

    nodes.push(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel
    ]));

    // 人數太少嘅崗位一覽——**唔理揀咗邊個崗位都顯示**，
    // 因為呢個係「成盤數有冇問題」嘅訊號，唔應該要逐個崗位撳先見到。
    const thin = eligData.posts.filter((p) => p.thin);
    if (thin.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', {
        text: '有 ' + thin.length + ' 個崗位的合資格人數少於 '
          + eligData.thinThreshold + ' 人：',
        className: 'vio-head'
      }));
      thin.forEach((p) => box.appendChild(make('div', {
        text: p.postNameTC + '：' + p.eligibleCount + ' 人', className: 'vio-row'
      })));
      nodes.push(box);
    }

    if (!eligPostFilter) {
      nodes.push(make('div', {
        text: '選一個崗位，就會列出全部人，逐個勾。',
        className: 'muted'
      }));
    } else {
      nodes.push(peopleSearchBox(keyword, (k) => renderEligibility(k)));
      const post = eligData.posts.filter((p) => p.postId === eligPostFilter)[0];
      const list = make('div', { className: 'sec' }, [
        sectionTitle(post.postNameTC + '：現時合資格 ' + post.eligibleCount + ' 人')
      ]);

      const k = String(keyword || '').trim().toLowerCase();
      eligData.people.forEach((person) => {
        if (k && (person.nameTC + ' ' + person.nameEN + ' ' + person.personId)
          .toLowerCase().indexOf(k) === -1) return;

        const key = person.personId + '|' + eligPostFilter;
        const cell = eligData.cells[key] || { eligible: false, historicalCount: 0 };
        const current = Object.prototype.hasOwnProperty.call(eligChanges, key)
          ? eligChanges[key] : cell.eligible;

        const label = make('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = current;
        cb.addEventListener('change', () => {
          // 改返做原本嘅值就當冇改過——確認畫面唔應該報一個
          // 「勾咗再取消勾」嘅假改動。
          if (cb.checked === cell.eligible) delete eligChanges[key];
          else eligChanges[key] = cb.checked;
          renderEligibilityFooter();
        });
        label.appendChild(cb);
        label.appendChild(make('span', {
          text: person.nameTC + (person.active ? '' : '（已停用）')
        }));
        // 第八十五輪批次 LC 組：「堂委」「執事」那幾行是身分，不是一個人——按每個主日當日的現任展開
        label.appendChild(make('span', {
          text: person.isRole ? '身分：每個主日按當日現任展開'
            : (cell.historicalCount > 0 ? '做過 ' + cell.historicalCount + ' 次' : '未做過'),
          className: 'muted'
        }));
        label.appendChild(make('span', {
          text: '合共 ' + person.postCount + ' 個崗位', className: 'muted'
        }));
        list.appendChild(label);
      });
      nodes.push(list);
    }

    nodes.push(make('div', { id: 'eligFooter', className: 'sec' }));

    openModal('崗位資格', nodes, [
      button('儲存改動', () => confirmEligibilityBatch(), ''),
      button('關閉', () => closeModalAndRefresh(), 'secondary')
    ]);
    renderEligibilityFooter();
  }

  function renderEligibilityFooter() {
    const node = el('eligFooter');
    if (!node) return;
    clear(node);
    const summary = summariseEligChanges();
    node.appendChild(make('div', {
      text: summary.total === 0
        ? '未有任何改動。'
        : '未儲存的改動：新增 ' + summary.added + ' 項資格、取消 ' + summary.removed + ' 項資格。',
      className: summary.total === 0 ? 'muted' : 'ok-line strong'
    }));
  }

  function summariseEligChanges() {
    let added = 0;
    let removed = 0;
    Object.keys(eligChanges).forEach((k) => {
      if (eligChanges[k]) added++; else removed++;
    });
    return { added: added, removed: removed, total: added + removed };
  }

  function confirmEligibilityBatch() {
    const summary = summariseEligChanges();
    if (summary.total === 0) { setStatus('未有任何改動。'); return; }

    const nameById = {};
    eligData.people.forEach((p) => { nameById[p.personId] = p.nameTC; });
    const postById = {};
    eligData.posts.forEach((p) => { postById[p.postId] = p.postNameTC; });

    const list = make('div', { className: 'sec' });
    Object.keys(eligChanges).forEach((k) => {
      const parts = k.split('|');
      list.appendChild(make('div', {
        text: (eligChanges[k] ? '＋ ' : '－ ') + (nameById[parts[0]] || parts[0])
          + '　' + (postById[parts[1]] || parts[1]),
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: [
        para('會新增 ' + summary.added + ' 項資格、取消 ' + summary.removed + ' 項資格。'),
        list,
        para('取消資格不會刪除那一行，做過的次數會保留。', 'muted')
      ],
      confirmLabel: '確定儲存',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const changes = Object.keys(eligChanges).map((k) => {
            const parts = k.split('|');
            return { personId: parts[0], postId: parts[1], eligible: eligChanges[k] };
          });
          // 第六十七輪批次 AI 組：傳埋季度，後端順帶算「這一版有幾多格的人已唔喺名單上」
          const res = await callServerMutating('apiSaveEligibilityBatch', changes, currentQuarterId);
          if (!res.ok) { showErrorModal('崗位資格', new Error(res.message || '儲存失敗')); return; }
          setStatus('已新增 ' + res.added + ' 項、取消 ' + res.removed + ' 項。');
          eligData = await callServer('apiGetEligibilityMatrix');
          eligChanges = {};
          renderEligibility('');
          // 名單改咗而現有職事表上有格受影響 ⇒ 要講，而且要有出口
          const impactNodes = buildEligibilityImpactNodes(res.eligibilityImpact, { withButton: true });
          if (impactNodes.length > 0) {
            openModal('名單已儲存', [
              para('已新增 ' + res.added + ' 項、取消 ' + res.removed + ' 項。')
            ].concat(impactNodes), [button('知道了', () => closeModal(), '')]);
          }
        });
      }
    });
  }

  /* ============================================================
   * 畫面四：排表偏好（規格 4.6，第二十六輪批次階段 C4）
   * ============================================================ */

  let weightData = null;
  let weightChanges = {};
  let weightPostFilter = '';
  // 第七十七輪批次 EA 組：「也用於之後的季度（直到再改）」，**預設不勾**＝只用於這一季。
  let weightApplyFuture = false;

  function openWeights() {
    runAction('讀取排表偏好', async () => {
      weightData = await callServer('apiGetPersonPostWeightMatrix', currentQuarterId);
      weightChanges = {};
      weightPostFilter = '';
      weightApplyFuture = false;
      renderWeights();
    });
  }

  /** 第七十七輪批次 EA 組：畫面同確認窗都用呢個季度名（後端砌，冇就退回季度 ID）。 */
  function weightQuarterLabel() {
    return (weightData && weightData.quarterLabel) || currentQuarterId || '';
  }

  function renderWeights() {
    const nodes = [
      // 規格 4.6：呢句一定要有。冇咗嘅話，幹事會以為「少一次」＝「唔俾佢做」，
      // 然後去取消佢嘅資格——嗰個係一件完全唔同、而且好難復原嘅事。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這裏只影響「誰做多少次」。不會影響誰有資格做，'
            + '也不會令系統違反任何規則。',
          className: 'warn-head'
        })
      ]),
      para('「多一次」的意思是「這一季比系統原本會派的多大約一次」，'
        + '不是「一定多一次」——系統仍然要先滿足所有規則。', 'muted'),
      // 第七十七輪批次 EA 組：一律按所揀季度顯示（參考日期＝季度開始日）
      para('這裏顯示的是 ' + weightQuarterLabel() + ' 生效的偏好。每一項旁邊寫明是「只限這一季」還是「之後各季都用」。', 'muted')
    ];

    // 查不到用人量就講出嚟。唔講嘅話，畫面上「冇黃字」會被理解成
    // 「檢查過，冇人接近上限」——同「根本冇檢查過」意思完全相反。
    if (!weightData.loadAvailable) {
      nodes.push(make('div', {
        text: weightData.loadUnavailableReason
          + '（生成初稿之後回來看，這裏就會標出誰加了也不會生效。）',
        className: 'muted'
      }));
    }

    if (weightData.invalid && weightData.invalid.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', {
        text: '有 ' + weightData.invalid.length + ' 行的數值超出範圍，這幾行完全沒有生效：',
        className: 'vio-head'
      }));
      weightData.invalid.forEach((b) => box.appendChild(make('div', {
        text: weightPersonPostLabel(b.personId, b.postId) + '　' + b.reason, className: 'vio-row'
      })));
      nodes.push(box);
    }

    const postSel = document.createElement('select');
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '── 選一個崗位 ──';
    postSel.appendChild(allOpt);
    weightData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      o.textContent = p.postNameTC + '（' + p.people.length + ' 人有資格）';
      if (weightPostFilter === p.postId) o.selected = true;
      postSel.appendChild(o);
    });
    postSel.addEventListener('change', () => {
      weightPostFilter = postSel.value;
      renderWeights();
    });
    nodes.push(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel
    ]));

    if (!weightPostFilter) {
      nodes.push(make('div', {
        text: '選一個崗位，就會列出有資格做那個崗位的人。',
        className: 'muted'
      }));
    } else {
      const post = weightData.posts.filter((p) => p.postId === weightPostFilter)[0];
      const list = make('div', { className: 'sec' }, [sectionTitle(post.postNameTC)]);
      // ⚠️ 只列**有該崗位資格**嘅人（後端已經篩好）——
      // 90 × 16 個空下拉係一幅噪音，幹事會搵唔到想改嗰個。
      if (post.people.length === 0) {
        list.appendChild(make('div', {
          text: '這個崗位還沒有任何人有資格。要先去「崗位資格」加人。',
          className: 'muted'
        }));
      }
      post.people.forEach((person) => list.appendChild(weightRow(post, person)));
      nodes.push(list);
    }

    // 第七十七輪批次 EA 組：範圍勾選框（預設不勾＝只用於這一季）
    const futureBox = document.createElement('input');
    futureBox.type = 'checkbox';
    futureBox.id = 'weightApplyFuture';
    futureBox.checked = weightApplyFuture;
    futureBox.addEventListener('change', () => { weightApplyFuture = futureBox.checked; });
    const futureLabel = make('label', { className: 'check-row' }, [
      futureBox, make('span', { text: ' 也用於之後的季度（直到再改）' })
    ]);
    nodes.push(make('div', { className: 'sec' }, [
      futureLabel,
      para('不勾＝這次的改動只用於 ' + weightQuarterLabel() + '，之後的季度不受影響。', 'muted')
    ]));

    nodes.push(make('div', { id: 'weightFooter', className: 'sec' }));
    openModal('排表偏好：' + weightQuarterLabel(), nodes, [
      button('儲存改動', () => confirmWeightBatch(), ''),
      button('關閉', () => closeModalAndRefresh(), 'secondary')
    ]);
    renderWeightFooter();
  }

  function weightRow(post, person) {
    const key = person.personId + '|' + post.postId;
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', { text: person.nameTC, className: 'prop-head' }));

    // ⚠️ 第二十八輪批次階段 A3：**每一行都顯示基準同目標**，唔理有冇偏好。
    //
    // Ivan 實測撞到嘅根本問題：佢揀咗「多一次」，但畫面上冇任何數字話俾佢知
    // 「多一次」係由幾多變到幾多，所以生成完之後亦冇辦法知道有冇生效。
    // （而實際上舊版嗰個語意令佢完全冇生效——冇人睇得出。）
    //
    // 呢句字由後端砌（`describeWeightBaseline_()`），前端唔可以自己再砌一次
    // ——兩邊各砌一次就會有一日兩個畫面講唔同嘅嘢。
    const targetLine = make('div', { text: person.baselineText, className: 'lines' });
    // `thisQuarterCount` 係 null ＝ 呢一季未有版本，**唔係「已排 0 次」**。
    if (person.thisQuarterCount !== null && person.thisQuarterCount !== undefined) {
      targetLine.textContent += '　今季已排 ' + person.thisQuarterCount + ' 次';
    }
    box.appendChild(targetLine);

    // ⚠️ 第二十九輪批次階段 C：實際次數同目標對唔上嗰陣，**喺呢一頁講返點解**。
    //
    // 原本個原因收咗喺選單「軟規則實測量度」入面，而幹事根本唔會去嗰度。
    // 佢喺呢一頁見到「今季目標 2 次　今季已排 1 次」而冇下文，
    // 只會得出一個結論：「呢個功能壞咗」。
    //
    // 呢句字由後端 `buildPersonPostWeightReport_()` 算——同 `Diagnostics`
    // 嗰一節、同選單版嗰個工具用嘅係同一份計算。
    // **前端唔可以自己判斷「差咗定多咗」再砌一句**：另寫一套就係
    // 同一件事兩個真相來源。
    if (person.gapText) {
      box.appendChild(make('div', { text: '⚠ ' + person.gapText, className: 'link-warn' }));
    }

    // ⚠️ 下拉用人話，**唔俾幹事打數字**——打錯一個負號就完全相反，
    // 而「多一次」同「少一次」睇落只差一個字。
    const sel = document.createElement('select');
    weightData.choices.forEach((c) => {
      const o = document.createElement('option');
      o.value = String(c.adjust);
      o.textContent = c.label;
      if (c.adjust === person.adjust) o.selected = true;
      sel.appendChild(o);
    });

    const reasonInput = textField(person.reason, '原因（必填，例如：堂委 2026-08 決議）');

    const sync = () => {
      const adjust = Number(sel.value);
      if (adjust === person.adjust) delete weightChanges[key];
      else weightChanges[key] = { adjust: adjust, reason: reasonInput.value.trim() };
      renderWeightFooter();
    };
    sel.addEventListener('change', sync);
    reasonInput.addEventListener('input', sync);

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '偏好' }), sel,
      make('span', { text: '原因' }), reasonInput
    ]));
    if (person.adjust !== 0) {
      // 第七十七輪批次 EA 組：寫明範圍
      box.appendChild(make('div', {
        text: '目前生效中（' + (person.scopeText || '之後各季都用') + '）。'
          + '選「一般（預設）」就會改為照一般排（記錄會保留，不會刪除）。',
        className: 'muted'
      }));
    }

    // ⚠️ 第二十七輪批次階段 B2：撞到每季上限嘅話，即場講。
    //
    // 離線驗收撞到：四行偏好之中兩行「冇變」，因為嗰兩位已經到咗
    // `MaxPerQuarter`，而偏好係軟嘅，唔會突破上限。機制係啱嘅，
    // 但幹事揀咗「多一次」而乜都冇發生，佢只會覺得「呢個功能壞咗」，
    // 然後去做啲更危險嘅嘢（例如去改人哋嘅崗位資格）。
    //
    // `quarterLoad` 係 null ＝ **查不到**（未揀季度／未有版本／讀取失敗），
    // 唔係「冇接近上限」。查不到就唔講——講「他還沒有接近上限」等於
    // 話「已經檢查過」，而根本冇檢查過。
    const load = person.quarterLoad;
    if (load && load.near) {
      box.appendChild(make('div', {
        text: load.atLimit
          ? '這位這一季已經排滿每季上限（' + load.limit + ' 次，已排 ' + load.count
            + ' 次），加「多一次」不會生效——系統不會為了偏好而超出上限。'
          : '這位已經接近每季上限（' + load.limit + ' 次，已排 ' + load.count
            + ' 次），加「多一次」可能不會生效。',
        className: 'link-warn'
      }));
    }
    return box;
  }

  function renderWeightFooter() {
    const node = el('weightFooter');
    if (!node) return;
    clear(node);
    const summary = summariseWeightChanges();
    node.appendChild(make('div', {
      text: summary.total === 0
        ? '未有任何改動。'
        : '未儲存的改動：新增 ' + summary.added + ' 項偏好、解除 ' + summary.released + ' 項偏好。',
      className: summary.total === 0 ? 'muted' : 'ok-line strong'
    }));
  }

  function summariseWeightChanges() {
    let added = 0;
    let released = 0;
    Object.keys(weightChanges).forEach((k) => {
      if (weightChanges[k].adjust === 0) released++; else added++;
    });
    return { added: added, released: released, total: added + released };
  }

  /**
   * 第八十三輪批次 JC 組：偏好相關畫面一律寫「人名　崗位名」，唔可以出 PersonID／PostID。
   * 名由 `weightData.posts`（後端已經譯好）查；查唔到都唔印代號。
   * @param {string} personId
   * @param {string} postId
   * @returns {string}
   */
  function weightPersonPostLabel(personId, postId) {
    const post = ((weightData && weightData.posts) || []).filter((p) => p.postId === postId)[0];
    let person = post ? (post.people || []).filter((x) => x.personId === personId)[0] : null;
    if (!person) {
      ((weightData && weightData.posts) || []).forEach((p) => {
        if (!person) person = (p.people || []).filter((x) => x.personId === personId)[0] || null;
      });
    }
    return (person ? person.nameTC : '（名單上找不到這個人）') + '　' + (post ? post.postNameTC : '（找不到這個崗位）');
  }

  function confirmWeightBatch() {
    const summary = summariseWeightChanges();
    if (summary.total === 0) { setStatus('未有任何改動。'); return; }

    // 每一項偏好都要填原因——三個月之後，冇原因嘅偏好冇人記得點解。
    const missing = Object.keys(weightChanges).filter((k) => {
      return weightChanges[k].adjust !== 0 && !weightChanges[k].reason;
    });
    if (missing.length > 0) {
      setStatus('有 ' + missing.length + ' 項未填原因。每一項偏好都要填原因才可以儲存。', true);
      return;
    }

    const list = make('div', { className: 'sec' });
    Object.keys(weightChanges).forEach((k) => {
      const parts = k.split('|');
      const c = weightChanges[k];
      const choice = weightData.choices.filter((x) => x.adjust === c.adjust)[0];
      // 第八十三輪批次 JC 組：寫人名同崗位名，唔寫 PersonID／PostID
      list.appendChild(make('div', {
        text: weightPersonPostLabel(parts[0], parts[1]) + '　→ ' + (choice ? choice.label : c.adjust)
          + (c.reason ? '（' + c.reason + '）' : ''),
        className: 'vio-row'
      }));
    });

    // 第七十七輪批次 EA 組：儲存之前先講明範圍（Ivan：提醒使用者是只限這一季，還是之後的季度也用）
    const label = weightQuarterLabel();
    const scopeLine = weightApplyFuture
      ? '這 ' + summary.total + ' 項偏好由 ' + label + ' 開始，之後每一季都會用，直到你再改。'
      : '這 ' + summary.total + ' 項偏好只用於 ' + label + '。之後的季度不受影響。';
    openConfirm({
      title: '確定要儲存嗎',
      bodyNodes: [
        make('div', { className: 'warnbox' }, [make('div', { text: scopeLine, className: 'warn-head' })]),
        list,
        para(weightApplyFuture
          ? '之前「只限某一季」或者長期的設定會由 ' + label + ' 起停止生效；紀錄會保留，不會刪除。'
          : '選「一般（預設）」也會記一項「這一季照一般排」，用來蓋過長期的偏好；紀錄會保留，不會刪除。', 'muted')
      ],
      confirmLabel: '確定儲存',
      cancelLabel: '返回',
      onConfirm: () => {
        runAction('儲存中', async () => {
          const changes = Object.keys(weightChanges).map((k) => {
            const parts = k.split('|');
            return {
              personId: parts[0], postId: parts[1],
              adjust: weightChanges[k].adjust,
              // 解除唔需要新原因（原本嗰行嘅原因照樣留喺表上）
              reason: weightChanges[k].reason || '解除偏好'
            };
          });
          const res = await callServerMutating('apiSavePersonPostWeightBatch', changes,
            { quarterId: currentQuarterId, applyToFuture: weightApplyFuture === true });
          if (!res.ok) { showErrorModal('排表偏好', new Error(res.message || '儲存失敗')); return; }
          setStatus('已儲存 ' + res.added + ' 項、解除 ' + res.released + ' 項（' + (res.scopeText || '') + '）。');
          weightData = await callServer('apiGetPersonPostWeightMatrix', currentQuarterId);
          weightChanges = {};
          // 第八十二輪批次 ID 組（Ivan：不用這個功能）：第七十五輪 CI 組「要不要重新生成」嗰一問拿走
          //（重新生成會蓋過人手改動）——只出完成訊息，指去〔請系統幫我調整〕。
          showWeightsSavedNotice(res);
        });
      }
    });
  }

  /**
   * 第八十二輪批次 ID 組：儲存排表偏好之後嘅完成訊息（唔再問要唔要重新生成）。
   * @param {{added: number, released: number, scopeText: string}} res `apiSavePersonPostWeightBatch` 嘅結果
   */
  function showWeightsSavedNotice(res) {
    openModal('排表偏好已儲存', [
      make('div', {
        text: '已儲存排表偏好' + (res.scopeText ? '（' + res.scopeText + '）' : '') + '。'
          + '要用新偏好調整現有的職事表，按第 2 步〔請系統幫我調整〕；還未生成的話，生成時會自動用。',
        className: 'ok-line'
      }),
      para('新增 ' + res.added + ' 項、解除 ' + res.released + ' 項。', 'muted')
    ], [button('知道了', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 畫面五：身分（堂委／執事）（規格 4.3，第二十七輪批次階段 C）
   * ============================================================
   *
   * ⚠️ 呢個畫面平時幾乎唔會用。真正會用到嘅時刻只有一個：**換屆**。
   * 所以整個畫面嘅重心係嗰粒「換屆」掣，唔係逐行編輯。
   */

  let rolesData = null;

  function openRoles(keyword) {
    runAction('讀取身分名單', async () => {
      rolesData = await callServer('apiListRoles', keyword || '');
      renderRoles(keyword || '');
    });
  }

  function renderRoles(keyword) {
    const nodes = [];

    if (!rolesData.sheetExists) {
      nodes.push(make('div', { className: 'vio vio-hard' }, [
        make('div', {
          text: '身分名單（Roles）這張工作表還沒有建立，所以現在沒有任何人有身分。',
          className: 'vio-head'
        }),
        make('div', {
          text: '請先用試算表選單「維護 ▸ 補建身分名單工作表」。'
            + '在建立之前，「報告限堂委」「當值堂委限堂委或執事」這兩條規則不會生效。',
          className: 'vio-row'
        })
      ]));
    }

    // 規格 4.3：呢段字逐字照抄，唔可以改寫成「摘要版」。
    // 換屆做錯嘅後果係**追溯**性嘅——舊季度嘅職事表會突然變成違規，
    // 而嗰啲季度早就寄咗信、印咗 PDF。所以要把「點解」寫足。
    nodes.push(make('div', { className: 'warnbox' }, [
      make('div', { text: '換屆時不要刪除舊的行。', className: 'warn-head' }),
      make('div', {
        text: '按「換屆」，輸入卸任日期，系統會把所有現任的行填上「生效至」＝卸任日期，'
          + '然後你再逐個加入新一屆。',
        className: 'lines'
      }),
      make('div', {
        text: '這樣做的原因：舊季度的職事表不會因為今日換屆而被追溯判成違規。',
        className: 'lines'
      })
    ]));

    nodes.push(row([
      button('換屆', () => openTermChange(), 'danger'),
      button('＋ 新增一行', () => openRoleEditor(), '')
    ], 'row-right'));

    nodes.push(peopleSearchBox(keyword, (k) => openRoles(k)));
    nodes.push(make('div', {
      text: '目前在任共 ' + rolesData.currentCount + ' 項身分（判斷基準日：' + rolesData.today + '）。',
      className: 'muted'
    }));

    if (rolesData.people.length === 0) {
      nodes.push(make('div', {
        text: keyword ? '沒有符合搜尋的人。' : '名單上還沒有任何身分紀錄。',
        className: 'muted'
      }));
    }
    // 按人分組——一個人可以同時是堂委又是執事，或者卸任後再連任。
    rolesData.people.forEach((p) => nodes.push(rolePersonRow(p)));

    nodes.push(make('div', { id: 'roleOverview', className: 'sec' }));

    openModal('身分（堂委／執事）', nodes, [
      button('檢查名單', () => loadRoleOverview(), 'secondary'),
      button('關閉', () => closeModalAndRefresh(), '')
    ]);
  }

  /** 一個人一行，下面列出佢全部身分行。同「不能服侍的日期」一樣嘅精簡清單風格。 */
  function rolePersonRow(p) {
    const box = make('div', { className: 'prop' });
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: p.nameTC }),
      make('span', { text: p.personId, className: 'idtag' })
    ]));

    p.rows.forEach((r) => {
      const line = make('div', { className: 'prop-opts' + (r.current ? '' : ' is-off') });
      const head = make('div', {});
      head.appendChild(make('span', { text: r.roleLabel }));
      if (r.unknownRoleCode) {
        // 認唔出嘅身分代號**一定要標出嚟**：打錯字嘅話，
        // 嗰條規則會靜靜失效，而畫面上睇落完全正常。
        head.appendChild(make('span', {
          text: '這個身分代號系統不認得，等於沒有身分', className: 'tag tag-bad'
        }));
      }
      head.appendChild(make('span', {
        text: '　' + (r.effectiveFrom || '（一直以來）') + ' 至 '
          + (r.effectiveTo || '現在'),
        className: 'muted'
      }));
      head.appendChild(make('span', {
        text: r.current ? '在任' : '已卸任／未生效', className: 'tag'
      }));
      if (!r.active) head.appendChild(make('span', { text: '已停用', className: 'tag' }));
      line.appendChild(head);
      // ⚠️ 顯示用 `notesDisplay`（備註同個名一樣就唔顯示——見
      // `displayableNote_()`），「修改」欄位用返 `notes` 原值。
      // 兩個混咗嘅話，幹事一撳「儲存」就會把試算表嗰個備註抹咗。
      if (r.notesDisplay) {
        line.appendChild(make('div', { text: '備註：' + r.notesDisplay, className: 'muted' }));
      }

      const slot = make('div', {});
      line.appendChild(slot);
      line.appendChild(row([button('修改', () => {
        if (slot.firstChild) { clear(slot); return; }   // 再撳一次收埋
        slot.appendChild(roleEditorFields(p, r));
      }, 'link')], 'row-right'));
      box.appendChild(line);
    });

    return box;
  }

  /** 撳「修改」之後先展開嘅欄位。 */
  function roleEditorFields(person, existing) {
    const e = existing || {};
    const box = make('div', { className: 'prop-opts' });

    const roleSel = document.createElement('select');
    rolesData.roleChoices.forEach((c) => {
      const o = document.createElement('option');
      o.value = c.roleCode;
      // ⚠️ 畫面永遠顯示中文，`value` 先係英文碼。幹事唔應該見到英文代號。
      o.textContent = c.label;
      if (e.roleCode === c.roleCode) o.selected = true;
      roleSel.appendChild(o);
    });

    const fromInput = dateInput(e.effectiveFrom || '');
    const toInput = dateInput(e.effectiveTo || '');
    const notesInput = textField(e.notes, '備註（可留空）');

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = e.active !== false;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', { text: '啟用（取消勾選＝這一行不算數；不會刪除）' }));

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '身分' }), roleSel,
      make('span', { text: '生效日' }), fromInput,
      make('span', { text: '生效至' }), toInput
    ]));
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '備註' }), notesInput
    ]));
    box.appendChild(activeLabel);
    box.appendChild(make('div', {
      text: '「生效日」留空＝一直以來都是。「生效至」留空＝仍然在任。'
        + '卸任時填「生效至」，不要刪除整行。',
      className: 'muted'
    }));

    box.appendChild(row([button('儲存這一行', () => {
      const payload = {
        roleAssignmentId: e.roleAssignmentId,
        personId: person.personId,
        roleCode: roleSel.value,
        effectiveFrom: fromInput.value.trim(),
        effectiveTo: toInput.value.trim(),
        notes: notesInput.value.trim(),
        active: activeCb.checked
      };
      const label = roleSel.options[roleSel.selectedIndex].textContent;
      const warn = [];
      if (!e.effectiveTo && payload.effectiveTo) {
        warn.push('填了「生效至」＝ ' + payload.effectiveTo
          + '，代表他在那一日之後不再是' + label + '。那一日之前的職事表不受影響。');
      }
      if (e.active !== false && !activeCb.checked) {
        warn.push('取消「啟用」＝這一行完全不算數（連過去也不算）。'
          + '如果只是卸任，應該填「生效至」而不是取消啟用。');
      }
      openConfirm({
        title: '確定要儲存嗎',
        bodyNodes: [para('會改動 1 行：' + person.nameTC + '　' + label + '。')]
          .concat(warn.map((w) => make('div', { text: w, className: 'vio vio-warn' }))),
        confirmLabel: '確定儲存',
        onConfirm: () => runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveRole', payload);
          if (!res.ok) { showErrorModal('身分', new Error(res.message)); return; }
          setStatus('已儲存。');
          openRoles('');
        })
      });
    }, '')], 'row-right'));

    return box;
  }

  /** 新增一行（要先揀人）。 */
  function openRoleEditor() {
    const personSel = document.createElement('select');
    rolesData.allPeople.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.personId;
      o.textContent = p.nameTC;
      personSel.appendChild(o);
    });

    const roleSel = document.createElement('select');
    rolesData.roleChoices.forEach((c) => {
      const o = document.createElement('option');
      o.value = c.roleCode;
      o.textContent = c.label;
      roleSel.appendChild(o);
    });

    const fromInput = dateInput('');
    const toInput = dateInput('');
    const notesInput = textField('', '備註（可留空）');

    openModal('新增一行身分', [
      make('div', { className: 'prop-head' }, [
        make('span', { text: '誰' }), personSel,
        make('span', { text: '身分' }), roleSel
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '生效日' }), fromInput,
        make('span', { text: '生效至' }), toInput,
        make('span', { text: '備註' }), notesInput
      ]),
      para('新一屆通常只需要填「生效日」（就職日），「生效至」留空。', 'muted'),
      para('日期請用 2026-11-08 這種寫法（年-月-日）。', 'muted')
    ], [
      button('加入', () => {
        const name = personSel.options[personSel.selectedIndex].textContent;
        const label = roleSel.options[roleSel.selectedIndex].textContent;
        openConfirm({
          title: '確定要加入嗎',
          bodyNodes: [
            para('會加入 1 行：' + name + '　' + label + '。'),
            para('生效日：' + (fromInput.value.trim() || '（留空＝一直以來都是）')
              + '　生效至：' + (toInput.value.trim() || '（留空＝仍然在任）'))
          ],
          confirmLabel: '確定加入',
          onConfirm: () => runAction('加入中', async () => {
            const res = await callServerMutating('apiAddRole', {
              personId: personSel.value,
              roleCode: roleSel.value,
              effectiveFrom: fromInput.value.trim(),
              effectiveTo: toInput.value.trim(),
              notes: notesInput.value.trim()
            });
            if (!res.ok) { showErrorModal('身分', new Error(res.message)); return; }
            setStatus('已加入 ' + res.nameTC + '　' + res.roleLabel + '。');
            openRoles('');
          })
        });
      }, ''),
      button('取消', () => renderRoles(''), 'secondary')
    ]);
  }

  /* ── 換屆（批次動作）───────────────────────────────────── */

  function openTermChange() {
    const dateIn = dateInput('');
    openModal('換屆', [
      make('div', { className: 'warnbox' }, [
        make('div', { text: '換屆時不要刪除舊的行。', className: 'warn-head' }),
        make('div', {
          text: '按「換屆」，輸入卸任日期，系統會把所有現任的行填上「生效至」＝卸任日期，'
            + '然後你再逐個加入新一屆。',
          className: 'lines'
        }),
        make('div', {
          text: '這樣做的原因：舊季度的職事表不會因為今日換屆而被追溯判成違規。',
          className: 'lines'
        })
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '卸任日期' }), dateIn
      ]),
      para('下一步會列出全部會被填上「生效至」的行，讓你逐個看過再決定。', 'muted')
    ], [
      button('看看會改哪幾行', () => runAction('計算中', async () => {
        const plan = await callServer('apiRolesTermChangePlan', dateIn.value.trim());
        renderTermChangePlan(plan);
      }), ''),
      button('取消', () => renderRoles(''), 'secondary')
    ]);
  }

  function renderTermChangePlan(plan) {
    if (!plan.ok || plan.blocked) {
      showErrorModal('換屆', new Error(plan.message));
      return;
    }
    if (plan.rows.length === 0) {
      openModal('換屆', [
        para('沒有任何現任的身分行需要處理——每一行都已經有「生效至」了。'),
        para('如果這一屆已經換過，直接用「＋ 新增一行」加入新一屆就可以。', 'muted')
      ], [button('知道了', () => renderRoles(''), '')]);
      return;
    }

    // 規格 4.3：**逐行列出全部**，唔可以只講數目。
    // 呢一步係幹事唯一一次可以用人眼確認「係咪真係想改咁多人」嘅關口。
    const list = make('div', { className: 'sec' }, [
      sectionTitle('這 ' + plan.rows.length + ' 行會填上「生效至」＝ ' + plan.endDate)
    ]);
    plan.rows.forEach((r) => {
      list.appendChild(make('div', {
        text: r.nameTC + '　' + r.roleLabel + '　'
          + (r.effectiveFrom ? '由 ' + r.effectiveFrom + ' 起' : '（一直以來）'),
        className: 'vio-row'
      }));
    });

    openConfirm({
      title: '換屆（會改動 ' + plan.rows.length + ' 行）',
      bodyNodes: [
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', {
            text: '・把上面 ' + plan.rows.length + ' 行的「生效至」填成 ' + plan.endDate,
            className: 'vio-row'
          }),
          make('div', { text: '・逐行記入紀錄（誰、甚麼身分、哪一日卸任）', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會刪除任何一行', className: 'vio-row' }),
          make('div', { text: '・不會加入新一屆（那一步要你逐個加）', className: 'vio-row' }),
          make('div', { text: '・不會改動任何已經生成的職事表', className: 'vio-row' })
        ]),
        para('那一日之前的職事表完全不受影響——這正是不刪行的原因。')
      ],
      requireTyping: true,
      typingHint: '這個動作會一次改動 ' + plan.rows.length + ' 行。確定的話，'
        + '請在下面輸入「' + CONFIRM_PHRASE + '」兩個字：',
      confirmLabel: '確定換屆',
      danger: true,
      onConfirm: (typed) => runAction('換屆中', async () => {
        const res = await callServerMutating('apiRolesTermChangeExecute', plan.endDate, typed);
        if (!res.ok) { showErrorModal('換屆', new Error(res.message)); return; }
        const nodes = [
          make('div', {
            text: '已把 ' + res.written + ' 行的「生效至」填成 ' + res.endDate + '。',
            className: 'ok-line'
          })
        ];
        // 搵唔返嗰啲一定要報出嚟——靜靜略過就係「做咗一半但報告話全部成功」。
        if (res.failed.length > 0) {
          nodes.push(make('div', { className: 'warnbox' }, [
            make('div', {
              text: '有 ' + res.failed.length + ' 行找不到，沒有改到：',
              className: 'warn-head'
            }),
            make('div', { text: res.failed.join('、'), className: 'lines' }),
            make('div', {
              text: '可能是剛才有人在試算表改動過。請重新整理再看一次。',
              className: 'lines'
            })
          ]));
        }
        nodes.push(para('下一步：用「＋ 新增一行」逐個加入新一屆。'));
        openModal('換屆完成', nodes, [button('完成', () => openRoles(''), '')]);
      })
    });
  }

  /* ── 唯讀提示：身分總覽 ─────────────────────────────────── */

  function loadRoleOverview() {
    runAction('檢查名單', async () => {
      const res = await callServer('apiRoleOverview');
      const node = el('roleOverview');
      if (!node) return;
      clear(node);
      if (!res.ok) {
        node.appendChild(make('div', { text: res.message, className: 'err-text' }));
        return;
      }
      node.appendChild(sectionTitle('名單檢查（唯讀）'));
      res.rows.forEach((r) => {
        node.appendChild(make('div', {
          text: r.section + '　' + r.item + '　' + r.value
            + (r.note ? '　（' + r.note + '）' : ''),
          className: 'vio-row'
        }));
      });
    });
  }


  /* ============================================================
   * 畫面六：暫時不做某崗位（規格 4.5，第二十七輪批次階段 D）
   * ============================================================ */

  let exclusionData = null;

  function openExclusions(keyword) {
    runAction('讀取個人崗位限制', async () => {
      exclusionData = await callServer('apiListExclusions', keyword || '');
      renderExclusions(keyword || '');
    });
  }

  function renderExclusions(keyword) {
    const nodes = [];

    if (!exclusionData.sheetExists) {
      nodes.push(make('div', { className: 'vio vio-hard' }, [
        make('div', {
          text: '個人崗位排除（PersonPostExclusions）這張工作表還沒有建立。',
          className: 'vio-head'
        }),
        make('div', {
          text: '請先用試算表選單「維護 ▸ 補建身分名單工作表」（它會一併建立這一張）。',
          className: 'vio-row'
        })
      ]));
    }

    // 規格 4.5：呢兩句一定要有，而且要逐字照抄。
    //
    // 混淆呢兩件事嘅後果：幹事想「呢半年唔好排佢做主席」，
    // 就會去取消佢主席嘅資格——而嗰個係「以後永遠唔會排佢」，
    // 而且日後想恢復嗰陣，「佢做過幾多次」呢個歷史已經斷咗。
    nodes.push(make('div', { className: 'warnbox' }, [
      make('div', { text: '崗位資格 = 這個人從來沒做過這個崗位。', className: 'warn-head' }),
      make('div', { text: '暫時不做 = 這個人做得到，但這一段時間不排他。', className: 'warn-head' })
    ]));

    nodes.push(row([
      button('＋ 新增一條', () => openExclusionEditor(null), '')
    ], 'row-right'));
    nodes.push(peopleSearchBox(keyword, (k) => openExclusions(k)));

    if (exclusionData.current.length === 0) {
      nodes.push(make('div', { text: '目前沒有生效中的限制。', className: 'muted' }));
    } else {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('生效中（' + exclusionData.current.length + ' 條）')
      ]);
      exclusionData.current.forEach((r) => box.appendChild(exclusionRow(r, false)));
      nodes.push(box);
    }

    // 已解除嘅摺入一節，**唔刪**——要睇得返「嗰段時間確實生效過」。
    if (exclusionData.lifted.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('已解除（' + exclusionData.lifted.length + ' 條，保留紀錄，不會刪除）')
      ]);
      exclusionData.lifted.forEach((r) => box.appendChild(exclusionRow(r, true)));
      nodes.push(box);
    }

    openModal('暫時不做某崗位', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  function exclusionRow(r, isLifted) {
    const box = make('div', { className: 'prop' + (isLifted ? ' is-off' : '') });
    const head = make('div', { className: 'prop-head' });
    head.appendChild(make('span', { text: r.nameTC }));
    head.appendChild(make('span', { text: '　' + r.postNameTC }));
    if (r.unknownPost) {
      // 崗位表冇呢個代號 ⇒ 呢條限制根本唔會生效，而畫面睇落完全正常。
      head.appendChild(make('span', {
        text: '崗位表沒有這個代號，這一條不會生效', className: 'tag tag-bad'
      }));
    }
    if (!r.active) head.appendChild(make('span', { text: '已停用', className: 'tag' }));
    box.appendChild(head);

    box.appendChild(make('div', {
      text: (r.effectiveFrom || '（即時生效）') + ' 至 '
        + (r.effectiveTo || '仍然生效') + '　原因：' + r.reason,
      className: 'muted'
    }));

    const slot = make('div', {});
    box.appendChild(slot);

    const buttons = [button('修改', () => {
      if (slot.firstChild) { clear(slot); return; }
      slot.appendChild(exclusionEditorFields(r));
    }, 'link')];
    // 已解除嘅唔會再有「解除」掣——按落去只會令人以為要再解除一次。
    if (!isLifted) buttons.unshift(button('解除限制', () => openLiftExclusion(r), ''));
    box.appendChild(row(buttons, 'row-right'));
    return box;
  }

  /** 解除：直接彈日期選擇，預設今日（規格 4.5）。 */
  function openLiftExclusion(r) {
    const dateIn = dateInput(exclusionData.today);
    openModal('解除限制', [
      para('解除的意思是「由這一日起，可以再排他做這個崗位」。'),
      make('div', { className: 'sec' }, [
        make('div', { text: r.nameTC + '　' + r.postNameTC, className: 'vio-row' }),
        make('div', { text: '原因：' + r.reason, className: 'vio-row' }),
        make('div', {
          text: '生效期間：' + (r.effectiveFrom || '（即時生效）') + ' 至 仍然生效',
          className: 'vio-row'
        })
      ]),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '解除日' }), dateIn
      ]),
      // 解除做成「填日期」而唔係「刪行」／「取消啟用」嘅原因，一定要講。
      // 唔講嘅話，下一個人會覺得「刪咗佢乾淨啲」。
      make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統只會填上「解除日」，不會刪除這一行，也不會把它設成停用。',
          className: 'warn-head'
        }),
        make('div', {
          text: '這樣舊季度的職事表仍然看得出「那一段時間確實不應該排他」。'
            + '如果刪除或者停用，舊季度就會變成「當時本來可以排他」，那是錯的。',
          className: 'lines'
        })
      ])
    ], [
      button('確定解除', () => {
        openConfirm({
          title: '確定要解除嗎',
          bodyNodes: [
            para('會改動 1 行：' + r.nameTC + '　' + r.postNameTC + '。'),
            para('「解除日」會填成 ' + (dateIn.value.trim() || '（空白）')
              + '，其餘欄位一格都不會改。')
          ],
          confirmLabel: '確定解除',
          onConfirm: () => runAction('解除中', async () => {
            const res = await callServerMutating('apiLiftExclusion',
              r.exclusionId, dateIn.value.trim());
            if (!res.ok) { showErrorModal('解除限制', new Error(res.message)); return; }
            setStatus('已解除（解除日 ' + res.effectiveTo + '）。');
            openExclusions('');
          })
        });
      }, ''),
      button('取消', () => renderExclusions(''), 'secondary')
    ]);
  }

  /** 撳「修改」之後先展開嘅欄位。 */
  function exclusionEditorFields(r) {
    const box = make('div', { className: 'prop-opts' });

    const postSel = document.createElement('select');
    exclusionData.posts.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.postId;
      o.textContent = p.postNameTC;
      if (r.postId === p.postId) o.selected = true;
      postSel.appendChild(o);
    });

    const reasonInput = textField(r.reason, '原因（必填）');
    const fromInput = dateInput(r.effectiveFrom || '');
    const toInput = dateInput(r.effectiveTo || '');
    const notesInput = textField(r.notes, '備註（可留空）');

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = r.active !== false;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', {
      text: '啟用（取消勾選＝這一行從頭到尾都不算數；只是解除的話請用「解除限制」）'
    }));

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '崗位' }), postSel,
      make('span', { text: '原因' }), reasonInput
    ]));
    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '生效日' }), fromInput,
      make('span', { text: '解除日' }), toInput,
      make('span', { text: '備註' }), notesInput
    ]));
    box.appendChild(activeLabel);

    box.appendChild(row([button('儲存這一條', () => {
      const payload = {
        exclusionId: r.exclusionId,
        personId: r.personId,
        postId: postSel.value,
        reason: reasonInput.value.trim(),
        effectiveFrom: fromInput.value.trim(),
        effectiveTo: toInput.value.trim(),
        notes: notesInput.value.trim(),
        active: activeCb.checked
      };
      const warn = [];
      if (r.active !== false && !activeCb.checked) {
        warn.push('取消「啟用」＝這一行從頭到尾都不算數（連過去的季度也會變成'
          + '「當時本來可以排他」）。如果只是想解除，請用「解除限制」填日期。');
      }
      openConfirm({
        title: '確定要儲存嗎',
        bodyNodes: [para('會改動 1 行：' + r.nameTC + '　'
          + postSel.options[postSel.selectedIndex].textContent + '。')]
          .concat(warn.map((w) => make('div', { text: w, className: 'vio vio-warn' }))),
        confirmLabel: '確定儲存',
        onConfirm: () => runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveExclusion', payload);
          if (!res.ok) { showErrorModal('暫時不做某崗位', new Error(res.message)); return; }
          setStatus('已儲存。');
          openExclusions('');
        })
      });
    }, '')], 'row-right'));

    return box;
  }

      ]),

      ]),

  /* ============================================================
   * 第七十七輪批次 EG 組：進階與診斷 ▸ 出席系統連結（取代「從出席系統補電郵」）
   * ============================================================
   *
   * 方法 A（Ivan 決定）：會眾資料只要出席系統一個來源。電郵按**會眾編號**自動由出席系統讀取
   *（載入幹事介面時、寄信之前）；呢個畫面只負責「邊個仲未連結」：
   *   一、沒有會眾編號的人（附出席系統嘅候選人，**預設不勾**——按姓名配對錯咗會寄錯人）
   *   二、出席系統找不到編號的人　三、重複編號　四、出席系統沒有電郵的人
   * 〔連結勾了的人〕只寫會眾編號（同由編號推出嘅堂會／身分），之後即時更新電郵。名字一律保留職事表寫法。
   */

  let hwcasLinkData = null;
  /** personId → 勾咗嘅會眾編號（一個人只可以揀一個） */
  let hwcasLinkPicked = {};
  let hwcasSyncedOnLoad_ = false;

  /** 舊名（名單檢查「去處理」、進階與診斷嗰行都叫佢）。 */
  function openHwcas() { openHwcasLink(); }

  /**
   * 幹事介面載入時叫一次：由出席系統按會眾編號更新電郵。
   * ⚠️ 唔經 `runAction()`（唔鎖畫面、唔拖慢主畫面）；任何失敗都唔可以令主畫面出事。
   */
  function syncHwcasOnLoad() {
    if (hwcasSyncedOnLoad_) return;
    hwcasSyncedOnLoad_ = true;
    callServerMutating('apiSyncPeopleFromHwcas', { force: true }).then((r) => {
      if (!r || r.skipped === 'locked') return;
      if (r.ok && r.updated > 0) setStatus('電郵已由出席系統更新：' + r.updated + ' 位。');
      else if (r.ok === false && r.notice) setStatus(r.notice, true);
      // 狀態卡要顯示「已更新（時間）」／「讀不到…」⇒ 重讀一次主畫面
      runAction('重新整理', loadDashboard);
    }).catch(() => { /* 讀唔到出席系統唔可以令主畫面出事 */ });
  }

  function openHwcasLink() {
    runAction('讀取出席系統連結', async () => {
      hwcasLinkData = await callServer('apiHwcasLinkPreview');
      hwcasLinkPicked = {};
      renderHwcasLink();
    });
  }

  function hwcasCandidateText(c) {
    return c.hwcasName + '　編號 ' + c.memberNo
      + '　' + (c.hasEmail ? c.emailMasked : '（出席系統沒有電郵）')
      + (c.lastAttendance ? '　最後出席 ' + c.lastAttendance : '')
      + (c.matchType === 'ALIAS' ? '　（靠別名對上）' : '')
      + (c.usedBy ? '　⚠ 這個編號已經是名單上「' + c.usedBy + '」的' : '');
  }

  function renderHwcasLink() {
    const d = hwcasLinkData;
    if (!d || !d.ok) {
      openModal('出席系統連結', [
        make('div', { className: 'warnbox' }, [make('div', { text: (d && d.message) || '讀不到出席系統。', className: 'warn-head' })]),
        d && d.notConfigured ? para('設定好之後回來重新整理這一頁。', 'muted') : null
      ], [button('知道了', () => closeModal(), '')]);
      return;
    }
    const nodes = [
      para('人員和電郵由出席系統按會眾編號讀取。名字一律保留職事表的寫法，不會改成出席系統的寫法。'),
      d.sync && d.sync.line ? make('div', { text: d.sync.line, className: d.sync.errorText ? 'vio-row' : 'muted' }) : null
    ];

    // ── 一、沒有會眾編號的人 ──────────────────────────────────
    const sec1 = make('div', { className: 'sec' }, [sectionTitle('一、沒有會眾編號的人（' + d.unlinked.length + ' 位）')]);
    if (d.unlinked.length === 0) {
      sec1.appendChild(make('div', { text: '名單上每一位都已經連結出席系統。', className: 'ok-line' }));
    } else {
      sec1.appendChild(make('div', {
        text: '下面是出席系統裏同名（或靠別名配對）的人。出席系統是靠姓名配對的，配錯了就會寄錯人——'
          + '所以預設全部不勾，請逐個看過才勾。', className: 'muted'
      }));
    }
    d.unlinked.forEach((p) => {
      const box = make('div', { className: 'prop' });
      box.appendChild(make('div', { text: p.nameTC + (p.active ? '' : '（已停用）'), className: 'prop-head' }));
      if (p.candidates.length === 0) {
        box.appendChild(make('div', { text: '出席系統找不到同名的人。要用〔加入名單〕在出席系統搜尋，或者請辦公室先在出席系統加入他。', className: 'muted' }));
      }
      p.candidates.forEach((c) => {
        const line = make('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = hwcasLinkPicked[p.personId] === c.memberNo;   // ⚠️ 預設不勾
        cb.disabled = !!c.usedBy;
        cb.addEventListener('change', () => {
          if (cb.checked) hwcasLinkPicked[p.personId] = c.memberNo; else delete hwcasLinkPicked[p.personId];
          renderHwcasLink();
        });
        line.appendChild(cb);
        line.appendChild(make('span', { text: hwcasCandidateText(c) }));
        box.appendChild(line);
      });
      sec1.appendChild(box);
    });
    nodes.push(sec1);

    // ── 二、出席系統找不到編號的人 ────────────────────────────
    const sec2 = make('div', { className: 'sec' }, [sectionTitle('二、出席系統找不到編號的人（' + d.notFound.length + ' 位）')]);
    if (d.notFound.length === 0) sec2.appendChild(make('div', { text: '沒有。', className: 'muted' }));
    d.notFound.forEach((p) => sec2.appendChild(make('div', { text: p.nameTC + '　編號 ' + p.memberNo + '　——電郵照用上次的，不會改', className: 'vio-row' })));
    nodes.push(sec2);

    // ── 三、重複編號 ──────────────────────────────────────────
    const sec3 = make('div', { className: 'sec' }, [sectionTitle('三、重複編號（' + d.duplicates.length + ' 個）')]);
    if (d.duplicates.length === 0) sec3.appendChild(make('div', { text: '沒有。', className: 'muted' }));
    d.duplicates.forEach((x) => sec3.appendChild(make('div', {
      text: '編號 ' + x.memberNo + '：' + x.people.map((p) => p.nameTC).join('、') + '　——系統分不出是哪一位，兩位的電郵都不會改；請在試算表 NameMapping 改正', className: 'vio-row'
    })));
    nodes.push(sec3);

    // ── 四、出席系統沒有電郵的人 ──────────────────────────────
    const sec4 = make('div', { className: 'sec' }, [sectionTitle('四、出席系統沒有電郵的人（' + d.noEmailInHwcas.length + ' 位）')]);
    if (d.noEmailInHwcas.length === 0) sec4.appendChild(make('div', { text: '沒有。', className: 'muted' }));
    d.noEmailInHwcas.forEach((p) => sec4.appendChild(make('div', { text: p.nameTC + '　編號 ' + p.memberNo + '　——請辦公室在出席系統補上電郵，這裏不用改', className: 'vio-row' })));
    nodes.push(sec4);

    const pickedCount = Object.keys(hwcasLinkPicked).length;
    nodes.push(make('div', { text: pickedCount === 0 ? '未勾任何一位。' : '勾了 ' + pickedCount + ' 位。', className: pickedCount === 0 ? 'muted' : 'ok-line strong' }));

    const linkBtn = button('連結勾了的人', () => confirmHwcasLink(), '');
    linkBtn.disabled = pickedCount === 0;
    openModal('出席系統連結', nodes, [linkBtn, button('關閉', () => closeModal(), 'secondary')]);
  }

  function confirmHwcasLink() {
    const links = Object.keys(hwcasLinkPicked).map((pid) => ({ personId: pid, memberNo: hwcasLinkPicked[pid] }));
    if (links.length === 0) { setStatus('未勾任何一位。', true); return; }
    const byId = {};
    (hwcasLinkData.unlinked || []).forEach((p) => { byId[p.personId] = p; });
    const list = make('div', { className: 'sec' });
    links.forEach((l) => {
      const p = byId[l.personId] || { nameTC: l.personId, candidates: [] };
      const c = p.candidates.filter((x) => x.memberNo === l.memberNo)[0];
      list.appendChild(make('div', { text: p.nameTC + '　→　' + (c ? hwcasCandidateText(c) : '編號 ' + l.memberNo), className: 'vio-row' }));
    });
    openConfirm({
      title: '確定要連結嗎',
      bodyNodes: [
        para('會連結 ' + links.length + ' 位。'),
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', { text: '・只寫入會眾編號（和由編號推出的堂會／身分）', className: 'vio-row' }),
          make('div', { text: '・之後即時按編號由出席系統更新電郵', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會改名字（保留職事表的寫法）', className: 'vio-row' }),
          make('div', { text: '・不會改動出席系統（那邊一律唯讀）', className: 'vio-row' }),
          make('div', { text: '・不會寄出任何電郵', className: 'vio-row' })
        ])
      ],
      confirmLabel: '確定連結',
      onConfirm: () => runAction('連結中', async () => {
        const res = await callServerMutating('apiHwcasLinkSelected', links);
        if (!res.ok) { showErrorModal('出席系統連結', new Error(res.message)); return; }
        const nodes = [make('div', { text: '已連結 ' + res.linked.length + ' 位。', className: 'ok-line' })];
        if (res.sync) {
          nodes.push(make('div', {
            text: res.sync.ok ? ('電郵已由出席系統更新：' + res.sync.updated + ' 位。') : (res.sync.notice || '讀不到出席系統。'),
            className: res.sync.ok ? 'ok-line' : 'vio-row'
          }));
        }
        if (res.skipped.length > 0) {
          const box = make('div', { className: 'warnbox' }, [make('div', { text: '有 ' + res.skipped.length + ' 位沒有連結：', className: 'warn-head' })]);
          res.skipped.forEach((x) => box.appendChild(make('div', { text: (x.nameTC || x.personId) + '：' + x.reason, className: 'lines' })));
          nodes.push(box);
        }
        openModal('連結完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }

  /* ============================================================
   * 區三共用小元件
   * ============================================================ */

  /** 搜尋格（中文名／英文名／PersonID）。 */
  function peopleSearchBox(keyword, onSearch) {
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.value = keyword || '';
    input.placeholder = '搜尋姓名或編號';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') onSearch(input.value.trim());
    });
    return make('div', { className: 'prop-head' }, [
      make('span', { text: '搜尋' }), input,
      button('搜尋', () => onSearch(input.value.trim()), 'secondary'),
      button('全部', () => onSearch(''), 'link')
    ]);
  }

  function textField(value, placeholder) {
    const input = document.createElement('input');
    input.type = 'text';
    // 姓名／電郵格一律關掉瀏覽器自動填充——唔關嘅話 Chrome 會彈出
    // 使用者自己嘅通訊錄，幹事會以為係系統建議（見階段 B2）。
    input.autocomplete = 'off';
    input.name = 'hwc-roster-field';
    input.value = value || '';
    input.placeholder = placeholder || '';
    return input;
  }

  function dateInput(value) {
    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.className = 'inp-date';
    input.value = value || '';
    input.placeholder = 'yyyy-MM-dd';
    return input;
  }
</script>
