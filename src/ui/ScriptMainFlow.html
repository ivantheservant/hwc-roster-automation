<script>
  /* ============================================================
   * 第三十九輪批次 A／C／D 組：**幹事主流程六步**
   * ============================================================
   *
   * 幹事的真實工作流程就是這六件事，順序固定：
   *
   *   1. 生成下一季職事表
   *   2. 查看／修改職事表
   *   3. 改動時的名單協助
   *   4. 維護各崗位的事奉人員名單
   *   5. 寄出
   *   6. 沒有電郵的人要印紙本
   *
   * 放在畫面最頂，字大、間距闊、一眼看得晒。每一步一粒主掣，
   * **不用細字解釋**——他不會讀。
   *
   * ⚠️ 這一段**沒有另起爐灶**。每一粒掣落到最後都是叫原本那幾條
   * 已經在真實環境跑過的路（`openGenerateDraft()`／`openSaveAndConfirm()`／
   * `openReview()`／`openOfficial()`／`openResend()`）。
   * 改的是「幹事看到什麼、要不要自己判斷」，不是寄信同建立版本那部機器。
   *
   * ⚠️ 載入次序：這個檔案要排在 `ScriptZone1` **之後**——
   * 它會叫 `openGenerateDraft()` 那幾個函式（在 ScriptZone1 定義）。
   */

  /** 最近一次 `apiGetMainFlowState` 的結果。跟 dashboard 一樣，過期就重讀。 */
  let mainFlowState_ = null;
  let mainFlowStaleQuarter_ = null;

  /**
   * 主流程要的額外資料。**每次換季度或者做完動作都會重讀**——
   * 快取一個舊季度的數字，就是「畫面看起來完全正常但講緊另一季」那一類 bug。
   */
  async function getMainFlowState() {
    if (!mainFlowState_ || mainFlowStaleQuarter_ !== currentQuarterId) {
      mainFlowState_ = await callServer('apiGetMainFlowState', currentQuarterId);
      mainFlowStaleQuarter_ = currentQuarterId;
    }
    return mainFlowState_;
  }

  /** 換季度／做完寫入動作之後叫。 */
  function resetMainFlowState() {
    mainFlowState_ = null;
    mainFlowStaleQuarter_ = null;
  }

  /**
   * 砌一步。
   * @param {Object} o {num, title, note, why, acts:[Node]}
   * @returns {Node}
   */
  function stepCard(o) {
    const body = make('div', { className: 'step-body' }, [
      make('div', { text: o.title, className: 'step-title' })
    ]);
    if (o.note) body.appendChild(make('div', { text: o.note, className: 'step-note' }));
    // 第八十二輪批次 IH 組：`whyAlways` ⇒ 冇原因都留一個（隱藏）位，之後輕量更新嗰陣先有地方寫
    if (o.why || o.whyAlways) {
      const why = make('div', { text: o.why || '', className: 'step-why' });
      why.hidden = !o.why;
      body.appendChild(why);
    }
    if (o.acts && o.acts.length > 0) {
      body.appendChild(make('div', { className: 'step-acts' }, o.acts));
    }
    if (o.extra) body.appendChild(o.extra);
    return make('div', { className: 'step' }, [
      make('div', { text: String(o.num), className: 'step-num' }),
      body
    ]);
  }

  /**
   * 第八十二輪批次 II 組（Ivan 決定）：幹事介面唔再有「重新生成初稿」——指去〔整季清走重來〕或者〔用這一版作起點〕。
   * 後端訊息同一句：`REDO_QUARTER_HINT_TEXT`（Constants.gs）。
   */
  const REDO_QUARTER_HINT = '要整季重來，用下面「常用設定 ▸ 整季重設」之後再生成；'
    + '要回到之前的內容，用第 2 步版本下拉〔用這一版作起點〕。';

  /** 第八十二輪批次 IG 組：〔變動的人〕灰色時嘅原因（後端 `RESEND_NEEDS_OFFICIAL_TEXT` 同一句）。 */
  const RESEND_NEEDS_OFFICIAL_HINT = '要先用〔給所有人〕正式發出一次';

  /** 主流程用的大掣。 */
  /**
   * 主流程一粒掣。
   *
   * ⚠️ 第四十三輪批次 E2：**一粒撳唔到而又冇解釋嘅掣，唔准存在。**
   *
   * Ivan 現場：「click 寄給堂委審閱，不能 click。」——一粒灰掣，
   * 冇任何字講點解。佢企咗喺度，唔知係系統壞咗、定係佢做漏咗嘢。
   *
   * 所以 `disabled` 一定要連埋 `title`。冇傳 `title` 就喺度砌一句
   * 保底嘅——一句「唔知點解」都好過完全冇字，起碼佢知道要去問。
   */
  function stepButton(label, onClick, opts) {
    opts = opts || {};
    const b = button(label, onClick, 'step-btn ' + (opts.className || ''));
    if (opts.disabled) b.disabled = true;
    if (opts.title) {
      b.title = opts.title;
    } else if (opts.disabled) {
      b.title = '這個按鈕現在不能按，而系統說不出原因——這是一個程式問題，'
        + '請把這一句連同你剛才做過的事告訴開發者。';
    }
    // 第八十七輪批次 NB 組：只可查看 ⇒ 原因一律寫「你只有查看權限」（上面的 opts 不可以把它改回可按）
    if (b.viewOnlyBlocked_) markViewOnlyBlocked_(b);
    return b;
  }

  /* ============================================================
   * 主畫面
   * ============================================================ */

  async function renderMainFlow(d) {
    const root = clear(el('mainFlowBody'));
    const flow = await getMainFlowState();

    // ⚠️ 第四十一輪批次 A 組：由六步變**五步**。
    // 原本嘅第 3 步（加名單選單）已經全自動，唔再出現喺主流程。
    //
    // ⚠️ 編號一定要重新排好。跳號（第 2 步、第 4 步、第 5 步）
    // 對幹事嚟講就係「我係咪漏咗一步」——一條直線唔可以有窿。
    const steps = [
      renderStep1(d, flow),
      renderStep2(d, flow),
      renderStepSend(d),
      renderStepPaper(d, flow)
    ];
    steps.forEach((node) => root.appendChild(node));

    // ⚠️ 第四十二輪批次 E 組：頁頂嗰個「幾多步」**由實際步數算出嚟**。
    //
    // 第四十一輪由六步減成五步，而 `Index.html` 嗰句仍然寫住「六步」，
    // 足足一輪冇人發現。一個同畫面唔符嘅數字，幹事會以為自己漏咗一步，
    // 然後去搵一個唔存在嘅第六步。
    //
    // 寫死一個數字 ＝ 又一個「兩個真相來源」。呢度改成只有一個。
    const sub = el('flowHeadSub');
    if (sub) sub.textContent = '由上而下做，' + cnNumber(steps.length) + '步';
  }

  /** 一位數嘅中文數字。超出範圍就照回阿拉伯數字——**唔可以回空白**。 */
  function cnNumber(n) {
    const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    return (n >= 0 && n <= 10) ? digits[n] : String(n);
  }

  /* ── 第 1 步：生成下一季職事表 ─────────────────────────────── */

  /**
   * ⚠️ 第六十五輪批次 AB 組第 3 點：「現時有 N 個版本」用**儲存後已刷新嘅 dashboard**。
   *
   * 現場：儲存成第 2、3 版之後，第 1 步仍然寫「現時有 2 個版本」，要撳「重新整理」先變。
   * 成因：版本數嚟自 `apiGetMainFlowState()`（`mainFlowState_` 快取），而寫入動作
   * 之後只有 dashboard 會重讀。目標季度就係而家睇緊嗰季時，用 dashboard 嘅最新版本號。
   * @param {Object} target `flow.generateTarget`
   * @param {Object} d dashboard
   * @returns {Object} 一份新物件（唔改快取）
   */
  function withFreshVersionCount(target, d) {
    const t = Object.assign({}, target || {});
    if (t.quarterId && t.quarterId === currentQuarterId && d && d.latestVersion
        && !isNaN(Number(d.latestVersion.versionNo))) {
      t.versionCount = Number(d.latestVersion.versionNo) + 1;
    }
    return t;
  }

  function renderStep1(d, flow) {
    const t = withFreshVersionCount(flow && flow.generateTarget, d);
    const acts = [];

    if (!t.found) {
      return stepCard({
        num: 1, title: '生成下一季職事表',
        why: t.reason || '找不到任何季度。去下面「進階與診斷 ▸ 建立未來季度」建立。'
      });
    }

    // ⚠️ 掣上面直接寫是哪一季——**不要他自己去揀**。
    const label = '生成' + t.label + '職事表';
    if (t.alreadyGenerated) {
      acts.push(stepButton(label, () => {}, {
        disabled: true,
        title: t.allGenerated
          ? '所有已建立的季度都生成過了。未來幾個月開始的季度系統會自動建立；'
            + '要手動再做一次，請去「進階與診斷 ▸ 建立未來季度」。'
          // 第八十二輪批次 II 組：唔再叫人「重新生成初稿」
          : '這一季已經生成過了。' + REDO_QUARTER_HINT
      }));
    } else {
      acts.push(stepButton(label, () => openGenerateForTarget(t)));
    }

    const card = stepCard({
      num: 1,
      title: '生成下一季職事表',
      note: t.alreadyGenerated
        // ⚠️ 第四十二輪批次 C 組：呢種情況粒掣係灰嘅，幹事乜都做唔到。
        // 所以呢一句唯一有用嘅資訊係「下一步去邊」——
        // 唔可以再夾一句「生成日期仲有 9 天」落嚟。
        ? (t.allGenerated
          ? ('所有已建立的季度都生成過了（' + t.label + ' 現時有 '
            + t.versionCount + ' 個版本）。未來幾個月開始的季度系統會自動建立；'
            + '要手動再做一次，請去下面「進階與診斷 ▸ 建立未來季度」。')
          : (t.label + ' 已經生成過了（現時有 ' + t.versionCount
            + ' 個版本）。要生成另一季，先在最上面的季度選單選那一季。' + REDO_QUARTER_HINT))
        // ⚠️ 第四十輪批次 E 組：掣旁邊要寫住生成日期同距離幾多日。
        //
        // 2026-08-21 實測撞到：粒掣寫住「生成 2027 年 1-3 月職事表」，
        // 而嗰一季嘅 GenerateOn 係 2026-11-27——仲有三個幾月。
        // 嗰一季係留嚟真正上線嗰季，今日撳落去會用掉佢。
        //
        // 冇 GenerateOn 就照講「冇填」——**唔可以當成「今日就係」**，
        // 嗰個係一個肯定句，而我哋根本唔知。
        : describeGenerateOn(t),
      why: t.warn ? firstLineOf(t.warnMessage) : '',
      acts: acts,
      extra: renderPermanentLink(flow)
    });
    // 第七十五輪批次 CN 組：第六十七輪 AF 組加喺呢度嘅〔用「匯入」〕掣拿走。
    // Ivan 實測：生成前後撳落去都只係開「檢查匯入表：填了 0 格」，以為係匯入 Excel／PDF。
    // 匯入功能只留喺「進階與診斷 ▸ 匯入人手編好的職事表」。
    return card;
  }

  /**
   * 生成之前問一次：使唔使先改名單？
   *
   * ⚠️ 兩粒掣都要係真出口：〔先去改名單〕直接開嗰張工作表，
   * 唔係叫佢自己去搵。一個叫人「請去某某地方」而唔帶佢去嘅提示，
   * 對一個唔熟電腦嘅人嚟講等於冇提示。
   *
   * @param {Function} onGenerate 揀咗「直接生成」之後行乜
   */
  function askEligibilityFirst(onGenerate) {
    openConfirm({
      title: '生成之前',
      bodyNodes: [
        para('要不要先更改各崗位的事奉人員名單？'),
        para('名單改了，生成出來的安排才會用新名單。'
          + '生成之後才改名單的話，那一版仍然是用舊名單排的。', 'muted')
      ],
      confirmLabel: '直接生成',
      cancelLabel: '先去改名單',
      onCancel: () => { closeModal(); openEligibilitySheet(); },
      onConfirm: () => { closeModal(); onGenerate(); }
    });
  }

  /** 生成日期同距離幾多日，一句人話。 */
  function describeGenerateOn(t) {
    if (!t.generateOn) {
      return '這一季的 Quarters 沒有填生成日期（GenerateOn），所以系統說不出還有多久。';
    }
    const d = t.daysUntilGenerateOn;
    if (d === null || d === undefined) {
      return '生成日期：' + t.generateOn + '。';
    }
    // ⚠️ 第四十二輪批次 C 組：順帶講埋而家有幾多個版本。
    // 呢一步係「生成」，而「而家有幾多個版本」就係佢撳落去之前
    // 最需要知嗰件事——0 個代表全新，唔係 0 就代表佢會多開一版。
    const v = '　現時有 ' + (t.versionCount || 0) + ' 個版本。';
    if (d > 0) return '生成日期：' + t.generateOn + '（還有 ' + d + ' 天）。' + v;
    if (d === 0) return '生成日期：' + t.generateOn + '（就是今日）。' + v;
    return '生成日期：' + t.generateOn + '（已經過了 ' + (-d) + ' 天）。' + v;
  }

  /**
   * 三段式訊息的第一段——步卡上面只講一句，詳情留在確認畫面。
   *
   * ⚠️ 第四十二輪批次 E 組：要把「發生了什麼：」呢個**機器標記**剝走。
   *
   * 嗰個標記係後端同前端之間嘅分隔符（見 `buildThreePartMessage_()`），
   * 唔係俾人睇嘅字。第四十一輪已經把彈窗嗰個顯示標籤改成「要留意」，
   * 但步卡呢一句係直接攞原文第一行，所以嗰五個字照樣漏咗出嚟——
   * 而嗰句講嘅係「呢一季仲未到生成日期」，根本冇嘢發生過。
   */
  function firstLineOf(text) {
    return String(text || '').split('\n')[0].replace(/^發生了甚麼：\s*/, '');
  }

  /**
   * 生成一個指定季度。
   *
   * ⚠️ 目標季度如果不是現在看著那一季，**先把上面的季度選單切過去**——
   * 否則生成完之後，畫面其餘部分仍然在講另一季，
   * 而幹事會以為生成失敗了。
   */
  function openGenerateForTarget(t) {
    const go = () => {
      if (t.quarterId !== currentQuarterId) {
        const sel = el('quarter');
        sel.value = t.quarterId;
        currentQuarterId = t.quarterId;
        resetAllZoneLoadState();
        resetMainFlowState();
        runAction('切換到' + t.label, async () => {
          await loadDashboard();
          openGenerateDraft();
        });
        return;
      }
      // ⚠️ 第四十三輪批次 H 組：生成之前先問一次「使唔使先改名單」。
      //
      // Ivan：「名單改咗，生成出嚟嘅安排先會用新名單。」
      // 佢每一季真正嘅第一步就係改名單，而生成係一個**會用掉嗰一季**
      // 嘅動作——問一次嘅成本係一秒，唔問嘅成本係重新生成一次。
      //
      // ⚠️ 第四十四輪批次 F 組：呢一問而家住喺 `openGenerateDraft()`
      // 本身（見 `ScriptZone1.html`）。呢度**唔可以**再包多一次，
      // 否則幹事會連續見到兩個一模一樣嘅彈窗。
      openGenerateDraft();
    };

    // ⚠️ 第四十二輪批次 C 組：真正要上線嗰一季，撳之前要額外講一句。
    // 邊一季係「上線嗰季」由 Config 嘅 `GO_LIVE_QUARTER_ID` 決定，
    // **唔係寫死**——嗰個係教會嘅資料，而且每年都唔同。
    const goLiveNote = t.isGoLiveQuarter
      ? make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這一季是實際要上線的季度。一旦生成就會用掉它——'
            + '如果你只是想試一試，請改用一個測試季度。',
          className: 'lines'
        })
      ])
      : null;

    // 已經開始／已經過去／未到生成日期 ⇒ **准許，但先講清楚**。
    if (t.warn || goLiveNote) {
      openConfirm({
        title: '生成' + t.label + '職事表',
        bodyNodes: (t.warn
          // ⚠️ 第四十二輪批次 E 組：唔可以 `para(rawMessage)`——
          // 噉樣會把「發生了什麼：」呢個機器標記原封不動印上畫面。
          ? threePartNodes(t.warnMessage)
          : [para('現時有 ' + (t.versionCount || 0) + ' 個版本。')]
        ).concat([goLiveNote]).filter(Boolean),
        confirmLabel: '知道了，照樣生成',
        onConfirm: () => { closeModal(); go(); }
      });
      return;
    }
    go();
  }

  /* ── 那條永久連結 ─────────────────────────────────────────── */

  function renderPermanentLink(flow) {
    const p = (flow && flow.permanentLink) || {};
    if (!p.hasLink) {
      if (p.checkFailed) {
        return make('div', { className: 'permalink' }, [
          make('div', { text: '查不到這一季有沒有永久連結。', className: 'permalink-label' }),
          make('div', {
            text: '這不代表沒有連結，只代表系統現在看不到。'
              + '按一次「重新整理」再看，或者去下面「進階與診斷 ▸ 重新發佈公開連結」。',
            className: 'permalink-note'
          })
        ]);
      }
      return make('div', { className: 'permalink' }, [
        make('div', { text: '這一季還沒有永久連結。', className: 'permalink-label' }),
        make('div', {
          text: '生成職事表之後就會有。' + (p.explanation || ''),
          className: 'permalink-note'
        })
      ]);
    }

    const urlNode = make('div', { text: p.url, className: 'permalink-url' });
    const copyBtn = button('複製連結', () => copyTextToClipboard(p.url, copyBtn), 'secondary');
    const openBtn = make('a', { text: '開啟看看', className: 'sheetlink' });
    openBtn.href = p.url;
    openBtn.target = '_blank';
    openBtn.rel = 'noopener';

    return make('div', { className: 'permalink' }, [
      make('div', { text: '職事表的永久連結', className: 'permalink-label' }),
      urlNode,
      make('div', { className: 'row' }, [copyBtn, openBtn]),
      make('div', { text: p.explanation || '', className: 'permalink-note' })
    ]);
  }

  /**
   * 複製到剪貼簿。
   *
   * ⚠️ `navigator.clipboard` 在 Apps Script 的 iframe 裡面**不一定**用得到
   * （權限政策、非 HTTPS 情境都會令它失敗）。失敗**不可以靜靜當作成功**——
   * 幹事會以為複製好了，貼出來卻是舊東西。所以有退路，而且兩條路都會
   * 明確講結果。
   */
  function copyTextToClipboard(text, btn) {
    const done = (ok) => {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = ok ? '已複製 ✓' : '複製不到，請自己選取上面那一行';
      setTimeout(() => { btn.textContent = original; }, 2200);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
        return;
      }
    } catch (e) { /* 落下面那條退路 */ }
    fallbackCopy(text, done);
  }

  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e) {
      done(false);
    }
  }

  /* ── 第 2 步：查看／修改職事表 ─────────────────────────────── */

  /* ── 第八十二輪批次 IH 組：切返幹事介面就自動重新檢查〔儲存〕────────────
   *
   * 幹事喺試算表分頁改完格、切返嚟（`visibilitychange`／`focus`）⇒ 用一個**輕量**呼叫
   * （`apiGetSaveButtonState`，同主畫面同一支 `computeSaveButton_()`）更新〔儲存〕同第 2 步嗰句；
   * 10 秒內唔重覆；彈窗開住就唔做（唔好喺幹事睇緊嘢嗰陣郁畫面）。
   */
  const SAVE_RECHECK_MIN_MS = 10000;
  let step2SaveRefs_ = null;
  let saveRecheckAt_ = 0;

  /* 第八十三輪批次 JG 組：撳〔儲存〕即時有反應——掣變灰、旁邊寫「儲存中……」，做完先還原。 */
  const SAVE_RUNNING_TEXT = '儲存中……（可能要一至兩分鐘，請不要再按）';
  let saveRunning_ = false;

  /**
   * @param {boolean} on 開始（true）／結束（false）
   */
  function setSaveButtonRunning(on) {
    saveRunning_ = !!on;
    const refs = step2SaveRefs_;
    if (!refs || !refs.btn) return;
    if (on) {
      refs.wasDisabled = !!refs.btn.disabled;
      refs.btn.disabled = true;
      refs.btn.classList.add('is-running');
      if (refs.running) { refs.running.textContent = SAVE_RUNNING_TEXT; refs.running.hidden = false; }
    } else {
      refs.btn.disabled = !!refs.wasDisabled;
      refs.btn.classList.remove('is-running');
      if (refs.running) { refs.running.textContent = ''; refs.running.hidden = true; }
    }
  }

  /** 搵一個節點入面第一個 className 完全等於 cls 嘅子孫。 */
  function findChildByClass(node, cls) {
    if (!node) return null;
    if (node.className === cls) return node;
    const kids = node.children || [];
    for (let i = 0; i < kids.length; i++) {
      const hit = findChildByClass(kids[i], cls);
      if (hit) return hit;
    }
    return null;
  }

  /**
   * 把後端〔儲存〕狀態套落畫面。
   * @param {{btn: Node, note: ?Node, why: ?Node}} refs
   * @param {{enabled: boolean, disabledReason: string, dynamicText: string}} save
   */
  function applySaveButtonState(refs, save) {
    if (!refs || !refs.btn || !save) return;
    refs.btn.disabled = !save.enabled;
    refs.btn.title = save.enabled ? '' : (save.disabledReason || '');
    if (refs.note) refs.note.textContent = save.dynamicText || '';
    if (refs.why) {
      refs.why.textContent = save.enabled ? '' : (save.disabledReason || '');
      refs.why.hidden = !!save.enabled;
    }
  }

  /**
   * 切返嚟嗰陣檢查一次（10 秒內唔重覆）。
   * @param {number=} nowMs 測試用
   * @returns {Promise<boolean>} 有冇真係叫後端
   */
  async function maybeRecheckSaveButton(nowMs) {
    const now = nowMs === undefined ? Date.now() : nowMs;
    if (!step2SaveRefs_ || !currentQuarterId || modalOpen) return false;
    if (saveRunning_) return false;   // 第八十三輪批次 JG 組：儲存緊唔好著返粒掣
    if (now - saveRecheckAt_ < SAVE_RECHECK_MIN_MS) return false;
    saveRecheckAt_ = now;
    try {
      const r = await callServer('apiGetSaveButtonState', currentQuarterId);
      applySaveButtonState(step2SaveRefs_, r && r.save);
      return true;
    } catch (err) {
      return false;   // 檢查唔到就維持原狀；撳〔儲存〕嗰陣後端會再判斷一次
    }
  }

  function onReturnToDashboard() {
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    maybeRecheckSaveButton();
  }
  document.addEventListener('visibilitychange', onReturnToDashboard);
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('focus', onReturnToDashboard);
  }

  function renderStep2(d, flow) {
    const acts = [];
    const sheetUrl = d.latestVersion && d.latestVersion.sheetUrl;
    const suggestion = (flow && flow.suggestion) || {};

    let openNode;
    // 第八十七輪批次 NB 組：只可查看的人沒有主試算表的存取權 ⇒ 開公開職事表（唯讀連結）
    const publicLink = (flow && flow.permanentLink) || {};
    if (viewOnly_ && publicLink.hasLink && publicLink.url) {
      const open = make('a', { text: '查看／修改職事表', className: 'bigLink', title: '只可查看：打開公開職事表' });
      open.href = publicLink.url;
      open.target = '_blank';
      open.rel = 'noopener';
      open.style.fontSize = 'var(--fs-lg)';
      open.style.padding = '12px 22px';
      openNode = open;
    } else if (viewOnly_) {
      openNode = make('div', {}, [
        stepButton('查看／修改職事表', () => {}, { disabled: true, title: '這一季還沒有公開職事表' }),
        make('div', { text: '這一季還沒有公開職事表', className: 'step-why' })
      ]);
    } else if (sheetUrl) {
      const open = make('a', { text: '查看／修改職事表', className: 'bigLink' });
      open.href = sheetUrl;
      open.target = '_blank';
      open.rel = 'noopener';
      open.style.fontSize = 'var(--fs-lg)';
      open.style.padding = '12px 22px';
      openNode = open;
    } else {
      openNode = stepButton('查看／修改職事表', () => {}, {
        disabled: true,
        title: d.latestVersion ? '開不到那一張工作表。' : '要先在第 1 步生成職事表。'
      });
    }
    // 第七十五輪批次 CH 組：版本下拉（預設＝最新一版）。揀最新 ⇒ 照舊；揀舊版本 ⇒〔查看這一版〕〔用這一版作起點〕
    acts.push((d.versionChoices || []).length > 0 ? buildVersionPicker(d.versionChoices, openNode) : openNode);

    // ── 第四十一輪批次 B 組：兩粒新掣 ───────────────────────────
    //
    // ⚠️ 兩粒都同「儲存我的修改」並排。Ivan 講嘅流程係
    //「改 → 檢查 → 調整 → 再改 → 再調整 → 滿意先儲存」，
    // 四樣嘢喺同一個地方佢先做得順。
    const has = !!d.latestVersion;
    acts.push(stepButton('檢查我的改動', openCheckMyChanges, {
      disabled: !has,
      className: 'secondary',
      title: has ? '只看，不會改動任何東西。' : '要先在第 1 步生成職事表。'
    }));
    // ⚠️ 第四十五輪批次：**一定要包一層 `() => …`。**
    //
    // 直接綁 `openBuildSuggestion` 嘅話，佢收到嘅第一個參數係一個
    // MouseEvent（`button()` 用嘅係 `addEventListener`），而嗰個會原封不動
    // 傳落 `apiBuildSuggestion` 做第 1 個參數 ⇒
    // `Failed due to illegal value in property: 1`，而且**後端一次都唔會被叫到**。
    //
    // 呢個就係現場嗰個錯。上一輪拎住同一句英文查咗成個後端，判錯咗成因。
    acts.push(stepButton('請系統幫我調整', () => openBuildSuggestion(), {
      disabled: !has,
      className: 'secondary',
      title: has ? '產生一張建議版本，正式職事表不會改動。' : '要先在第 1 步生成職事表。'
    }));

    // ⚠️ 「儲存我的修改」同「查看／修改」要**並排、同樣大**：
    // 他做完 A 一定會做 B。分開兩個地方就會漏。
    const save = (d.buttons && d.buttons.save) || {};
    // ⚠️ 第四十六輪批次 D2 組：改名叫「儲存及寄出」。
    // 儲存之後直唔直接去寄出，係確認窗入面一個**預設唔勾**嘅選項。
    // 第七十七輪批次 ED 組（Ivan：〔儲存〕要和〔查看／修改職事表〕一樣顯眼）：
    // 用主要按鈕樣式（藍色），字體大小同內距同上面嗰條 `bigLink` 一樣；撳唔到就照舊變灰、有原因。
    const saveBtn = stepButton('儲存', () => openSaveAndConfirm(), {
      disabled: !save.enabled,
      className: 'primary-big',
      title: save.enabled ? '' : (save.disabledReason || '')
    });
    saveBtn.style.fontSize = 'var(--fs-lg)';
    saveBtn.style.padding = '12px 22px';
    acts.push(saveBtn);
    // 第八十三輪批次 JG 組：「儲存中……」（撳下先出）
    const saveRunningNote = make('span', { text: '', className: 'save-running' });
    saveRunningNote.hidden = true;
    acts.push(saveRunningNote);

    // 第七十五輪批次 CH 組：〔回到上一個儲存版本〕拿走——上面嘅版本下拉〔用這一版作起點〕取代佢。
    // 第七十七輪批次 EA 組：〔排表偏好〕搬咗去「開季前準備」（〔不能服侍的日期〕旁邊）。

    const card = stepCard({
      num: 2,
      title: '查看／修改職事表',
      note: save.dynamicText || '',
      why: (!save.enabled && save.disabledReason) ? save.disabledReason : '',
      whyAlways: true,
      acts: acts
    });
    // 第八十二輪批次 IH 組：記住〔儲存〕同第 2 步嗰兩句，切返幹事介面時輕量更新（唔重載成個主畫面）
    step2SaveRefs_ = {
      btn: saveBtn,
      running: saveRunningNote,
      note: findChildByClass(card, 'step-note'),
      why: findChildByClass(card, 'step-why')
    };

    // ── 第四十八輪批次 A4 組第 3 點 ──────────────────────────────
    //
    // ⚠️ 呢一句係整組最重要嗰一句。
    //
    // AuditLog 同 SendLog 係畀**日後查**嘅；呢一句係畀**而家**嘅佢睇。
    // 佢撳完〔寄出上一個版本〕、閂咗個窗，五分鐘之後就會唔記得自己揀咗乜
    // ——而嗰陣佢會以為收信嘅人睇到嘅係佢表上而家嗰個內容。
    //
    // 儲存咗之後自動消失（後端 `buildSentWithUnsavedWarning_()` 見到
    // 冇未儲存改動就回空字串）——一句永遠關唔甩嘅警告，好快就冇人再讀。
    if (d.sentWithUnsavedWarning) {
      card.querySelector('.step-body').appendChild(
        make('div', { className: 'warnbox' }, [
          make('div', { text: d.sentWithUnsavedWarning, className: 'lines' })
        ]));
    }

    // 第六十七輪批次 AI 組：名單改了之後，這一版有幾多格的人已唔喺名單上——
    // 同狀態卡同一個數字（同一支 `buildEligibilityImpactNodes()`）
    buildEligibilityImpactNodes(d.eligibilityImpact).forEach((n) => {
      card.querySelector('.step-body').appendChild(n);
    });

    // ⚠️ 有建議表而畫面唔講，幹事會喺正式表上改，然後發現改動唔見咗
    //（因為下一次調整會以建議表做起點）。所以一定要講，而且要有出口。
    if (suggestion.hasSuggestion) {
      const link = make('a', { text: '開啟建議表', className: 'sheetlink' });
      link.href = suggestion.url;
      link.target = '_blank';
      link.rel = 'noopener';
      const box = make('div', { className: 'permalink' }, [
        make('div', { text: '現在有一張建議表未處理', className: 'permalink-label' }),
        make('div', {
          text: '「' + suggestion.sheetName + '」。'
            + '在你接受或者放棄它之前，再按「請系統幫我調整」會以那一張做起點。',
          className: 'permalink-note'
        }),
        make('div', { className: 'row' }, [
          link,
          button('接受它', () => openAcceptSuggestion(), ''),
          button('放棄它', () => openDiscardSuggestion(), 'secondary')
        ])
      ]);
      card.querySelector('.step-body').appendChild(box);
    }

    return card;
  }

  /* ── 第七十五輪批次 CH 組：版本下拉 ────────────────────────────
   *
   * 揀咗邊一版要記住（主畫面每次重新整理都會重畫），換季度就返去最新一版。
   * 〔用這一版作起點〕唔會即刻建立新版本：只係把嗰一版寫入最新嗰張可以改嘅工作表，
   * 撳〔儲存〕先成為新一版（來源「以第 M 版作起點」）。舊版本一律唔改唔刪。
   */
  let pickedVersionNo_ = null;
  let pickedVersionQuarter_ = '';

  function buildVersionPicker(choices, openNode) {
    if (pickedVersionQuarter_ !== currentQuarterId) {
      pickedVersionNo_ = null;
      pickedVersionQuarter_ = currentQuarterId;
    }
    const wrap = make('span', { className: 'version-picker' });
    const slot = make('span', { className: 'version-picker-acts' });
    const select = document.createElement('select');
    select.title = '版本';
    choices.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = String(v.versionNo);
      opt.textContent = v.label + (v.isLatest ? '（最新）' : '');
      select.appendChild(opt);
    });
    const latest = choices.filter((v) => v.isLatest)[0] || choices[0];
    const keep = choices.filter((v) => v.versionNo === pickedVersionNo_ && !v.isLatest)[0];
    select.value = String((keep || latest).versionNo);
    const paint = () => {
      clear(slot);
      const no = Number(select.value);
      const chosen = choices.filter((v) => v.versionNo === no)[0];
      if (!chosen || chosen.isLatest) {
        pickedVersionNo_ = null;
        slot.appendChild(openNode);
        return;
      }
      pickedVersionNo_ = no;
      slot.appendChild(buildViewVersionLink(chosen));
      slot.appendChild(stepButton('用這一版作起點', () => openUseVersionAsStartPoint(chosen), {
        className: 'secondary',
        title: '把第 ' + no + ' 版的內容寫入最新那一張職事表，之後按〔儲存〕成為新一版。'
      }));
    };
    select.addEventListener('change', paint);
    wrap.appendChild(select);
    wrap.appendChild(slot);
    paint();
    return wrap;
  }

  /**
   * 〔查看這一版〕。
   *
   * ⚠️ 第七十八輪批次 FB 組：**先準備、後開啟。** 以前係一條 `<a target=_blank>`，撳落去即刻開網址，
   * 同時「射後不理」叫 `apiOpenVersionForViewing()`（還原＋保護）。內置瀏覽器喺同一分頁開，頁面一走
   * 個呼叫就斷咗，還原從來冇跑；就算新分頁開，`/preview` 都早過還原載入（第七十七輪回歸 G12）。
   * 而家係一粒掣：等後端還原完，先出小窗〔開啟第 N 版〕（`target=_blank`，避開彈出視窗攔截）。
   */
  function buildViewVersionLink(v) {
    if (!v.sheetUrl) {
      return stepButton('查看這一版', () => {}, {
        disabled: true, title: '找不到第 ' + v.versionNo + ' 版的工作表。'
      });
    }
    return stepButton('查看這一版', () => openViewVersion(v), {
      className: 'secondary',
      title: '先把第 ' + v.versionNo + ' 版那一張表準備好（只可以看），再開啟。'
    });
  }

  /**
   * 第七十八輪批次 FB 組：〔查看這一版〕嘅小窗。還原唔到（`restoreFailed`）⇒ 黃框講明，唔可以沉默。
   * @param {Object} v 版本下拉嘅一項
   */
  function openViewVersion(v) {
    runAction('準備第 ' + v.versionNo + ' 版（只可以看）', async () => {
      // ⚠️ 會還原舊表、加保護（寫入）⇒ 用 callServerMutating，**等佢完成**先出連結
      const r = await callServerMutating('apiOpenVersionForViewing', currentQuarterId, v.versionNo);
      const link = make('a', { text: '開啟第 ' + v.versionNo + ' 版', className: 'sheetlink' });
      link.href = (r && r.url) || v.sheetUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      const nodes = [make('div', { text: '第 ' + v.versionNo + ' 版已經準備好（只可以看）', className: 'ok-head' })];
      if (r && r.restoreFailed) {
        nodes.push(make('div', { className: 'warnbox' }, [
          make('div', {
            text: '這一張表未能還原成第 ' + v.versionNo + ' 版的內容（' + r.restoreFailed + '），'
              + '畫面上看到的可能不是第 ' + v.versionNo + ' 版。',
            className: 'lines'
          })
        ]));
      }
      nodes.push(make('div', {}, [link]));
      openModal('查看第 ' + v.versionNo + ' 版', nodes, [button('關閉', () => closeModal(), 'secondary')]);
    });
  }

  function openUseVersionAsStartPoint(v) {
    openConfirm({
      title: '用第 ' + v.versionNo + ' 版作起點',
      bodyNodes: [
        para('現在的職事表上未儲存的改動會被這一版的內容蓋過，舊版本不會改變。'),
        para('寫入之後你可以再改；按〔儲存〕才會成為新一版（來源寫「以第 ' + v.versionNo + ' 版作起點」）。', 'muted')
      ],
      confirmLabel: '確定',
      cancelLabel: '取消',
      onConfirm: () => {
        closeModal();
        runAction('寫入第 ' + v.versionNo + ' 版的內容', async () => {
          const r = await callServerMutating('apiUseVersionAsStartPoint', currentQuarterId, v.versionNo);
          pickedVersionNo_ = null;
          const link = make('a', { text: '開啟職事表', className: 'sheetlink' });
          link.href = r.sheetUrl || '';
          link.target = '_blank';
          link.rel = 'noopener';
          openModal('已用第 ' + r.targetVersionNo + ' 版作起點', [
            make('div', {
              text: '已把第 ' + r.targetVersionNo + ' 版寫入最新那一張職事表：' + r.cellCount + ' 格'
                + (r.titleCount > 0 ? '、每週標題 ' + r.titleCount + ' 週' : '') + '。',
              className: 'ok-line'
            }),
            para('還未儲存。看過或再改之後，按〔儲存〕成為新一版。舊版本沒有改變。', 'muted'),
            r.sheetUrl ? link : para('')
          ], [button('知道了', () => closeModalAndRefresh(), '')]);
        });
      }
    });
  }

  /* ── 名單下拉選單：第四十一輪批次 A 組起全自動 ────────────────
   *
   * Ivan 實測之後講明：「我想『生成』自動做這一步。每一個編輯過的版本
   * 都應該有這個下拉選單。如果『事奉人員名單』有更新，這個也要自動再跑
   * 一次。如果做到，第 3 步就不用出現在介面上。」
   *
   * 所以做咗兩件事：
   *   createRosterSheet()（RosterWriter.gs）收尾自動套用——五條建立版本
   *   　嘅路都經過嗰度，所以每一張新 grid 都自動有
   *   apiApplyEligibilitySheet() 套用完名單之後順帶再跑一次
   *
   * 下面呢個函式冇刪，佢搬咗去「進階與診斷」做手動補救——
   * 萬一自動嗰次設唔到（例如工作表被保護），仲有一條路。
   */
  function openApplyDropdowns() {
    runAction('加入名單選單', async () => {
      const r = await callServerMutating('apiApplyGridNameDropdowns', currentQuarterId);
      openModal('名單選單', [
        make('div', { text: '已完成', className: 'ok-head' }),
        para(r.summary),
        para('回到職事表（第 2 步的按鈕）就會看到。', 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  /* ── 第 0 步：更改各崗位的事奉人員名單 ─────────────────────
   *
   * ⚠️ 第四十三輪批次 H 組：呢一步由主流程搬咗入「開季前準備」。
   *
   * Ivan 嘅講法：改名單係**生成之前**做嘅事，唔係生成之後。
   * 擺喺主流程第 3 步（即係生成、改表之後）本身就講錯咗次序——
   * 佢改完名單先生成，排出嚟先會用到新名單。
   *
   * 所以佢而家係「第 0 步」，而主流程剩返四步。
   */

  function renderStepEligibility() {
    return stepCard({
      num: 0,
      title: '更改各崗位的事奉人員名單',
      note: '開一張工作表，一個崗位一欄。在裏面自由增刪改，改完回來按「儲存並套用名單」。',
      acts: [
        stepButton('開啟名單工作表', openEligibilitySheet),
        stepButton('儲存並套用名單', openApplyEligibilitySheet, { className: 'secondary' })
      ]
    });
  }

  function openEligibilitySheet() {
    // 第八十七輪批次 NB 組：只可查看 ⇒ 不開試算表，改為唯讀視窗
    if (viewOnly_) { openEligibilityViewOnly(); return; }
    runAction('開啟名單工作表', async () => {
      const r = await callServerMutating('apiOpenEligibilitySheet');
      const link = make('a', { text: '開啟「' + r.sheetName + '」', className: 'bigLink' });
      link.href = r.url;
      link.target = '_blank';
      link.rel = 'noopener';
      openModal('名單工作表', [
        make('div', { text: '已經展開', className: 'ok-head' }),
        para('一個崗位一欄，下面是該崗位的人。加人就在那一欄下面輸入名字，'
          + '移走就把那一格清空。'),
        link,
        para('改完之後，回來按「儲存並套用名單」。在你按之前，'
          + '真正的名單一格都不會變。', 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  /**
   * 第八十七輪批次 NB 組：「崗位名單（只可查看）」——每個崗位一段，列出名字；
   * 「堂委」「執事」寫明現任是誰；暫時不做這個崗位的人註明。
   */
  function openEligibilityViewOnly() {
    runAction('讀取崗位名單', async () => {
      const r = await callServer('apiGetEligibilityViewOnly', currentQuarterId);
      const nodes = [para('你只有查看權限。要改名單，請找可以修改的同工。', 'muted')];
      (r.posts || []).forEach((p) => {
        const box = make('div', { className: 'sec' }, [sectionTitle(p.postNameTC)]);
        (p.roleTexts || []).forEach((t) => box.appendChild(make('div', { text: '・' + t, className: 'vio-row' })));
        box.appendChild(make('div', {
          text: (p.names || []).length ? (p.names || []).join('、') : '（名單上沒有人）',
          className: 'vio-row'
        }));
        if ((p.excluded || []).length) {
          box.appendChild(make('div', { text: '暫時不做這個崗位：' + p.excluded.join('、'), className: 'muted' }));
        }
        nodes.push(box);
      });
      openModal('崗位名單（只可查看）', nodes, [button('關閉', () => closeModal(), '')]);
    });
  }

  function openApplyEligibilitySheet() {
    runAction('讀取名單工作表', async () => {
      const plan = await callServer('apiPlanEligibilitySheetApply', currentQuarterId);
      // ⚠️ 每次重新讀都要清走上一次嘅勾選。留住嘅話，佢加咗一個新人
      // 之後重新檢查，上一次揀走嗰一項會靜靜噉繼續被略過，
      // 而畫面上嗰個勾**係打咗開**——即係畫面同實際做嘅嘢唔同。
      eligSkip_ = {};
      renderEligibilitySheetPlan(plan);
    });
  }

  /**
   * 第 3 步嘅預覽畫面。
   *
   * ⚠️ 第四十一輪批次 D 組改咗四樣（全部係 Ivan 實測撞到嘅）：
   *   一、認唔出嘅名字旁邊有一粒〔這是新人，一併加入〕
   *   二、逐項可以勾走（預設全部勾好）
   *   三、「會移走」講齊三件事，唔係得「停用不是刪除」一句
   *   四、字大咗（`dlg-lg`，見 Style.html）
   */
  let eligSkip_ = {};   // key -> true 代表**唔要**呢一項（預設全部要）

  function renderEligibilitySheetPlan(plan) {
    const nodes = [];

    if (plan.unresolved.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + plan.unresolved.length + ' 個名字系統認不出'),
        make('div', {
          text: '在處理好之前，一項都不會寫入——'
            + '認不出而照樣套用，等於把那個人靜靜移出名單，而沒有人會知道。',
          className: 'muted'
        })
      ]);
      plan.unresolved.forEach((u) => {
        const item = make('div', { className: 'prop' });
        item.appendChild(make('div', { text: u.note, className: 'prop-head' }));
        // ⚠️ 只有「認唔出嘅人名」先加得到人。「崗位代號對唔上」係另一回事
        //（多數係整欄剪貼錯位），加一個人解決唔到，加咗仲會掩蓋咗真正嘅問題。
        if (u.kind === 'UNKNOWN_NAME') {
          item.appendChild(row([
            // ⚠️ 走返第四十輪嗰一粒同一個對話框（`ScriptZone1.html`），
            // **唔係另寫一份**。加完自動重新讀一次名單工作表。
            button('這是新人，一併加入',
              () => openAddUnresolvedPerson(u, openApplyEligibilitySheet), '')
          ]));
        } else {
          item.appendChild(make('div', {
            text: '這一項不是人名的問題，加人解決不了。'
              + '多數是那一欄整欄貼錯了位置——回去那張表看第 1 行的崗位名。',
            className: 'muted'
          }));
        }
        box.appendChild(item);
      });
      nodes.push(box);
    }

    // ── 逐項勾選 ────────────────────────────────────────────
    //
    // ⚠️ 預設**全部勾好**。Ivan 嘅情況係「改一欄嗰陣順手碰到咗另一欄」，
    // 即係話大部分項都係佢想要嘅，得一兩項唔要。預設唔勾嘅話，
    // 佢每次都要撳幾十下先做得返今日一撳就做到嘅嘢。
    const countNode = make('div', { className: 'ok-line strong' });
    const total = plan.added.length + plan.removed.length;
    const refreshCount = () => {
      const skipped = Object.keys(eligSkip_).filter((k) => eligSkip_[k] === true).length;
      countNode.textContent = '會套用 ' + (total - skipped) + ' 項，略過 ' + skipped + ' 項。';
    };

    const checkRow = (key, textNode) => {
      const line = make('label', { className: 'check-row' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = eligSkip_[key] !== true;
      cb.addEventListener('change', () => {
        eligSkip_[key] = !cb.checked;
        refreshCount();
      });
      line.appendChild(cb);
      line.appendChild(textNode);
      return line;
    };

    if (plan.added.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('會加入（' + plan.added.length + ' 項）')
      ]);
      plan.added.forEach((a) => {
        box.appendChild(checkRow(a.key, make('span', {
          text: a.postNameTC + '　＋　' + a.nameTC
        })));
      });
      nodes.push(box);
    }

    if (plan.removed.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('會移走（' + plan.removed.length + ' 項）')
      ]);
      // ⚠️ 三件事都要講。Ivan 實測時見到嘅只有「停用不是刪除」一句，
      // 而佢真正想知嘅係「噉現有嗰幾格點算」——嗰句冇答到佢。
      const why = make('div', { className: 'sec' });
      why.appendChild(make('div', {
        text: '・以後重新生成，系統不會再自動排他做這個崗位。', className: 'ok-line'
      }));
      why.appendChild(make('div', {
        text: '・現有職事表上已經排好的格不會被拿走。'
          + '下面有哪幾格的，就是那幾格——要改就自己回職事表改。',
        className: 'ok-line'
      }));
      why.appendChild(make('div', {
        text: '・這是「停用」，不是刪除。紀錄仍然留着，'
          + '下次在那張表把他的名字打回去就會重新啟用。',
        className: 'ok-line'
      }));
      box.appendChild(why);

      plan.removed.forEach((r) => {
        const span = make('span', {
          text: r.postNameTC + '　－　' + r.nameTC
        });
        const line = checkRow(r.key, span);
        box.appendChild(line);
        // ⚠️ 唔止講「還有 N 格」——要講**邊幾個主日**。
        // 一個佢核對唔到嘅數字，同冇講差唔多。
        if (r.assignedCount > 0) {
          const dates = (r.assignedDates || []).map((d) => humanDate(d)).join('、');
          box.appendChild(make('div', {
            text: '　　⚠ 他在 ' + plan.quarterId + ' 第 ' + plan.versionNo
              + ' 版還有 ' + r.assignedCount + ' 格是這個崗位'
              + (dates ? ('：' + dates) : '') + '。那幾格不會被拿走。',
            className: 'muted'
          }));
        }
      });
      nodes.push(box);
    }

    if (plan.blocked) {
      openModal('儲存並套用名單', nodes.concat([
        para('把上面認不出的名字處理好，再按一次。'
          + '如果那是新人，可以直接按上面的〔這是新人，一併加入〕。', 'muted')
      ]), [button('知道了', () => closeModal(), '')]);
      return;
    }

    if (total === 0) {
      openModal('儲存並套用名單', [
        para('名單沒有改動，不需要儲存。')
      ], [button('知道了', () => closeModal(), '')]);
      return;
    }

    refreshCount();
    nodes.push(countNode);

    openConfirm({
      title: '儲存並套用名單',
      // ⚠️ 字太細係 Ivan 直接講嘅。呢個彈窗一次要睇幾十行，
      // 而佢要逐行核對「係咪真係想改呢一項」。
      // 包一層 `dlg-lg` 而唔係改 `openConfirm()`——Style.html 因為
      // 改現有規則出過兩次事，加一個 scope 係最細嘅改動。
      bodyNodes: [make('div', { className: 'dlg-lg' }, nodes)],
      confirmLabel: '確定套用',
      onConfirm: () => {
        // ⚠️ 只傳**勾住嗰啲**嘅 key。後端仍然會自己重新算一次預覽，
        // 呢個清單淨係用嚟篩走——見 `EligibilitySheetEditor.gs` 檔頭。
        const keys = plan.added.concat(plan.removed)
          .map((x) => x.key)
          .filter((k) => eligSkip_[k] !== true);
        runAction('套用名單', async () => {
          const r = await callServerMutating(
            'apiApplyEligibilitySheet', currentQuarterId, keys);
          resetMainFlowState();
          renderEligibilityApplyResult(r);
        });
      }
    });
  }

  function renderEligibilityApplyResult(r) {
    const done = [
      make('div', { text: '已完成', className: 'ok-head' }),
      para(r.message)
    ];

    // ⚠️ 勾咗但重算之後已經唔存在嘅項**一定要講**。
    // 佢睇緊預覽嗰陣又去改咗嗰張表，係完全正常嘅事——
    // 但唔講嘅話，佢以為嗰幾項套用咗。
    if (r.vanished && r.vanished.length > 0) {
      done.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '你勾選的其中 ' + r.vanished.length + ' 項，在系統重新讀那張表的時候'
            + '已經不存在了（多數是你看着這個畫面的時候又改過那張表）。'
            + '那幾項一格都沒有動。再按一次「儲存並套用名單」會重新看一次。',
          className: 'lines'
        })
      ]));
    }

    if (r.stillAssigned && r.stillAssigned.length > 0) {
      done.push(para('這幾位已經排在現有職事表上，那幾格不會自動改動：', 'muted'));
      r.stillAssigned.forEach((s) => {
        done.push(make('div', {
          text: s.postNameTC + '　' + s.nameTC + '　（' + s.assignedCount + ' 格）',
          className: 'vio-row'
        }));
      });
    }

    if (r.dropdownNote) {
      done.push(make('div', { className: 'warnbox' }, [
        make('div', { text: r.dropdownNote, className: 'lines' })
      ]));
    }

    // 第六十七輪批次 AI 組：這一版有幾多格的人已經唔喺名單上（同狀態卡同一支）
    buildEligibilityImpactNodes(r.eligibilityImpact, { withButton: true }).forEach((n) => done.push(n));

    openModal('名單已套用', done, [button('知道了', () => closeModal(), '')]);
  }

  /* ── 第 4 步：寄出（C 組）────────────────────────────────── */

  function renderStepSend(d) {
    // 第七十七輪批次 EE 組（Ivan 手動測試 B）：一粒〔寄出〕改為三粒——
    //   〔給所有人〕　寄現時已儲存的版本給職事表上所有人、堂委、執事（冇〔選擇收件人〕）
    //   〔變動的人〕　只寄給同**上一次寄出的版本**比較有改動的人（正式發出之後先可以撳；冇〔選擇收件人〕）
    //   〔選擇其他〕　現時嘅〔寄出〕：自動打開〔選擇收件人〕，預設勾有改動嘅人
    // 三粒都先經同一個未儲存檢查（`renderSendDialog()`），再開寄出窗；之後行嘅仍然係原本三條寄出路。
    // 第八十二輪批次 IG 組（Ivan 手動測試 C）：四粒——
    //   〔寄給堂委／執事〕審閱本（堂委、執事、IT、幹事、固定名單、你自己；任何階段）
    //   〔給所有人〕　　　一律係正式發出（第一次要打「確認」；之後＝全部人都收到嘅改動後重發）
    //   〔變動的人〕　　　正式發出之後先可以撳
    //   〔選擇其他〕　　　正式發出之前＝審閱本；之後＝改動通知
    const has = !!d.latestVersion;
    const officialOnce = !!d.officialSentOnce;
    const notYet = '要先在第 1 步生成職事表。';
    const changedWhy = !has ? notYet
      : (officialOnce ? '只寄給和上一次寄出的版本比較、安排有改動的人。' : RESEND_NEEDS_OFFICIAL_HINT + '。');
    return stepCard({
      num: 3,
      title: '寄出',
      note: '系統只會寄已經儲存的版本。',
      why: has && !officialOnce ? '〔變動的人〕：' + RESEND_NEEDS_OFFICIAL_HINT + '。' : '',
      acts: [
        stepButton('寄給堂委／執事', () => openSendDialog('COMMITTEE'), {
          disabled: !has,
          className: 'secondary',
          title: has ? '寄審閱本給堂委、執事、IT、幹事、固定收件人和你自己。不會改變進度。' : notYet
        }),
        // 第八十五輪批次 LA 組：〔給所有人〕和其餘三個寄出按鈕同一個樣式，第 3 步沒有藍色主按鈕。
        stepButton('給所有人', () => openSendDialog('ALL'), {
          disabled: !has,
          className: 'secondary',
          title: !has ? notYet
            : (officialOnce ? '再寄一次給全部人（改動後重發，全部人都會收到）。'
              : '正式發出給全體（職事表上所有人、堂委和執事）。不可逆。')
        }),
        stepButton('變動的人', () => openSendDialog('CHANGED'), {
          disabled: !has || !officialOnce,
          className: 'secondary',
          title: changedWhy
        }),
        stepButton('選擇其他', () => openSendDialog('PICK'), {
          disabled: !has,
          className: 'secondary',
          title: !has ? notYet : ('自己選擇寄給誰（會先打開收件人名單）。'
            + (officialOnce ? '正式發出之後寄的是改動通知。' : '正式發出之前寄的是審閱本。'))
        })
      ]
    });
  }

  /* ── 第 5 步：無電郵者的紙本（D 組）─────────────────────── */

  function renderStepPaper(d, flow) {
    const n = (flow && flow.paperCount) || 0;
    return stepCard({
      num: 4,
      // ⚠️ 第四十六輪批次 D3 組：標題嗰個動態數字保留（做得好），
      // 但因為粒掣改咗名叫「下載及匯出」，副標題要講清楚呢度同時處理
      // **兩種用途**——唔講嘅話，幹事會以為呢度淨係為咗冇電郵嗰批人，
      // 而佢想自己留一份 PDF 嗰陣就唔知去邊度攞。
      title: n > 0 ? ('要印紙本的有 ' + n + ' 位') : '下載及匯出',
      note: n > 0
        ? '這幾位查不到電郵，收不到信，但照樣要服侍。'
          + '這裏同時可以把整季或者個人的 PDF 下載一份自己保存。'
        : '這一季暫時沒有查不到電郵的人。'
          + '這裏可以把整季或者個人的 PDF 下載一份自己保存，'
          + '也可以在這裏加人（有些長者兩種方式都需要）。',
      acts: [stepButton('下載及匯出', () => openPaperDialog(), {
        disabled: !d.latestVersion,
        className: n > 0 ? '' : 'secondary',
        title: d.latestVersion ? '' : '要先在第 1 步生成職事表。'
      })]
    });
  }
</script>
