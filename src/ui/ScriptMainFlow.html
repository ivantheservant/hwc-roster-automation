<script>
  /* ============================================================
   * 第三十九輪批次 A／C／D 組：**幹事主流程六步**
   * ============================================================
   *
   * 幹事的真實工作流程就是這六件事，順序固定：
   *
   *   1. 生成下一季職事表
   *   2. 查看／修改職事表
   *   3. 改動時的名單協助
   *   4. 維護各崗位的事奉人員名單
   *   5. 寄出
   *   6. 沒有電郵的人要印紙本
   *
   * 放在畫面最頂，字大、間距闊、一眼看得晒。每一步一粒主掣，
   * **不用細字解釋**——他不會讀。
   *
   * ⚠️ 這一段**沒有另起爐灶**。每一粒掣落到最後都是叫原本那幾條
   * 已經在真實環境跑過的路（`openGenerateDraft()`／`openSaveAndConfirm()`／
   * `openReview()`／`openOfficial()`／`openResend()`）。
   * 改的是「幹事看到什麼、要不要自己判斷」，不是寄信同建立版本那部機器。
   *
   * ⚠️ 載入次序：這個檔案要排在 `ScriptZone1` **之後**——
   * 它會叫 `openGenerateDraft()` 那幾個函式（在 ScriptZone1 定義）。
   */

  /** 最近一次 `apiGetMainFlowState` 的結果。跟 dashboard 一樣，過期就重讀。 */
  let mainFlowState_ = null;
  let mainFlowStaleQuarter_ = null;

  /**
   * 主流程要的額外資料。**每次換季度或者做完動作都會重讀**——
   * 快取一個舊季度的數字，就是「畫面看起來完全正常但講緊另一季」那一類 bug。
   */
  async function getMainFlowState() {
    if (!mainFlowState_ || mainFlowStaleQuarter_ !== currentQuarterId) {
      mainFlowState_ = await callServer('apiGetMainFlowState', currentQuarterId);
      mainFlowStaleQuarter_ = currentQuarterId;
    }
    return mainFlowState_;
  }

  /** 換季度／做完寫入動作之後叫。 */
  function resetMainFlowState() {
    mainFlowState_ = null;
    mainFlowStaleQuarter_ = null;
  }

  /**
   * 砌一步。
   * @param {Object} o {num, title, note, why, acts:[Node]}
   * @returns {Node}
   */
  function stepCard(o) {
    const body = make('div', { className: 'step-body' }, [
      make('div', { text: o.title, className: 'step-title' })
    ]);
    if (o.note) body.appendChild(make('div', { text: o.note, className: 'step-note' }));
    if (o.why) body.appendChild(make('div', { text: o.why, className: 'step-why' }));
    if (o.acts && o.acts.length > 0) {
      body.appendChild(make('div', { className: 'step-acts' }, o.acts));
    }
    if (o.extra) body.appendChild(o.extra);
    return make('div', { className: 'step' }, [
      make('div', { text: String(o.num), className: 'step-num' }),
      body
    ]);
  }

  /** 主流程用的大掣。 */
  function stepButton(label, onClick, opts) {
    opts = opts || {};
    const b = button(label, onClick, 'step-btn ' + (opts.className || ''));
    if (opts.disabled) b.disabled = true;
    if (opts.title) b.title = opts.title;
    return b;
  }

  /* ============================================================
   * 主畫面
   * ============================================================ */

  async function renderMainFlow(d) {
    const root = clear(el('mainFlowBody'));
    const flow = await getMainFlowState();

    // ⚠️ 第四十一輪批次 A 組：由六步變**五步**。
    // 原本嘅第 3 步（加名單選單）已經全自動，唔再出現喺主流程。
    //
    // ⚠️ 編號一定要重新排好。跳號（第 2 步、第 4 步、第 5 步）
    // 對幹事嚟講就係「我係咪漏咗一步」——一條直線唔可以有窿。
    const steps = [
      renderStep1(d, flow),
      renderStep2(d, flow),
      renderStepEligibility(),
      renderStepSend(d),
      renderStepPaper(d, flow)
    ];
    steps.forEach((node) => root.appendChild(node));

    // ⚠️ 第四十二輪批次 E 組：頁頂嗰個「幾多步」**由實際步數算出嚟**。
    //
    // 第四十一輪由六步減成五步，而 `Index.html` 嗰句仍然寫住「六步」，
    // 足足一輪冇人發現。一個同畫面唔符嘅數字，幹事會以為自己漏咗一步，
    // 然後去搵一個唔存在嘅第六步。
    //
    // 寫死一個數字 ＝ 又一個「兩個真相來源」。呢度改成只有一個。
    const sub = el('flowHeadSub');
    if (sub) sub.textContent = '由上而下做，' + cnNumber(steps.length) + '步';
  }

  /** 一位數嘅中文數字。超出範圍就照回阿拉伯數字——**唔可以回空白**。 */
  function cnNumber(n) {
    const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    return (n >= 0 && n <= 10) ? digits[n] : String(n);
  }

  /* ── 第 1 步：生成下一季職事表 ─────────────────────────────── */

  function renderStep1(d, flow) {
    const t = (flow && flow.generateTarget) || {};
    const acts = [];

    if (!t.found) {
      return stepCard({
        num: 1, title: '生成下一季職事表',
        why: t.reason || '找不到任何季度。先去「開季前準備」建立一季。'
      });
    }

    // ⚠️ 掣上面直接寫是哪一季——**不要他自己去揀**。
    const label = '生成' + t.label + '職事表';
    if (t.alreadyGenerated) {
      acts.push(stepButton(label, () => {}, {
        disabled: true,
        title: t.allGenerated
          ? '所有已建立的季度都生成過了。要建立更下一年的季度，'
            + '請去「開季前準備 ▸ 產生下一年度四個季度」。'
          : '這一季已經生成過了。要重新生成（會覆蓋現有安排）'
            + '請去下面「進階與診斷」。'
      }));
    } else {
      acts.push(stepButton(label, () => openGenerateForTarget(t)));
    }

    const card = stepCard({
      num: 1,
      title: '生成下一季職事表',
      note: t.alreadyGenerated
        // ⚠️ 第四十二輪批次 C 組：呢種情況粒掣係灰嘅，幹事乜都做唔到。
        // 所以呢一句唯一有用嘅資訊係「下一步去邊」——
        // 唔可以再夾一句「生成日期仲有 9 天」落嚟。
        ? (t.allGenerated
          ? ('所有已建立的季度都生成過了（' + t.label + ' 現時有 '
            + t.versionCount + ' 個版本）。要建立更下一年的季度，'
            + '請去下面「開季前準備 ▸ 產生下一年度四個季度」。')
          : (t.label + ' 已經生成過了（現時有 ' + t.versionCount
            + ' 個版本）。要重新生成（會覆蓋現有安排）請去下面「進階與診斷」。'))
        // ⚠️ 第四十輪批次 E 組：掣旁邊要寫住生成日期同距離幾多日。
        //
        // 2026-08-21 實測撞到：粒掣寫住「生成 2027 年 1-3 月職事表」，
        // 而嗰一季嘅 GenerateOn 係 2026-11-27——仲有三個幾月。
        // 嗰一季係留嚟真正上線嗰季，今日撳落去會用掉佢。
        //
        // 冇 GenerateOn 就照講「冇填」——**唔可以當成「今日就係」**，
        // 嗰個係一個肯定句，而我哋根本唔知。
        : describeGenerateOn(t),
      why: t.warn ? firstLineOf(t.warnMessage) : '',
      acts: acts,
      extra: renderPermanentLink(flow)
    });
    return card;
  }

  /** 生成日期同距離幾多日，一句人話。 */
  function describeGenerateOn(t) {
    if (!t.generateOn) {
      return '這一季的 Quarters 沒有填生成日期（GenerateOn），所以系統講不出還有多久。';
    }
    const d = t.daysUntilGenerateOn;
    if (d === null || d === undefined) {
      return '生成日期：' + t.generateOn + '。';
    }
    // ⚠️ 第四十二輪批次 C 組：順帶講埋而家有幾多個版本。
    // 呢一步係「生成」，而「而家有幾多個版本」就係佢撳落去之前
    // 最需要知嗰件事——0 個代表全新，唔係 0 就代表佢會多開一版。
    const v = '　現時有 ' + (t.versionCount || 0) + ' 個版本。';
    if (d > 0) return '生成日期：' + t.generateOn + '（還有 ' + d + ' 天）。' + v;
    if (d === 0) return '生成日期：' + t.generateOn + '（就是今日）。' + v;
    return '生成日期：' + t.generateOn + '（已經過了 ' + (-d) + ' 天）。' + v;
  }

  /**
   * 三段式訊息的第一段——步卡上面只講一句，詳情留在確認畫面。
   *
   * ⚠️ 第四十二輪批次 E 組：要把「發生了什麼：」呢個**機器標記**剝走。
   *
   * 嗰個標記係後端同前端之間嘅分隔符（見 `buildThreePartMessage_()`），
   * 唔係俾人睇嘅字。第四十一輪已經把彈窗嗰個顯示標籤改成「要留意」，
   * 但步卡呢一句係直接攞原文第一行，所以嗰五個字照樣漏咗出嚟——
   * 而嗰句講嘅係「呢一季仲未到生成日期」，根本冇嘢發生過。
   */
  function firstLineOf(text) {
    return String(text || '').split('\n')[0].replace(/^發生了什麼：\s*/, '');
  }

  /**
   * 生成一個指定季度。
   *
   * ⚠️ 目標季度如果不是現在看著那一季，**先把上面的季度選單切過去**——
   * 否則生成完之後，畫面其餘部分仍然在講另一季，
   * 而幹事會以為生成失敗了。
   */
  function openGenerateForTarget(t) {
    const go = () => {
      if (t.quarterId !== currentQuarterId) {
        const sel = el('quarter');
        sel.value = t.quarterId;
        currentQuarterId = t.quarterId;
        resetAllZoneLoadState();
        resetMainFlowState();
        runAction('切換到' + t.label, async () => {
          await loadDashboard();
          openGenerateDraft();
        });
        return;
      }
      openGenerateDraft();
    };

    // ⚠️ 第四十二輪批次 C 組：真正要上線嗰一季，撳之前要額外講一句。
    // 邊一季係「上線嗰季」由 Config 嘅 `GO_LIVE_QUARTER_ID` 決定，
    // **唔係寫死**——嗰個係教會嘅資料，而且每年都唔同。
    const goLiveNote = t.isGoLiveQuarter
      ? make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這一季是實際要上線的季度。生成落去就會用掉它——'
            + '如果你只是想試一試，請改用一個測試季度。',
          className: 'lines'
        })
      ])
      : null;

    // 已經開始／已經過去／未到生成日期 ⇒ **准許，但先講清楚**。
    if (t.warn || goLiveNote) {
      openConfirm({
        title: '生成' + t.label + '職事表',
        bodyNodes: (t.warn
          // ⚠️ 第四十二輪批次 E 組：唔可以 `para(rawMessage)`——
          // 噉樣會把「發生了什麼：」呢個機器標記原封不動印上畫面。
          ? threePartNodes(t.warnMessage)
          : [para('現時有 ' + (t.versionCount || 0) + ' 個版本。')]
        ).concat([goLiveNote]).filter(Boolean),
        confirmLabel: '知道了，照樣生成',
        onConfirm: () => { closeModal(); go(); }
      });
      return;
    }
    go();
  }

  /* ── 那條永久連結 ─────────────────────────────────────────── */

  function renderPermanentLink(flow) {
    const p = (flow && flow.permanentLink) || {};
    if (!p.hasLink) {
      if (p.checkFailed) {
        return make('div', { className: 'permalink' }, [
          make('div', { text: '查不到這一季有沒有永久連結。', className: 'permalink-label' }),
          make('div', {
            text: '這不代表沒有連結，只代表系統現在看不到。'
              + '撳一次「重新整理」再看，或者去下面「進階與診斷 ▸ 重新發佈公開連結」。',
            className: 'permalink-note'
          })
        ]);
      }
      return make('div', { className: 'permalink' }, [
        make('div', { text: '這一季還沒有永久連結。', className: 'permalink-label' }),
        make('div', {
          text: '生成職事表之後就會有。' + (p.explanation || ''),
          className: 'permalink-note'
        })
      ]);
    }

    const urlNode = make('div', { text: p.url, className: 'permalink-url' });
    const copyBtn = button('複製連結', () => copyTextToClipboard(p.url, copyBtn), 'secondary');
    const openBtn = make('a', { text: '開啟看看', className: 'sheetlink' });
    openBtn.href = p.url;
    openBtn.target = '_blank';
    openBtn.rel = 'noopener';

    return make('div', { className: 'permalink' }, [
      make('div', { text: '職事表的永久連結', className: 'permalink-label' }),
      urlNode,
      make('div', { className: 'row' }, [copyBtn, openBtn]),
      make('div', { text: p.explanation || '', className: 'permalink-note' })
    ]);
  }

  /**
   * 複製到剪貼簿。
   *
   * ⚠️ `navigator.clipboard` 在 Apps Script 的 iframe 裡面**不一定**用得到
   * （權限政策、非 HTTPS 情境都會令它失敗）。失敗**不可以靜靜當作成功**——
   * 幹事會以為複製好了，貼出來卻是舊東西。所以有退路，而且兩條路都會
   * 明確講結果。
   */
  function copyTextToClipboard(text, btn) {
    const done = (ok) => {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = ok ? '已複製 ✓' : '複製不到，請自己選取上面那一行';
      setTimeout(() => { btn.textContent = original; }, 2200);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
        return;
      }
    } catch (e) { /* 落下面那條退路 */ }
    fallbackCopy(text, done);
  }

  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e) {
      done(false);
    }
  }

  /* ── 第 2 步：查看／修改職事表 ─────────────────────────────── */

  function renderStep2(d, flow) {
    const acts = [];
    const sheetUrl = d.latestVersion && d.latestVersion.sheetUrl;
    const suggestion = (flow && flow.suggestion) || {};

    if (sheetUrl) {
      const open = make('a', { text: '查看／修改職事表', className: 'bigLink' });
      open.href = sheetUrl;
      open.target = '_blank';
      open.rel = 'noopener';
      open.style.fontSize = 'var(--fs-lg)';
      open.style.padding = '12px 22px';
      acts.push(open);
    } else {
      acts.push(stepButton('查看／修改職事表', () => {}, {
        disabled: true,
        title: d.latestVersion ? '開不到那一張工作表。' : '要先在第 1 步生成職事表。'
      }));
    }

    // ── 第四十一輪批次 B 組：兩粒新掣 ───────────────────────────
    //
    // ⚠️ 兩粒都同「儲存我的修改」並排。Ivan 講嘅流程係
    //「改 → 檢查 → 調整 → 再改 → 再調整 → 滿意先儲存」，
    // 四樣嘢喺同一個地方佢先做得順。
    const has = !!d.latestVersion;
    acts.push(stepButton('檢查我的改動', openCheckMyChanges, {
      disabled: !has,
      className: 'secondary',
      title: has ? '只看，不會改動任何東西。' : '要先在第 1 步生成職事表。'
    }));
    acts.push(stepButton('請系統幫我調整', openBuildSuggestion, {
      disabled: !has,
      className: 'secondary',
      title: has ? '產生一張建議版本，正式職事表不會改動。' : '要先在第 1 步生成職事表。'
    }));

    // ⚠️ 「儲存我的修改」同「查看／修改」要**並排、同樣大**：
    // 他做完 A 一定會做 B。分開兩個地方就會漏。
    const save = (d.buttons && d.buttons.save) || {};
    acts.push(stepButton('儲存我的修改', openSaveAndConfirm, {
      disabled: !save.enabled,
      className: 'secondary',
      title: save.enabled ? '' : (save.disabledReason || '')
    }));

    const card = stepCard({
      num: 2,
      title: '查看／修改職事表',
      note: save.dynamicText || '',
      why: (!save.enabled && save.disabledReason) ? save.disabledReason : '',
      acts: acts
    });

    // ⚠️ 有建議表而畫面唔講，幹事會喺正式表上改，然後發現改動唔見咗
    //（因為下一次調整會以建議表做起點）。所以一定要講，而且要有出口。
    if (suggestion.hasSuggestion) {
      const link = make('a', { text: '開啟建議表', className: 'sheetlink' });
      link.href = suggestion.url;
      link.target = '_blank';
      link.rel = 'noopener';
      const box = make('div', { className: 'permalink' }, [
        make('div', { text: '現在有一張建議表未處理', className: 'permalink-label' }),
        make('div', {
          text: '「' + suggestion.sheetName + '」。'
            + '在你接受或者放棄它之前，再撳「請系統幫我調整」會以那一張做起點。',
          className: 'permalink-note'
        }),
        make('div', { className: 'row' }, [
          link,
          button('接受它', () => openAcceptSuggestion(), ''),
          button('放棄它', () => openDiscardSuggestion(), 'secondary')
        ])
      ]);
      card.querySelector('.step-body').appendChild(box);
    }

    return card;
  }

  /* ── 名單下拉選單：第四十一輪批次 A 組起全自動 ────────────────
   *
   * Ivan 實測之後講明：「我想『生成』自動做這一步。每一個編輯過的版本
   * 都應該有這個下拉選單。如果『事奉人員名單』有更新，這個也要自動再跑
   * 一次。如果做到，第 3 步就不用出現在介面上。」
   *
   * 所以做咗兩件事：
   *   createRosterSheet()（RosterWriter.gs）收尾自動套用——五條建立版本
   *   　嘅路都經過嗰度，所以每一張新 grid 都自動有
   *   apiApplyEligibilitySheet() 套用完名單之後順帶再跑一次
   *
   * 下面呢個函式冇刪，佢搬咗去「進階與診斷」做手動補救——
   * 萬一自動嗰次設唔到（例如工作表被保護），仲有一條路。
   */
  function openApplyDropdowns() {
    runAction('加入名單選單', async () => {
      const r = await callServerMutating('apiApplyGridNameDropdowns', currentQuarterId);
      openModal('名單選單', [
        make('div', { text: '已完成', className: 'ok-head' }),
        para(r.summary),
        para('回到職事表（第 2 步那一粒）就會見到。', 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  /* ── 第 3 步：維護各崗位的事奉人員名單 ─────────────────────── */

  function renderStepEligibility() {
    return stepCard({
      num: 3,
      title: '維護各崗位的事奉人員名單',
      note: '開一張工作表，一個崗位一欄。在裡面自由增刪改，改完回來撳「儲存並套用名單」。',
      acts: [
        stepButton('開啟名單工作表', openEligibilitySheet),
        stepButton('儲存並套用名單', openApplyEligibilitySheet, { className: 'secondary' })
      ]
    });
  }

  function openEligibilitySheet() {
    runAction('開啟名單工作表', async () => {
      const r = await callServerMutating('apiOpenEligibilitySheet');
      const link = make('a', { text: '開啟「' + r.sheetName + '」', className: 'bigLink' });
      link.href = r.url;
      link.target = '_blank';
      link.rel = 'noopener';
      openModal('名單工作表', [
        make('div', { text: '已經攤開好了', className: 'ok-head' }),
        para('一個崗位一欄，底下是該崗位的人。加人就在那一欄下面打名，'
          + '移走就把那一格清空。'),
        link,
        para('改完之後，回來撳「儲存並套用名單」。在你撳之前，'
          + '真正的名單一格都不會變。', 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  function openApplyEligibilitySheet() {
    runAction('讀取名單工作表', async () => {
      const plan = await callServer('apiPlanEligibilitySheetApply', currentQuarterId);
      // ⚠️ 每次重新讀都要清走上一次嘅勾選。留住嘅話，佢加咗一個新人
      // 之後重新檢查，上一次揀走嗰一項會靜靜噉繼續被略過，
      // 而畫面上嗰個勾**係打咗開**——即係畫面同實際做嘅嘢唔同。
      eligSkip_ = {};
      renderEligibilitySheetPlan(plan);
    });
  }

  /**
   * 第 3 步嘅預覽畫面。
   *
   * ⚠️ 第四十一輪批次 D 組改咗四樣（全部係 Ivan 實測撞到嘅）：
   *   一、認唔出嘅名字旁邊有一粒〔這是新人，一併加入〕
   *   二、逐項可以勾走（預設全部勾好）
   *   三、「會移走」講齊三件事，唔係得「停用不是刪除」一句
   *   四、字大咗（`dlg-lg`，見 Style.html）
   */
  let eligSkip_ = {};   // key -> true 代表**唔要**呢一項（預設全部要）

  function renderEligibilitySheetPlan(plan) {
    const nodes = [];

    if (plan.unresolved.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + plan.unresolved.length + ' 個名字系統認不出'),
        make('div', {
          text: '在處理好之前，一項都不會寫入——'
            + '認不出而照樣套用，等於把那個人靜靜移出名單，而沒有人會知道。',
          className: 'muted'
        })
      ]);
      plan.unresolved.forEach((u) => {
        const item = make('div', { className: 'prop' });
        item.appendChild(make('div', { text: u.note, className: 'prop-head' }));
        // ⚠️ 只有「認唔出嘅人名」先加得到人。「崗位代號對唔上」係另一回事
        //（多數係整欄剪貼錯位），加一個人解決唔到，加咗仲會掩蓋咗真正嘅問題。
        if (u.kind === 'UNKNOWN_NAME') {
          item.appendChild(row([
            // ⚠️ 走返第四十輪嗰一粒同一個對話框（`ScriptZone1.html`），
            // **唔係另寫一份**。加完自動重新讀一次名單工作表。
            button('這是新人，一併加入',
              () => openAddUnresolvedPerson(u, openApplyEligibilitySheet), '')
          ]));
        } else {
          item.appendChild(make('div', {
            text: '這一項不是人名的問題，加人解決不了。'
              + '多數是那一欄整欄貼錯了位置——回去那張表看第 1 行的崗位名。',
            className: 'muted'
          }));
        }
        box.appendChild(item);
      });
      nodes.push(box);
    }

    // ── 逐項勾選 ────────────────────────────────────────────
    //
    // ⚠️ 預設**全部勾好**。Ivan 嘅情況係「改一欄嗰陣順手碰到咗另一欄」，
    // 即係話大部分項都係佢想要嘅，得一兩項唔要。預設唔勾嘅話，
    // 佢每次都要撳幾十下先做得返今日一撳就做到嘅嘢。
    const countNode = make('div', { className: 'ok-line strong' });
    const total = plan.added.length + plan.removed.length;
    const refreshCount = () => {
      const skipped = Object.keys(eligSkip_).filter((k) => eligSkip_[k] === true).length;
      countNode.textContent = '會套用 ' + (total - skipped) + ' 項，略過 ' + skipped + ' 項。';
    };

    const checkRow = (key, textNode) => {
      const line = make('label', { className: 'check-row' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = eligSkip_[key] !== true;
      cb.addEventListener('change', () => {
        eligSkip_[key] = !cb.checked;
        refreshCount();
      });
      line.appendChild(cb);
      line.appendChild(textNode);
      return line;
    };

    if (plan.added.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('會加入（' + plan.added.length + ' 項）')
      ]);
      plan.added.forEach((a) => {
        box.appendChild(checkRow(a.key, make('span', {
          text: a.postNameTC + '　＋　' + a.nameTC
        })));
      });
      nodes.push(box);
    }

    if (plan.removed.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('會移走（' + plan.removed.length + ' 項）')
      ]);
      // ⚠️ 三件事都要講。Ivan 實測時見到嘅只有「停用不是刪除」一句，
      // 而佢真正想知嘅係「噉現有嗰幾格點算」——嗰句冇答到佢。
      const why = make('div', { className: 'sec' });
      why.appendChild(make('div', {
        text: '・以後重新生成，系統不會再自動排他做這個崗位。', className: 'ok-line'
      }));
      why.appendChild(make('div', {
        text: '・現有職事表上已經排好的格不會被拿走。'
          + '下面有哪幾格的，就是那幾格——要改就自己回職事表改。',
        className: 'ok-line'
      }));
      why.appendChild(make('div', {
        text: '・這是「停用」，不是刪除。紀錄仍然留著，'
          + '下次在那張表把他的名字打回去就會重新啟用。',
        className: 'ok-line'
      }));
      box.appendChild(why);

      plan.removed.forEach((r) => {
        const span = make('span', {
          text: r.postNameTC + '　－　' + r.nameTC
        });
        const line = checkRow(r.key, span);
        box.appendChild(line);
        // ⚠️ 唔止講「還有 N 格」——要講**邊幾個主日**。
        // 一個佢核對唔到嘅數字，同冇講差唔多。
        if (r.assignedCount > 0) {
          const dates = (r.assignedDates || []).map((d) => humanDate(d)).join('、');
          box.appendChild(make('div', {
            text: '　　⚠ 他在 ' + plan.quarterId + ' 第 ' + plan.versionNo
              + ' 版還有 ' + r.assignedCount + ' 格是這個崗位'
              + (dates ? ('：' + dates) : '') + '。那幾格不會被拿走。',
            className: 'muted'
          }));
        }
      });
      nodes.push(box);
    }

    if (plan.blocked) {
      openModal('儲存並套用名單', nodes.concat([
        para('把上面認不出的名字處理好，再撳一次。'
          + '如果那是新人，可以直接撳上面那一粒〔這是新人，一併加入〕。', 'muted')
      ]), [button('知道了', () => closeModal(), '')]);
      return;
    }

    if (total === 0) {
      openModal('儲存並套用名單', [
        para('名單沒有改動，不需要儲存。')
      ], [button('知道了', () => closeModal(), '')]);
      return;
    }

    refreshCount();
    nodes.push(countNode);

    openConfirm({
      title: '儲存並套用名單',
      // ⚠️ 字太細係 Ivan 直接講嘅。呢個彈窗一次要睇幾十行，
      // 而佢要逐行核對「係咪真係想改呢一項」。
      // 包一層 `dlg-lg` 而唔係改 `openConfirm()`——Style.html 因為
      // 改現有規則出過兩次事，加一個 scope 係最細嘅改動。
      bodyNodes: [make('div', { className: 'dlg-lg' }, nodes)],
      confirmLabel: '確定套用',
      onConfirm: () => {
        // ⚠️ 只傳**勾住嗰啲**嘅 key。後端仍然會自己重新算一次預覽，
        // 呢個清單淨係用嚟篩走——見 `EligibilitySheetEditor.gs` 檔頭。
        const keys = plan.added.concat(plan.removed)
          .map((x) => x.key)
          .filter((k) => eligSkip_[k] !== true);
        runAction('套用名單', async () => {
          const r = await callServerMutating(
            'apiApplyEligibilitySheet', currentQuarterId, keys);
          resetMainFlowState();
          renderEligibilityApplyResult(r);
        });
      }
    });
  }

  function renderEligibilityApplyResult(r) {
    const done = [
      make('div', { text: '已完成', className: 'ok-head' }),
      para(r.message)
    ];

    // ⚠️ 勾咗但重算之後已經唔存在嘅項**一定要講**。
    // 佢睇緊預覽嗰陣又去改咗嗰張表，係完全正常嘅事——
    // 但唔講嘅話，佢以為嗰幾項套用咗。
    if (r.vanished && r.vanished.length > 0) {
      done.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '你勾選的其中 ' + r.vanished.length + ' 項，在系統重新讀那張表的時候'
            + '已經不存在了（多數是你看著這個畫面的時候又改過那張表）。'
            + '那幾項一格都沒有動。再撳一次「儲存並套用名單」會重新看一次。',
          className: 'lines'
        })
      ]));
    }

    if (r.stillAssigned && r.stillAssigned.length > 0) {
      done.push(para('這幾位已經排在現有職事表上，那幾格不會自動改動：', 'muted'));
      r.stillAssigned.forEach((s) => {
        done.push(make('div', {
          text: s.postNameTC + '　' + s.nameTC + '　（' + s.assignedCount + ' 格）',
          className: 'vio-row'
        }));
      });
    }

    if (r.dropdownNote) {
      done.push(make('div', { className: 'warnbox' }, [
        make('div', { text: r.dropdownNote, className: 'lines' })
      ]));
    }

    openModal('名單已套用', done, [button('知道了', () => closeModal(), '')]);
  }

  /* ── 第 4 步：寄出（C 組）────────────────────────────────── */

  function renderStepSend(d) {
    const canSend = !!(d.buttons && (
      (d.buttons.review && d.buttons.review.enabled)
      || (d.buttons.official && d.buttons.official.enabled)
      || (d.buttons.resend && d.buttons.resend.enabled)));
    return stepCard({
      num: 4,
      title: '寄出',
      note: '系統只會寄你已經儲存確認的版本。撳落去會先講清楚這一次寄給誰、寄什麼。',
      acts: [stepButton('寄出', openSendDialog, {
        disabled: !canSend && !d.latestVersion,
        title: d.latestVersion ? '' : '要先在第 1 步生成職事表。'
      })]
    });
  }

  /* ── 第 5 步：無電郵者的紙本（D 組）─────────────────────── */

  function renderStepPaper(d, flow) {
    const n = (flow && flow.paperCount) || 0;
    return stepCard({
      num: 5,
      title: n > 0 ? ('要印紙本的有 ' + n + ' 位') : '要印紙本的人',
      note: n > 0
        ? '這幾位查不到電郵，收不到信，但照樣要服侍。'
        : '這一季暫時沒有查不到電郵的人。你仍然可以在這裡加人（有些長者兩樣都要）。',
      acts: [stepButton('處理紙本', openPaperDialog, {
        disabled: !d.latestVersion,
        className: n > 0 ? '' : 'secondary',
        title: d.latestVersion ? '' : '要先在第 1 步生成職事表。'
      })]
    });
  }
</script>
