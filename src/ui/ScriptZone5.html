<script>
  /* ============================================================
   * 第一百零一輪批次：由試算表選單搬入幹事介面的功能及新功能
   *   ZB-12〔更新電郵範本到最新版〕、〔預覽電郵範本〕
   * ============================================================ */

  /** 一段可以捲動的原文（範本內容）。 */
  function z5TextBox(text) {
    return make('div', { text: String(text || '（空白）'), className: 'z5-text' });
  }

  /* ---------- ZB-12〔更新電郵範本到最新版〕 ---------- */

  let tplUpdateSkip_ = {};

  function openEmailTemplateUpdate() {
    runAction('比對電郵範本', async () => {
      const plan = await callServer('apiPlanEmailTemplateUpdate');
      tplUpdateSkip_ = {};
      const todo = plan.items.filter((x) => x.status !== 'SAME');
      const same = plan.items.length - todo.length;
      if (todo.length === 0) {
        openModal('更新電郵範本到最新版', [
          make('div', { text: '沒有差異', className: 'ok-head' }),
          para('試算表上 ' + plan.items.length + ' 個範本全部已經是最新版。')
        ], [button('知道了', () => closeModal(), '')]);
        return;
      }
      const nodes = [
        para('下面 ' + todo.length + ' 個範本和最新版不同' + (same ? ('（另外 ' + same + ' 個已經是最新版）') : '') + '。'
          + '勾選要更新的範本，按〔確認更新〕：系統會先把舊內容整行備份到「EmailTemplates_Backup」工作表（加時間），再覆寫主旨及內文。'),
        para('附件類型（AttachType）和是否啟用（Active）不會改。', 'muted')
      ];
      todo.forEach((x) => {
        const box = make('div', { className: 'sec' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        cb.addEventListener('change', () => { tplUpdateSkip_[x.templateId] = !cb.checked; });
        const head = make('label', { className: 'check-row' });
        head.appendChild(cb);
        head.appendChild(make('span', { text: x.templateId + (x.status === 'MISSING' ? '（工作表沒有這一行，會新增）' : ''), className: 'strong' }));
        box.appendChild(head);
        x.diffs.forEach((d) => {
          box.appendChild(make('div', { text: d.label, className: 'prop-head' }));
          if (x.status !== 'MISSING') {
            box.appendChild(make('div', { text: '現時：', className: 'muted' }));
            box.appendChild(z5TextBox(d.current));
          }
          box.appendChild(make('div', { text: '最新版：', className: 'muted' }));
          box.appendChild(z5TextBox(d.latest));
        });
        nodes.push(box);
      });
      openModal('更新電郵範本到最新版', nodes, [
        button('確認更新', () => applyEmailTemplateUpdateNow(todo.map((x) => x.templateId).filter((id) => tplUpdateSkip_[id] !== true)), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  function applyEmailTemplateUpdateNow(ids) {
    if (!ids || ids.length === 0) {
      openModal('更新電郵範本到最新版', [para('一個都沒有勾選，沒有改動。')], [button('知道了', () => closeModal(), '')]);
      return;
    }
    runAction('更新電郵範本', async () => {
      const r = await callServerMutating('apiApplyEmailTemplateUpdate', ids);
      openModal('更新電郵範本到最新版', [
        make('div', { text: '已完成', className: 'ok-head' }),
        para(r.message || ''),
        para((r.updated || []).concat(r.added || []).join('、'), 'muted')
      ], [button('知道了', () => closeModal(), '')]);
    });
  }

  /* ---------- 〔預覽電郵範本〕（不寄） ---------- */

  function openTemplatePreview() {
    runAction('產生電郵範本預覽', async () => {
      const r = await callServer('apiPreviewTemplateSamples', currentQuarterId);
      const nodes = [
        para('這是〔寄出電郵範本樣本〕會寄出的同一份內容，只在這裏顯示，不會寄出。'
          + (r.hasVersion ? ('用 ' + currentQuarterId + ' 第 ' + r.versionNo + ' 版的資料。') : '這一季還沒有版本，用示範資料。')),
        para('每一封都檢查了：有沒有主試算表的網址或 ID、有沒有舊用字、有沒有「試算表連結」。', 'muted')
      ];
      const bad = r.samples.filter((s) => s.hasSpreadsheetId || s.hasOldWord || s.hasSheetLink).length;
      nodes.push(make('div', { text: bad === 0 ? ('✔ ' + r.samples.length + ' 封全部沒有問題') : ('✘ ' + bad + ' 封有問題（見下面）'),
        className: bad === 0 ? 'ok-line strong' : 'warnbox' }));
      r.samples.forEach((s) => {
        const flags = [];
        flags.push(s.hasSpreadsheetId ? '✘ 有主試算表 ID' : '✔ 沒有主試算表 ID');
        flags.push(s.hasOldWord ? '✘ 有舊用字' : '✔ 沒有舊用字');
        flags.push(s.hasSheetLink ? '✘ 有「試算表連結」' : '✔ 沒有「試算表連結」');
        const box = make('details', { className: 'sec' });
        box.appendChild(make('summary', { text: s.title }));
        box.appendChild(make('div', { text: flags.join('　'), className: 'muted' }));
        box.appendChild(make('div', { text: '主旨：' + s.subject, className: 'prop-head' }));
        box.appendChild(z5TextBox(s.bodyPlain));
        nodes.push(box);
      });
      openModal('預覽電郵範本（' + currentQuarterId + '）', nodes, [button('關閉', () => closeModal(), '')]);
    });
  }

  /* ============================================================
   * 第一百零一輪批次 ZE-1：收件人選擇（共用元件）
   *   用於〔寄出季前資料〕及〔寄出／匯出申報不能服侍日子連結〕。
   *   sel＝{groups, personIds, emails}；按〔更新收件人名單〕由伺服器重新列出全部收件人（同一份判斷）。
   * ============================================================ */

  function renderAudiencePicker(opts, sel, onRefresh) {
    const box = make('div', { className: 'sec' }, [sectionTitle('① 寄給誰')]);
    const groupIds = sel.groups || (sel.groups = []);
    (opts.groups || []).forEach((g) => {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'aud-group';
      cb.checked = groupIds.indexOf(g.id) !== -1 && g.allowed;
      cb.disabled = !g.allowed;
      cb.addEventListener('change', () => {
        const i = groupIds.indexOf(g.id);
        if (cb.checked && i === -1) groupIds.push(g.id);
        if (!cb.checked && i !== -1) groupIds.splice(i, 1);
      });
      const line = make('label', { className: 'check-row' + (g.allowed ? '' : ' disabled') });
      line.appendChild(cb);
      line.appendChild(make('span', { text: g.label }));
      if (g.note) line.appendChild(make('span', { text: '　' + g.note, className: 'muted' }));
      box.appendChild(line);
    });
    // 指定的人（可多選）
    const picked = sel.personIds || (sel.personIds = []);
    const pickBox = make('details', { className: 'aud-pick' });
    pickBox.open = picked.length > 0;
    pickBox.appendChild(make('summary', { text: '指定的人（從名單選，可多選；已選 ' + picked.length + ' 位）' }));
    if (opts.leadersOnly) pickBox.appendChild(make('div', { text: '不是堂委、執事或幹事的人不可以選：' + opts.leadersOnlyNote, className: 'muted' }));
    (opts.people || []).forEach((p) => {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'aud-person';
      cb.checked = picked.indexOf(p.personId) !== -1 && p.allowed;
      cb.disabled = !p.allowed;
      cb.addEventListener('change', () => {
        const i = picked.indexOf(p.personId);
        if (cb.checked && i === -1) picked.push(p.personId);
        if (!cb.checked && i !== -1) picked.splice(i, 1);
      });
      const line = make('label', { className: 'check-row' + (p.allowed ? '' : ' disabled') });
      line.appendChild(cb);
      line.appendChild(make('span', { text: p.name + (p.hasEmail ? '' : '（沒有電郵）') }));
      pickBox.appendChild(line);
    });
    box.appendChild(pickBox);
    if (opts.allowEmails) {
      const ta = document.createElement('textarea');
      ta.className = 'aud-emails';
      ta.rows = 2;
      ta.placeholder = '另外輸入電郵（可以留空；多個用逗號分開）';
      ta.value = (sel.emails || []).join(', ');
      ta.addEventListener('input', () => { sel.emails = ta.value.split(/[,，;；\s]+/).map((x) => x.trim()).filter(Boolean); });
      box.appendChild(ta);
    }
    box.appendChild(row([button('更新收件人名單', () => onRefresh(sel), 'secondary')]));
    return box;
  }

  /** 季前資料、申報連結共用：② 列出收件人。 */
  function audienceListBox(title, names, emptyText) {
    const box = make('div', { className: 'sec' }, [sectionTitle(title)]);
    box.appendChild(make('div', { text: names.length ? names.join('、') : emptyText, className: names.length ? 'vio-row' : 'muted' }));
    return box;
  }

  /* ---------- 〔寄出季前資料〕 ---------- */

  function openPreseasonSend(sel) {
    runAction('讀取季前資料', async () => {
      const p = await callServer('apiPreseasonPreview', currentQuarterId, sel || null);
      const s = p.selection || { groups: [], personIds: [], emails: [] };
      const nodes = [
        // 第一百零一輪批次 ZE-3：窗最上面講明會寄出甚麼、不包括甚麼
        make('div', { className: 'warnbox' }, [
          make('div', { text: p.contentsLine || '', className: 'warn-head' }),
          make('div', { text: p.notIncludedLine || '' })
        ]),
        para(p.generateDate ? ('生成日是 ' + humanDate(p.generateDate) + '。') : '這一季沒有生成日期。', 'muted')
      ];
      nodes.push(renderAudiencePicker(p.audience, s, (next) => openPreseasonSend(next)));
      nodes.push(audienceListBox('② 收件人（' + (p.recipients || []).length + ' 位；同一地址只收一封）',
        (p.recipients || []).map((r) => r.displayName + '（' + r.why + '）'), '一位都沒有。'));
      if ((p.noEmail || []).length > 0) nodes.push(make('div', { text: '沒有電郵，收不到：' + p.noEmail.join('、'), className: 'err-text' }));
      (p.sections || []).forEach((sec) => {
        const box = make('details', { className: 'sec' });
        box.appendChild(make('summary', { text: sec.title }));
        (sec.lines || []).forEach((l) => box.appendChild(make('div', { text: '・' + l, className: 'vio-row' })));
        nodes.push(box);
      });
      if (p.sentRecord) {
        const sr = p.sentRecord;
        const modeOf = (m) => (m === 'AUTO' ? '自動' : '人手');
        nodes.push(para(sr.real
          ? '這一季已經在 ' + sr.real.date + ' 真正寄出過一次（' + modeOf(sr.real.mode) + '）；再寄會再收到一封。'
          : '這一季在 ' + sr.date + ' 只有模擬寄出（' + modeOf(sr.mode) + '），沒有真正寄出過；模擬不算已寄出。', 'muted'));
      }
      openModal('寄出季前資料：' + (p.quarterLabel || currentQuarterId), nodes, [
        button('寄出', () => runAction('寄出季前資料', async () => {
          const r = await callServerMutating('apiPreseasonSend', currentQuarterId, s);
          openModal('寄出季前資料', [make('div', {
            text: r.dryRun ? ('模擬 ' + r.simulated + ' 封（測試模式，沒有真正寄出）')
              : ('寄出 ' + r.sent + ' 封' + ((r.failed || []).length ? '，' + r.failed.length + ' 封失敗' : '')),
            className: 'ok-line'
          })], [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /* ---------- ZC-3〔寄出／匯出申報不能服侍日子連結〕 ---------- */

  // 按鈕名稱 UNAVAILABLE_LINK_BUTTON_LABEL 在 ScriptZone2.html（開季前準備那一行用；同一個全域只可以宣告一次）

  function openUnavailableInvite(sel) {
    runAction('讀取申報連結', async () => {
      const p = await callServer('apiUnavailableLinkPreview', currentQuarterId, sel || null);
      const s = p.selection || { groups: [], personIds: [], emails: [] };
      const nodes = [
        para('寄信給選了的人，請他們用自己的個人專屬連結，申報這一季哪些主日不能服侍。'
          + '沒有電郵的人，同時產生一份 Word 檔（每人一頁），讓你印出交給他們。', 'muted'),
        para('想先看看事奉人員會見到甚麼，可以用「進階與診斷 ▸ 預覽電郵範本」。', 'muted'),
        make('div', { className: 'sec' }, [sectionTitle('截止日'),
          make('div', { text: p.deadline ? humanDate(p.deadline) + '（生成日 ' + humanDate(p.generateDate) + ' 之前）'
            : '這一季沒有生成日期，信內會寫「生成日之前」。', className: 'vio-row' })])
      ];
      nodes.push(renderAudiencePicker(p.audience, s, (next) => openUnavailableInvite(next)));
      nodes.push(audienceListBox('② 會收到電郵（' + (p.recipientNames || []).length + ' 位）', p.recipientNames || [], '一位都沒有。'));
      nodes.push(audienceListBox('沒有電郵，會產生 Word 檔（' + (p.noEmail || []).length + ' 位）', p.noEmail || [], '沒有。'));
      if ((p.noLink || []).length > 0) {
        nodes.push(make('div', { text: '沒有個人專屬連結，不會寄、亦不會產生（先在「進階與診斷」〔補發個人專屬連結〕）：'
          + p.noLink.join('、'), className: 'err-text' }));
      }
      if (p.baseUrlMissing) nodes.push(make('div', { text: '還沒有設定事奉人員個人連結的網址，寄不出。請管理員先設定。', className: 'err-text' }));
      if (p.sentRecord) {
        const sr = p.sentRecord;
        nodes.push(para(sr.real ? '這一季已經在 ' + sr.real.date + ' 真正寄出過一次；再寄會再收到一封。'
          : '這一季在 ' + sr.date + ' 只有模擬寄出，沒有真正寄出過；模擬不算已寄出。', 'muted'));
      }
      openModal(UNAVAILABLE_LINK_BUTTON_LABEL + '：' + (p.quarterLabel || currentQuarterId), nodes, [
        button('寄出及匯出', () => runAction(UNAVAILABLE_LINK_BUTTON_LABEL, async () => {
          const r = await callServerMutating('apiUnavailableLinkSendAndExport', currentQuarterId, s);
          const done = [make('div', {
            text: r.dryRun ? ('電郵：模擬 ' + r.simulated + ' 封（測試模式，沒有真正寄出）')
              : ('電郵：寄出 ' + r.sent + ' 封' + ((r.failed || []).length ? '，' + r.failed.length + ' 封失敗' : '')),
            className: 'ok-line'
          })];
          if (r.paper && r.paper.fileUrl) {
            done.push(make('div', { text: 'Word 檔：' + r.paper.count + ' 位沒有電郵的人（每人一頁），存在這一季的 PDF 資料夾。', className: 'ok-line' }));
            const link = make('a', { text: '開啟／下載 Word 檔' + (r.paper.fileName ? '（' + r.paper.fileName + '）' : ''), className: 'bigLink' });
            link.href = r.paper.fileUrl;
            link.target = '_blank';
            link.rel = 'noopener';
            done.push(link);
          }
          openModal(UNAVAILABLE_LINK_BUTTON_LABEL, done, [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /** 舊入口〔沒有電郵的人：匯出邀請〕（深連結、舊按鈕）⇒ 轉到合併後的窗。 */
  function openInvitePaper() { openUnavailableInvite(); }

  /* ============================================================
   * 第一百零一輪批次 ZD 組：由試算表選單搬入的功能
   * ============================================================ */

  /** 一行「標籤：內容」。 */
  function z5Line(label, value, cls) {
    return make('div', { text: label + '：' + value, className: cls || 'vio-row' });
  }

  /* ---------- 自動排程 ---------- */

  function openAutomationStatus() {
    runAction('讀取自動排程狀態', async () => {
      const s = await callServer('apiGetAutomationStatus');
      const nodes = [
        z5Line('觸發器', s.installed ? ('已安裝（每日約 ' + s.hour + ':00 執行一次檢查）') : '未安裝（系統不會自己執行任何動作）', s.installed ? 'ok-line' : 'err-text'),
        z5Line('上次執行', s.lastRun ? (s.lastRun.at + '　' + (s.lastRun.ok ? '✔ ' : '✘ ') + s.lastRun.summary) : '還沒有紀錄'),
        z5Line('測試模式（DRY_RUN）', s.dryRun ? '開（不會真正寄信）' : '關（會真正寄信）')
      ];
      if (s.triggerError) nodes.push(make('div', { text: '讀不到觸發器：' + s.triggerError, className: 'err-text' }));
      nodes.push(sectionTitle('自動寄信時間表（未來兩季）'));
      (s.timetable || []).forEach((q) => {
        const box = make('div', { className: 'sec' }, [make('div', { text: q.quarterLabel + '（' + q.quarterId + '）', className: 'prop-head' })]);
        const table = make('table', { className: 'mine z5-table' });
        const head = make('tr');
        ['項目', '日期', '會寄給誰', '現時開／關'].forEach((h) => head.appendChild(make('th', { text: h })));
        table.appendChild(head);
        q.items.forEach((it) => {
          const tr = make('tr');
          [it.label, it.date, it.who, it.onOff].forEach((v) => tr.appendChild(make('td', { text: v })));
          table.appendChild(tr);
        });
        box.appendChild(table);
        nodes.push(box);
      });
      if ((s.timetable || []).length === 0) nodes.push(para('沒有未來的季度。', 'muted'));
      const daily = make('div', { className: 'sec' }, [sectionTitle('每日檢查還會做')]);
      (s.daily || []).forEach((d) => daily.appendChild(z5Line(d.label, d.who + '（現時' + d.onOff + '）')));
      nodes.push(daily);
      nodes.push(z5Line('時間表核對', s.reviewedAt ? ('已核對（' + s.reviewedAt + '）') : '還沒有核對', s.reviewedAt ? 'ok-line' : 'muted'));
      openModal('自動排程狀態', nodes, [
        button('我已核對時間表', () => runAction('記下核對日期', async () => {
          const r = await callServerMutating('apiMarkAutomationScheduleReviewed');
          setStatus(r.message);
          openAutomationStatus();
        }), ''),
        button('關閉', () => closeModal(), 'secondary')
      ]);
    });
  }

  function installAutomationNow() {
    openConfirm({
      title: '安裝自動排程',
      bodyNodes: [para('安裝之後，系統每日會自己檢查一次：按時間表自動寄季前資料、自動生成（如開了）、通知幹事。正式發出永遠要幹事親自按。'),
        para('按〔自動排程狀態〕可以看到每一項的日期、會寄給誰及現時開／關。', 'muted')],
      confirmLabel: '確定安裝',
      onConfirm: () => runAction('安裝自動排程', async () => {
        const r = await callServerMutating('apiInstallAutomation');
        openModal('安裝自動排程', [make('div', { text: r.message, className: 'ok-line' })], [button('知道了', () => closeModal(), '')]);
      })
    });
  }

  function removeAutomationNow() {
    openConfirm({
      title: '移除自動排程',
      bodyNodes: [para('移除之後，系統不會再自己執行任何動作（不會自動寄季前資料、不會通知幹事）。')],
      confirmLabel: '確定移除',
      danger: true,
      onConfirm: () => runAction('移除自動排程', async () => {
        const r = await callServerMutating('apiRemoveAutomation');
        openModal('移除自動排程', [make('div', { text: r.message, className: 'ok-line' })], [button('知道了', () => closeModal(), '')]);
      })
    });
  }

  /* ---------- ZG〔上線前檢查〕 ---------- */

  function openPreLaunchCheck() {
    runAction('上線前檢查', async () => {
      const r = await callServer('apiGetPreLaunchCheck');
      const nodes = [make('div', { text: r.okCount + ' / ' + r.total + ' 項已完成', className: r.okCount === r.total ? 'ok-line strong' : 'warnbox' })];
      const table = make('table', { className: 'mine z5-table' });
      const head = make('tr');
      ['', '項目', '現時', '去哪裏改'].forEach((h) => head.appendChild(make('th', { text: h })));
      table.appendChild(head);
      r.items.forEach((it) => {
        const tr = make('tr');
        [it.ok ? '✔' : '✘', it.label, it.value, it.where].forEach((v) => tr.appendChild(make('td', { text: v })));
        table.appendChild(tr);
      });
      nodes.push(table);
      nodes.push(para('這裏只看，不會改動任何東西。', 'muted'));
      openModal('上線前檢查', nodes, [button('關閉', () => closeModal(), '')]);
    });
  }

  /* ---------- 個人專屬連結 ---------- */

  function openPersonalLinkTools() {
    runAction('讀取個人專屬連結', async () => {
      const d = await callServer('apiGetPersonalLinkTools');
      const nodes = [];
      const seed = make('div', { className: 'sec' }, [sectionTitle('補發個人專屬連結（新人）')]);
      seed.appendChild(para(d.missing.length ? ('還沒有個人專屬連結：' + d.missing.map((p) => p.nameTC).join('、'))
        : '每一位都已經有個人專屬連結。', d.missing.length ? '' : 'muted'));
      if (d.missing.length) {
        seed.appendChild(row([button('補發個人專屬連結', () => runAction('補發個人專屬連結', async () => {
          const r = await callServerMutating('apiSeedPersonalLinkTokens');
          setStatus(r.message);
          openPersonalLinkTools();
        }), '')]));
      }
      nodes.push(seed);
      const re = make('div', { className: 'sec' }, [sectionTitle('重新產生某人的個人連結（外洩時用）')]);
      re.appendChild(para('舊連結會即時失效，之後要把新連結交給他本人。', 'muted'));
      const sel = document.createElement('select');
      d.people.forEach((p) => {
        const o = document.createElement('option');
        o.value = p.personId;
        o.textContent = p.nameTC + (p.hasLink ? '' : '（還沒有連結）');
        sel.appendChild(o);
      });
      re.appendChild(make('div', { className: 'prop-head' }, [make('span', { text: '誰' }), sel]));
      re.appendChild(row([button('重新產生某人的個人連結', () => {
        const name = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
        openConfirm({
          title: '重新產生 ' + name + ' 的個人連結',
          bodyNodes: [para('舊連結會即時失效（他手上舊電郵內的連結會打不開）。'), para('只在連結外洩時才用。', 'muted')],
          requireTyping: true,
          typingPhrase: d.confirmText,
          confirmLabel: '確定重新產生',
          danger: true,
          onConfirm: (typed) => runAction('重新產生個人連結', async () => {
            const r = await callServerMutating('apiReissuePersonalLinkToken', sel.value, typed, currentQuarterId);
            const done = [make('div', { text: r.message, className: 'ok-line' })];
            if (r.newUrl) done.push(make('div', { text: r.newUrl, className: 'z5-text' }));
            openModal('重新產生某人的個人連結', done, [button('知道了', () => closeModal(), '')]);
          })
        });
      }, 'danger')]));
      nodes.push(re);
      openModal('個人專屬連結', nodes, [button('關閉', () => closeModal(), 'secondary')]);
    });
  }

  /* ---------- 補建設定及範本 ---------- */

  function openSeedConfigAndTemplates() {
    runAction('檢查設定及範本', async () => {
      const p = await callServer('apiPlanSeedConfigAndTemplates');
      const outOrder = p.postsOutputOrder || [];
      const total = p.configMissing.length + p.templatesMissing.length + outOrder.length;
      const nodes = [para('只新增缺少的設定行及電郵範本，不會改動任何現有的行。新加的設定是預設值。')];
      nodes.push(audienceListBox('缺少的設定（' + p.configMissing.length + ' 行）',
        p.configMissing.map((c) => c.key + '＝' + (c.defaultValue || '（空白）')), '沒有。'));
      nodes.push(audienceListBox('缺少的電郵範本（' + p.templatesMissing.length + ' 個）', p.templatesMissing, '沒有。'));
      // 第一百零二輪批次 OA 組：Posts.OutputOrder（寄出／公開職事表的崗位次序）
      if (outOrder.length) nodes.push(audienceListBox('寄出／公開職事表的崗位次序（Posts 的 OutputOrder 欄，會新增並填好）', outOrder, ''));
      openModal('補建設定及範本', nodes, total === 0 ? [button('知道了', () => closeModal(), '')] : [
        button('補建', () => runAction('補建設定及範本', async () => {
          const r = await callServerMutating('apiSeedConfigAndTemplates');
          openModal('補建設定及範本', [make('div', { text: r.message, className: 'ok-line' }),
            para((r.configAdded || []).concat(r.templatesAdded || []).join('、'), 'muted')], [button('知道了', () => closeModal(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /* ---------- 上線切換／回到測試模式（只限可以修改的人） ---------- */

  function openGoLive(rollback) {
    runAction('讀取上線狀態', async () => {
      const p = await callServer('apiGoLivePlan', currentQuarterId);
      const nodes = [z5Line('現時', p.state.description, 'prop-head')];
      if (!rollback) {
        if (p.readinessError) nodes.push(make('div', { text: '全面體檢失敗：' + p.readinessError, className: 'err-text' }));
        else if (p.readiness && !p.readiness.ok) {
          const box = make('div', { className: 'vio vio-hard' }, [make('div', { text: '全面體檢有 ' + p.readiness.mustCount + ' 項「必須處理」，不可以上線：', className: 'vio-head' })]);
          p.readiness.mustItems.forEach((i) => box.appendChild(make('div', { text: '・' + i.section + '：' + i.label + '——' + i.summary, className: 'vio-row' })));
          nodes.push(box);
        } else if (p.readiness) {
          nodes.push(make('div', { text: '全面體檢：沒有「必須處理」項目（建議處理 ' + p.readiness.shouldCount + ' 項）。', className: 'ok-line' }));
        }
        nodes.push(para('上線會：清空主旨前綴，然後把 DRY_RUN 改為 FALSE（風險最高的一步排最後）。之後寄出的信會真正寄出。', 'strong'));
      } else {
        nodes.push(para('回到測試模式會：先把 DRY_RUN 改為 TRUE（立即停止真正寄信），再放回主旨前綴「' + p.testPrefix + '」。已經寄出的信收不回來。', 'strong'));
      }
      const blocked = !rollback && (!p.readiness || !p.readiness.ok);
      const go = button(rollback ? '回到測試模式' : '上線切換', () => openConfirm({
        title: rollback ? '回到測試模式' : '上線切換',
        bodyNodes: [para(rollback ? '確定要回到測試模式嗎？' : '確定要上線嗎？上線之後，系統會真正寄出電郵。')],
        requireTyping: true,
        typingPhrase: rollback ? p.rollbackConfirmText : p.confirmText,
        confirmLabel: rollback ? '確定回到測試模式' : '確定上線',
        danger: !rollback,
        onConfirm: (typed) => runAction(rollback ? '回到測試模式' : '上線切換', async () => {
          const r = rollback ? await callServerMutating('apiGoLiveRollback', typed) : await callServerMutating('apiGoLiveExecute', currentQuarterId, typed);
          openModal(rollback ? '回到測試模式' : '上線切換', [make('div', { text: r.message, className: 'ok-line' }),
            para((r.done || []).join('；'), 'muted')], [button('完成', () => refreshLikeButton(), '')]);
        })
      }), rollback ? '' : 'danger');
      if (blocked) { go.disabled = true; go.title = '全面體檢有「必須處理」項目'; }
      openModal(rollback ? '回到測試模式' : '上線切換', nodes, [go, button('取消', () => closeModal(), 'secondary')]);
    });
  }

  /* ---------- 〔使用權限〕 ---------- */

  function openPermissions() {
    runAction('讀取使用權限', async () => {
      const p = await callServer('apiGetPermissions');
      const fields = {};
      const nodes = [para('每行一個電郵。改完按〔儲存〕；每一項改動都會記錄。不可以把自己從「可以修改」移走。', 'muted')];
      const area = (key, title, list) => {
        const ta = document.createElement('textarea');
        ta.className = 'perm-' + key;
        ta.rows = Math.max(2, list.length + 1);
        ta.value = list.join('\n');
        fields[key] = ta;
        nodes.push(make('div', { className: 'sec' }, [sectionTitle(title), make('div', { text: p.text[key], className: 'muted' }), ta]));
      };
      area('editors', '可以修改的人（WEBAPP_ALLOWED_EMAILS）', p.editors);
      area('viewers', '只可查看的人（WEBAPP_VIEWER_EMAILS）', p.viewers);
      area('confirmers', '確認申報的人（UNAVAILABLE_CONFIRMER_EMAILS）', p.confirmers);
      area('adminNotify', '幹事通知電郵（MAIL_ADMIN_NOTIFY）', p.adminNotify);
      const rolloutSel = document.createElement('select');
      [['LEADERS', '只開放給堂委、執事及幹事（第一階段）'], ['ALL', '全部事奉人員']].forEach(([v, t]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = t; o.selected = p.rollout === v;
        rolloutSel.appendChild(o);
      });
      nodes.push(make('div', { className: 'sec' }, [sectionTitle('開放範圍（ROLLOUT_AUDIENCE）'), make('div', { text: p.text.rollout, className: 'muted' }), rolloutSel]));
      const roles = make('div', { className: 'sec' }, [sectionTitle('現任堂委、執事（只看）')]);
      roles.appendChild(z5Line('堂委（' + p.committee.length + ' 位）', p.committee.join('、') || '沒有'));
      roles.appendChild(z5Line('執事（' + p.deacon.length + ' 位）', p.deacon.join('、') || '沒有'));
      roles.appendChild(row([button('身分設定', () => openRoles(''), 'secondary')]));
      nodes.push(roles);
      const lines = (ta) => ta.value.split(/[\n,，;；\s]+/).map((s) => s.trim()).filter(Boolean);
      openModal('使用權限', nodes, [
        button('儲存', () => runAction('儲存使用權限', async () => {
          const r = await callServerMutating('apiSavePermissions', {
            editors: lines(fields.editors), viewers: lines(fields.viewers), confirmers: lines(fields.confirmers),
            adminNotify: lines(fields.adminNotify), rollout: rolloutSel.value
          });
          openModal('使用權限', [make('div', { text: r.message, className: 'ok-line' }), para((r.changes || []).join('\n'), 'lines')],
            [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }
</script>
