<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><?= data.quarterId ?> 職事表</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --border: #d0d7de;
    --header: #d9ead3;
    --skipped: #efefef;
    --special: #d9d2e9;
    --gap: #f4cccc;
    --highlight: #ffd54f;
    --highlight-fg: #3e2c00;
  }
  /* 第十一輪批次階段 D3：呢個頁面預設淺色，唔跟裝置嘅深色模式自動切換
     ——事奉人員多數用手機睇，淺色較適合閱讀，亦較接近印出嚟嘅職事表。
     只有幹事介面（ui/Style.html）先會跟裝置嘅深色模式設定自動切換，
     呢度一定要事奉人員自己撳掣先會轉深色。 */
  :root[data-theme="dark"] {
    --bg: #16181d;
    --fg: #e6edf3;
    --muted: #9198a1;
    --border: #30363d;
    --header: #24402a;
    --skipped: #24272e;
    --special: #3a2f52;
    --gap: #5c2b2b;
    --highlight: #b8860b;
    --highlight-fg: #1a1200;
  }

  * { box-sizing: border-box; }

  /* 第一百零一輪批次 ZF 組：很多長者使用 ⇒ 正文預設約 20px（「大」），可切換「特大」（24px）。
     其餘字號一律用 em 跟着正文放大；職事表表格至少 16px（0.8em）。 */
  :root { --fs: 20px; }
  :root[data-font="xl"] { --fs: 24px; }

  body {
    margin: 0;
    padding: 16px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    font-size: var(--fs);
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .toolbar .title-block { flex: 1 1 260px; min-width: 0; }
  .toolbar .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 頁頂「某某 專屬連結」：獨立一行大標題，人名粗體，約 32px */
  h1.person-title { font-size: 1.6em; line-height: 1.25; margin: 0 0 6px; font-weight: 400; }
  h1.person-title strong { font-weight: 800; }
  .subtitle { color: var(--muted); font-size: 0.9em; margin: 0; }

  button.theme-toggle, button.font-toggle {
    font: inherit;
    font-size: 0.85em;
    min-height: 48px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    white-space: nowrap;
  }

  .schedule {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .schedule h2 { font-size: 1.2em; margin: 0 0 8px; }
  .schedule ul { margin: 0; padding-left: 1.2em; font-size: 1em; }
  .schedule p { margin: 0; font-size: 1em; color: var(--muted); }

  /* 手機上表格在自己的框內左右捲動，整頁不會左右捲動 */
  .scroll { overflow-x: auto; max-width: 100%; margin-bottom: 14px; }
  table { border-collapse: collapse; font-size: 0.8em; }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 9px;
    text-align: center;
    white-space: nowrap;
    overflow-wrap: normal;
  }
  thead th { background: var(--header); position: sticky; top: 0; z-index: 1; }
  .special-note { display: block; font-size: 1em; color: var(--muted); font-weight: normal; }
  /* 第十二輪批次階段 A5：崗位在左（第一欄）、日期在頂，橫向捲動時第一欄
     （崗位名稱）用 sticky 定位保持喺畫面左邊，事奉人員用手機睇 13 週嘅表都
     唔會捲走咗先前對照緊嘅崗位。左上角個 <th>（崗位標題）要同時 sticky
     top＋left、z-index 要比其他 sticky 都高，先唔會俾兩邊嘅 sticky 元素
     蓋過。 */
  th.post-col, td.post-col {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--bg);
    text-align: left;
    font-weight: 700;
  }
  thead th.post-col { background: var(--header); z-index: 2; }
  td.mine {
    background: var(--highlight) !important;
    color: var(--highlight-fg);
    font-weight: 700;
  }

  .legend { font-size: 1em; margin-bottom: 14px; max-width: 100%; overflow-x: auto; }
  .legend table { width: auto; }

  .footer-note { font-size: 0.85em; color: var(--muted); font-style: italic; margin-bottom: 14px; }

  .how-to {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    font-size: 0.9em;
    color: var(--muted);
  }
  .how-to strong { color: var(--fg); }

  .updated { font-size: 0.85em; color: var(--muted); margin-top: 16px; }

  /* 第九十輪批次 QC 組：申報不能服侍的日子（第一百零一輪批次 ZF 組：全部放大，按鈕最少 48px 高） */
  .unav {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 1em;
  }
  .unav h2 { font-size: 1.2em; margin: 0 0 8px; }
  .unav h3 { font-size: 1.05em; margin: 12px 0 4px; }
  .unav .muted { color: var(--muted); }
  .unav label { display: block; padding: 6px 0; }
  .unav label.off { color: var(--muted); }
  .unav input[type="radio"], .unav input[type="checkbox"] { width: 1.3em; height: 1.3em; vertical-align: middle; margin-right: 6px; }
  .unav input[type="text"] { font: inherit; width: 100%; max-width: 520px; min-height: 48px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--fg); }
  .unav button { font: inherit; min-height: 48px; padding: 8px 20px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--header); color: var(--fg); cursor: pointer; }
  .unav button.link { background: transparent; border: none; min-height: 0; padding: 0 0 0 8px; margin: 0; text-decoration: underline; }
  .unav .sub-row { padding: 3px 0; }
  .unav .unav-msg { font-weight: 700; margin: 0 0 8px; }
  .unav .unav-msg.err { color: #b42318; }
  .unav .closed-note { font-weight: 700; margin: 4px 0; }
  /* 第九十四輪批次 UA 組：逐個主日的方格（手機友善：自動換行、不會橫向捲動；方格最少 52px 高，手指按得到） */
  .unav .q-block { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 10px; }
  /* 第一百零五輪批次 RB 組：〔我這一季沒有不能服侍的日子〕 */
  .unav .none-reply { margin: 6px 0 10px; }
  .unav button.none-btn { margin: 0; min-height: 48px; padding: 8px 14px; }
  .unav .month-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin: 10px 0; }
  .unav .month-label { flex: 0 0 3.4em; font-weight: 700; padding-top: 12px; }
  .unav .tiles { flex: 1 1 180px; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .unav button.tile { min-width: 76px; min-height: 52px; margin: 0; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); line-height: 1.2; }
  .unav button.tile.on { background: #1a7f37; border-color: #1a7f37; color: #ffffff; font-weight: 700; }
  .unav button.tile.done { background: var(--skipped); color: var(--muted); cursor: not-allowed; }
  .unav .tile-note { display: block; font-size: 0.75em; font-weight: normal; }
  .unav button.all-month { margin: 0; min-height: 48px; padding: 8px 14px; font-size: 0.9em; background: transparent; }
  .unav .scope label { display: block; padding: 8px 0; }
  .unav .posts-box { padding-left: 1.4em; }
  .unav .posts-box label { display: inline-block; padding: 8px 14px 8px 0; }
  .unav .hint { color: var(--muted); font-size: 0.9em; margin: 6px 0; }
  .unav .hint.err { color: #b42318; }
  .unav table.mine { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 6px; }
  .unav table.mine th, .unav table.mine td { white-space: normal; word-break: break-word; text-align: left;
    font-size: 0.85em; padding: 6px 8px; }
  .unav button:disabled { opacity: 0.55; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="title-block">
      <h1 class="person-title"><strong><?= data.personName ?></strong> 專屬連結</h1>
      <p class="subtitle"><?= data.quarterId ?> 職事表——這條連結不會改變，之後排表有任何更新，重新打開就會看到最新內容。</p>
    </div>
    <div class="tools">
      <button class="font-toggle" id="fontToggleBtn" type="button">字體：大</button>
      <button class="theme-toggle" id="themeToggleBtn" type="button">🌙 深色</button>
    </div>
  </div>

  <? if (data.noRoster) { ?>
  <div class="schedule">
    <h2>你的服侍安排</h2>
    <p>這一季的職事表還未發出。</p>
  </div>
  <? } else { ?>
  <div class="schedule">
    <h2>你的服侍安排</h2>
    <? if (data.mySchedule.length === 0) { ?>
      <p>本季你暫時沒有任何服侍安排。</p>
    <? } else { ?>
      <ul>
        <? data.mySchedule.forEach(function (item) { ?>
          <li><?= item.serviceDate ?>　<?= item.postNameTC ?></li>
        <? }); ?>
      </ul>
    <? } ?>
  </div>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th class="post-col" rowspan="2"><?= GRID_LABELS.POST_COLUMN ?></th>
          <? data.monthGroups.forEach(function (g) { ?>
            <th colspan="<?= g.span ?>"><?= g.label ?></th>
          <? }); ?>
        </tr>
        <tr>
          <? data.dateColumns.forEach(function (dc) { ?>
            <th><?= dc.dayLabel ?><? if (dc.specialTitle) { ?><span class="special-note"><?= dc.specialTitle ?></span><? } ?></th>
          <? }); ?>
        </tr>
      </thead>
      <tbody>
        <? data.postRows.forEach(function (pr) { ?>
          <tr>
            <? if (pr.isFirstSlot) { ?>
              <th class="post-col" rowspan="<?= pr.slotCount ?>"><?= pr.postNameTC ?></th>
            <? } ?>
            <? pr.cells.forEach(function (cell) { ?>
              <td<?!= cell.mine ? ' class="mine"' : (cell.background ? ' style="background:' + cell.background + '"' : '') ?>><?= cell.text ?></td>
            <? }); ?>
          </tr>
        <? }); ?>
      </tbody>
    </table>
  </div>

  <? if (data.legendRows.length > 0) { ?>
    <div class="legend">
      <table>
        <? data.legendRows.forEach(function (row) { ?>
          <tr><td><?= row[0] ?></td><td><?= row[1] ?></td><td><?= row[2] ?></td></tr>
        <? }); ?>
      </table>
    </div>
  <? } ?>

  <? if (data.footerNote) { ?>
    <p class="footer-note"><?= data.footerNote ?></p>
  <? } ?>
  <? } ?>

  <!-- 第九十輪批次 QC 組：申報不能服侍的日子（只可以呼叫 personalSubmitUnavailable／personalWithdrawUnavailable；
       第一百零五輪批次 RB 組加 personalReplyNoUnavailable） -->
  <div class="unav" id="unavSection">
    <h2>申報不能服侍的日子</h2>
    <div id="unavBody"><p class="muted">載入中……</p></div>
  </div>

  <div class="how-to">
    <p><strong>如果這一週不能服侍：</strong><span id="howToDeclare">還未排表的主日，可以在上面「申報不能服侍的日子」申報，幹事或堂委確認後生效；已經排了你的那一週，請直接聯絡幹事安排調動，不要自行更改試算表內容。</span></p>
  </div>

  <p class="updated">最後更新：<?= data.updatedAt ?>（此連結長期有效，之後排表更新會自動反映在這裏）</p>

  <script>
    // 第九十輪批次 QC 組：申報不能服侍的日子。起始資料由伺服器端放入（只有這個人自己的資料）；
    // 提交／撤回只呼叫 personalSubmitUnavailable／personalWithdrawUnavailable，伺服器端每次重新用 token 認人。
    var UNAV_BOOT = <?!= data.unavailableJson ?>;
    (function () {
      var boot = UNAV_BOOT || {};
      var token = boot.token || '';
      var quarterId = boot.quarterId || '';
      var body = document.getElementById('unavBody');
      var busy = false;

      function el(tag, text, cls) {
        var n = document.createElement(tag);
        if (text) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      }

      function call(fnName, args, view) {
        if (busy) return;
        busy = true;
        render(view, '處理中……', false);
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            busy = false;
            if (res && res.closed) { renderClosed(res.message); return; }   // 第一百零一輪批次 ZE-2
            render((res && res.view) || view, (res && res.message) || '', !(res && res.ok));
          })
          .withFailureHandler(function (err) {
            busy = false;
            render(view, (err && err.message) || '未能完成，請稍後再試，或者聯絡幹事。', true);
          });
        if (fnName === 'submit') runner.personalSubmitUnavailable(token, quarterId, args[0], args[1], args[2]);
        else if (fnName === 'none') runner.personalReplyNoUnavailable(token, quarterId, args[0], args[1]);
        else runner.personalWithdrawUnavailable(token, quarterId, args[0]);
      }

      var DONE_NOTE = { PENDING: '等候確認', ACCEPTED: '已確認', LISTED: '已在不能服侍名單' };

      // 第九十四輪批次 UA 組：一季一個區塊——主日按月份分行（方格，按一下選取、再按取消；每行「全選這個月」），
      // 下面揀「全部崗位」或「只限以下崗位」（只列這個人這一季可以服侍的崗位），原因，〔提交〕。
      // 第一百零五輪批次 RB 組：〔我這一季沒有不能服侍的日子〕——按了顯示「你已回覆」，可以〔取消〕改回
      function renderNoneReply(q, view, block) {
        var box = el('div', '', 'none-reply');
        if (q.noneReplied) {
          box.appendChild(el('span', '你已回覆：這一季沒有不能服侍的日子。'));
          var undo = el('button', '取消', 'link');
          undo.type = 'button';
          undo.addEventListener('click', function () { call('none', [q.quarterId, false], view); });
          box.appendChild(undo);
        } else {
          var none = el('button', '我這一季沒有不能服侍的日子', 'none-btn');
          none.type = 'button';
          none.addEventListener('click', function () { call('none', [q.quarterId, true], view); });
          box.appendChild(none);
        }
        block.appendChild(box);
      }

      function renderQuarter(q, view) {
        var block = el('div', '', 'q-block');
        block.appendChild(el('h3', q.label + (q.deadline ? '（請在 ' + q.deadline + ' 之前申報）' : '')));
        renderNoneReply(q, view, block);
        var chosen = {};
        var tiles = [];
        var months = [];
        var byMonth = {};
        q.dates.forEach(function (d) {
          var key = d.serviceDate.slice(0, 7);
          if (!byMonth[key]) { byMonth[key] = []; months.push(key); }
          byMonth[key].push(d);
        });
        function paintTile(t) {
          var on = !!chosen[t.date];
          t.btn.className = 'tile' + (on ? ' on' : '');
          t.btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          t.label.textContent = (on ? '✓ ' : '') + t.text;
        }
        months.forEach(function (key) {
          var rowEl = el('div', '', 'month-row');
          rowEl.appendChild(el('div', Number(key.slice(5, 7)) + ' 月', 'month-label'));
          var box = el('div', '', 'tiles');
          var mine = [];
          byMonth[key].forEach(function (d) {
            var btn = el('button', '', 'tile');
            btn.type = 'button';
            var text = Number(d.serviceDate.slice(5, 7)) + '/' + Number(d.serviceDate.slice(8, 10));
            var label = el('span', text);
            btn.appendChild(label);
            if (d.status) {
              btn.className = 'tile done';
              btn.disabled = true;
              btn.appendChild(el('span', DONE_NOTE[d.status] || '', 'tile-note'));
            } else {
              var t = { date: d.serviceDate, btn: btn, label: label, text: text };
              btn.addEventListener('click', function () { chosen[t.date] = !chosen[t.date]; paintTile(t); refresh(); });
              tiles.push(t);
              mine.push(t);
              paintTile(t);
            }
            box.appendChild(btn);
          });
          rowEl.appendChild(box);
          if (mine.length > 0) {
            var all = el('button', '全選這個月', 'all-month');
            all.type = 'button';
            all.addEventListener('click', function () {
              var every = mine.every(function (t) { return chosen[t.date]; });
              mine.forEach(function (t) { chosen[t.date] = !every; paintTile(t); });
              refresh();
            });
            rowEl.appendChild(all);
          }
          block.appendChild(rowEl);
        });
        if (tiles.length === 0) {
          block.appendChild(el('p', '這一季可以申報的主日都已經申報了。', 'muted'));
          return block;
        }
        // 這些日子不能服侍：● 全部崗位（預設）○ 只限以下崗位
        var scope = el('div', '', 'scope');
        scope.appendChild(el('div', '這些日子不能服侍：'));
        var name = 'scope-' + q.quarterId;
        function radio(value, text, checked) {
          var lab = el('label');
          var r = document.createElement('input');
          r.type = 'radio';
          r.name = name;
          r.value = value;
          r.checked = checked;
          lab.appendChild(r);
          lab.appendChild(document.createTextNode(' ' + text));
          scope.appendChild(lab);
          return r;
        }
        var rAll = radio('ALL', '全部崗位', true);
        var rPosts = (q.posts || []).length > 0 ? radio('POSTS', '只限以下崗位', false) : null;
        var postsBox = el('div', '', 'posts-box');
        postsBox.hidden = true;
        var postChecks = [];
        (q.posts || []).forEach(function (p) {
          var lab = el('label');
          var c = document.createElement('input');
          c.type = 'checkbox';
          c.value = p.postId;
          c.addEventListener('change', refresh);
          lab.appendChild(c);
          lab.appendChild(document.createTextNode(' ' + p.postNameTC));
          postsBox.appendChild(lab);
          postChecks.push(c);
        });
        scope.appendChild(postsBox);
        rAll.addEventListener('change', refresh);
        if (rPosts) rPosts.addEventListener('change', refresh);
        block.appendChild(scope);
        var reason = document.createElement('input');
        reason.type = 'text';
        reason.maxLength = view.maxReason;
        reason.placeholder = '原因（可以留空，最多 ' + view.maxReason + ' 字）';
        block.appendChild(reason);
        var hint = el('p', '', 'hint');
        block.appendChild(hint);
        var submit = el('button', '提交');
        submit.type = 'button';
        block.appendChild(el('div')).appendChild(submit);
        function selectedDates() { return tiles.filter(function (t) { return chosen[t.date]; }).map(function (t) { return t.date; }); }
        function selectedPosts() { return postChecks.filter(function (c) { return c.checked; }).map(function (c) { return c.value; }); }
        function onlyPosts() { return !!(rPosts && rPosts.checked); }
        function refresh() {
          postsBox.hidden = !onlyPosts();
          var n = selectedDates().length;
          if (onlyPosts() && selectedPosts().length === 0) {
            submit.disabled = true;
            hint.className = 'hint err';
            hint.textContent = '請最少選一個崗位，或選「全部崗位」';
          } else {
            submit.disabled = n === 0;
            hint.className = 'hint';
            hint.textContent = n === 0 ? '先按上面的日子選取。' : '已選 ' + n + ' 個日子。';
          }
        }
        submit.addEventListener('click', function () {
          var dates = selectedDates();
          if (dates.length === 0) return;
          if (dates.length > view.maxDates) { hint.className = 'hint err'; hint.textContent = '每次最多可以提交 ' + view.maxDates + ' 個日子，請分開提交。'; return; }
          var posts = onlyPosts() ? selectedPosts() : [];
          if (onlyPosts() && posts.length === 0) return;
          call('submit', [dates, reason.value, posts], view);
        });
        refresh();
        return block;
      }

      // 頁底「我已申報的日子」：主日、崗位、原因、狀態；等候確認的才可以〔撤回〕
      function renderMine(view) {
        body.appendChild(el('h3', '我已申報的日子'));
        if (view.submissions.length === 0) { body.appendChild(el('p', '還沒有申報。', 'muted')); return; }
        var table = el('table', '', 'mine');
        var head = el('tr');
        ['主日', '崗位', '原因', '狀態'].forEach(function (h) { head.appendChild(el('th', h)); });
        table.appendChild(head);
        view.submissions.forEach(function (s) {
          var tr = el('tr');
          tr.appendChild(el('td', s.label));
          tr.appendChild(el('td', s.postsText || '全部崗位'));
          tr.appendChild(el('td', s.reason || ''));
          var st = el('td', s.statusText + (s.late ? '（截止日之後）' : ''));
          if (s.canWithdraw) {
            var w = el('button', '撤回', 'link');
            w.type = 'button';
            w.addEventListener('click', function () { call('withdraw', [s.submissionId], view); });
            st.appendChild(w);
          } else if (s.status === 'ACCEPTED') {
            st.appendChild(el('div', '如需取消，請聯絡幹事', 'muted'));
          }
          tr.appendChild(st);
          table.appendChild(tr);
        });
        body.appendChild(table);
      }

      function render(view, msg, isErr) {
        body.innerHTML = '';
        if (msg) body.appendChild(el('p', msg, 'unav-msg' + (isErr ? ' err' : '')));
        if (!view) {
          body.appendChild(el('p', boot.error || '暫時未能申報，請聯絡幹事。', 'muted'));
          return;
        }
        if (view.quarters.length === 0) {
          body.appendChild(el('p', '現在沒有可以申報的主日。', 'muted'));
        } else {
          body.appendChild(el('p', '按一下你不能服侍的主日（再按一下取消），選擇崗位，可以填原因，然後按〔提交〕。幹事或堂委確認之後才會生效。', 'muted'));
          body.appendChild(el('p', '不同日子不能服侍的崗位不同？請分開兩次提交。', 'muted'));
          view.quarters.forEach(function (q) { body.appendChild(renderQuarter(q, view)); });
        }
        renderMine(view);
      }

      // 第一百零一輪批次 ZE-2：第一階段只開放給堂委、執事及幹事——其他人只看到一句，下面的提示一併改寫
      function renderClosed(text) {
        body.innerHTML = '';
        body.appendChild(el('p', text || boot.closedText || '', 'closed-note'));
        var how = document.getElementById('howToDeclare');
        if (how) how.textContent = '已經排了你的那一週，如不能服侍，請直接聯絡幹事安排調動。';
      }

      if (boot.closed) renderClosed(boot.closedText);
      else render(boot.view, '', false);
    })();

    // 第十一輪批次階段 D：只用 localStorage，完全冇任何伺服器端腳本呼叫
    // ——呢個頁面係 access=ANYONE 部署、匿名訪客都打得開，唔應該有任何
    // 伺服器往返嘅路徑（連讀取偏好都唔應該有），亦冇「呢個訪客係邊個」
    // 嘅身分可以將偏好存喺伺服器端（UserProperties 係跟 Google 帳戶行嘅，
    // 匿名訪客冇對應嘅帳戶）。localStorage 讀寫失敗（例如瀏覽器封鎖）就
    // 靜靜維持預設淺色，唔會令頁面壞晒。
    (function () {
      var STORAGE_KEY = 'hwcRosterTheme';
      var btn = document.getElementById('themeToggleBtn');
      var root = document.documentElement;

      function applyTheme(theme) {
        if (theme === 'dark') {
          root.setAttribute('data-theme', 'dark');
          btn.textContent = '☀️ 淺色';
        } else {
          root.removeAttribute('data-theme');
          btn.textContent = '🌙 深色';
        }
      }

      var stored = null;
      try { stored = window.localStorage.getItem(STORAGE_KEY); } catch (err) { stored = null; }
      applyTheme(stored === 'dark' ? 'dark' : 'light');

      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { window.localStorage.setItem(STORAGE_KEY, next); } catch (err) { /* 靜靜失敗 */ }
      });
    })();

    // 第一百零一輪批次 ZF 組：〔字體：大／特大〕切換。記在 localStorage（讀寫都包 try/catch）；讀不到就用「大」。
    (function () {
      var FONT_KEY = 'hwcRosterFont';
      var btn = document.getElementById('fontToggleBtn');
      var root = document.documentElement;
      function applyFont(size) {
        if (size === 'xl') { root.setAttribute('data-font', 'xl'); btn.textContent = '字體：特大'; }
        else { root.removeAttribute('data-font'); btn.textContent = '字體：大'; }
      }
      var stored = null;
      try { stored = window.localStorage.getItem(FONT_KEY); } catch (err) { stored = null; }
      applyFont(stored === 'xl' ? 'xl' : 'large');
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-font') === 'xl' ? 'large' : 'xl';
        applyFont(next);
        try { window.localStorage.setItem(FONT_KEY, next); } catch (err) { /* 靜靜失敗 */ }
      });
    })();
  </script>
</body>
</html>
