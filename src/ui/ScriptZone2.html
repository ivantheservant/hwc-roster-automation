<script>
  /* ============================================================
   * 第二十四輪批次階段 F：區二——開季前準備
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第三節。
   *
   * 三個畫面：確認特別主日／填講員翻譯獻花／名單檢查（唯讀）。
   * 五項未做完**唔阻擋任何一粒掣**——只係「表會有空格」嘅提醒。
   */

  // ⚠️ 第二十五輪批次階段 A：呢度本來有個 `zone2Loaded`，
  // 而 `wireZoneToggle()` 內部另外有個 `loaded`——**同一個狀態兩個旗標**，
  // 換季度只重設咗其中一個，結果區二一直顯示上一個季度嘅數字。
  //
  // 而家「呢個區載入咗未」統一由 `Script.html` 嘅 `zoneLoadState` 保管，
  // **呢個檔案唔可以再自己開一個旗標**。要重新載入就叫 `markZoneNeedsReload()`。

  /** 區頭嘅「還有 N 項未做」。N=0 時整區收摺。 */
  function renderZone2Head(d) {
    const pq = d.preQuarter || { undoneItemCount: 0, items: [] };
    const countNode = el('zone2Count');

    if (pq.undoneItemCount < 0) {
      // 後端算唔到。**唔可以顯示「全部做好了」**——嗰個等於話「檢查過冇問題」。
      countNode.textContent = '（暫時查不到）';
      countNode.className = 'zone-count warn';
      setZoneOpen('zone2Head', 'zone2Body', true);
      markZoneLoaded('zone2Body');
    } else if (pq.undoneItemCount === 0) {
      countNode.textContent = '全部做好了';
      countNode.className = 'zone-count ok';
      // ⚠️ 第四十三輪批次 H 組：Ivan 要求呢一組**預設展開**。
      // 佢每一季第一件做嘅事就係呢度（改名單、標特別主日）——
      // 「全部做好咗」唔等於「唔使再開」，佢仍然會入嚟改名單。
      setZoneOpen('zone2Head', 'zone2Body', true);
      markZoneLoaded('zone2Body');
    } else {
      countNode.textContent = '還有 ' + pq.undoneItemCount + ' 項未做';
      countNode.className = 'zone-count warn';
      setZoneOpen('zone2Head', 'zone2Body', true);
      // `setZoneOpen()` 係直接開，唔會行 `wireZoneToggle()` 嗰條路，
      // 所以要自己標記「已載入」——用同一個 zoneLoadState，唔可以另開旗標。
      markZoneLoaded('zone2Body');
    }

    // ⚠️ 第二十七輪批次階段 A：**每次都重畫**，唔理之前畫過未。
    //
    // 本來寫成「未載入過先至畫」。噉樣區三加咗一筆不能服侍日期之後，
    // 上面嘅「還有 N 項未做」會變，但下面逐項嘅數字唔會變——
    // 又係同一個 bug class（同一份資料，一半更新咗一半冇）。
    //
    // 呢個函式係純渲染（資料由參數嚟，零伺服器來回），重畫嘅成本近乎零，
    // 所以冇任何理由保留嗰個「畫過未」嘅分支。
    renderZone2Body(d);
  }

  function renderZone2Body(d) {
    const body = clear(el('zone2Body'));
    const pq = (d && d.preQuarter) || { items: [] };

    // 逐項各自顯示自己嘅數字（規格 3.1：N 係項數，每項各自有 count）
    const summary = make('div', { className: 'sec' }, [sectionTitle('這一季還要做的：')]);
    (pq.items || []).forEach((i) => {
      summary.appendChild(make('div', {
        text: (i.count > 0 ? '⬜ ' : '✅ ') + i.label + '：' + i.count
          + (i.count > 0 ? ' 項' : ' 項（做好了）'),
        className: i.count > 0 ? 'vio-row' : 'vio-row muted'
      }));
    });
    body.appendChild(summary);

    // ⚠️ 第四十三輪批次 H 組：「更改各崗位的事奉人員名單」搬咗入嚟做**第 0 步**。
    //
    // Ivan 嘅講法：改名單係**生成之前**做嘅事。擺喺主流程第 3 步
    //（即係生成完、改完表之後）本身就講錯咗次序。
    //
    // ⚠️ 用返 `renderStepEligibility()`（ScriptMainFlow.html）——
    // **唔係喺呢度另寫一份**。寫兩份嘅話，兩邊嘅掣會慢慢唔一樣。
    if (typeof renderStepEligibility === 'function') {
      body.appendChild(renderStepEligibility());
    }

    body.appendChild(row([
      button('確認特別主日', openSpecialSundays, ''),
      button('填講員／翻譯／獻花', openPreacherFill, ''),
      button('名單檢查', openPeopleHints, 'secondary')
    ]));
  }

  /* ============================================================
   * 畫面一：確認特別主日（規格 3.2）
   * ============================================================ */

  let specialData = null;

  function openSpecialSundays() {
    runAction('讀取特別主日', async () => {
      specialData = await callServer('apiListSpecialSundays', currentQuarterId);
      renderSpecialSundays();
    });
  }

  function renderSpecialSundays() {
    const nodes = [
      para('特別主日會影響排表：標了「這一週不用排」的崗位，系統就不會排人。'),
      para('「日期已確認」沒有勾的，會在上面顯示為「未做完」。')
    ];

    const active = specialData.rows.filter((r) => r.active);
    const inactive = specialData.rows.filter((r) => !r.active);

    if (active.length === 0) {
      nodes.push(make('div', { text: '這一季還沒有登記任何特別主日。', className: 'muted' }));
    }
    active.forEach((r) => nodes.push(specialRowEditor(r)));

    if (inactive.length > 0) {
      nodes.push(sectionTitle('已停用（不會影響排表，可以重新開啟）'));
      inactive.forEach((r) => nodes.push(specialRowEditor(r)));
    }

    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('年度動作（一年做一次）'),
      make('div', {
        text: '這兩個動作都會先給你看預覽，確認之後才寫入。',
        className: 'muted'
      }),
      row([
        button('產生下一年度四個季度', () => openAnnualTool('quarters'), 'secondary'),
        button('產生年度合堂建議', () => openAnnualTool('combined'), 'secondary')
      ])
    ]));

    nodes.push(row([button('＋ 新增一個特別主日', openAddSpecialSunday, 'link')], 'row-right'));

    openModal('確認特別主日', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  /** 一行特別主日嘅編輯器。 */
  function specialRowEditor(r) {
    const box = make('div', { className: 'prop' + (r.active ? '' : ' is-off') });

    const dateInput = document.createElement('input');
    dateInput.type = 'text';
    dateInput.value = r.serviceDate;
    dateInput.className = 'inp-date';

    const typeInput = document.createElement('input');
    typeInput.type = 'text';
    typeInput.value = r.type;
    typeInput.placeholder = '例如：合堂／浸禮／宣教月／堂慶';

    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.value = r.title;
    titleInput.placeholder = '名稱';

    box.appendChild(make('div', { className: 'prop-head' }, [
      make('span', { text: '日期' }), dateInput,
      make('span', { text: '類型' }), typeInput,
      make('span', { text: '名稱' }), titleInput
    ]));

    // 「哪些崗位不用排」用 checkbox 陣列，唔叫幹事打 WORSHIP,PIANO
    const skipBox = make('div', { className: 'prop-opts' }, [
      make('div', { text: '這一週哪些崗位不用排：', className: 'muted' })
    ]);
    const skipInputs = [];
    specialData.posts.forEach((p) => {
      const label = make('label', { className: 'check-row inline' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = r.skipPostIds.indexOf(p.postId) !== -1;
      cb.dataset.postId = p.postId;
      skipInputs.push(cb);
      label.appendChild(cb);
      label.appendChild(make('span', { text: p.postNameTC }));
      skipBox.appendChild(label);
    });
    box.appendChild(skipBox);

    const confirmedCb = document.createElement('input');
    confirmedCb.type = 'checkbox';
    confirmedCb.checked = r.confirmedChecked;
    const confirmedLabel = make('label', { className: 'check-row' });
    confirmedLabel.appendChild(confirmedCb);
    confirmedLabel.appendChild(make('span', { text: '日期已確認（未勾的會顯示為「未做完」）' }));

    const translationCb = document.createElement('input');
    translationCb.type = 'checkbox';
    translationCb.checked = r.translationRequired;
    const translationLabel = make('label', { className: 'check-row' });
    translationLabel.appendChild(translationCb);
    translationLabel.appendChild(make('span', { text: '這一週需要翻譯' }));

    const activeCb = document.createElement('input');
    activeCb.type = 'checkbox';
    activeCb.checked = r.active;
    const activeLabel = make('label', { className: 'check-row' });
    activeLabel.appendChild(activeCb);
    activeLabel.appendChild(make('span', { text: '啟用（取消勾選＝這一季不用這一項；不會刪除）' }));

    box.appendChild(confirmedLabel);
    box.appendChild(translationLabel);
    box.appendChild(activeLabel);

    box.appendChild(row([
      button('儲存這一行', () => {
        const payload = {
          quarterId: currentQuarterId,
          sheetRow: r.sheetRow,
          serviceDate: dateInput.value.trim(),
          type: typeInput.value.trim(),
          title: titleInput.value.trim(),
          skipPostIds: skipInputs.filter((c) => c.checked).map((c) => c.dataset.postId),
          translationRequired: translationCb.checked,
          // ⚠️ 方向由後端 toConfirmedCellValue_() 處理：
          // 勾咗＝寫空白，未勾＝寫 FALSE。前端只傳 checkbox 狀態，
          // **唔喺呢度自己轉換**，否則兩邊各有一套就一定會有一邊搞反。
          confirmedChecked: confirmedCb.checked,
          active: activeCb.checked
        };
        runAction('儲存中', async () => {
          const res = await callServerMutating('apiSaveSpecialSunday', payload);
          if (res.warning) setStatus(res.warning, true);
          else setStatus('已儲存。');
          specialData = await callServer('apiListSpecialSundays', currentQuarterId);
          renderSpecialSundays();
        });
      }, '')
    ], 'row-right'));

    return box;
  }

  function openAddSpecialSunday() {
    const dateInput = document.createElement('input');
    dateInput.type = 'text';
    dateInput.placeholder = 'yyyy-MM-dd';
    const typeInput = document.createElement('input');
    typeInput.type = 'text';
    typeInput.placeholder = '例如：合堂';
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.placeholder = '名稱';

    const skipInputs = [];
    const skipBox = make('div', { className: 'prop-opts' }, [
      make('div', { text: '這一週哪些崗位不用排：', className: 'muted' })
    ]);
    specialData.posts.forEach((p) => {
      const label = make('label', { className: 'check-row inline' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.postId = p.postId;
      skipInputs.push(cb);
      label.appendChild(cb);
      label.appendChild(make('span', { text: p.postNameTC }));
      skipBox.appendChild(label);
    });

    const confirmedCb = document.createElement('input');
    confirmedCb.type = 'checkbox';
    const confirmedLabel = make('label', { className: 'check-row' });
    confirmedLabel.appendChild(confirmedCb);
    confirmedLabel.appendChild(make('span', { text: '日期已確認' }));

    openConfirm({
      title: '新增一個特別主日',
      bodyNodes: [
        make('div', { className: 'prop-head' }, [
          make('span', { text: '日期' }), dateInput,
          make('span', { text: '類型' }), typeInput,
          make('span', { text: '名稱' }), titleInput
        ]),
        skipBox,
        confirmedLabel,
        make('div', { text: '這一行會加入這一季的特別主日清單。', className: 'muted' })
      ],
      confirmLabel: '新增',
      onConfirm: () => runAction('新增中', async () => {
        const res = await callServerMutating('apiAddSpecialSunday', {
          quarterId: currentQuarterId,
          serviceDate: dateInput.value.trim(),
          type: typeInput.value.trim(),
          title: titleInput.value.trim(),
          skipPostIds: skipInputs.filter((c) => c.checked).map((c) => c.dataset.postId),
          translationRequired: false,
          confirmedChecked: confirmedCb.checked
        });
        if (res.warning) setStatus(res.warning, true);
        specialData = await callServer('apiListSpecialSundays', currentQuarterId);
        renderSpecialSundays();
      })
    });
  }

  /**
   * 年度工具（第二十七輪批次階段 G1）。
   *
   * 兩個都係**寫入動作**：先預覽 → 打字確認 → 執行 → 寫紀錄。
   * 一年做一次，所以寧可慢一步都要睇清楚。
   */
  function openAnnualTool(which) {
    const isQuarters = which === 'quarters';
    const name = isQuarters ? '產生下一年度四個季度' : '產生年度合堂建議';
    const yearInput = textField('', '年份（例如 2027）');

    openModal(name, [
      para(isQuarters
        ? '會一次過算好那一年四個季度的起訖日與全部主日。'
        : '會按教會年曆算出那一年建議的合堂主日（復活節、聖誕等）。'),
      make('div', { className: 'prop-head' }, [
        make('span', { text: '年份' }), yearInput
      ]),
      para('下一步會列出全部會新增的行，讓你逐行看過再決定。', 'muted')
    ], [
      button('看看會加什麼', () => runAction('計算中', async () => {
        const api = isQuarters ? 'apiAnnualQuartersPlan' : 'apiAnnualCombinedPlan';
        const plan = await callServer(api, yearInput.value.trim());
        if (!plan.ok) { showErrorModal(name, new Error(plan.message)); return; }
        if (isQuarters) renderAnnualQuartersPlan(plan);
        else renderAnnualCombinedPlan(plan);
      }), ''),
      button('取消', () => renderSpecialSundays(), 'secondary')
    ]);
  }

  /**
   * 第四十四輪批次 G 組：生成日期／正式發出日期那一句。
   * 算得到就講「會一併寫入」；算不到就講**為什麼**同**跟住做乜**。
   * @param {Object} plan `apiAnnualQuartersPlan()` 嘅結果
   * @returns {Node} 一句
   */
  function annualQuartersDateNote(plan) {
    const cannot = plan.rows.filter(
      (r) => !r.alreadyExists && (!r.generateOn || !r.officialSendOn));
    if (cannot.length === 0) {
      return para('「什麼時候生成」和「什麼時候正式發出」會一併填好，'
        + '不用再另外做一次。', 'muted');
    }
    return make('div', { className: 'warnbox' }, [
      make('div', {
        text: '其中 ' + cannot.length + ' 季算不出「什麼時候生成」和「什麼時候正式發出」，'
          + '因為 Config 的 LEAD_DAYS_GENERATE 或 LEAD_DAYS_OFFICIAL 還沒有填。'
          + '那兩格會留空，之後可以用選單的「準備工作 ▸ 計算季度日期」補上。',
        className: 'lines'
      })
    ]);
  }

  function renderAnnualQuartersPlan(plan) {
    const willWrite = plan.rows.filter((r) => !r.alreadyExists);
    const list = make('div', { className: 'sec' }, [
      sectionTitle(plan.year + ' 年四個季度')
    ]);
    plan.rows.forEach((r) => {
      list.appendChild(make('div', {
        text: r.quarterId + '　' + r.startDate + ' 至 ' + r.endDate
          + '　主日 ' + r.weekCount + ' 個'
          + (r.alreadyExists
            ? '　⚠ 已經存在，整季略過'
            : '　會新增 ' + r.newServiceDateCount + ' 行主日'
              + (r.skippedServiceDates > 0
                ? '（其中 ' + r.skippedServiceDates + ' 行已存在，會略過）' : '')),
        className: r.alreadyExists ? 'vio-row muted' : 'vio-row'
      }));
      // ⚠️ 第四十四輪批次 G 組：兩個日期要**喺呢一版睇得到**。
      // 後端算咗而畫面唔顯示，幹事就要寫入之後去 Quarters 逐格對——
      // 而佢唔會做，於是第 1 步就會一直顯示「沒有填生成日期」。
      if (!r.alreadyExists) {
        list.appendChild(make('div', {
          text: '　　生成日期 ' + (r.generateOn || '（算不出）')
            + '　　正式發出日期 ' + (r.officialSendOn || '（算不出）'),
          className: (r.generateOn && r.officialSendOn) ? 'ok-line' : 'vio-row'
        }));
      }
    });

    if (willWrite.length === 0) {
      openModal('產生下一年度四個季度', [
        list,
        para('這一年的四個季度都已經存在，沒有東西要新增。')
      ], [button('知道了', () => renderSpecialSundays(), '')]);
      return;
    }

    openConfirm({
      title: '產生 ' + plan.year + ' 年四個季度',
      bodyNodes: [
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', { text: '・新增 ' + willWrite.length + ' 個季度', className: 'vio-row' }),
          make('div', {
            text: '・新增 ' + willWrite.reduce((n, r) => n + r.newServiceDateCount, 0) + ' 行主日日期',
            className: 'vio-row'
          }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會覆寫任何一格既有資料', className: 'vio-row' }),
          make('div', { text: '・不會產生任何職事表', className: 'vio-row' }),
          make('div', { text: '・不會寄出任何電郵', className: 'vio-row' })
        ]),
        // ⚠️ 第四十四輪批次 G 組：呢一句以前寫住「那兩格這裡不會填」，
        // 而幹事唔會記得去跑一個藏喺選單、叫「計算季度日期」嘅工具。
        // 而家兩格會一齊填。算唔到嘅時候先至講返點算。
        annualQuartersDateNote(plan)
      ],
      requireTyping: true,
      confirmLabel: '確定寫入',
      danger: true,
      onConfirm: (typed) => runAction('寫入中', async () => {
        const res = await callServerMutating('apiAnnualQuartersExecute', plan.year, typed);
        if (!res.ok) { showErrorModal('產生下一年度四個季度', new Error(res.message)); return; }
        openModal('完成', [
          make('div', {
            text: '已新增 ' + res.quartersWritten + ' 個季度、'
              + res.serviceDatesWritten + ' 行主日日期。',
            className: 'ok-line'
          }),
          make('div', {
            text: res.skipped.length > 0
              ? '略過 ' + res.skipped.length + ' 個已經存在的季度。' : '',
            className: 'muted'
          })
        ], [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }

  function renderAnnualCombinedPlan(plan) {
    const willWrite = plan.rows.filter((r) => r.willWrite);
    const list = make('div', { className: 'sec' }, [
      sectionTitle(plan.year + ' 年建議的合堂主日')
    ]);
    plan.rows.forEach((r) => {
      // 冇 QuarterID 嘅行寫落去等於垃圾行（全系統都讀唔到），
      // 所以喺預覽就要講清楚會略過，唔可以寫完先發現。
      const why = r.alreadyExists
        ? '　⚠ 已經有這一日，略過'
        : (!r.quarterId ? '　⚠ 找不到對應的季度（那一季還沒有建立），略過' : '');
      list.appendChild(make('div', {
        text: r.serviceDate + '　' + r.title + (r.quarterId ? '　' + r.quarterId : '') + why,
        className: why ? 'vio-row muted' : 'vio-row'
      }));
    });

    if (willWrite.length === 0) {
      openModal('產生年度合堂建議', [
        list,
        para('沒有任何一行可以新增。')
      ], [button('知道了', () => renderSpecialSundays(), '')]);
      return;
    }

    openConfirm({
      title: '產生 ' + plan.year + ' 年合堂建議',
      bodyNodes: [
        list,
        make('div', { className: 'sec' }, [
          sectionTitle('會做的事：'),
          make('div', { text: '・新增 ' + willWrite.length + ' 行特別主日', className: 'vio-row' }),
          sectionTitle('不會做的事：'),
          make('div', { text: '・不會覆寫已經存在的那幾日', className: 'vio-row' }),
          make('div', { text: '・「這一週哪些崗位不用排」一律留空，要你自己填', className: 'vio-row' }),
          make('div', { text: '・不會產生任何職事表，也不會寄出任何電郵', className: 'vio-row' })
        ]),
        para('這些只是「建議」。日期要不要用、哪些崗位不用排，都由你決定。')
      ],
      requireTyping: true,
      confirmLabel: '確定寫入',
      danger: true,
      onConfirm: (typed) => runAction('寫入中', async () => {
        const res = await callServerMutating('apiAnnualCombinedExecute', plan.year, typed);
        if (!res.ok) { showErrorModal('產生年度合堂建議', new Error(res.message)); return; }
        const nodes = [
          make('div', { text: '已新增 ' + res.written + ' 行。', className: 'ok-line' })
        ];
        if (res.skipped.length > 0) {
          const box = make('div', { className: 'warnbox' }, [
            make('div', { text: '略過 ' + res.skipped.length + ' 行：', className: 'warn-head' })
          ]);
          res.skipped.forEach((s) => box.appendChild(make('div', {
            text: (s.serviceDate || '') + '　' + (s.reason || s.title || ''),
            className: 'lines'
          })));
          nodes.push(box);
        }
        nodes.push(para('記得逐一填「這一週哪些崗位不用排」，然後勾「日期已確認」。'));
        openModal('完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
      })
    });
  }

  /* ============================================================
   * 畫面二：填講員／翻譯／獻花（規格 3.3）
   * ============================================================ */

  function openPreacherFill() {
    runAction('讀取待填格子', async () => {
      const data = await callServer('apiWebListPreacherPending', currentQuarterId);
      renderPreacherFill(data);
    });
  }

  /**
   * 第二十五輪批次階段 B3：儲存之後講「呢個名有冇對上名單」。
   *
   * ─────────────────────────────────────────────────────────────
   * 點解呢一句字比建議下拉重要好多
   * ─────────────────────────────────────────────────────────────
   *
   * 翻譯打錯一個字（例如異體字寫錯咗），嗰位弟兄姊妹就**永遠收唔到通知**
   * ——正式發出嗰陣佢唔喺收件名單入面。而畫面上完全睇唔出：
   * 職事表照樣印住個名，PDF 照樣有佢，一切正常。
   *
   * 呢一句字係唯一一個會即刻話你知嘅位。
   *
   * ⚠️ 對唔上**唔一定係錯**——外請講員本來就唔喺名單入面，
   * 所以文案要講清楚「外請講員屬正常」，唔可以寫成一個錯誤。
   * 寫成錯誤嘅話幹事會去「修正」一個根本冇問題嘅嘢。
   * @param {HTMLElement} node 要寫入嘅元素
   * @param {Object} res `apiSavePreacherTranslationEntry()` 嘅回傳
   * @param {string} typedName 幹事打嘅名
   */
  function renderLinkFeedback(node, res, typedName) {
    clear(node);
    if (!res) { node.className = 'muted'; return; }
    if (res.linkedToNameMapping) {
      node.className = 'link-ok';
      node.textContent = '已對上名單上的「' + typedName + '」，正式發出時他會收到通知。';
    } else {
      node.className = 'link-warn';
      node.textContent = '名單上沒有這個名字，正式發出時不會寄給他。外請講員屬正常。';
    }
  }

  function renderPreacherFill(data) {
    const nodes = [
      para('這三個崗位系統不會自動排，一定要人手填。'),
      para('改完即刻儲存，不需要另外按確認。')
    ];

    // 第二十五輪批次階段 C：這一季已經正式發出過的話，改動之後要重發。
    // 後端一直都有回 officialSentHint，只係從來冇用到。
    if (data.officialSentHint) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這一季已經正式發出，改動之後記得用「改動後重發」通知受影響的人。',
          className: 'warn-head'
        })
      ]));
    }

    // ⚠️ 第二十五輪批次階段 C：**收窄成單一欄名。**
    //
    // 原本寫成「A 欄唔存在就用 B 欄」嗰種兩選一寫法，而後端由頭到尾
    // 只有其中一個欄名。呢種 fallback 睇落係「穩陣啲」，實際上係一個
    // **會遮蓋結構不符嘅陷阱**：兩個名都唔啱嘅話，畫面只會空白，
    // 唔會報錯，而空白同「真係冇嘢要填」睇落一模一樣。
    // 收窄成一個名之後，後端結構一有變就即刻睇得出。
    //
    // （呢段特登唔寫出嗰個舊寫法嘅字面樣，因為 tests/ 有一條斷言
    // 就係掃呢個檔案有冇出現過嗰串字——寫喺註解都會被捉到。）
    const cells = data.pending || [];

    if (cells.length === 0) {
      nodes.push(make('div', { text: '這一季沒有待填的格子。', className: 'ok-line' }));
    }

    cells.forEach((c) => {
      const box = make('div', { className: 'prop' + (c.optional ? ' is-optional' : '') });
      const head = make('div', { className: 'prop-head' });
      head.appendChild(make('span', { text: c.serviceDate + '　' + (c.postName || c.postId) }));
      if (c.optional) head.appendChild(make('span', { text: '可留空', className: 'tag' }));
      box.appendChild(head);

      const input = document.createElement('input');
      input.type = 'text';
      input.value = c.currentName || '';
      input.placeholder = '姓名';
      // ⚠️ 第二十五輪批次階段 B2：一定要關掉瀏覽器自動填充。
      //
      // 冇設 autocomplete 嘅話，Chrome 會當呢格係聯絡人欄位，
      // 彈出**使用者自己嘅通訊錄**（Ivan 實測見到自己個名同
      // 「Manage addresses…」）。幹事會以為嗰啲係系統畀嘅建議名單，
      // 撳落去就填咗一個完全唔相干嘅人。
      //
      // `name` 用一個 Chrome 認唔出嘅自訂值——單靠 `autocomplete="off"`
      // Chrome 有時會照樣無視。
      input.autocomplete = 'off';
      input.name = 'hwc-person-free-text';
      box.appendChild(input);

      const statusSpan = make('span', { text: '', className: 'muted' });
      // 「有冇對上名單」嘅回饋（規格 3.3）。獨立一行，唔同 statusSpan 混埋——
      // 前者係「儲存咗未」，後者係「呢個人收唔收到通知」，兩件唔同嘅事。
      const linkNote = make('div', { text: '', className: 'muted' });

      box.appendChild(row([
        button('儲存', () => {
          const name = input.value.trim();
          if (!name) { statusSpan.textContent = '姓名不可留空（留空就不用按儲存）。'; return; }
          runAction('儲存中', async () => {
            const res = await callServerMutating('apiWebSavePreacherEntry',
              currentQuarterId, c.serviceDate, c.postId, c.slotIndex, name);
            statusSpan.textContent = '已儲存 ✓';
            renderLinkFeedback(linkNote, res, name);
          });
        }, ''),
        statusSpan
      ], 'row-right'));
      box.appendChild(linkNote);

      nodes.push(box);
    });

    openModal('填講員／翻譯／獻花', nodes, [button('關閉', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 畫面三：名單檢查（規格 3.4，唯讀）
   * ============================================================ */

  function openPeopleHints() {
    runAction('讀取名單檢查', async () => {
      const data = await callServer('apiGetPreQuarterChecklist', currentQuarterId);
      const hints = data.peopleHints || [];

      const nodes = [
        para('這幾項跟人不跟季，所以不算入上面的「還有 N 項未做」。')
      ];

      // 第二十五輪批次階段 E4：頭兩項同最後一項已經有區三畫面，
      // 「去處理」直接開嗰個畫面，唔使幹事自己去試算表搵。
      //
      // 身分（Roles）嗰項仲未有畫面，繼續指返試算表——
      // **唔可以扮到有得撳**，撳完乜都冇發生比指返選單更差。
      const openIn = {
        noEmail: function () { openPeople(); },
        notInNameList: function () { openPeople(); },
        thinEligibility: function () { openEligibility(); }
      };
      const where = {
        expiredRole: 'Roles 工作表，檢查 EffectiveTo 欄；換屆不要刪行，只填卸任日期'
      };

      hints.forEach((h) => {
        if (h.count === -1) {
          nodes.push(make('div', { text: h.label, className: 'err-text' }));
          return;
        }
        const box = make('div', { className: 'prop' + (h.count === 0 ? ' is-off' : '') });
        box.appendChild(make('div', {
          text: (h.count === 0 ? '✅ ' : '⚠️ ') + h.label + '：' + h.count,
          className: 'prop-head'
        }));
        // ⚠️ 用中括號取欄位，唔用點號寫法——`id` 同 `name` 呢類欄名
        // 本身就係真嘅頂層網域，點號寫法喺敏感資料掃描眼中形狀同網域
        // 一模一樣，會誤報。（第二十二輪喺 PreLaunchChecklist 撞過同一件事。）
        // 呢度特登唔喺註解舉完整例子——寫出嚟一樣會被自己個掃描器捉到。
        const hintId = h['id'];
        if (h.count > 0 && openIn[hintId]) {
          box.appendChild(row([button('去處理', () => {
            // 開區三之前先展開嗰一區，否則關咗彈窗之後幹事會搵唔返。
            setZoneOpen('zone3Head', 'zone3Body', true);
            markZoneLoaded('zone3Body');
            renderZone3();
            openIn[hintId]();
          }, 'link')], 'row-right'));
        } else if (h.count > 0 && where[hintId]) {
          box.appendChild(make('div', {
            text: '去處理：試算表的 ' + where[hintId] + '。改完回來重新整理這一頁。',
            className: 'muted'
          }));
        }
        nodes.push(box);
      });

      openModal('名單檢查', nodes, [button('關閉', () => closeModal(), '')]);
    });
  }
</script>
