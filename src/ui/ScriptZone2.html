<script>
  /* ============================================================
   * 第二十四輪批次階段 F：區二——開季前準備
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第三節。
   *
   * 三個畫面：確認特別主日／填講員翻譯獻花／名單檢查（唯讀）。
   * 五項未做完**唔阻擋任何一粒掣**——只係「表會有空格」嘅提醒。
   */

  // ⚠️ 第二十五輪批次階段 A：呢度本來有個 `zone2Loaded`，
  // 而 `wireZoneToggle()` 內部另外有個 `loaded`——**同一個狀態兩個旗標**，
  // 換季度只重設咗其中一個，結果區二一直顯示上一個季度嘅數字。
  //
  // 而家「呢個區載入咗未」統一由 `Script.html` 嘅 `zoneLoadState` 保管，
  // **呢個檔案唔可以再自己開一個旗標**。要重新載入就叫 `markZoneNeedsReload()`。

  /** 區頭嘅「還有 N 項未做」。N=0 時整區收摺。 */
  function renderZone2Head(d) {
    const pq = d.preQuarter || { undoneItemCount: 0, items: [] };
    const countNode = el('zone2Count');

    if (pq.undoneItemCount < 0) {
      // 後端算唔到。**唔可以顯示「全部做好了」**——嗰個等於話「檢查過冇問題」。
      countNode.textContent = '（暫時查不到）';
      countNode.className = 'zone-count warn';
      setZoneOpen('zone2Head', 'zone2Body', true);
      markZoneLoaded('zone2Body');
    } else if (pq.undoneItemCount === 0) {
      countNode.textContent = '全部做好了';
      countNode.className = 'zone-count ok';
      // ⚠️ 第四十三輪批次 H 組：Ivan 要求呢一組**預設展開**。
      // 佢每一季第一件做嘅事就係呢度（改名單、標特別主日）——
      // 「全部做好咗」唔等於「唔使再開」，佢仍然會入嚟改名單。
      setZoneOpen('zone2Head', 'zone2Body', true);
      markZoneLoaded('zone2Body');
    } else {
      countNode.textContent = '還有 ' + pq.undoneItemCount + ' 項未做';
      countNode.className = 'zone-count warn';
      setZoneOpen('zone2Head', 'zone2Body', true);
      // `setZoneOpen()` 係直接開，唔會行 `wireZoneToggle()` 嗰條路，
      // 所以要自己標記「已載入」——用同一個 zoneLoadState，唔可以另開旗標。
      markZoneLoaded('zone2Body');
    }

    // ⚠️ 第二十七輪批次階段 A：**每次都重畫**，唔理之前畫過未。
    //
    // 本來寫成「未載入過先至畫」。噉樣區三加咗一筆不能服侍日期之後，
    // 上面嘅「還有 N 項未做」會變，但下面逐項嘅數字唔會變——
    // 又係同一個 bug class（同一份資料，一半更新咗一半冇）。
    //
    // 呢個函式係純渲染（資料由參數嚟，零伺服器來回），重畫嘅成本近乎零，
    // 所以冇任何理由保留嗰個「畫過未」嘅分支。
    renderZone2Body(d);
  }

  function renderZone2Body(d) {
    const body = clear(el('zone2Body'));
    const pq = (d && d.preQuarter) || { items: [] };

    // ⚠️ 第四十三輪批次 H 組：「更改各崗位的事奉人員名單」搬咗入嚟做**第 0 步**。
    //
    // Ivan 嘅講法：改名單係**生成之前**做嘅事。擺喺主流程第 3 步
    //（即係生成完、改完表之後）本身就講錯咗次序。
    //
    // ⚠️ 用返 `renderStepEligibility()`（ScriptMainFlow.html）——
    // **唔係喺呢度另寫一份**。寫兩份嘅話，兩邊嘅掣會慢慢唔一樣。
    if (typeof renderStepEligibility === 'function') {
      body.appendChild(renderStepEligibility());
    }

    // ⚠️ 第七十五輪批次 CA 組：〔不能服侍的日期〕由「名單維護」搬到呢度（Ivan：生成之前就要處理）；
    // 〔名單檢查〕搬去「進階與診斷」（唔係常用功能）。
    // 第七十七輪批次 EA 組：〔排表偏好〕由第 2 步搬到呢度，同〔不能服侍的日期〕並排（Ivan 決定）。
    // 第八十五輪批次 LE 組：〔合堂主日〕放在同一行
    body.appendChild(row([
      button('不能服侍的日期', () => openUnavailable(), ''),
      button('排表偏好', () => openWeights(), ''),
      button('合堂主日', () => openCombinedServices(), ''),
      // 第九十輪批次 QB 組：〔詩班獻詩〕放在〔合堂主日〕旁邊
      button('詩班獻詩', () => openChoirSinging(), '')
    ]));
    // 第八十五輪批次 LF 組：〔寄出季前資料〕（先預覽內容和收件人，再寄）
    body.appendChild(row([button('寄出季前資料', () => openPreseasonSend(), 'secondary')]));

    // 第八十五輪批次 LD 組：人手檢查——有問題才顯示「人手不足：N 個崗位」及〔人手檢查〕
    const st = d && d.staffing;
    if (st && !st.error && st.totalBlanks > 0) {
      body.appendChild(make('div', { className: 'vio vio-hard' }, [
        make('div', { text: staffingShortText(st), className: 'vio-head' }),
        row([button('人手檢查', () => openStaffingCheck(), '')])
      ]));
    }

    // 逐項各自顯示自己嘅數字（規格 3.1：N 係項數，每項各自有 count）
    const summary = make('div', { className: 'sec' }, [sectionTitle('這一季還要做的：')]);
    // 第八十五輪批次 LF 組：「季前資料：已寄出（日期，自動／人手）」或「建議 <日期> 寄出（未寄）」
    if (d && d.preseasonStatus) {
      summary.appendChild(make('div', { text: (/已寄出/.test(d.preseasonStatus) ? '✅ ' : '⬜ ') + d.preseasonStatus,
        className: /已寄出/.test(d.preseasonStatus) ? 'vio-row muted' : 'vio-row' }));
    }
    // 第八十五輪批次 LD 組：沒有問題就寫「人手檢查：足夠」；讀不到就照實講
    if (st && st.error) {
      summary.appendChild(make('div', { text: '⬜ 人手檢查：暫時查不到（' + st.error + '）', className: 'vio-row' }));
    } else if (st && st.totalBlanks === 0) {
      summary.appendChild(make('div', { text: '✅ 人手檢查：足夠', className: 'vio-row muted' }));
    }
    (pq.items || []).forEach((i) => {
      summary.appendChild(make('div', {
        text: (i.count > 0 ? '⬜ ' : '✅ ') + i.label + '：' + i.count
          + (i.count > 0 ? ' 項' : ' 項（做好了）')
          // 第七十五輪批次 CD 組：講員／翻譯／獻花嘅提示（「生成之後在職事表直接填」）
          + (i.count > 0 && i.hint ? '——' + i.hint : ''),
        className: i.count > 0 ? 'vio-row' : 'vio-row muted'
      }));
    });
    body.appendChild(summary);
  }

  /**
   * 第八十五輪批次 LE 組：〔合堂主日〕——這一季每個主日一行：日期、種類（不是合堂／合堂／浸禮／堂慶）、名稱。
   * 名稱只在選了種類之後才可以填；不改動職事表，只傳給週報系統。
   */
  function openCombinedServices() {
    runAction('讀取合堂主日', async () => {
      const data = await callServer('apiGetCombinedServices', currentQuarterId);
      const rows = [];
      const list = make('div', { className: 'sec' });
      (data.weeks || []).forEach((w) => {
        const sel = document.createElement('select');
        const none = document.createElement('option');
        none.value = ''; none.textContent = '不是合堂';
        sel.appendChild(none);
        (data.kinds || []).forEach((k) => {
          const o = document.createElement('option');
          o.value = k.code; o.textContent = k.label;
          if (w.kind === k.code) o.selected = true;
          sel.appendChild(o);
        });
        sel.value = w.kind || '';
        const name = document.createElement('input');
        name.type = 'text';
        name.value = w.name || '';
        name.placeholder = '名稱（例如宣教月，可以留空）';
        name.disabled = !sel.value;
        sel.addEventListener('change', () => { name.disabled = !sel.value; if (!sel.value) name.value = ''; });
        rows.push({ serviceDate: w.serviceDate, sel: sel, name: name });
        list.appendChild(make('div', { className: 'check-row' }, [make('span', { text: humanDate(w.serviceDate) }), sel, name]));
      });
      openModal('合堂主日：' + (data.quarterLabel || currentQuarterId), [para(data.note || ''), list], [
        button('儲存', () => runAction('儲存合堂主日', async () => {
          const items = rows.map((r) => ({ serviceDate: r.serviceDate, kind: r.sel.value, name: r.sel.value ? r.name.value : '' }));
          const res = await callServerMutating('apiSaveCombinedServices', currentQuarterId, items);
          openModal('合堂主日', [make('div', { text: res.message || '已儲存。', className: 'ok-line' })],
            [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /**
   * 第九十輪批次 QB 組：〔詩班獻詩〕——這一季每個主日一行，勾選「詩班獻詩」→〔儲存〕。
   * 那幾個主日，詩班名單上的人盡量不擔任其他崗位（SEMI_CHOIR_SUNDAY）；亦傳給週報系統。
   */
  function openChoirSinging() {
    runAction('讀取詩班獻詩', async () => {
      const data = await callServer('apiGetChoirSinging', currentQuarterId);
      const rows = [];
      const list = make('div', { className: 'sec' });
      (data.weeks || []).forEach((w) => {
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !!w.singing;
        rows.push({ serviceDate: w.serviceDate, box: box });
        list.appendChild(make('label', { className: 'check-row' }, [box, make('span', { text: humanDate(w.serviceDate) + '　詩班獻詩' })]));
      });
      const head = [para(data.note || '')];
      if (data.choirCount === 0) {
        head.push(para('詩班名單現時是空的——在「開季前準備 ▸ 開啟名單工作表」的「詩班」一欄填。', 'muted'));
      } else if (data.choirCount > 0) {
        head.push(para('詩班名單：' + data.choirCount + ' 人。', 'muted'));
      }
      openModal('詩班獻詩：' + (data.quarterLabel || currentQuarterId), head.concat([list]), [
        button('儲存', () => runAction('儲存詩班獻詩', async () => {
          const items = rows.map((r) => ({ serviceDate: r.serviceDate, singing: !!r.box.checked }));
          const res = await callServerMutating('apiSaveChoirSinging', currentQuarterId, items);
          openModal('詩班獻詩', [make('div', { text: res.message || '已儲存。', className: 'ok-line' })],
            [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /** 第八十五輪批次 LF 組：〔寄出季前資料〕——預覽（六段內容＋收件人＋沒有電郵的人）→〔寄出〕→「模擬／寄出 N 封」。 */
  function openPreseasonSend() {
    runAction('讀取季前資料', async () => {
      const p = await callServer('apiPreseasonPreview', currentQuarterId);
      const nodes = [para('會寄給寄出當日的現任堂委、執事和幹事'
        + (p.generateDate ? '；生成日是 ' + humanDate(p.generateDate) + '。' : '。'), 'muted')];
      (p.sections || []).forEach((s) => {
        const box = make('div', { className: 'sec' }, [sectionTitle(s.title)]);
        (s.lines || []).forEach((l) => box.appendChild(make('div', { text: '・' + l, className: 'vio-row' })));
        nodes.push(box);
      });
      const who = make('div', { className: 'sec' }, [sectionTitle('收件人（' + (p.recipients || []).length + ' 位）')]);
      (p.recipients || []).forEach((r) => who.appendChild(make('div', { text: '・' + r.displayName + '（' + r.why + '）', className: 'vio-row' })));
      if ((p.noEmail || []).length > 0) {
        who.appendChild(make('div', { text: '沒有電郵，收不到：' + p.noEmail.join('、'), className: 'err-text' }));
      }
      nodes.push(who);
      // 第八十六輪批次 MA 組：講明之前是模擬還是真正寄出（模擬不算已寄出）
      if (p.sentRecord) {
        const sr = p.sentRecord;
        const modeOf = (m) => (m === 'AUTO' ? '自動' : '人手');
        nodes.push(para(sr.real
          ? '這一季已經在 ' + sr.real.date + ' 真正寄出過一次（' + modeOf(sr.real.mode) + '）；再寄會再收到一封。'
          : '這一季在 ' + sr.date + ' 只有模擬寄出（' + modeOf(sr.mode) + '），沒有真正寄出過；模擬不算已寄出。', 'muted'));
      }
      openModal('寄出季前資料：' + (p.quarterLabel || currentQuarterId), nodes, [
        button('寄出', () => runAction('寄出季前資料', async () => {
          const r = await callServerMutating('apiPreseasonSend', currentQuarterId);
          openModal('寄出季前資料', [make('div', {
            text: r.dryRun ? ('模擬 ' + r.simulated + ' 封（測試模式，沒有真正寄出）')
              : ('寄出 ' + r.sent + ' 封' + ((r.failed || []).length ? '，' + r.failed.length + ' 封失敗' : '')),
            className: 'ok-line'
          })], [button('完成', () => closeModalAndRefresh(), '')]);
        }), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
    });
  }

  /** 第八十五輪批次 LD 組：「人手不足：N 個崗位（最少 M 格會留空）」 */
  function staffingShortText(st) {
    return '人手不足：' + st.shortPostCount + ' 個崗位（最少 ' + st.totalBlanks + ' 格會留空）'
      + ((st.posts || []).length ? '——' + st.posts.map((p) => '「' + p.postNameTC + '」').join('、') : '');
  }

  /** 第八十五輪批次 LD 組：〔人手檢查〕——逐個崗位、逐週列出原因。 */
  function openStaffingCheck() {
    runAction('人手檢查', async () => {
      const r = await callServer('apiGetStaffingCheck', currentQuarterId);
      openModal('人手檢查：' + (r.quarterLabel || currentQuarterId), staffingCheckNodes(r), [button('關閉', () => closeModal(), '')]);
    });
  }

  /** 人手檢查的內容（生成確認窗、季前資料預覽也用同一份）。 */
  function staffingCheckNodes(r) {
    const nodes = [para('只計一定要遵守的規則（名單、不能服侍、身分要求、暫時不做、同週不可兼任、每人每季上限）。'
      + '盡量遵守的規則和排表偏好不計——那些可以違反並提醒。', 'muted')];
    if (!r || r.totalBlanks === 0) {
      nodes.push(make('div', { text: '人手足夠：每一格都排得到人。', className: 'ok-line' }));
    } else {
      nodes.push(make('div', { text: '最少一定會留空 ' + r.totalBlanks + ' 格（共需要 ' + r.totalNeeded + ' 格）。', className: 'strong' }));
      (r.posts || []).forEach((p) => {
        const box = make('div', { className: 'sec' }, [make('div', { text: p.text, className: 'vio-head' })]);
        (p.blankWeeks || []).forEach((w) => box.appendChild(make('div', {
          text: humanDate(w.serviceDate) + '：' + w.blanks + ' 格（' + w.reasonText + '）', className: 'vio-row'
        })));
        nodes.push(box);
      });
    }
    (r && r.notes || []).forEach((n) => nodes.push(para(n, 'muted')));
    return nodes;
  }

  /* ============================================================
   * 畫面一（已拿走）：確認特別主日
   * ============================================================
   *
   * ⚠️ 第七十五輪批次 CC 組（Ivan 決定）：特別主日完全拿走——〔確認特別主日〕掣、彈窗、
   * 入面嘅年度工具（產生下一年度四個季度／年度合堂建議）全部拿走。
   * 未來季度改為自動建立（CB 組：「進階與診斷 ▸ 建立未來季度」）；
   * 每週標題由幹事喺職事表「類型」欄直接改（`WeekTitles.gs`）。
   * 伺服器嘅特別主日函式冇刪（`SPECIAL_SUNDAYS_ENABLED=TRUE` 仲用得到選單版）。
   */

  /* ============================================================
   * 畫面二（已拿走）：填講員／翻譯／獻花
   * ============================================================
   *
   * ⚠️ 第七十五輪批次 CD 組（Ivan 決定）：〔填講員／翻譯／獻花〕掣同彈窗拿走。
   * Ivan：「生成前撳會出『找不到已生成的版本』，好混亂；統一喺〔查看／修改職事表〕加或者改。」
   * 而家人手崗位嘅格喺職事表有名單選單（亦可以打名單以外嘅名），任何階段嘅改動
   * 〔儲存〕都會偵測到（見 `buildGridOverlayState_()`）。第七十四輪 BC 組嘅提示句同
   * 儲存後嗰句狀態字隨彈窗一齊拿走。
   * 試算表選單嘅側邊欄（PreacherFillSidebar）冇改。
   */

  /* ============================================================
   * 畫面三：名單檢查（規格 3.4，唯讀）
   * ============================================================ */

  function openPeopleHints() {
    runAction('讀取名單檢查', async () => {
      const data = await callServer('apiGetPreQuarterChecklist', currentQuarterId);
      const hints = data.peopleHints || [];

      const nodes = [
        para('這幾項跟人不跟季，所以不算入「開季前準備」的「還有 N 項未做」。')
      ];

      // 第二十五輪批次階段 E4：頭兩項同最後一項已經有區三畫面，
      // 「去處理」直接開嗰個畫面，唔使幹事自己去試算表搵。
      //
      // 身分（Roles）嗰項仲未有畫面，繼續指返試算表——
      // **唔可以扮到有得撳**，撳完乜都冇發生比指返選單更差。
      const openIn = {
        // 第七十七輪批次 EF 組：人員與電郵畫面拿走 ⇒ 改開「出席系統連結」
        noEmail: function () { openHwcas(); },
        notInNameList: function () { openHwcas(); },
        // 第七十五輪批次 CA 組：〔崗位資格〕入口拿走（同名單工作表重複）⇒ 改開名單工作表
        thinEligibility: function () { openEligibilitySheet(); }
      };
      const where = {
        expiredRole: 'Roles 工作表，檢查 EffectiveTo 欄；換屆不要刪行，只填卸任日期'
      };

      hints.forEach((h) => {
        if (h.count === -1) {
          nodes.push(make('div', { text: h.label, className: 'err-text' }));
          return;
        }
        const box = make('div', { className: 'prop' + (h.count === 0 ? ' is-off' : '') });
        box.appendChild(make('div', {
          text: (h.count === 0 ? '✅ ' : '⚠️ ') + h.label + '：' + h.count,
          className: 'prop-head'
        }));
        // ⚠️ 用中括號取欄位，唔用點號寫法——`id` 同 `name` 呢類欄名
        // 本身就係真嘅頂層網域，點號寫法喺敏感資料掃描眼中形狀同網域
        // 一模一樣，會誤報。（第二十二輪喺 PreLaunchChecklist 撞過同一件事。）
        // 呢度特登唔喺註解舉完整例子——寫出嚟一樣會被自己個掃描器捉到。
        const hintId = h['id'];
        if (h.count > 0 && openIn[hintId]) {
          // 第七十五輪批次 CA 組：區三已經唔係「名單維護」，直接開嗰個畫面就得。
          box.appendChild(row([button('去處理', () => openIn[hintId](), 'link')], 'row-right'));
        } else if (h.count > 0 && where[hintId]) {
          box.appendChild(make('div', {
            text: '去處理：試算表的 ' + where[hintId] + '。改完回來重新整理這一頁。',
            className: 'muted'
          }));
        }
        nodes.push(box);
      });

      openModal('名單檢查', nodes, [button('關閉', () => closeModal(), '')]);
    });
  }
</script>
