<style>
  /* 第二十四輪批次階段 B：幹事介面四區改造嘅樣式。
     深色／淺色沿用第十一輪嘅架構：同一組 CSS 變數，
     分別只在於邊個選擇器生效（跟裝置設定 vs 手動選擇）。 */
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --border: #d0d7de;
    --accent: #1a73e8;
    --danger: #b3261e;
    --warn-bg: #fff8e1;
    --warn-border: #e8c61a;
    --ok: #1e7e34;
    --card: #ffffff;
    --card-off: #f6f7f9;
    /* 第二十五輪批次階段 B5：禁用掣專用嘅三隻色。見下面 button:disabled。 */
    /* 第二十五輪階段 B3：「對唔上名單」用嘅琥珀色。唔用紅——對唔上唔一定係錯。 */
    --warn-fg: #8a6100;
    --disabled-bg: #e9ebee;
    --disabled-fg: #9aa0a6;
    --disabled-border: #d0d4d9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.75;
    font-size: var(--fs-body);
    /* 第八十二輪批次 IE 組：字大到一行放不下時，長字（網址、電郵）也要斷行，不可以撐出橫向捲動 */
    overflow-wrap: anywhere;
  }

  h1 { font-size: var(--fs-h1); margin: 0; }

  /* ── 頂部 ─────────────────────────────────────────────── */
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: flex-start; justify-content: space-between;
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .quarter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
  .quarter-row label { font-size: var(--fs-hint); color: var(--muted); }
  .topbar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  select, input[type=text] {
    font: inherit; padding: 6px 10px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg);
  }
  input[type=text] { min-width: 140px; }
  select, input[type=text], textarea { max-width: 100%; }

  button {
    font: inherit; padding: 7px 14px; border-radius: 6px;
    cursor: pointer; background: var(--accent); color: #fff;
    border: 1px solid var(--accent);
  }
  button.secondary { background: var(--card); color: var(--fg); border-color: var(--border); }
  /* 第七十七輪批次 ED 組：第 2 步〔儲存〕——同〔查看／修改職事表〕同一個份量嘅主要按鈕 */
  button.primary-big { font-weight: 600; }
  button.primary-big:disabled { opacity: .55; cursor: not-allowed; }
  button.danger { background: var(--danger); border-color: var(--danger); }
  button.link {
    background: none; border: none; color: var(--accent);
    padding: 2px 4px; text-decoration: underline;
  }
  button.chip {
    background: var(--card-off); color: var(--fg); border: 1px solid var(--border);
    font-size: var(--fs-note); padding: 2px 8px; border-radius: 999px; margin: 0 4px 4px 0;
  }
  /* 第二十五輪批次階段 B5：禁用掣唔可以只靠透明度。
     藍底掣半透明之後仍然係藍色，喺非技術使用者眼中「淺藍」同「藍」
     都係「可以撳」——分唔到就會一直撳，撳完冇反應就以為壞咗。
     所以改成**換色相**：灰底、灰字、灰邊框，同啟用態係兩種顏色，
     唔係同一種顏色嘅兩個濃度。`!important` 係因為要蓋過
     .danger／.secondary 各自嘅底色。 */
  button:disabled {
    background: var(--disabled-bg) !important;
    color: var(--disabled-fg) !important;
    border: 1px solid var(--disabled-border) !important;
    cursor: not-allowed;
    opacity: 1;
  }

  .badge {
    font-size: var(--fs-note); padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card);
  }
  .badge-dryrun {
    background: #fce8e6; border-color: #f5c2bd; color: #a1160a; font-weight: 600;
  }
  .badge.inline { display: inline-block; margin-top: 8px; }

  .status { min-height: 20px; font-size: var(--fs-hint); color: var(--muted); margin-bottom: 10px; }
  .status.error { color: var(--danger); }

  /* ────────────────────────────────────────────────────────
     第三十四輪批次乙1：`[hidden]` 一定要真係收起。

     ⚠️ 瀏覽器預設嘅 `[hidden] { display: none }` 係喺 UA stylesheet，
     **任何一條有 class 選擇器嘅 `display` 規則都會蓋過佢**。
     本檔案已經因為呢件事逐個補過兩次
     （`.zone-body[hidden]`、`.modal-backdrop[hidden]`）——
     即係每加一個新元件就要記得補多一次，而唔記得嘅代價係
     一個**睇得見、撳得到、但會被靜靜忽略**嘅控制項。

     2026-08-20 實測撞到第三次：「不能服侍的日期」揀「全部崗位」時，
     程式碼有寫 `postBox.hidden = true`，但 `.prop-opts { display: flex }`
     蓋過咗佢，所以嗰張崗位清單照樣顯示、照樣勾得到，
     而後端見到 `AppliesTo=ALL` 就完全唔理個勾——零提示。

     所以改成一條總規則，唔再逐個補。
     ──────────────────────────────────────────────────────── */
  [hidden] { display: none !important; }

  /* ── 狀態卡（規格 1.2）────────────────────────────────── */
  .statuscard {
    border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; background: var(--card);
  }
  .statuscard-title { font-size: var(--fs-body); font-weight: 600; }
  .statuscard-sub { font-size: var(--fs-note); color: var(--muted); margin-top: 4px; }

  /* ── 四區 ─────────────────────────────────────────────── */
  .zone { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .zone-primary { border-color: var(--accent); }
  .zone-head {
    width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--card-off); border: none;
    color: var(--fg); cursor: pointer; text-align: left; border-radius: 0;
  }
  .zone-head.static { cursor: default; }
  .zone-title { font-weight: 600; font-size: var(--fs-body2); flex: 1; }
  .zone-count { font-size: var(--fs-note); }
  .zone-count.warn { color: #a15c00; font-weight: 600; }
  .zone-count.ok { color: var(--ok); }
  .zone-caret { color: var(--muted); font-size: var(--fs-note); }
  .zone-body { padding: 12px 14px; }
  .zone-body[hidden] { display: none; }

  /* ── 區一：一粒掣一張卡 ───────────────────────────────── */
  .act {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; background: var(--card);
  }
  .act-off { background: var(--card-off); }
  .act-on { border-color: var(--accent); }
  .act-main { flex: 1 1 16em; min-width: 0; }
  .act-name { font-weight: 600; font-size: var(--fs-name); }
  .act-desc { font-size: var(--fs-hint); color: var(--muted); margin-top: 3px; }
  .act-why { font-size: var(--fs-note); color: #a15c00; margin-top: 5px; }

  /* ── 彈窗 ─────────────────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 16px; z-index: 100; overflow-y: auto;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--bg); border-radius: 10px; max-width: 720px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); display: flex; flex-direction: column;
    max-height: calc(100vh - 60px);
  }
  .modal-title {
    font-size: var(--fs-title); font-weight: 600; padding: 16px 20px 10px;
    border-bottom: 1px solid var(--border);
  }
  .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  /* 第四十四輪批次 C 組：彈窗入面嘅訊息列。**唔可以係細灰字**——
     佢出現嘅時候，幹事啱啱撳完一粒掣而件事冇發生，要一眼睇得到。 */
  .modal-status {
    margin: 0 20px 12px; padding: 10px 12px; border-radius: 6px;
    font-size: var(--fs-body2); line-height: 1.5; font-weight: 600;
    /* 錯誤用紅（`--danger`），唔用琥珀——琥珀喺呢個專案係
       「對唔上名單但唔一定係錯」嗰種，而呢度係「你撳咗，件事冇發生」。 */
    background: var(--warn-bg); color: var(--danger);
    border: 1px solid var(--danger);
  }
  .modal-status.ok {
    color: var(--ok); border-color: var(--ok);
    background: var(--card-off);
  }
  /* 第四十四輪批次 D 組：「未寄出，仲喺度補產生」嗰個頭。
     ⚠️ **唔可以**用 `.ok-head` 嗰隻綠——幹事見到綠色就會走去印，
     而封信根本未寄出。 */
  .warn-head {
    font-size: var(--fs-body); font-weight: 600; color: var(--danger); margin-bottom: 6px;
  }
  .modal-actions {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-wrap: wrap;
  }

  /* ── 內容元件 ─────────────────────────────────────────── */
  .lines { font-size: var(--fs-body2); margin: 0 0 12px; white-space: pre-wrap; }
  .muted { font-size: var(--fs-hint); color: var(--muted); }
  .sec { margin: 14px 0; }
  .sec-title { font-weight: 600; font-size: var(--fs-body2); margin-bottom: 6px; }
  .sec-warn { border-left: 3px solid var(--warn-border); padding-left: 10px; }
  .sec-summary { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .row-right { justify-content: flex-end; }

  .vio { border-left: 3px solid var(--border); padding: 8px 12px; margin: 10px 0; font-size: var(--fs-hint); }
  .vio-hard { border-color: var(--danger); background: #fce8e611; }
  .vio-warn { border-color: var(--warn-border); background: #fff8e111; }
  .vio-info { border-color: var(--accent); background: #e8f0fe11; }
  .vio-head { font-weight: 600; margin-bottom: 4px; }
  .vio-row { padding: 2px 0; font-size: var(--fs-hint); }
  .ok-line { font-size: var(--fs-body2); padding: 3px 0; }
  .ok-line.strong { font-weight: 600; }

  .warnbox {
    border: 1px solid var(--warn-border); background: var(--warn-bg);
    border-radius: 6px; padding: 10px 12px; margin: 12px 0;
  }
  :root[data-theme="dark"] .warnbox { background: #3a2f10; }

  .err-part { margin-bottom: 12px; }
  .err-label { font-weight: 600; font-size: var(--fs-hint); color: var(--muted); }
  .err-text { font-size: var(--fs-body2); white-space: pre-wrap; }
  .err-list { margin: 4px 0 0; padding-left: 22px; font-size: var(--fs-body2); }
  .err-list li { margin: 3px 0; }

  .tech { margin-top: 14px; }
  .tech-pre {
    background: var(--card-off); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; font-size: var(--fs-note); white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow-y: auto;
  }

  .prop { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .prop.is-off { background: var(--card-off); opacity: .75; }
  .prop.is-optional { border-style: dashed; }
  .prop-head { font-weight: 600; font-size: var(--fs-hint); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .prop-opts { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }

  .radio-row, .check-row {
    display: flex; align-items: center; gap: 7px; font-size: var(--fs-hint); cursor: pointer; padding: 2px 0;
  }
  .check-row.inline { display: inline-flex; margin-right: 12px; }
  .radio-row.is-off { color: var(--muted); cursor: not-allowed; }

  .tag {
    font-size: var(--fs-tiny); padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card-off); font-weight: normal;
  }
  .tag-bad { background: #fce8e6; border-color: #f5c2bd; }

  .confirm-typing {
    border: 1px solid var(--danger); border-radius: 6px;
    padding: 10px 12px; margin-top: 14px;
  }

  /* 第二十五輪批次階段 A5／A6：生成流程同常駐職事表連結 */
  .statuscard-link { margin-top: 6px; font-size: var(--fs-hint); }
  .sheetlink { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .bigLink {
    display: inline-block; margin: 10px 0; padding: 10px 16px;
    background: var(--accent); color: #fff; border-radius: 6px;
    text-decoration: none; font-weight: 600;
  }
  .ok-head { font-size: var(--fs-body); font-weight: 600; color: var(--ok); margin-bottom: 6px; }

  /* 第二十五輪批次階段 B3：「有冇對上名單」嘅回饋。
     兩種都唔係錯誤（外請講員對唔上係正常），所以用綠／琥珀，唔用紅。 */
  .link-ok { font-size: var(--fs-hint); color: var(--ok); margin-top: 4px; }
  .link-warn { font-size: var(--fs-hint); color: var(--warn-fg); margin-top: 4px; }

  /* 第二十五輪批次階段 E：區三名單維護 */
  .idtag {
    font-size: var(--fs-tiny); color: var(--muted); background: var(--card-off);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px;
  }
  .tag-bad { background: #fce8e6; border-color: #f5c2bd; color: #a1160a; }
  .check-row.inline { display: inline-flex; margin-right: 12px; }
  .prop.is-off { opacity: .6; }
  .inp-date { max-width: 10em; }


  /* ══════════════════════════════════════════════════════════════
     第三十九輪批次 B 組：字大、間距闊、載入回饋睇得見
     ══════════════════════════════════════════════════════════════

     Ivan 明講兩件事：**字太細佢讀唔到**，**載入回饋太細睇唔出做緊嘢
     定係做完咗**。所以呢一段唔係「美化」，係可用性。

     ⚠️ 唔用 `zoom`。`zoom` 會連帶放大邊框同陰影、喺唔同瀏覽器行為唔一，
     而且冇得逐個元件微調。改用一個一致嘅字級尺度，逐個元件講明用邊級。

     ⚠️ 呢一段任何一條 `display` 規則都**唔可以**帶 `!important`——
     上面 `[hidden] { display: none !important; }` 係總閘，
     帶 `!important` 就會同佢打架，重現第三十四輪嗰個
    「睇得見、撳得到、但會被靜靜忽略」嘅 bug。
     ────────────────────────────────────────────────────────────── */
  /* 第八十二輪批次 IE 組：字體分三級（頁頂〔字體〕選單，記在瀏覽器；見 Script.html initFontSizePicker）。
     Ivan：重要的提示文字要大至少一倍。所以 `:root` 本身＝「大」（預設；腳本未行到也是大），
     `data-font="standard"`＝第八十一輪之前的字號，`data-font="xlarge"`＝特大。
     ⚠️ 全檔一律用這些變數，不准再寫死 px 字號（tests/round82_ie_font_size.test.js 守住）。
     ⚠️ 「大」「特大」兩級：提示、說明、按鈕下的描述（--fs-tiny 至 --fs-md）一律不可以小於內文 --fs-body。
     代價：字大了，彈窗會變長要捲動、按鈕會換行——所以做成可以選的三級，而不是一律大一倍。 */
  :root {
    --fs-tiny: 18px;   /* 小標籤（.tag、.idtag）；標準級 11px */
    --fs-note: 18px;   /* 附註（.statuscard-sub、.zone-count、.act-why、.badge）；標準級 12px */
    --fs-hint: 18px;   /* 提示、說明（.muted、.act-desc、.vio-row、勾選列）；標準級 13px */
    --fs-body2: 18px;  /* 彈窗內文、小標題；標準級 14px */
    --fs-name: 19px;   /* 按鈕卡名稱；標準級 15px */
    --fs-body: 18px;   /* 內文基準；標準級 16px */
    --fs-title: 20px;  /* 彈窗標題；標準級 17px */
    --fs-h1: 27px;     /* 頁首；標準級 24px */
    --fs-xs: 18px;   /* 附註、機器代號；標準級 13px */
    --fs-sm: 18px;   /* 次要說明；標準級 15px */
    --fs-md: 18px;   /* 內文基準；標準級 16px */
    --fs-lg: 20px;   /* 區塊標題、彈窗標題；標準級 18px */
    --fs-xl: 23px;   /* 主流程每一步嘅標題；標準級 21px */
    --fs-2xl: 28px;  /* 載入回饋、頁首；標準級 26px */
  }
  :root[data-font="standard"] {
    --fs-tiny: 11px; --fs-note: 12px; --fs-hint: 13px; --fs-body2: 14px;
    --fs-name: 15px; --fs-body: 16px; --fs-title: 17px; --fs-h1: 24px;
    --fs-xs: 13px; --fs-sm: 15px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 21px; --fs-2xl: 26px;
  }
  :root[data-font="xlarge"] {
    --fs-tiny: 22px; --fs-note: 22px; --fs-hint: 22px; --fs-body2: 22px;
    --fs-name: 23px; --fs-body: 22px; --fs-title: 24px; --fs-h1: 30px;
    --fs-xs: 22px; --fs-sm: 22px; --fs-md: 22px; --fs-lg: 24px; --fs-xl: 27px; --fs-2xl: 32px;
  }
  /* 字大之後按鈕文字可以換行，不可以撐出畫面或者被截斷。 */
  button { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
  /* 第八十三輪批次 JF 組：**全部** radio／checkbox 跟字體級別放大。
     ⚠️ 唔可以用 `1em`：輸入框唔繼承字號，`1em` 永遠係瀏覽器預設（約 13px），特大級都係咁細。
     所以直接用字號變數（同內文一樣大）；唔逐處寫死、唔排除任何一種。 */
  input[type="checkbox"], input[type="radio"] {
    width: calc(var(--fs-body) * 1.1); height: calc(var(--fs-body) * 1.1);
    flex: 0 0 auto; vertical-align: middle; margin: 0 0.35em 0 0; cursor: pointer;
  }
  .font-pick { display: inline-flex; align-items: center; gap: 6px; }

  /* ── 主流程六步（規格 1.0，第三十九輪 A 組）────────────────
     呢一段要**明顯大過**其餘部分——幹事九成時間只會用呢六粒掣。 */
  .flow { margin-bottom: 22px; }
  .flow-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }
  .flow-head-title { font-size: var(--fs-xl); font-weight: 700; }
  .flow-head-sub { font-size: var(--fs-sm); color: var(--muted); }

  .step {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 16px 18px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card);
  }
  .step-num {
    flex: 0 0 auto; width: 1.9em; height: 1.9em; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: var(--fs-lg); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: var(--fs-xl); font-weight: 700; line-height: 1.35; }
  .step-note { font-size: var(--fs-sm); color: var(--muted); margin-top: 4px; }
  .step-why { font-size: var(--fs-sm); color: var(--warn-fg); margin-top: 6px; }
  .step-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

  /* 主掣：字要大過內文，撳落去唔使諗。 */
  button.step-btn {
    font-size: var(--fs-lg); font-weight: 600;
    padding: 12px 22px; border-radius: 8px; min-height: 48px;
  }
  button.step-btn.secondary { font-weight: 600; }

  /* 進行中：一眼分得出，而且唔可以再撳。 */
  /* 第八十三輪批次 JG 組：〔儲存〕旁邊「儲存中……」 */
  .save-running { font-size: var(--fs-body); font-weight: 600; color: var(--warn-fg); align-self: center; }
  button.is-running {
    background: var(--card-off) !important; color: var(--muted) !important;
    border-color: var(--border) !important; cursor: progress;
  }

  /* 永久連結（第 1 步）*/
  .permalink {
    margin-top: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-left: 4px solid var(--ok);
    border-radius: 8px; background: var(--card-off);
  }
  .permalink-label { font-size: var(--fs-sm); font-weight: 600; }
  .permalink-url {
    font-size: var(--fs-sm); word-break: break-all; margin: 6px 0 8px;
    color: var(--accent);
  }
  .permalink-note { font-size: var(--fs-xs); color: var(--muted); margin-top: 8px; }

  /* ── 載入回饋（規格 B2）──────────────────────────────────
     舊嗰句細灰字「重新整理…」唔夠。呢個係一塊蓋住畫面中央嘅牌，
     講明**做緊咩**，做完講明**已完成**，而且停留夠耐俾人睇到。 */
  .busy-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .35);
  }
  .busy-card {
    background: var(--card); border: 1px solid var(--border);
    border-left: 6px solid var(--accent);
    border-radius: 12px; padding: 26px 32px; min-width: 280px; max-width: 90vw;
    box-shadow: 0 12px 44px rgba(0, 0, 0, .35); text-align: center;
  }
  .busy-title { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.4; }
  .busy-sub { font-size: var(--fs-md); color: var(--muted); margin-top: 8px; }
  .busy-bar {
    margin-top: 14px; height: 10px; border-radius: 999px;
    background: var(--card-off); border: 1px solid var(--border); overflow: hidden;
  }
  .busy-bar-fill { height: 100%; background: var(--accent); width: 0; }
  .busy-card.is-done { border-left-color: var(--ok); }
  .busy-card.is-done .busy-title { color: var(--ok); }
  .busy-card.is-fail { border-left-color: var(--danger); }
  .busy-card.is-fail .busy-title { color: var(--danger); }


  /* 第四十三輪批次 F 組：自行輸入電郵，格式唔啱即刻標紅。
     ⚠️ 唔可以等佢撳落去先講——嗰陣佢已經行咗三步。 */
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); }
  .bad-input { border-color: var(--danger); background: var(--warn-bg); }
  /* ── 忙碌鎖（第四十三輪批次 A 組）─────────────────────────
     Ivan 現場：撳「儲存我的修改」之後三十幾秒，全部掣照樣撳得到，
     而畫面睇落好似已經做完。佢話「好易令我誤撳其他掣，或者再撳一次儲存」。

     ⚠️ 用 body class 而唔係逐粒掣設 disabled，係因為**動作期間會重畫**
     （ 會 clear 再 appendChild）。逐粒設嘅話，
     重畫出嚟嗰批新掣冇人幫佢哋設過 ⇒ 鎖自己冇咗。
     一條 CSS 規則就冇呢個問題：新節點一樣喺 body 入面。

     ⚠️ `.busy-overlay` 一定要排除，否則連中央嗰塊牌都會被熄掉
     （佢自己唔使撳，但將來加「取消」掣就會撳唔到）。 */
  body.is-busy { cursor: progress; }
  body.is-busy > *:not(.busy-overlay) { pointer-events: none; }
  body.is-busy > *:not(.busy-overlay) button,
  body.is-busy > *:not(.busy-overlay) select,
  body.is-busy > *:not(.busy-overlay) a { opacity: .55; }

  /* 忙碌牌上面嗰個「已經等咗幾多秒」。⚠️ 呢個係**真嘅計時**，
     唔係一個扮出嚟嘅進度——見 `busyShow()` 嘅說明。 */
  .busy-elapsed { font-size: var(--fs-sm); color: var(--muted); margin-top: 10px; }
  .busy-steps { font-size: var(--fs-sm); color: var(--muted); margin-top: 10px; text-align: left; }
  .busy-steps li { margin: 2px 0; }
  /* ── 大字彈窗（第四十一輪批次 D 組）──────────────────────
     Ivan 實測第 3 步嗰個預覽：「字太細」。嗰個窗一次要睇幾十行，
     而佢要逐行核對「係咪真係想改呢一項」。

     ⚠️ **只加一個有前綴嘅 scope，唔改任何現有 selector。**
     `Style.html` 因為改咗現有規則而出過事兩次（`[hidden]` 被覆蓋）。
     加一個新 class，冇用嗰度一啲影響都冇。

     ⚠️ 亦都唔用 `!important`。要覆蓋嘅嗰幾條全部係單一 class
     （`.vio-row` 等等），`.dlg-lg .vio-row` 兩個 class 已經夠特異。 */
  .dlg-lg { font-size: var(--fs-md); }
  .dlg-lg .vio-row,
  .dlg-lg .ok-line,
  .dlg-lg .radio-row,
  .dlg-lg .check-row,
  .dlg-lg .lines { font-size: var(--fs-md); line-height: 1.5; }
  .dlg-lg .muted { font-size: var(--fs-sm); }
  .dlg-lg .sec-title { font-size: var(--fs-lg); }
  .dlg-lg .prop-head { font-size: var(--fs-md); }
  /* 勾選框本身都要大——手指撳得中先算得上「勾得到」（第八十三輪批次 JF 組起由上面全域規則負責）。 */

  /* ── 手機／平板 ───────────────────────────────────────────
     幹事有機會用平板或手機開。呢度只放大同換行，唔改任何行為。 */
  @media (max-width: 700px) {
    body { padding: 14px; font-size: var(--fs-md); }
    .step { flex-direction: column; gap: 10px; padding: 14px; }
    .step-acts { flex-direction: column; align-items: stretch; }
    button.step-btn { width: 100%; }
    .busy-card { padding: 20px 22px; }
    .busy-title { font-size: var(--fs-xl); }
  }

  /* ── 深色模式 ─────────────────────────────────────────── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --fg: #e6edf3; --muted: #9198a1; --border: #30363d;
      --card: #1c1f26; --card-off: #22262e; --warn-bg: #3a2f10; --warn-border: #7a6420;
      --danger: #f2867c; --ok: #6cc07f;
      --disabled-bg: #24282f; --disabled-fg: #6a7078; --disabled-border: #343a42;
      --warn-fg: #d8a838;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --fg: #e6edf3; --muted: #9198a1; --border: #30363d;
    --card: #1c1f26; --card-off: #22262e; --warn-bg: #3a2f10; --warn-border: #7a6420;
    --danger: #f2867c; --ok: #6cc07f;
    --disabled-bg: #24282f; --disabled-fg: #6a7078; --disabled-border: #343a42;
    --warn-fg: #d8a838;
  }
</style>
