<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --border: #d0d7de;
    --accent: #1a73e8;
    --ok: #ffffff;
    --warning: #fff2cc;
    --forced: #f9cb9c;
    --skipped: #efefef;
    /* 第十輪批次階段 A：「系統應該排但排不出」專用色，跟 grid 工作表的
       GRID_PENDING_FILL_COLOR 同一隻粉紅——一種顏色一個意思。 */
    --gap: #f4cccc;
    --header: #d9ead3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
  }

  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 18px;
  }

  label { font-size: 13px; color: var(--muted); }

  select, button {
    font: inherit;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
  }

  button {
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button.secondary { background: #fff; color: var(--fg); border-color: var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .status {
    min-height: 22px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .status.error { color: #b3261e; }

  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .panel[hidden] { display: none; }

  .scroll { overflow-x: auto; }

  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
    white-space: nowrap;
  }
  thead th { background: var(--header); position: sticky; top: 0; }

  td.warning { background: var(--warning); }
  td.forced  { background: var(--forced); }
  td.skipped { background: var(--skipped); color: var(--muted); }
  /* 第十輪批次階段 A：排唔出嘅格唔用灰色淡字——佢係唯一真正要人跟進嘅一類，
     要突出，唔係要淡化。 */
  td.gap     { background: var(--gap); font-weight: 600; }
  td.meta    { color: var(--muted); }

  tr.section td { background: #d9d9d9; font-weight: 600; }
  tr.deviates td { background: var(--warning); }

  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .summary span { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; }
  .summary span.bad { background: #fce8e6; border-color: #f5c2bd; }
  .summary span.good { background: #e6f4ea; border-color: #b7e1c1; }

  .badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
  }
  .badge.stage { background: #e8f0fe; border-color: #c6dafc; }
  .badge.dryrun-on { background: #e6f4ea; border-color: #b7e1c1; }
  .badge.dryrun-off { background: #fce8e6; border-color: #f5c2bd; font-weight: 600; }

  .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }

  .step-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .step-card.locked { opacity: .55; }
  .step-card.available { border-color: var(--accent); }
  .step-card.done { background: #e6f4ea11; }

  .step-title { font-weight: 600; font-size: 14px; }
  .step-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .step-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .wizard-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .wizard-lines { font-size: 13px; white-space: pre-wrap; margin: 0 0 14px; line-height: 1.7; }
  .wizard-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .violation-block { border-left: 3px solid var(--border); padding: 8px 12px; margin: 10px 0; font-size: 13px; }
  .violation-block.hard { border-color: #b3261e; background: #fce8e611; }
  .violation-block.other { border-color: #c88a00; background: #fff2cc11; }
  .violation-row { padding: 2px 0; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); margin-left: 6px; }
  .tag.no-email { background: #fce8e6; border-color: #f5c2bd; }
  .tag.first-notify { background: #e8f0fe; border-color: #c6dafc; }
  .tag.no-assign { background: #efefef; }

  .release-box {
    border: 1px solid #b3261e;
    background: #fce8e611;
    border-radius: 8px;
    padding: 12px 14px;
    margin: 12px 0;
  }
  .release-box input { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); width: 220px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e6edf3; --muted: #9198a1; --border: #30363d;
      --ok: #16181d; --warning: #4a3f1a; --forced: #5a3b1c; --skipped: #24272e;
      --gap: #5c2b2b;
      --header: #24402a;
    }
    select, button.secondary { background: #1f232b; color: var(--fg); }
    tr.section td { background: #2a2f37; }
    .badge, .badge.stage, .badge.dryrun-on, .badge.dryrun-off { background: #1f232b; }
    .violation-block.hard, .violation-block.other, .release-box { background: transparent; }
  }
</style>
