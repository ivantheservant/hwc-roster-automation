<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= includeHtml('ui/Style') ?>
</head>
<body>
  <!--
    第二十四輪批次階段 B：幹事介面四區改造。
    對應 docs/幹事介面規格.md 第 1.1 節嘅頁面骨架。

    警告：呢個檔案完全冇任何資料注入（冇會轉義嘅輸出標籤）。
    全部資料一律經 google.script.run 攞——用會轉義嗰個輸出標籤配
    JSON.stringify 會令前端收到帶引號嘅字串，係本專案已知嘅紅線
    （第十九輪撞過）。新增畫面一律沿用 callServer()。

    注意：HtmlService 嘅樣板引擎唔理呢個係咪 HTML 註解，
    輸出標籤照樣會編譯——所以呢段警告刻意唔寫出實際嘅標籤符號，
    改用文字描述。
  -->

  <header class="topbar">
    <div class="topbar-main">
      <h1>粵語堂職事表</h1>
      <div class="quarter-row">
        <label for="quarter">季度</label>
        <select id="quarter"></select>
        <span class="badge" id="dryRunBadge" hidden></span>
        <!--
          第四十一輪批次 H 組：轉寄測試地址。
          ⚠️ 佢最壞嘅失敗方式係「唔記得閂」——上線之後全體一封都收唔到，
          而所有畫面同報告都會話一切正常。所以介面頂部一定要有呢個標籤。
        -->
        <span class="badge" id="mailRedirectBadge" hidden></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btnRefresh" class="secondary" type="button">重新整理</button>
      <button id="themeToggleBtn" class="secondary" type="button">🌙 深色模式</button>
    </div>
  </header>

  <div class="status" id="status"></div>

  <!-- 狀態卡：一句人話 ＋ 第二行細字寫版本（規格 1.2） -->
  <section class="statuscard" id="statusCard" hidden>
    <div class="statuscard-title" id="statusText"></div>
    <div class="statuscard-sub" id="statusVersion"></div>
    <!-- 常駐「開啟職事表」連結（第二十五輪階段 A6）。開唔到嗰陣整行收起。 -->
    <div class="statuscard-link" id="statusLink" hidden></div>
  </section>


  <!--
    第三十九輪批次 A 組：主流程六步。

    幹事九成時間只用呢六件事，順序固定。放喺最頂、字大、間距闊。
    落面四區嘅內容**一樣都冇刪**，只係收咗落去。
  -->
  <section class="flow" id="mainFlow">
    <div class="flow-head">
      <span class="flow-head-title">主流程</span>
      <span class="flow-head-sub">由上而下做，六步</span>
    </div>
    <div id="mainFlowBody"></div>
  </section>
  <!-- 開季前準備（每季開頭做一次；未做完 >0 時展開）-->
  <section class="zone" id="zone2">
    <button class="zone-head" id="zone2Head" type="button" aria-expanded="false">
      <span class="zone-title">開季前準備</span>
      <span class="zone-count" id="zone2Hint">每季開頭做一次</span>
      <span class="zone-count" id="zone2Count"></span>
      <span class="zone-caret">▾</span>
    </button>
    <div class="zone-body" id="zone2Body" hidden></div>
  </section>

  <!--
    區一：第三十九輪批次 E 組起，日常那幾粒掣已經搬上「主流程」。
    ⚠️ 這個容器刻意保留：renderZone1() 仍然會畫進去，而且原有那幾份
    測試守住它的行為。搬位置不等於刪功能。
    預設收起——同一組掣不需要在畫面上出現兩次。
  -->
  <section class="zone" id="zone1" hidden>
    <div class="zone-head static">
      <span class="zone-title">區一　日常（已經搬上「主流程」）</span>
    </div>
    <div class="zone-body" id="zone1Body"></div>
  </section>

  <!-- 名單維護（改人、改資格、改偏好）-->
  <section class="zone" id="zone3">
    <button class="zone-head" id="zone3Head" type="button" aria-expanded="false">
      <span class="zone-title">名單維護</span>
      <span class="zone-count">改人、改資格、改偏好</span>
      <span class="zone-caret">▾</span>
    </button>
    <div class="zone-body" id="zone3Body" hidden></div>
  </section>

  <!-- 進階與診斷（出事或者要查數先用）-->
  <section class="zone" id="zone4">
    <button class="zone-head" id="zone4Head" type="button" aria-expanded="false">
      <span class="zone-title">進階與診斷</span>
      <span class="zone-count">出事或者要查數先用</span>
      <span class="zone-caret">▾</span>
    </button>
    <div class="zone-body" id="zone4Body" hidden></div>
  </section>

  <!-- 共用彈窗容器：一個動作只有一個確認畫面（規格 1.4） -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!--
    ⚠️ 載入次序：共通嗰個一定要行先——後面三個檔案會用到
    callServer()／runAction()／openModal() 等共通函式。
  -->
  <?!= includeHtml('ui/Script') ?>
  <?!= includeHtml('ui/ScriptZone1') ?>
  <?!= includeHtml('ui/ScriptZone2') ?>
  <?!= includeHtml('ui/ScriptZone3') ?>
  <?!= includeHtml('ui/ScriptZone4') ?>
  <?!= includeHtml('ui/ScriptMainFlow') ?>
  <?!= includeHtml('ui/ScriptSendPaper') ?>
  <?!= includeHtml('ui/ScriptSuggestion') ?>
  <?!= includeHtml('ui/ScriptRollback') ?>
  <?!= includeHtml('ui/ScriptBoot') ?>
</body>
</html>
