<script>
  /* ============================================================
   * 第二十四輪批次階段 C／D：區一——日常四個掣
   * ============================================================
   *
   * 對應 docs/幹事介面規格.md 第二節。
   *
   * 一條總原則（規格 1.7）：
   *   **掣 1 係唯一會改動職事表內容嘅掣。掣 2／3／4 只寄信，永不改內容。**
   */

  /** 規格 2.2：四粒掣嘅名。 */
  const ZONE1_BUTTONS = [
    { key: 'save', name: '儲存並確認', label: '開始', danger: false },
    { key: 'review', name: '寄給堂委審閱', label: '寄出', danger: false },
    { key: 'official', name: '正式發出給全體', label: '發出', danger: true },
    { key: 'resend', name: '改動後重發', label: '重發', danger: true }
  ];

  function renderZone1(d) {
    const body = clear(el('zone1Body'));

    // ── 第二十五輪批次階段 A4：區一有**兩種形態** ─────────────────
    //
    // 未有版本 ⇒ 只顯示「生成初稿」，四粒日常掣完全唔出現。
    //
    // 點解唔係「一粒生得、四粒變灰」：對幹事嚟講，四粒撳唔到嘅掣係噪音。
    // 佢要做嘅嘢只有一件，畫面就應該只有一件。四粒灰掣只會令佢問
    //「係咪壞咗」，而唔會令佢更快搵到應該撳邊粒。
    //
    // 已有版本 ⇒「生成初稿」消失，四粒日常掣出現。
    // 重新生成（覆蓋式）唔喺呢度，留喺區四「進階功能」——嗰個係
    // 會覆蓋現有安排嘅動作，唔應該同日常操作擺埋一齊。
    if (!d.latestVersion) {
      const g = (d.buttons && d.buttons.generate) || {};
      body.appendChild(bigButton({
        buttonName: '生成初稿',
        dynamicText: g.dynamicText,
        disabledReason: g.disabledReason,
        enabled: g.enabled !== false,
        buttonLabel: '生成',
        danger: false,
        onClick: openGenerateDraft
      }));
      return;
    }

    const handlers = {
      save: openSaveAndConfirm,
      review: openReview,
      official: openOfficial,
      resend: openResend
    };
    ZONE1_BUTTONS.forEach((b) => {
      const state = (d.buttons && d.buttons[b.key]) || {};
      body.appendChild(bigButton({
        buttonName: b.name,
        dynamicText: state.dynamicText,
        disabledReason: state.disabledReason,
        enabled: !!state.enabled,
        buttonLabel: b.label,
        danger: b.danger,
        onClick: handlers[b.key]
      }));
    });
  }

  /* ============================================================
   * 掣 0：生成初稿（規格 2.1，第二十五輪批次階段 A5）
   * ============================================================ */

  function openGenerateDraft() {
    runAction('讀取資料', async () => {
      const plan = await callServer('apiGenerateDraftPlan', currentQuarterId);
      if (plan.blocked) {
        showErrorModal('生成初稿', new Error(plan.message || plan.blockReason));
        return;
      }
      renderGenerateConfirm(plan);
    });
  }

  function renderGenerateConfirm(plan) {
    const facts = make('div', { className: 'sec' }, [
      sectionTitle('會做的事：'),
      make('div', {
        text: '・' + plan.serviceDateCount + ' 個主日、' + plan.postCount + ' 個崗位',
        className: 'vio-row'
      }),
      make('div', {
        text: '・系統會試 ' + plan.attemptsPlanned + ' 次不同排法，選最平均那一次',
        className: 'vio-row'
      }),
      make('div', {
        text: '・講員、翻譯、獻花不會自動排，要你之後人手填',
        className: 'vio-row'
      }),
      make('div', { text: '・不會寄出任何電郵', className: 'vio-row' })
    ]);

    // 生成係**可逆**嘅：唔會寄信、唔會覆蓋任何嘢（冇版本先撳得到）。
    // 所以唔需要打字確認——打字確認留返俾真正不可逆嘅動作（掣 3／掣 4）。
    // 每個動作都要打字，打字就會變成一個機械動作，到真正危險嗰次就冇咗作用。
    openConfirm({
      title: '生成 ' + (plan.quarterLabel || plan.quarterId) + ' 的初稿',
      bodyNodes: [
        facts,
        para('可能需要一至數分鐘，過程中不要關掉這個視窗。')
      ],
      confirmLabel: '開始生成',
      onConfirm: () => executeGenerateDraft()
    });
  }

  function executeGenerateDraft() {
    // 執行中：整頁掣停用（runAction 嘅 setBusy 已經做咗），
    // 再加一個明確嘅「已經開始」訊息——生成要跑幾分鐘，冇呢句嘅話
    // 幹事會以為撳咗冇反應，而去撳多次或者重新整理。
    openModal('正在生成初稿', [
      para('正在生成……已經開始，請不要關掉視窗或重新整理。'),
      para('這一步要跑幾分鐘。完成之後這個視窗會自動變成結果畫面。', 'muted')
    ], []);

    runAction('生成初稿', async () => {
      const res = await callServerMutating('apiGenerateDraftExecute', currentQuarterId);
      renderGenerateResult(res);
    });
  }

  function renderGenerateResult(res) {
    if (!res.ok) {
      showErrorModal('生成初稿', new Error(res.message || '生成失敗'));
      return;
    }

    const nodes = [
      make('div', {
        text: '已生成初稿（第 ' + res.versionNo + ' 版）',
        className: 'ok-head'
      }),
      make('div', {
        text: res.serviceDateCount + ' 個主日、' + res.postCount + ' 個崗位'
          + (res.genuineGapCount > 0 ? '、有 ' + res.genuineGapCount + ' 格未能安排' : ''),
        className: 'lines'
      })
    ];

    // -1 ＝ 算唔到。唔可以當成 0（0 等於話「檢查過，冇嘢要填」）。
    if (res.manualPendingCount > 0) {
      nodes.push(make('div', {
        text: '另有 ' + res.manualPendingCount + ' 格是要你人手填的（講員、翻譯、獻花），'
          + '這不算問題。',
        className: 'muted'
      }));
    }

    // 階段 A7：跑少咗次數一定要講出嚟。**唔可以靜靜接受一個較差嘅結果**
    // ——排表品質下降而幹事完全唔知，係最差嘅一種失敗。
    if (res.stoppedByTime) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這次只試了 ' + res.attemptsRun + ' 次（原定 ' + res.attemptsPlanned
            + ' 次），因為時間快要不夠。',
          className: 'warn-head'
        }),
        make('div', {
          text: '初稿仍然可以用，只是「選最平均那一次」的挑選範圍比平時窄。'
            + '如果想試足全部次數，請用試算表選單的「生成職事表」重做一次。',
          className: 'lines'
        })
      ]));
    }

    // 階段 A2-1：發佈失敗係**黃色**唔係紅色——版本真係建立咗。
    // 而且要明確講「寄給堂委之前要先補返」，否則幹事會直接撳掣 2
    // 而寄出一封冇連結嘅信。
    if (res.publishFailed) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '初稿已經生成好（第 ' + res.versionNo + ' 版）。'
            + '但公開連結未能建立（原因：' + (res.publishFailMessage || '不明') + '）。',
          className: 'warn-head'
        }),
        make('div', {
          text: '在寄給堂委之前，請去「進階功能 ▸ 重新發佈公開連結」再試一次。'
            + '沒有公開連結的話，「寄給堂委審閱」會拒絕執行。',
          className: 'lines'
        })
      ]));
    }

    if (res.sheetUrl) {
      const a = document.createElement('a');
      a.href = res.sheetUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '開啟職事表檢查同修改';
      a.className = 'bigLink';
      nodes.push(a);
    }
    nodes.push(para('在試算表直接改格子，改完回來撳「儲存並確認」。'));

    // 「還有 N 項未做」——真數字，唔係寫死。
    const pq = res.preQuarter || {};
    if (pq.undoneItemCount === -1) {
      nodes.push(make('div', {
        text: '「開季前準備」還有多少項未做，暫時查不到。開回主畫面看看。',
        className: 'muted'
      }));
    } else if (pq.undoneItemCount > 0) {
      const detail = (pq.items || [])
        .filter((i) => i.count > 0)
        .map((i) => i.label + ' ' + i.count)
        .join('、');
      nodes.push(make('div', {
        text: '另外「開季前準備」還有 ' + pq.undoneItemCount + ' 項未做'
          + (detail ? '（' + detail + '）' : '') + '。',
        className: 'lines'
      }));
    }

    openModal('生成完成', nodes, [button('知道了', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 掣 1：儲存並確認（規格 2.4）
   * ============================================================ */

  /** 掣 1 嘅暫存狀態：由 plan 攞返嚟，逐格決定存喺呢度。 */
  let savePlan = null;
  let saveDecisions = {};

  /**
   * 第三十九輪批次 A 組第 3 步：**完全沒有問題就不要彈窗。**
   *
   * 幹事改一格、撳「儲存我的修改」，如果一切正常，他不需要看一個
   * 有五節內容的確認畫面再撳多一次「確定」。彈一個沒有東西要他決定的窗，
   * 只會訓練他不看內容就撳確定——而下一次真的有東西要看的時候，
   * 他一樣不會看。
   *
   * ⚠️ 「完全沒有問題」的定義刻意寫得**嚴**：任何一項有東西，就照舊彈窗。
   * 判斷錯的代價不對稱——多彈一個窗只是麻煩，少彈一個就是靜靜改了東西。
   *
   * @param {Object} plan `apiSaveAndConfirmPlan` 的結果
   * @returns {boolean} 可不可以直接儲存
   */
  function saveIsCompletelyClean(plan) {
    const v = plan.violations || {};
    const r = plan.requests || {};
    return (v.real || []).length === 0
      && (v.semiHard || []).length === 0
      && (v.released || []).length === 0
      && (r.confirm || []).length === 0
      && (r.needsInput || []).length === 0
      && (plan.overlaps || []).length === 0
      && (plan.unresolved || []).length === 0
      && !plan.needsRelease
      // 有申報要套用就一定要彈——那不是他改的東西，他有權先看一眼。
      && (r.apply || []).length === 0
      // 真的有東西要儲存，才走這條快路。
      && (plan.gridChanges || []).length > 0;
  }

  function openSaveAndConfirm() {
    runAction('讀取改動', async () => {
      savePlan = await callServer('apiSaveAndConfirmPlan', currentQuarterId);
      saveDecisions = {};

      if (savePlan.blocked) return renderSaveBlocked(savePlan);
      if (savePlan.zeroChange) return renderSaveZeroChange(savePlan);
      // 第三十九輪批次 A 組第 3 步：一切正常就直接儲存，唔彈窗。
      if (saveIsCompletelyClean(savePlan)) return executeCleanSave(savePlan);
      renderSaveMain(savePlan);
    });
  }

  /* ── C1：三種阻擋 ────────────────────────────────────────── */

  function renderSaveBlocked(plan) {
    // 認唔出姓名：**只顯示呢一件事，唔顯示之後任何嘢。**
    // 唔提供「略過繼續」——認唔出就係認唔出，猜就係 bug 嘅溫床。
    if (plan.blockReason === 'UNRESOLVED_NAMES') {
      const nodes = [
        make('div', {
          text: '有 ' + plan.unresolved.length + ' 格的文字，系統認不出是誰。',
          className: 'err-label'
        }),
        para('在處理好這幾格之前，不會儲存任何東西，也不會建立新版本。'
          + '職事表現在完全沒有被改動。')
      ];

      const list = make('div', { className: 'sec' }, [sectionTitle('是這幾格：')]);
      // ⚠️ 第三十五輪批次 B 組：**兩個值都要印。**
      // 只印一個就永遠分唔出係邊一邊出事——之前就係只印「你打了」，
      // 而嗰個值因為欄位名錯咗永遠係空，結果對話框話幹事打咗空白，
      // 但 grid 上明明有字。幹事會照住去改一格本來冇問題嘅嘢。
      plan.unresolved.forEach((u) => {
        const box = make('div', { className: 'prop' });
        box.appendChild(make('div', {
          text: u.serviceDate + '　' + (u.postNameTC || u.postId || '')
            + (Number(u.slotIndex) > 1 ? (' ' + u.slotIndex) : ''),
          className: 'prop-head'
        }));
        box.appendChild(make('div', {
          text: '　　本來應該是：「' + (u.expectedText || '（空白）') + '」'
            + '　　格內現在是：「' + (u.gridText || u.rawText || u.text || '（空白）') + '」',
          className: 'muted'
        }));
        // ⚠️ 第四十輪批次 D 組：一粒〔立即加入這個人〕。
        //
        // 唔加〔照樣儲存〕嘅理由寫喺 `src/UnresolvedNameFix.gs` 檔頭：
        // 一個系統認唔出嘅名冇 PersonID，所以嗰一格對嗰個人**完全冇作用**
        // ——收唔到信、冇個人 PDF、唔會計入服侍次數、唔會被任何規則檢查覆蓋。
        //
        // 但幹事嘅需要係真實嘅（借調、外請、新人），所以補一個出口：
        // 喺同一個對話框加咗佢，然後自動重新檢查。
        box.appendChild(row([
          button('立即加入這個人', () => openAddUnresolvedPerson(u), '')
        ]));
        list.appendChild(box);
      });
      nodes.push(list);

      const how = make('div', { className: 'sec' }, [sectionTitle('或者這樣處理：')]);
      const ul = make('ul', { className: 'err-list' });
      ul.appendChild(make('li', { text: '如果打錯字，回到職事表把那一格改回正確的名字' }));
      ul.appendChild(make('li', { text: '如果是同一個人的另一種寫法，去「名單維護 ▸ 人員與電郵 ▸ 別名」加別名（下一輪才搬上來，暫時請用試算表的 NameAlias 工作表）' }));
      how.appendChild(ul);
      nodes.push(how);

      // ⚠️ 為什麼沒有〔照樣儲存〕——這一句一定要寫出來，否則幹事只會覺得
      // 系統無理取鬧。理由的全文在 `src/UnresolvedNameFix.gs` 檔頭。
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '這裡沒有「照樣儲存」，是刻意的：系統認不出的名字沒有內部編號，'
            + '存了之後那一格對那個人完全沒有作用——他收不到信、沒有個人 PDF、'
            + '不會被計入服侍次數，而且不會有任何錯誤訊息。',
          className: 'lines'
        })
      ]));

      openModal('儲存並確認：有名字認不出', nodes, [
        button('知道了，我去改', () => closeModal(), '')
      ]);
      return;
    }

    // NO_VERSION／GRID_SHEET_MISSING：後端已經俾咗三段式訊息。
    showErrorModal('儲存並確認', new Error(plan.message || plan.blockReason));
  }

  /* ── D4／零改動兩種路徑 ─────────────────────────────────── */

  function renderSaveZeroChange(plan) {
    if (plan.zeroChangeAction === 'ADVANCE_STAGE_ONLY') {
      openConfirm({
        title: '儲存並確認：堂委沒有提出改動',
        bodyNodes: [
          para('堂委沒有提出改動。撳下去就當作意見已收齊，'
            + '「正式發出給全體」會亮起。職事表內容不會改變。'),
          make('div', { className: 'sec' }, [
            sectionTitle('會做的事：'),
            make('div', { text: '・把這一季的進度推前到「意見已收齊」', className: 'vio-row' }),
            make('div', { text: '・重新發佈公開連結（連結地址不變）', className: 'vio-row' }),
            sectionTitle('不會做的事：'),
            make('div', { text: '・不會建立新版本', className: 'vio-row' }),
            make('div', { text: '・不會改動職事表任何一格', className: 'vio-row' }),
            make('div', { text: '・不會寄出任何電郵', className: 'vio-row' })
          ])
        ],
        confirmLabel: '確定，意見已收齊',
        onConfirm: () => executeSaveAndConfirm('')
      });
      return;
    }

    openModal('儲存並確認', [
      para('沒有偵測到任何改動，不需要儲存。'
        + (plan.stage === 'REQUESTS_APPLIED' ? '可以撳「正式發出給全體」了。' : '')
        + (plan.stage === 'OFFICIAL_SENT' ? '這一季已經正式發出過了。' : ''))
    ], [button('知道了', () => closeModal(), '')]);
  }

  /* ══════════════════════════════════════════════════════════════
   * 第四十輪批次 D 組：〔立即加入這個人〕
   * ══════════════════════════════════════════════════════════════
   *
   * 唔加〔照樣儲存〕嘅理由喺 `src/UnresolvedNameFix.gs` 檔頭。
   * 呢度做嘅係補一個出口：喺同一個對話框加咗佢，然後**自動重新檢查**
   * ——嗰一項應該即刻消失，唔使佢自己再撳一次儲存。
   *
   * ⚠️ 第四十一輪批次 D 組：第 3 步（崗位名單）都要用返呢一粒掣。
   * 所以「加完之後行邊個重新檢查」抽咗做參數 `onDone`——**唔係另寫一份**。
   * 寫兩份嘅話，兩邊嘅撞名提示、冇電郵提示會慢慢長得唔一樣，
   * 而幹事會覺得同一粒掣喺兩個地方行為唔同。
   *
   * @param {Object} u 認唔出嗰一項
   * @param {Function=} onDone 加完之後行乜。唔傳就重新行一次「儲存並確認」。
   */
  function openAddUnresolvedPerson(u, onDone) {
    const done = onDone || openSaveAndConfirm;
    const typed = String(u.gridText || u.rawText || u.text || '').trim();
    const postName = u.postNameTC || u.postId || '';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = typed;          // 已經填好——佢啱啱先打過一次
    const enInput = document.createElement('input');
    enInput.type = 'text';
    enInput.placeholder = '可以留空';
    const emailInput = document.createElement('input');
    emailInput.type = 'text';
    emailInput.placeholder = '可以留空';

    // 順帶問一句：同時讓他可以做該崗位。
    // 預設**勾選**——他既然被排在那一格，多數就是要做那個崗位。
    const eligRow = make('label', { className: 'check-row' });
    const eligCb = document.createElement('input');
    eligCb.type = 'checkbox';
    eligCb.checked = true;
    eligRow.appendChild(eligCb);
    eligRow.appendChild(make('span', {
      text: '同時讓他可以做「' + postName + '」'
    }));

    const field = (label, input) => make('div', { className: 'sec' }, [
      make('div', { text: label, className: 'sec-title' }), input
    ]);

    openConfirm({
      title: '加入「' + typed + '」',
      bodyNodes: [
        para('加入之後會自動重新檢查，這一項應該即刻消失。'),
        field('中文名', nameInput),
        field('英文名', enInput),
        field('電郵', emailInput),
        make('div', { className: 'sec' }, [eligRow]),
        // ⚠️ 冇電郵係合法嘅（現時就有幾位），但一定要提——
        // 唔提嘅話幹事會以為加完就萬事俱備，然後嗰個人一直收唔到信。
        make('div', {
          text: '沒有電郵的人收不到信，要用第 5 步印紙本給他。',
          className: 'muted'
        })
      ],
      confirmLabel: '加入',
      onConfirm: () => {
        const nameTC = nameInput.value.trim();
        if (!nameTC) { setStatus('中文名不可以留空。', true); return; }
        closeModal();
        runAction('加入' + nameTC, async () => {
          const r = await callServerMutating('apiAddPersonForUnresolvedName', {
            nameTC: nameTC,
            nameEN: enInput.value.trim(),
            email: emailInput.value.trim(),
            postId: u.postId,
            alsoEligible: eligCb.checked
          });
          if (!r.ok) { showErrorModal('加入這個人', new Error(r.message)); return; }

          // ⚠️ 撞名只係提示，唔阻擋——真係有兩個同名嘅人係正常事。
          // 但一定要講出嚟，否則佢會以為加咗落原本嗰一個度。
          if (r.duplicateWarning) {
            openModal('加入完成（但要看一眼）', [
              make('div', { text: r.message, className: 'ok-head' }),
              make('div', { className: 'warnbox' }, [
                make('div', { text: r.duplicateWarning, className: 'lines' })
              ]),
              para(r.noEmailNote || '', 'muted')
            ], [button('繼續，重新檢查', () => { closeModal(); done(); }, '')]);
            return;
          }

          // ⚠️ **自動重新檢查**：直接再行一次儲存流程。
          // 唔自動嘅話佢要自己記得再撳一次，而佢多數會以為加完就搞掂。
          if (r.noEmailNote) setStatus(r.noEmailNote);
          done();
        });
      }
    });
  }

  /* ── C2：正常流程（一個彈窗，由上而下五節）────────────────── */

  function renderSaveMain(plan) {
    const nodes = [];

    // 1　待處理申報
    if (plan.requests.apply.length > 0) {
      nodes.push(listSection('會自動套用的修改申報（' + plan.requests.apply.length + ' 筆）',
        plan.requests.apply, requestRow));
    }
    if (plan.requests.confirm.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('需要你逐筆確認（' + plan.requests.confirm.length + ' 筆）'),
        make('div', {
          text: '這幾位以前未做過該崗位。勾了才會套用；不勾就會記為「已拒絕」。',
          className: 'muted'
        })
      ]);
      plan.requests.confirm.forEach((r) => {
        const line = make('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.sheetRow = String(r.sheetRow);
        cb.className = 'req-confirm';
        line.appendChild(cb);
        line.appendChild(make('span', {
          text: r.serviceDateText + '　' + r.postNameText + '　' + r.personNameText
            + (r.reason ? '（' + r.reason + '）' : '')
        }));
        box.appendChild(line);
      });
      nodes.push(box);
    }
    if (plan.requests.needsInput.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('系統看不懂的申報（' + plan.requests.needsInput.length + ' 筆）'),
        make('div', {
          text: '這幾筆會原封不動留在申報表，你可以之後自己處理。不會阻擋這次儲存。',
          className: 'muted'
        })
      ]);
      plan.requests.needsInput.forEach((r) => box.appendChild(requestRow(r)));
      nodes.push(box);
    }

    // 2　重疊格（grid 贏）
    if (plan.overlaps && plan.overlaps.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('以下 ' + plan.overlaps.length + ' 格你在表上改過，同時亦有修改申報'),
        make('div', { text: '系統會以你表上的為準：', className: 'muted' })
      ]);
      plan.overlaps.forEach((o) => {
        box.appendChild(make('div', {
          text: o.serviceDate + '　' + o.postNameTC + '#' + o.slotIndex
            + '　申報想改成「' + (o.requestWants || '（空白）') + '」'
            + '　你表上是「' + o.gridHas + '」',
          className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    // 3　規則檢查
    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('規則檢查'),
      renderViolations(plan.violations)
    ]));

    // 4　三欄對照
    if (plan.proposals && plan.proposals.length > 0) {
      nodes.push(renderProposalTable(plan.proposals));
    }

    // 5　確認畫面（規格步 1.7）
    nodes.push(buildSaveSummary(plan));

    const bodyNodes = nodes;
    if (plan.needsRelease) {
      openConfirm({
        title: '儲存成第 ' + plan.targetVersionNo + ' 版',
        bodyNodes: bodyNodes,
        requireTyping: true,
        typingHint: '上面有 ' + plan.violations.real.length
          + ' 格違反了一定要遵守的規則。如果這是正確的（例如名單還未更新），'
          + '請在下面輸入「' + CONFIRM_PHRASE + '」放行。'
          + '放行之後這幾格會照樣儲存，並記入紀錄。',
        confirmLabel: '照樣儲存',
        // 第三十九輪批次 A 組第 3 步：「取消」喺呢度唔啱講法——
        // 佢唔係放棄，係返去表上面改返嗰幾格。
        cancelLabel: '返回修改',
        danger: true,
        onConfirm: (typed) => executeSaveAndConfirm(typed)
      });
    } else {
      openConfirm({
        title: '儲存成第 ' + plan.targetVersionNo + ' 版',
        bodyNodes: bodyNodes,
        confirmLabel: '照樣儲存',
        cancelLabel: '返回修改',
        onConfirm: () => executeSaveAndConfirm('')
      });
    }
  }

  function requestRow(r) {
    return make('div', {
      text: r.serviceDateText + '　' + r.postNameText + '　' + r.personNameText
        + (r.reason ? '：' + r.reason : ''),
      className: 'vio-row'
    });
  }

  /**
   * 規格步 1.6：三欄對照。**預設一定係「用我改的」**——
   * 幹事嘅決定係最新真相，系統唔應該替佢揀。
   */
  function renderProposalTable(proposals) {
    const box = make('div', { className: 'sec' }, [
      sectionTitle('這幾格要怎樣處理（' + proposals.length + ' 格）')
    ]);

    box.appendChild(row([
      button('全部用我改的', () => {
        proposals.forEach((p) => {
          const key = proposalKey(p);
          saveDecisions[key] = 'MANUAL';
          const radio = document.querySelector('input[name="' + cssEscape(key) + '"][value="MANUAL"]');
          if (radio) radio.checked = true;
        });
      }, 'link')
    ], 'row-right'));

    proposals.forEach((p) => {
      const key = proposalKey(p);
      saveDecisions[key] = 'MANUAL';   // 預設

      const line = make('div', { className: 'prop' });
      line.appendChild(make('div', {
        text: p.serviceDate + '　' + p.postNameTC + '#' + p.slotIndex
          + (p.reason ? '　（' + p.reason + '）' : ''),
        className: 'prop-head'
      }));

      const opts = make('div', { className: 'prop-opts' });
      opts.appendChild(radioOption(key, 'MANUAL', '用我改的：' + (p.manual || '（空白）'), true, false));
      if (p.suggested) {
        opts.appendChild(radioOption(key, 'SUGGESTED', '用系統建議：' + p.suggested, false, false));
      }
      // 原本係空白就唔可以「改回原本」——applyDecisions() 本身有呢道保護，
      // 前端要同步變灰並寫明原因，唔好俾人撳完先發現唔得。
      opts.appendChild(radioOption(
        key, 'ORIGINAL',
        p.canRevertToOriginal
          ? ('改回原本：' + p.original)
          : '改回原本（原本這一格是空白，不能改回）',
        false, !p.canRevertToOriginal));
      line.appendChild(opts);
      box.appendChild(line);
    });
    return box;
  }

  function proposalKey(p) { return p.serviceDate + '|' + p.postId + '|' + p.slotIndex; }

  /** name 屬性會入 CSS selector，簡單轉義一下。 */
  function cssEscape(s) { return s.replace(/[|]/g, '\\|'); }

  function radioOption(name, value, labelText, checked, disabled) {
    const label = make('label', { className: 'radio-row' + (disabled ? ' is-off' : '') });
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = name;
    input.value = value;
    input.checked = !!checked;
    input.disabled = !!disabled;
    input.addEventListener('change', () => { if (input.checked) saveDecisions[name] = value; });
    label.appendChild(input);
    label.appendChild(make('span', { text: labelText }));
    return label;
  }

  /** 規格步 1.7：「會做的事」同「不會做的事」兩節都要有。 */
  function buildSaveSummary(plan) {
    const box = make('div', { className: 'sec sec-summary' }, [sectionTitle('這一次會做的事：')]);
    const willDo = [];
    if (plan.gridChanges.length > 0) willDo.push('套用你在表上改的 ' + plan.gridChanges.length + ' 格');
    if (plan.requests.apply.length > 0) willDo.push('套用 ' + plan.requests.apply.length + ' 筆修改申報');
    if (plan.requests.confirm.length > 0) willDo.push('你剛才勾選確認的申報會一併套用');
    if (plan.requests.needsInput.length > 0) {
      willDo.push(plan.requests.needsInput.length + ' 筆申報系統看不懂，會留在申報表不動');
    }
    if (plan.needsRelease) willDo.push('放行 ' + plan.violations.real.length + ' 項規則違反（你需要打字確認）');
    willDo.push('儲存成第 ' + plan.targetVersionNo + ' 版。第 ' + plan.baseVersionNo
      + ' 版原封不動保留，可以對照');
    if (plan.stage === 'REVIEW_SENT') willDo.push('把這一季的進度推前到「意見已收齊」');
    willDo.push('重新發佈公開連結（連結地址不變）');
    willDo.forEach((t) => box.appendChild(make('div', { text: '・' + t, className: 'vio-row' })));

    box.appendChild(sectionTitle('不會做的事：'));
    ['不會寄出任何電郵', '不會產生任何 PDF'].forEach((t) => {
      box.appendChild(make('div', { text: '・' + t, className: 'vio-row' }));
    });
    return box;
  }

  /* ── C3：執行 ＋ 三種結果 ────────────────────────────────── */

  /**
   * 一切正常時的那條快路：直接儲存，講一句「已儲存」。
   *
   * ⚠️ 走的仍然是 `apiSaveAndConfirmExecute` 那一條——**沒有另一套儲存邏輯**。
   * 分別只在於「有沒有先彈一個要他撳確定的窗」。
   *
   * ⚠️ 空的 `decisions` 是對的：三欄對照的預設本來就是「用我改的」，
   * 而這條路的前提是一格違反都沒有，所以沒有任何東西要他決定。
   */
  function executeCleanSave(plan) {
    runAction('儲存中，請稍候', async () => {
      const result = await callServerMutating('apiSaveAndConfirmExecute', currentQuarterId, {
        decisions: [], confirmedRequestRows: [], releaseText: ''
      });
      resetMainFlowState();
      // ⚠️ 第四十一輪批次 C 組：快路同正常路要用**同一個**結果畫面。
      // 兩套「儲存成功」嘅講法 ＝ 兩個真相來源，改一個另一個唔會跟，
      // 而幹事會見到兩種唔同嘅提示而唔知邊個先啱。
      renderSaveResult(result);
    });
  }

  function executeSaveAndConfirm(releaseText) {
    const confirmedRequestRows = Array.prototype.slice
      .call(document.querySelectorAll('input.req-confirm'))
      .filter((cb) => cb.checked)
      .map((cb) => Number(cb.dataset.sheetRow));

    const decisions = Object.keys(saveDecisions).map((key) => {
      const parts = key.split('|');
      return {
        serviceDate: parts[0], postId: parts[1], slotIndex: Number(parts[2]),
        choice: saveDecisions[key]
      };
    });

    runAction('儲存中，請稍候', async () => {
      const result = await callServerMutating('apiSaveAndConfirmExecute', currentQuarterId, {
        decisions: decisions,
        confirmedRequestRows: confirmedRequestRows,
        releaseText: releaseText
      });
      renderSaveResult(result);
    });
  }

  function renderSaveResult(result) {
    // ── 完全失敗（後端回 ok:false，唔係拋錯）────────────────
    if (!result.ok) {
      showErrorModal('儲存並確認', new Error(result.message || '儲存失敗。'));
      return;
    }

    // ── 零改動路徑 ─────────────────────────────────────────
    if (result.zeroChange) {
      openModal('儲存並確認', [
        make('div', { text: result.message, className: 'ok-line' })
      ], [button('完成', () => closeModalAndRefresh(), '')]);
      return;
    }

    // ── 版本成功但發佈失敗：**黃色，唔係紅色** ───────────────
    // 版本真係儲存咗。當成失敗會令幹事以為要重做，就會建立第二個
    // 內容一樣嘅版本。
    if (result.publishFailed) {
      const parsed = parseThreePartMessage(result.message || '');
      const nodes = [
        make('div', {
          text: '第 ' + result.versionNo + ' 版已經儲存好了。',
          className: 'ok-line'
        }),
        make('div', { className: 'warnbox' }, [
          make('div', { text: '但公開連結未能更新。', className: 'err-label' }),
          make('div', {
            text: parsed ? parsed.state
              : '堂委現在開連結會看到舊內容。沒有寄出任何電郵。',
            className: 'err-text'
          }),
          make('div', {
            text: '請去試算表選單「準備工作 ▸ 發佈公開職事表」再試一次。'
              + '在成功之前，先不要撳「寄給堂委審閱」，否則他們會看到舊版本。',
            className: 'err-text'
          })
        ]),
        buildTechDetails(result.publishError || '')
      ];
      openModal('已儲存，但公開連結未更新', nodes, [
        button('知道了', () => closeModalAndRefresh(), '')
      ]);
      return;
    }

    // ── 完全成功 ───────────────────────────────────────────
    //
    // ⚠️ 第四十一輪批次 C 組：Ivan 實測之後講「沒有任何成功儲存的提示」。
    //
    // 呢個彈窗本來就有，但佢淨係俾一個數字（「套用了 3 格改動」）。
    // 一個數字證明唔到系統改嗰三格就係佢改嗰三格。所以逐格列出嚟。
    //
    // ⚠️ 呢個係**儲存之後**嘅結果，同儲存之前嗰個「會做／唔會做」預覽
    // 係兩件事，兩樣都要有，唔可以用其中一個代替另一個。
    const nodes = [
      make('div', { text: '已儲存成第 ' + result.versionNo + ' 版', className: 'ok-head' })
    ];

    // ⚠️ 第四十二輪批次 D 組：呢一段抽咗做共用元件 `savedChangeNodes()`。
    // 三個儲存出口（呢度、接受建議、套用申報）用同一份碼——
    // 各寫一次嘅話格式會慢慢長得唔一樣，而幹事會以為嗰個係三件唔同嘅事。
    savedChangeNodes(result.savedChanges, result.cellCount)
      .forEach((n) => nodes.push(n));

    if (result.appliedRequestCount > 0) {
      nodes.push(make('div', {
        text: '另外套用了 ' + result.appliedRequestCount + ' 筆修改申報。',
        className: 'ok-line'
      }));
    }
    if (result.rejectedRequestCount > 0) {
      nodes.push(make('div', {
        text: result.rejectedRequestCount + ' 筆申報沒有套用（以你表上改的為準，或者你沒有確認）。',
        className: 'ok-line'
      }));
    }
    if (result.needsInputCount > 0) {
      nodes.push(make('div', {
        text: result.needsInputCount + ' 筆系統看不懂的申報留在申報表，沒有動過。',
        className: 'ok-line'
      }));
    }
    if (result.releasedViolationCount > 0) {
      nodes.push(make('div', {
        text: '你放行了 ' + result.releasedViolationCount + ' 格違反規則的安排，已經記入紀錄。',
        className: 'ok-line'
      }));
    }
    nodes.push(make('div', { text: '公開連結已經更新——連結地址不變，'
      + '收到的人重新開就見到這一版。', className: 'ok-line' }));
    if (result.stageAdvanced) {
      nodes.push(make('div', { text: '「寄出」現在可以撳了。', className: 'ok-line strong' }));
    }
    nodes.push(para('第 ' + result.baseVersionNo + ' 版原封不動保留，可以隨時對照。', 'muted'));

    openModal('儲存完成', nodes, [button('知道了', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 掣 2：寄給堂委審閱（規格 2.5）
   * ============================================================ */

  /**
   * 階段 A2-2：冇公開連結就唔好去到確認畫面。
   *
   * ⚠️ 呢個畫面**唔止係報錯，仲要有一粒即刻解決到嘅掣**。
   * 淨係話「去進階功能發佈」嘅話，幹事要摺埋呢個彈窗、
   * 展開區四、搵嗰粒掣、發佈、再返嚟撳掣 2——五步。
   * 而佢本來只係想寄封信。
   */
  function renderReviewNeedsPublicLink() {
    openModal('寄給堂委審閱：還沒有公開連結', [
      errorPart(ERR_LABEL_WHAT, '這一季還沒有公開連結。堂委收到的信裡面有一條'
        + '「唯讀連結」，而那條連結現在是空的。'),
      errorPart('現在的情況', '沒有寄出任何電郵，職事表沒有任何改動。'),
      make('div', { className: 'err-part' }, [
        make('div', { text: '你可以怎樣做', className: 'err-label' }),
        make('div', {
          text: '撳下面的「立即發佈」。發佈好之後會自動回到寄出的確認畫面。',
          className: 'err-text'
        })
      ])
    ], [
      button('立即發佈', () => {
        runAction('發佈公開連結', async () => {
          // ⚠️ 第二十七輪批次階段 A：呢一句本來係 `callServer(...)`，
          // 之後即刻叫 `openReview()`——而 `openReview()` 讀嘅係
          // **發佈之前攞落嚟嘅狀態快取**，入面仲寫住「冇連結」，
          // 所以又跌返入呢個畫面。後端明明已經成功。
          //
          // 而家經 `callServerMutating()`，快取即刻變成「過期」，
          // `openReview()` 入面嗰句 `getDashboard()` 就會先刷新。
          const res = await callServerMutating('apiRepublishPublicLink', currentQuarterId);
          if (!res.ok) { showErrorModal('發佈公開連結', new Error(res.message)); return; }
          setStatus('公開連結已經發佈好了。');
          // 發佈完自動回到掣 2 嘅流程——唔使幹事自己再撳一次。
          openReview();
        });
      }, ''),
      button('取消', () => closeModal(), 'secondary')
    ]);
  }

  // ⚠️ 第四十輪批次 A 組：`sendOptions` 一路傳到底。
  // **冇傳嘅時候行為同今日一模一樣**——區一嗰幾粒舊掣就係噉叫（冇參數），
  // 而後端 `resolveSendOptions_()` 見到 undefined 就退回今日嘅預設值。
  function openReview(sendOptions) {
    runAction('讀取確認資料', async () => {
      // 前置檢查：狀態快取已經帶咗公開連結狀態返嚟，唔使多打一次伺服器。
      // ⚠️ `checkFailed` 唔可以當成「有連結」而放行——嗰個係「查不到」，
      // 唔係「冇問題」。後端仲有一道 assertPublicLinkReady_() 兜底。
      const d = await getDashboard();
      const link = d && d.publicLink;
      if (link && !link.hasLink) { renderReviewNeedsPublicLink(); return; }

      const preview = await callServer('apiStep2Preview', currentQuarterId);

      // 收件人 0 ⇒ **拒絕執行**，唔係警告。
      // 寄一封冇人收到嘅信，畫面仲會顯示「已寄出」——比唔寄更差。
      if (preview.recipientCount === 0) {
        openModal('寄給堂委審閱：沒有收件人', [
          errorPart(ERR_LABEL_WHAT, '現時沒有登記任何堂委電郵。'),
          errorPart('現在的情況', '沒有寄出任何電郵，職事表沒有任何改動。'),
          make('div', { className: 'err-part' }, [
            make('div', { text: '你可以怎樣做', className: 'err-label' }),
            make('div', {
              text: '去試算表的 EmailRecipients 工作表，加入堂委的電郵，'
                + 'Role 欄填 REVIEWER，Active 欄填 TRUE。加好之後重新整理這一頁。',
              className: 'err-text'
            })
          ])
        ], [button('知道了', () => closeModal(), '')]);
        return;
      }

      const nodes = [
        make('div', { className: 'sec' }, [
          sectionTitle('會寄給這 ' + preview.recipientCount + ' 位'),
          make('div', {
            text: '他們會收到一條唯讀連結，可以看到目前第 ' + preview.versionNo + ' 版的職事表。',
            className: 'muted'
          })
        ])
      ];

      if (preview.alreadySentCount > 0) {
        nodes.push(make('div', { className: 'warnbox' }, [
          make('div', {
            text: '注意：這個版本已經有 ' + preview.alreadySentCount + ' 位收件人收過信，'
              + '很可能是上次寄到一半中斷了。',
            className: 'err-text'
          }),
          make('div', {
            text: '如果只想補寄未收到的人，請取消，改用試算表選單'
              + '「四階段流程 ▸ 補寄未收到的人（唯讀預覽）」先看一次，'
              + '確認名單無誤之後再撳「⚠️ 執行補寄未收到的人」。',
            className: 'err-text'
          })
        ]));
      }

      const last = d.buttons.review.lastSentAt;
      if (last) {
        nodes.push(para('上次在 ' + last + ' 寄過，會再寄一次給同一批人。'));
      }
      if (d.isDryRun) {
        nodes.push(make('div', {
          text: '測試模式：不會真的寄出，只會記錄一次。',
          className: 'badge badge-dryrun inline'
        }));
      }

      // 規格 2.5：可重複、可逆、對象只有堂委 ⇒ 唔需要打字確認。
      openConfirm({
        title: '寄給堂委審閱',
        bodyNodes: nodes,
        confirmLabel: '確定寄出',
        onConfirm: () => runAction('寄送中，請稍候', async () => {
          const r = await callServerMutating('apiStep2Confirm', currentQuarterId, sendOptions);
          await renderReviewDone(r);
        })
      });
    });
  }

  async function renderReviewDone(r) {
    // ⚠️ 寄咗信之後先讀狀態——`getDashboard()` 見到快取過期會自己刷新。
    // 讀舊快取嘅話，下面「開季前準備還有 N 項」會係寄信之前嗰個數。
    const d = await getDashboard();
    const lines = [
      r.isDryRun ? '測試模式：沒有真的寄出任何電郵，只記錄了一次。' : '已經寄出。',
      '寄出 ' + r.sent + ' 封　模擬 ' + r.dryRun + ' 封　查無電郵略過 ' + r.skipped + ' 位',
      '這一季的進度現在是「已寄給堂委，等他們的意見」。'
    ];
    const nodes = lines.map((t) => make('div', { text: t, className: 'ok-line' }));

    // 規格 2.5 最後一段：區二未做完 >0 就提一提。
    const undone = d.preQuarter && d.preQuarter.undoneItemCount;
    if (undone > 0) {
      const bits = (d.preQuarter.items || [])
        .filter((i) => i.count > 0)
        .map((i) => i.label + ' ' + i.count);
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '提提你：開季前準備還有 ' + undone + ' 項未做（' + bits.join('、') + '）。'
            + '堂委看到的表會有空格。',
          className: 'err-text'
        })
      ]));
    }
    openModal('寄給堂委審閱：完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 掣 3：正式發出給全體（規格 2.6）
   * ============================================================ */

  // ⚠️ 第四十輪批次 A 組：`sendOptions` 一路傳到底。
  // **冇傳嘅時候行為同今日一模一樣**——區一嗰幾粒舊掣就係噉叫（冇參數），
  // 而後端 `resolveSendOptions_()` 見到 undefined 就退回今日嘅預設值。
  function openOfficial(sendOptions) {
    runAction('讀取確認資料', async () => {
      const d = await getDashboard();
      const warnings = await callServer('apiStep4GetPendingWarnings', currentQuarterId);
      const versionNo = warnings.versionNo;
      const missing = await callServer('apiStep4GetMissingPdfWarnings', currentQuarterId, versionNo);

      // 個人 PDF 缺件超過上限 ⇒ 保留現有阻擋（第十九輪嘅關卡）。
      if (missing.blocked) {
        openModal('正式發出：已中止', [
          errorPart(ERR_LABEL_WHAT,
            '有 ' + missing.missingTotal + ' / ' + missing.total + ' 人還沒有個人 PDF，'
            + '超過了容許的缺件上限。'),
          errorPart('現在的情況', '沒有寄出任何電郵，職事表沒有任何改動。'),
          make('div', { className: 'err-part' }, [
            make('div', { text: '你可以怎樣做', className: 'err-label' }),
            make('div', {
              text: '先去試算表選單「準備工作 ▸ 產生個人 PDF」，把缺的補齊，再回來撳這一粒。',
              className: 'err-text'
            })
          ]),
          buildTechDetails(missing.gateMessage || '')
        ], [button('知道了', () => closeModal(), '')]);
        return;
      }

      const preview = await callServer('apiStep4GetSendPreview', currentQuarterId, versionNo);
      const b = d.buttons.official;
      const willReceive = b.targetPersonCount - b.noEmailCount;

      const nodes = [];

      if (warnings.pendingRequests.length > 0 || warnings.pendingCellsTotal > 0) {
        const box = make('div', { className: 'warnbox' });
        if (warnings.pendingRequests.length > 0) {
          box.appendChild(make('div', {
            text: '仍然有 ' + warnings.pendingRequests.length + ' 筆修改申報未處理。',
            className: 'err-text'
          }));
        }
        if (warnings.pendingCellsTotal > 0) {
          box.appendChild(make('div', {
            text: '仍然有 ' + warnings.pendingCellsTotal + ' 格待補（黃底）。',
            className: 'err-text'
          }));
        }
        box.appendChild(make('div', {
          text: '這些不會阻擋你發出，但義工收到的表會有空格。',
          className: 'err-text'
        }));
        nodes.push(box);
      }

      if (preview.alreadySentCount > 0) {
        nodes.push(make('div', { className: 'warnbox' }, [
          make('div', {
            text: '注意：這個版本已經有 ' + preview.alreadySentCount + ' 個人收過信，'
              + '很可能是上次寄到一半中斷了。',
            className: 'err-text'
          }),
          make('div', {
            text: '如果只想補寄未收到的人，請取消，改用試算表選單'
              + '「四階段流程 ▸ 補寄未收到的人（唯讀預覽）」先看一次，'
              + '確認名單無誤之後再撳「⚠️ 執行補寄未收到的人」。',
            className: 'err-text'
          })
        ]));
      }

      const detail = make('div', { className: 'sec' }, [
        sectionTitle('會寄給表上 ' + b.targetPersonCount + ' 個人中的 ' + willReceive + ' 人')
      ]);
      [
        '每人一封信，附自己那份標示了名字的 PDF',
        '附月曆檔（.ics），紐西蘭時間，已計夏令時間',
        '附個人專屬連結（永遠顯示最新安排）'
      ].forEach((t) => detail.appendChild(make('div', { text: '・' + t, className: 'vio-row' })));
      if (b.noEmailCount > 0) {
        detail.appendChild(make('div', {
          text: '・' + b.noEmailCount + ' 人沒有電郵，會略過',
          className: 'vio-row'
        }));
      }
      detail.appendChild(make('div', {
        text: '・同時寄給堂委 ' + d.buttons.review.recipientCount + ' 人',
        className: 'vio-row'
      }));
      nodes.push(detail);

      nodes.push(make('div', { className: 'sec sec-warn' }, [
        make('div', {
          text: '寄出之後這一季就定稿了。之後有改動只能用「改動後重發」，'
            + '只會寄給有改動的人。',
          className: 'err-text'
        })
      ]));

      if (d.isDryRun) {
        nodes.push(make('div', {
          text: '測試模式：不會真的寄出，只會記錄一次。',
          className: 'badge badge-dryrun inline'
        }));
      }

      openConfirm({
        title: '正式發出給全體（不可逆）',
        bodyNodes: nodes,
        requireTyping: true,
        confirmLabel: '確定發出',
        danger: true,
        onConfirm: (typed) => runAction('寄送中，請稍候', async () => {
          const r = await callServerMutating('apiStep4Confirm', currentQuarterId, sendOptions);
          renderOfficialDone(r);
        })
      });
    });
  }

  function renderOfficialDone(r) {
    const nodes = [
      make('div', {
        text: r.isDryRun ? '測試模式：沒有真的寄出任何電郵。' : '已經正式發出。',
        className: 'ok-line'
      }),
      make('div', {
        text: '寄出 ' + r.sent + ' 封　模擬 ' + r.dryRun + ' 封　'
          + '查無電郵略過 ' + r.skipped + ' 位　未變略過 ' + r.unchanged + ' 位',
        className: 'ok-line'
      }),
      make('div', {
        text: '失敗 ' + r.failed + '　PDF 失敗 ' + r.errorPdf + '　PDF 缺件 ' + r.errorPdfMissing,
        className: 'ok-line'
      })
    ];
    if (r.outcomeSentence) {
      nodes.push(make('div', { text: r.outcomeSentence, className: 'ok-line strong' }));
    }
    if (!r.advanced) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          // 第二十五輪批次階段 B4：清走字面上嘅 `**`。
          // Markdown 粗體語法喺畫面上只會顯示成兩粒星，幹事會問「呢兩粒星係咩」。
          // （第二十一輪已經喺選單版清過一次同類問題。）
          text: '有人未收到，所以這一季的進度沒有推前。補救之後可以再撳一次這一粒。'
            .replace(/\*\*/g, ''),
          className: 'err-text'
        }),
        make('div', { text: r.outcomeMessage || '', className: 'err-text' })
      ]));
    }
    openModal('正式發出：完成', nodes, [button('完成', () => closeModalAndRefresh(), '')]);
  }

  /* ============================================================
   * 掣 4：改動後重發（規格 2.7）
   * ============================================================ */

  // ⚠️ 第四十輪批次 A 組：`sendOptions` 一路傳到底。
  // **冇傳嘅時候行為同今日一模一樣**——區一嗰幾粒舊掣就係噉叫（冇參數），
  // 而後端 `resolveSendOptions_()` 見到 undefined 就退回今日嘅預設值。
  function openResend(sendOptions) {
    runAction('比對有誰的安排改了', async () => {
      const d = await getDashboard();
      const plan = await callServer('apiStep5Plan', currentQuarterId);

      if (plan.mode === 'NO_CHANGES') {
        openModal('改動後重發', [
          para('自上次發出之後沒有人的安排改過，不需要重發。')
        ], [button('知道了', () => closeModal(), '')]);
        return;
      }

      // 規格 2.7：**逐個列出**有改動的人，唔可以淨係寫數字。
      // 呢度係幹事唯一一次可以人眼睇出「係咪真係想改咁多人」嘅關口。
      const nodes = [
        make('div', { className: 'sec' }, [
          sectionTitle('自上次發出之後，這 ' + plan.changed.length + ' 個人的安排改了'),
          make('div', {
            text: '只會寄給這幾位和堂委。請逐個看一次，確認是不是真的想改這麼多人。',
            className: 'muted'
          })
        ])
      ];

      const list = make('div', { className: 'sec' });
      plan.changed.forEach((c) => {
        const item = make('div', { className: 'prop' });
        const head = make('div', { className: 'prop-head' });
        head.appendChild(make('span', { text: c.nameTC }));
        if (!c.hasAssignments) head.appendChild(make('span', { text: '本季已無服侍安排', className: 'tag' }));
        if (c.firstNotifyDueToEmail) head.appendChild(make('span', { text: '首次通知（之前沒有電郵）', className: 'tag' }));
        if (!c.hasEmail) head.appendChild(make('span', { text: '沒有電郵，無法通知', className: 'tag tag-bad' }));
        item.appendChild(head);

        // 第二十五輪批次階段 D：「原本」而家真係攞到（由 SendLog 嘅
        // AssignmentSummary），所以**原本擺上面、現在擺下面**——
        // 人眼由上而下讀，「舊 → 新」先讀得出改咗啲乜。
        //
        // ⚠️ 攞唔到嗰啲仍然誠實講「沒有記錄」，唔會擺個假值扮到有得比較。
        // 「第一次收信」同「舊紀錄冇留底」都會落呢一格。
        item.appendChild(make('div', {
          text: '原本：' + (c.previousSummary || '（上次的安排沒有記錄，無法對照）'),
          className: c.previousSummary ? 'vio-row' : 'vio-row muted'
        }));
        item.appendChild(make('div', {
          text: '現在：' + (c.currentSummary || '（這一季沒有安排）'),
          className: 'vio-row'
        }));
        list.appendChild(item);
      });
      nodes.push(list);

      if (d.isDryRun) {
        nodes.push(make('div', {
          text: '測試模式：不會真的寄出，只會記錄一次。',
          className: 'badge badge-dryrun inline'
        }));
      }

      openConfirm({
        title: '改動後重發（不可逆）',
        bodyNodes: nodes,
        requireTyping: true,
        confirmLabel: '確定重發',
        danger: true,
        onConfirm: () => runAction('產生 PDF 並寄送，請稍候', async () => {
          await resendGeneratePdfsThenSend('', sendOptions);
        })
      });
    });
  }

  /**
   * 產生 PDF 可能要分批（接近單次執行時間上限會自動停），所以要重複呼叫。
   * 放行文字全程帶住——後端每次都會用「目前最新版本」重新驗一次。
   */
  async function resendGeneratePdfsThenSend(releaseText, sendOptions) {
    let guard = 0;
    for (;;) {
      guard++;
      if (guard > 40) throw new Error('產生個人 PDF 的次數超出預期，已停下來避免無限重試。請重新整理再試一次。');

      const r = await callServerMutating('apiStep5GeneratePdfs', currentQuarterId, releaseText);
      if (r.blocked) {
        showErrorModal('改動後重發', new Error('這一版仍然有違反規則的安排，需要先在「儲存並確認」處理。'));
        return;
      }
      if (r.noChanges) {
        openModal('改動後重發', [para('沒有改動需要重發。')],
          [button('關閉', () => closeModalAndRefresh(), '')]);
        return;
      }
      if (r.done) break;
      setStatus('產生個人 PDF：' + r.doneCount + ' / ' + r.totalPeople + ' 份…');
    }

    const result = await callServerMutating('apiStep5SendConfirm', currentQuarterId, releaseText, sendOptions);
    if (result.blocked) {
      showErrorModal('改動後重發', new Error('這一版仍然有違反規則的安排，尚未寄出任何電郵。'));
      return;
    }
    openModal('改動後重發：完成', [
      make('div', {
        text: result.isDryRun ? '測試模式：沒有真的寄出任何電郵。' : '已經重發。',
        className: 'ok-line'
      }),
      make('div', {
        text: '寄出 ' + result.sent + ' 封　模擬 ' + result.dryRun + ' 封　'
          + '查無電郵略過 ' + result.skipped + ' 位',
        className: 'ok-line'
      }),
      make('div', { text: '這一季的進度不變，仍然是「已正式發出給全體」。', className: 'ok-line' })
    ], [button('完成', () => closeModalAndRefresh(), '')]);
  }
</script>
