<script>
  /* ============================================================
   * 第三十九輪批次 C 組：寄出彈窗　／　D 組：紙本
   * ============================================================
   *
   * ⚠️ 載入次序：要排喺 `ScriptZone1` **之後**——
   * 落到最後係叫 `openReview()`／`openOfficial()`／`openResend()`，
   * 嗰三個喺 ScriptZone1 定義。
   *
   * ─────────────────────────────────────────────────────────────
   * C 組：一粒「寄出」，一個彈窗
   * ─────────────────────────────────────────────────────────────
   *
   * 幹事本來要喺三粒掣之間自己揀（審閱／正式／重發），而嗰個判斷
   * 其實完全係機械嘅——由呢一季行到邊一步決定。
   *
   * 而家：**由系統判斷，用一句人話講出嚟，佢睇得見但唔使自己諗。**
   *
   * ⚠️ 撳落去之後行嘅仍然係原本嗰三條路。呢度只係一個新嘅門口，
   * 唔係第二套寄信邏輯——嗰條路上每一道閘（三層防重複、未儲存改動、
   * 公開連結、附件資料夾、DRY_RUN）都係前面幾十輪逐個補返嚟嘅。
   */

  function openSendDialog() {
    runAction('讀取寄送資料', async () => {
      const s = await callServer('apiGetSendPlanSummary', currentQuarterId);
      renderSendDialog(s);
    });
  }

  function renderSendDialog(s) {
    // ── 寄唔到：逐個原因講，唔好合成一句 ──────────────────────
    if (s.kind === 'NONE') {
      const nodes = [para('現在沒有可以寄的東西。')];
      if (s.blockedReasons.length > 0) {
        const box = make('div', { className: 'sec' }, [sectionTitle('原因')]);
        const names = { review: '寄給堂委審閱', official: '正式發出給全體', resend: '改動後重發' };
        s.blockedReasons.forEach((b) => {
          box.appendChild(make('div', {
            text: '・' + (names[b.key] || b.key) + '：' + b.reason,
            className: 'vio-row'
          }));
        });
        nodes.push(box);
      }
      openModal('寄出', nodes, [button('知道了', () => closeModal(), '')]);
      return;
    }

    // ── 有未儲存嘅改動：**入彈窗之前**先問 ──────────────────────
    //
    // ⚠️ 呢一問唔可以省。幹事啱啱改完表、未撳儲存就撳寄出，
    // 系統寄出嘅係**上一次儲存確認嗰一版**——即係佢啱啱改嗰啲唔會喺入面，
    // 而佢完全唔會察覺。
    //
    // ⚠️ 第四十輪批次 C 組：一定要講出**改咗幾多格**同**寄緊第幾版**。
    // 淨係講「你有未儲存的修改」，幹事分唔清「係咪我啱啱嗰幾格」，
    // 亦都唔知寄出去嗰份係咩內容——結果佢淨係撳「繼續」算數。
    if (s.unsaved && s.unsaved.hasAny) {
      const versionText = s.latestVersion
        ? ('第 ' + s.latestVersion.versionNo + ' 版') : '上一次儲存確認的版本';
      openConfirm({
        title: '寄出',
        bodyNodes: [
          make('div', { className: 'warnbox' }, [
            make('div', {
              text: describeUnsaved(s.unsaved)
                + '寄出的會是「' + versionText + '」，你剛才改的不會寄出去。',
              className: 'lines'
            })
          ]),
          para('先儲存的話，改動會存成新一版，然後那一版才會寄出去。', 'muted')
        ],
        confirmLabel: '繼續寄出',
        cancelLabel: '先去儲存',
        // 〔先去儲存〕直接帶去第 2 步嗰粒「儲存我的修改」，
        // 唔係淨係關窗——關咗窗佢就要自己再搵一次。
        onCancel: () => { closeModal(); openSaveAndConfirm(); },
        onConfirm: () => { closeModal(); renderSendMain(s); }
      });
      return;
    }

    // ⚠️ 冇未儲存改動 ⇒ **唔好彈呢個窗**，直接開寄出彈窗。
    // 彈一個冇嘢要佢決定嘅窗，只會訓練佢唔睇內容就撳「繼續」。
    renderSendMain(s);
  }

  /**
   * 未儲存嘅改動係咩。
   * ⚠️ 三種都要講得出——只講「有改動」嘅話，幹事唔知係佢改嘅格、
   * 定係一筆佢未睇過嘅申報，兩者要做嘅嘢完全唔同。
   */
  function describeUnsaved(u) {
    const bits = [];
    if (u.gridChangeCount) bits.push('你在表上改了 ' + u.gridChangeCount + ' 格');
    if (u.unresolvedCount) bits.push('有 ' + u.unresolvedCount + ' 格的名字認不出');
    if (u.pendingRequestCount) bits.push('有 ' + u.pendingRequestCount + ' 筆未處理的修改申報');
    if (bits.length === 0) return '你有未儲存的修改，';
    return bits.join('、') + '，但還未儲存確認。';
  }

  /* ══════════════════════════════════════════════════════════════
   * 第四十輪批次 A 組：三個決定
   * ══════════════════════════════════════════════════════════════
   *
   * 上一輪個彈窗只係**報告事實**（會寄咩、寄俾邊個），一樣都揀唔到。
   * 實測之後 Ivan 講明幹事真係要每次揀——例如範本改好之後要重寄全體。
   *
   * 收成三個決定，功能覆蓋原本六個選項而少好多出錯機會：
   *   一、寄給誰　　全部／只寄有改動嘅／自己揀
   *   二、附件　　　不附／個人版 PDF／整季 PDF
   *   三、日曆檔　　附／唔附
   *
   * ⚠️ **預設值一律由後端嗰份 sendOptionDefaults 嚟。**
   * 前端自己寫死一套就係兩個真相來源，而「幹事乜都唔揀嘅時候行為
   * 同今日一樣」呢個保證會靜靜失效。
   */

  /** 呢一次彈窗入面幹事揀咗咩。開窗嗰陣由後端嘅預設值填好。 */
  let sendOptions_ = null;

  function renderSendMain(s) {
    // ⚠️ 每次開窗都重設，而且用**後端**畀嘅預設值。
    sendOptions_ = {
      // ⚠️ 第四十六輪批次 A 組：收件人一律行 `PICK`（照 `pickedKeys` 寄）。
      // 後端嗰個「按階段嘅預設收件範圍」仍然存在，但佢係**自動排程／補寄**
      // 嗰幾條路用嘅；幹事喺呢個彈窗做嘅事就係逐個決定寄俾邊個。
      recipientScope: 'PICK',
      attachType: (s.sendOptionDefaults || {}).attachType || 'NONE',
      includeIcs: !!(s.sendOptionDefaults || {}).includeIcs,
      pickedKeys: [],
      extraEmails: [],
      extraEmailsRaw: ''
    };
    // 第四十六輪批次 A 組：換季度／重開彈窗一律重新攞池，
    // 唔可以留住上一季嘅人名。
    sendPool_ = null;
    sendPoolGroups_ = null;
    sendChangedInfo_ = null;
    drawSendMain(s);
  }

  function drawSendMain(s) {
    const nodes = [];

    // ── 頂部：**只講事實，唔再由階段推斷「這一次是⋯⋯」**─────────
    //
    // ⚠️ 第四十六輪批次 A3 組：舊嗰句係
    //「這一次是寄給堂委審閱（這一季還未正式發出過）」——一句由**階段**
    // 推斷出嚟嘅描述。而由呢一輪開始收件人係幹事自己勾嘅，
    // 所以嗰句同佢實際做緊嘅事對唔上。Ivan 明確講咗嗰句係錯嘅。
    //
    // 留低嘅係兩樣真係有用嘅事實：寄邊一版、係咪模擬模式。
    nodes.push(make('div', { className: 'statuscard' }, [
      make('div', {
        text: '系統只會寄你已經儲存確認的版本'
          + (s.latestVersion ? '（現在是第 ' + s.latestVersion.versionNo + ' 版）' : '')
          + '。',
        className: 'statuscard-title'
      })
    ]));

    // ── 這一季的寄出紀錄（B3）───────────────────────────────
    nodes.push(buildSendHistoryBox(s.sendHistory));

    if (s.isDryRun) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '系統現在是模擬模式：全部信都只會記錄，一封都不會真的寄出去。',
          className: 'lines'
        })
      ]));
    }

    // ── 寄給誰：**由幹事決定，唔係由階段決定**（A1／A3）──────────
    const whoBox = make('div', { className: 'sec' }, [sectionTitle('寄給誰')]);
    whoBox.appendChild(make('div', {
      text: describeSendSelection(),
      className: (sendOptions_.pickedKeys || []).length === 0
        && (sendOptions_.extraEmails || []).length === 0
        ? 'vio-row' : 'ok-line strong'
    }));
    whoBox.appendChild(row([
      button((sendOptions_.pickedKeys || []).length === 0 ? '選擇收件人' : '改一改寄給誰',
        () => openSendRecipients(s), '')
    ]));
    nodes.push(whoBox);

    // ── 決定二：附件 ────────────────────────────────────────
    const attachBox = make('div', { className: 'sec' }, [sectionTitle('附件')]);
    const notes = s.attachOptionNotes || {};
    [
      ['NONE', '不附'],
      ['PERSONAL_PDF', '個人版 PDF'],
      ['FULL_PDF', '整季 PDF']
    ].forEach((opt) => {
      attachBox.appendChild(sendRadio('attach', opt[0], opt[1],
        sendOptions_.attachType === opt[0], () => {
          sendOptions_.attachType = opt[0];
          drawSendMain(s);
        }));
      // ⚠️ 第四十一輪批次 E 組：每個選項下面一行小字，直接寫出收件人會收到咩。
      //
      // 只寫「不附」三個字，幹事會以為嗰封信係空嘅——實際上仲有
      // 佢自己嗰條個人專屬連結同永久連結。撳之前就要知道。
      //
      // ⚠️ 呢啲字由**後端**出，同 attachTypeWantsPersonalLink_() 讀同一個判斷。
      // 前端自己寫一套，畫面就會講一件事而系統做另一件事。
      if (notes[opt[0]]) {
        attachBox.appendChild(make('div', {
          text: '　　' + notes[opt[0]], className: 'muted'
        }));
      }
    });
    nodes.push(attachBox);

    // ── 決定三：日曆檔 ──────────────────────────────────────
    const icsBox = make('div', { className: 'sec' }, [sectionTitle('日曆檔')]);
    const icsRow = make('label', { className: 'check-row' });
    const icsCb = document.createElement('input');
    icsCb.type = 'checkbox';
    icsCb.checked = sendOptions_.includeIcs;
    icsCb.addEventListener('change', () => {
      sendOptions_.includeIcs = icsCb.checked;
      drawSendMain(s);
    });
    icsRow.appendChild(icsCb);
    icsRow.appendChild(make('span', {
      text: '附 .ics 日曆檔（iPhone 同 Google 日曆都開得到）'
    }));
    icsBox.appendChild(icsRow);
    nodes.push(icsBox);

    // ⚠️ 個人版 PDF 同 .ics 都只對「這一季有服侍的人」有意義。
    // 唔講嘅話，幹事會以為堂委都會收到個人 PDF，然後去追一個唔存在嘅問題。
    if (sendOptions_.attachType === 'PERSONAL_PDF' || sendOptions_.includeIcs) {
      nodes.push(make('div', { className: 'muted' }, [
        make('div', {
          text: '個人版 PDF 同日曆檔只有「這一季有服侍的人」才會收到。'
            + '堂委名單那一封不會有——那是正常的，不是漏了。'
        })
      ]));
    }

    // ── 那條永久連結：一律附上，唔係一個選項 ─────────────────
    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('那條永久連結'),
      make('div', {
        text: s.permanentLink.hasLink
          ? '一律附在信末。收信的人之後打開就是最新版，不用再等你寄。'
          : (s.permanentLink.checkFailed
            ? '查不到這一季有沒有永久連結。這不代表沒有，只代表系統現在看不到。'
            : '這一季還沒有永久連結，所以這一次的信不會有那一段。'),
        className: s.permanentLink.hasLink ? 'ok-line' : 'vio-row'
      })
    ]));

    // ── 第四十三輪批次 F 組：自行輸入電郵 ──────────────────────
    //
    // ⚠️ 一定要擺喺**主彈窗**，唔可以收喺「自己選擇」嗰個子彈窗入面。
    // 收喺入面嘅話，幹事揀「全部應收的人」就永遠見唔到呢一格——
    // 而佢想做嘅嘢好可能正正就係「全部人 ＋ 多一個地址」。
    nodes.push(buildExtraEmailBox(sendOptions_,
      '這幾個地址會收到同一封信（包括附件），但不會加入人員名單。'));

    // ── 喺 REQUESTS_APPLIED 嗰一步，「再寄一次審閱本」仍然做得到 ──
    const actions = [];
    if (s.alsoReview) {
      actions.push(button('改為再寄一次審閱本', () => { closeModal(); openReview(); }, 'secondary'));
    }

    openConfirm({
      title: '寄出',
      bodyNodes: nodes,
      // ⚠️ 第四十三輪批次 E2：粒掣一律叫「寄出」。
      // Ivan：「click 寄給堂委審閱，不能 click。呢粒掣應該叫『寄出』。」
      // 呢一次係邊一種，彈窗頂已經用一句人話講咗（見上面），
      // 粒掣再講多次只會令佢以為嗰個係另一件事。
      confirmLabel: '寄出',
      extraActions: actions,
      onConfirm: () => {
        // ⚠️ 一位都冇揀而又冇自訂地址 ⇒ 唔可以行落去。
        // 後端一樣會擋（`resolveSendOptions_()` 會拋），呢度只係提早講。
        if ((sendOptions_.pickedKeys || []).length === 0
            && (sendOptions_.extraEmailsRaw || '').trim() === '') {
          setStatus('還沒有選任何收件人。撳〔選擇收件人〕選好再撳一次。', true);
          return;
        }
        // ⚠️ 格式唔啱就唔可以行落去。後端一樣會擋（resolveSendOptions_()
        // 會拋），呢度只係提早講。
        if (!commitExtraEmails(sendOptions_)) return;
        closeModal();
        routeSend(s.kind, sendOptions_);
      }
    });
  }

  /** 一粒 radio。 */
  function sendRadio(group, value, label, checked, onPick) {
    const line = make('label', { className: 'radio-row' });
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'sendopt-' + group;
    input.value = value;
    input.checked = !!checked;
    input.addEventListener('change', () => { if (input.checked) onPick(); });
    line.appendChild(input);
    line.appendChild(make('span', { text: label }));
    return line;
  }

  /* ══════════════════════════════════════════════════════════════
   * 第四十六輪批次 A／B 組：收件人由幹事決定
   * ══════════════════════════════════════════════════════════════
   *
   * ⚠️ 之前兩輪做錯咗嘅地方：把個名單當成「喺階段本來嘅收件範圍入面再篩」。
   * Ivan 要嘅係「寄俾職事表上全部人、CC、DB、IT、admin 同自訂 email」
   * ——即係**收件人同階段完全無關**。
   *
   * 呢度嘅真相來源只有一個：`sendOptions_.pickedKeys`。
   * 上面六個來源勾選框係**捷徑**，佢哋做嘅事係「把嗰一組人加入／移出
   * `pickedKeys`」——唔係另一個並行嘅收件範圍。
   *
   * 兩個真相來源（一個「來源」＋ 一個「名單」）會即刻出現
   *「勾咗堂委，但個名單度取消咗其中一個，到底寄唔寄」嘅問題。
   * 所以：**名單就係答案，來源只係一次過幫你勾。**
   */

  /** 收件人池（第一次撳先去攞）。 */
  let sendPool_ = null;
  /** 六個來源各有幾多人。由後端數，唔喺畫面寫死。 */
  let sendPoolGroups_ = null;
  /** 「有改動」係相對邊一版。 */
  let sendChangedInfo_ = null;

  /**
   * 一個來源入面**勾得到**嘅人。
   * ⚠️ 冇電郵嘅唔算——勾咗都收唔到，而勾一個收唔到嘅人只會令個數字講大話。
   * @param {string} sourceKey SEND_SOURCE 之一
   * @returns {Object[]} 成員
   */
  function sendPoolMembersOf(sourceKey) {
    return (sendPool_ || []).filter((c) =>
      (c.sources || []).indexOf(sourceKey) !== -1 && c.selectable !== false);
  }

  /** 這一組是不是已經全部勾了。 */
  function sendSourceAllPicked(sourceKey, selected) {
    const members = sendPoolMembersOf(sourceKey);
    return members.length > 0 && members.every((c) => selected[c.key] === true);
  }

  /**
   * 第四十六輪批次 A3 組：**收件摘要——由實際勾咗乜算出嚟。**
   *
   * ⚠️ 唔可以由階段推斷。舊嗰句「這一次是寄給堂委審閱」就係噉嚟嘅，
   * 而 Ivan 明確講咗嗰句係錯嘅描述。
   *
   * @returns {string} 一句
   */
  function describeSendSelection() {
    const keys = sendOptions_.pickedKeys || [];
    const extra = (sendOptions_.extraEmails || []).length;
    if (keys.length === 0 && extra === 0) return '還沒有選任何收件人。';

    const byKey = {};
    (sendPool_ || []).forEach((c) => { byKey[c.key] = c; });

    // 逐個來源數「呢一次揀咗嘅人入面，有幾多個屬於呢一組」。
    // 一個人可以同時屬於幾組（例如一個堂委今季又有服侍），所以
    // 各組加埋可以多過總數——所以總數要另外數，唔可以加埋。
    const bits = [];
    (sendPoolGroups_ || []).forEach((g) => {
      const n = keys.filter((k) => byKey[k]
        && (byKey[k].sources || []).indexOf(g.key) !== -1).length;
      if (n > 0) bits.push(g.label + ' ' + n + ' 位');
    });
    if (extra > 0) bits.push('自訂 ' + extra + ' 個地址');

    const total = keys.length + extra;
    return '這一次會寄給 ' + total + ' 位'
      + (bits.length > 0 ? ('：' + bits.join(' ＋ ')) : '')
      + '。';
  }

  /**
   * 第四十六輪批次 B3 組：這一季寄過幾次。
   * @param {Object} h `buildSendHistoryView_()` 的結果
   * @returns {Node} 一段
   */
  function buildSendHistoryBox(h) {
    const box = make('div', { className: 'sec' }, [sectionTitle('這一季的寄出紀錄')]);
    if (!h || (h.batches || []).length === 0) {
      box.appendChild(make('div', {
        text: '這一季從來沒有寄出過。', className: 'vio-row'
      }));
    } else {
      box.appendChild(make('div', {
        text: '這一季寄過 ' + h.batches.length + ' 次：', className: 'muted'
      }));
      h.batches.forEach((b) => {
        box.appendChild(make('div', {
          text: '　' + b.sentAt + '　' + b.stageLabel
            + '　第 ' + b.versionNo + ' 版　' + b.sent + ' 位'
            + (b.noEmail > 0 ? ('（' + b.noEmail + ' 位查無電郵）') : '')
            + (b.failed > 0 ? ('（' + b.failed + ' 位失敗）') : ''),
          className: 'ok-line'
        }));
      });
    }
    // ⚠️ 呢一行係整段最重要嘅：**現時嗰版從來未寄過就要明講。**
    // 幹事最容易犯嘅錯就係「以為寄咗」。
    if (h && h.warnSentence) {
      box.appendChild(make('div', { className: 'warnbox' }, [
        make('div', { text: h.warnSentence, className: 'lines' })
      ]));
    }
    return box;
  }

  /* ── 收件人彈窗：上面六個來源，下面一個可搜尋嘅名單 ───────── */

  function openSendRecipients(s, keyword) {
    if (sendPool_) { drawSendRecipients(s, keyword || ''); return; }
    runAction('讀取收件名單', async () => {
      const r = await callServer('apiGetSendRecipientPool', currentQuarterId);
      if (!r.ok) { showErrorModal('選擇收件人', new Error(r.message)); return; }
      sendPool_ = r.items || [];
      sendPoolGroups_ = r.groups || [];
      sendChangedInfo_ = r.changed || null;
      drawSendRecipients(s, '');
    });
  }

  function drawSendRecipients(s, keyword) {
    const selected = {};
    (sendOptions_.pickedKeys || []).forEach((k) => { selected[k] = true; });

    const redraw = (kw) => {
      sendOptions_.pickedKeys = Object.keys(selected).filter((k) => selected[k] === true);
      drawSendRecipients(s, kw === undefined ? keyword : kw);
    };

    const nodes = [
      para('先在上面勾一整組，再在下面逐個加或者減。下面那個名單就是最後會寄的人。')
    ];

    // ── 六 ＋ 一個來源 ───────────────────────────────────────
    const srcBox = make('div', { className: 'sec' }, [sectionTitle('一次過加一整組')]);
    (sendPoolGroups_ || []).forEach((g) => {
      const isChanged = g.key === 'CHANGED';
      // 「只寄給安排有改動的人」冇比較基準（從來未寄過）⇒ 勾唔到，
      // 而且要講明點解，唔可以靜靜唔出。
      const noBaseline = isChanged && sendChangedInfo_ && !sendChangedInfo_.hasBaseline;
      const line = make('label', { className: (g.selectable === 0 || noBaseline) ? 'check-row muted' : 'check-row' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      if (g.selectable === 0 || noBaseline) {
        cb.disabled = true;
        cb.checked = false;
      } else {
        cb.checked = sendSourceAllPicked(g.key, selected);
        cb.addEventListener('change', () => {
          sendPoolMembersOf(g.key).forEach((c) => { selected[c.key] = cb.checked; });
          redraw();
        });
      }
      line.appendChild(cb);
      line.appendChild(make('span', {
        text: g.label + '（' + g.selectable + ' 位'
          + (g.total > g.selectable ? ('，另外 ' + (g.total - g.selectable) + ' 位沒有電郵') : '')
          + '）'
      }));
      srcBox.appendChild(line);
      // ⚠️ 一組零人嗰陣**要講點解同去邊度加**。靜靜出一個勾唔到嘅框，
      // 幹事只會以為系統壞咗——而真正原因係「身分」那張表未填。
      if (g.total === 0 && !isChanged) {
        srcBox.appendChild(make('div', {
          text: '　　現時沒有人有這個身分。要用這一組，先去「名單維護 ▸ 身分」'
            + '把「' + g.label + '」加給相關的人。',
          className: 'muted'
        }));
      }
      if (isChanged && sendChangedInfo_) {
        srcBox.appendChild(make('div', {
          text: '　　' + sendChangedInfo_.sentence,
          className: sendChangedInfo_.hasBaseline ? 'muted' : 'vio-row'
        }));
      }
    });
    nodes.push(srcBox);

    // ── 自訂電郵：擺喺同一版，唔收埋去另一個窗 ──────────────
    nodes.push(buildExtraEmailBox(sendOptions_,
      '這幾個地址會收到同一封信（包括附件），但不會加入人員名單。'));

    nodes.push(make('div', {
      text: describeSendSelection(), className: 'ok-line strong'
    }));

    // ── 下面：**同「下載及匯出」一模一樣**嗰個可搜尋名單 ────────
    //
    // ⚠️ 用共用元件 `pickListNodes()`，兩邊叫同一份程式碼。
    // Ivan 已經講咗三次「應該似處理紙本嗰個」，寫第二份就會再一次
    // 出現兩邊行為唔一致。
    const items = (sendPool_ || []).map((c) => ({
      key: c.key,
      label: c.displayName,
      disabled: c.selectable === false,
      note: (c.type === 'LIST' ? '（收件人名單）' : ('（這一季 ' + c.cellCount + ' 格）'))
        + describeRoleTags(c.roles)
        // B2：勾咗「只寄有改動」之後，逐個要講明**改咗乜**。
        + ((c.changeNotes && c.changeNotes.length > 0)
          ? ('　改動：' + c.changeNotes.join('、')) : ''),
      warn: c.hasEmail ? '' : '⚠ 沒有電郵，收不到信——要用第 4 步印紙本給他'
    }));

    pickListNodes({
      items: items,
      selected: selected,
      keyword: keyword,
      onRedraw: redraw,
      onToggle: () => redraw(),
      emptyText: '這一季一個收件人都找不到。這通常代表這一季還沒有派工，'
        + '而且「身分」和「收件人名單」兩張表都是空的。'
    }).forEach((n) => nodes.push(n));

    openModal('選擇收件人', nodes,
      pickListBulkButtons(items, selected, redraw).concat([
        button('用這一份名單', () => {
          sendOptions_.pickedKeys = Object.keys(selected).filter((k) => selected[k] === true);
          // ⚠️ 收件人一律行 `PICK`：由呢一輪開始收件人係幹事決定嘅，
          // 而 `PICK` 就係「照 `pickedKeys` 寄」嗰條路。
          sendOptions_.recipientScope = 'PICK';
          if (!commitExtraEmails(sendOptions_)) return;
          closeModal();
          drawSendMain(s);
        }, ''),
        button('取消', () => { closeModal(); drawSendMain(s); }, 'secondary')
      ]));
  }

  /* ── 「自己揀」嗰個名單 ─────────────────────────────────── */

  /* ── 舊嗰個「自己揀」名單已經拆走（第四十六輪批次 A2）──────────
   *
   * ⚠️ 佢同  做緊同一件事，而且兩份會慢慢長得
   * 唔一樣——Ivan 講咗三次「應該似處理紙本嗰個」，成因就係兩份碼。
   * 收件人池而家一律行 （同階段無關）。
   */

  /**
   * 身分標籤，例如「　堂委」。冇身分就回空字串。
   * ⚠️ 第四十六輪批次 A1 組：多咗 `IT` 同 `CLERK` 兩個身分，
   * 呢度要一齊認得——認唔到就會喺名單上顯示成一片空白，
   * 而幹事會以為嗰個人冇身分。
   */
  function describeRoleTags(roles) {
    const map = { COMMITTEE: '堂委', DEACON: '執事', IT: 'IT', CLERK: '幹事' };
    const names = (roles || []).map((r) => map[r]).filter(Boolean);
    return names.length > 0 ? ('　' + names.join('、')) : '';
  }

  function sendConfirmLabel(kind) {
    if (kind === 'REVIEW') return '寄給堂委審閱';
    if (kind === 'OFFICIAL') return '正式發出給全體';
    if (kind === 'RESEND') return '重發給有改動的人';
    return '寄出';
  }

  /**
   * 落到原本嗰三條路。
   * ⚠️ **唔喺呢度重新實作任何一條。** 嗰三個函式各自帶住自己嗰套
   * 前置檢查同確認畫面，繞開佢哋就等於把嗰啲閘全部丟掉。
   *
   * ⚠️ 第四十輪：sendOptions 一路傳到底。三個入口都收多一個參數，
   * 冇傳嘅時候行為同今日一模一樣（見 SendOptions.gs 檔頭）。
   */
  function routeSend(kind, sendOptions) {
    if (kind === 'REVIEW') { openReview(sendOptions); return; }
    if (kind === 'OFFICIAL') { openOfficial(sendOptions); return; }
    if (kind === 'RESEND') { openResend(sendOptions); return; }
  }

  /* ============================================================
   * D 組：無電郵者的紙本
   * ============================================================ */

  let paperSelection_ = null;
  /** 第四十三輪批次 F 組：幹事自行輸入嘅電郵（同寄出嗰邊共用元件）。 */
  let paperExtra_ = { extraEmails: [], extraEmailsRaw: '' };

  /**
   * G 組：要印邊一種。`PERSONAL` ＝ 標示自己個名（現狀，預設）、
   * `PLAIN` ＝ 唔標示、`FULL_ONE` ＝ 一份大家睇。
   *
   * ⚠️ 每次開彈窗都要重設返做 `PERSONAL`——留住上一次嘅選擇，
   * 幹事下次開會以為自己揀緊預設，然後印出一疊冇名嘅表。
   */
  let paperKind_ = 'PERSONAL';

  function openPaperDialog() {
    runAction('讀取名單', async () => {
      const s = await callServer('apiGetPaperListState', currentQuarterId);
      if (s.versionNo < 0) {
        openModal('要印紙本的人', [para(s.message)], [button('知道了', () => closeModal(), '')]);
        return;
      }
      // 預設：**冇電郵嗰批全部勾好**。佢哋一定要印，唔應該要幹事逐個勾。
      paperKind_ = 'PERSONAL';
      paperExtra_ = { extraEmails: [], extraEmailsRaw: '' };
      paperSelection_ = {};
      s.noEmail.forEach((p) => { paperSelection_[p.personId] = true; });
      renderPaperDialog(s, '');
    });
  }

  /**
   * 第 5 步嘅名單。
   *
   * ⚠️ 第四十一輪批次 E 組：用共用元件 `pickListNodes()`，
   * 同「寄出 ▸ 自己選擇」嗰個名單**係同一份碼**。
   * 寫兩份嘅話，兩邊會慢慢長得唔一樣，而幹事會覺得系統時好時壞。
   *
   * ⚠️ 第四十一輪批次 G 組：加咗「印邊一種」三揀一。
   */
  function renderPaperDialog(s, keyword) {
    const nodes = [];

    nodes.push(para('有幾位查不到電郵，收不到信，但照樣要服侍。'
      + '下面是這一季第 ' + s.versionNo + ' 版有服侍的人。'));

    // ── G 組：要印哪一種 ────────────────────────────────────
    const kindBox = make('div', { className: 'sec' }, [sectionTitle('要印哪一種')]);
    [
      ['PERSONAL', '每人一份，標示他自己的名字',
        '每一份都不同：那個人自己那幾格有底色，一眼看到。'],
      ['PLAIN', '每人一份，不標示名字',
        '每一份內容都一模一樣，所以系統只做一個檔，你印幾份就可以。'
          + '下面仍然要選人——選了多少位，就是要印多少份。'],
      ['FULL_ONE', '一份整季表，印一張大家看',
        '同上面那一種是同一個檔，只是印一張。不需要選人。']
    ].forEach((opt) => {
      const line = make('label', { className: 'radio-row' });
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'paper-kind';
      input.checked = paperKind_ === opt[0];
      input.addEventListener('change', () => {
        if (!input.checked) return;
        paperKind_ = opt[0];
        renderPaperDialog(s, keyword);
      });
      line.appendChild(input);
      line.appendChild(make('span', { text: opt[1] }));
      kindBox.appendChild(line);
      // ⚠️ 每個選項下面嗰行小字唔可以慳。「不標示名字」同「一份大家看」
      // 係同一個檔——唔講清楚，幹事會以為系統漏做咗其他人嗰幾份，
      // 然後再撳多幾次。
      kindBox.appendChild(make('div', { text: '　　' + opt[2], className: 'muted' }));
    });
    nodes.push(kindBox);

    // ⚠️ 「一份整季表」根本唔使揀人。仲畫住個名單只會令人以為要揀——
    // 一個撳落去冇作用嘅控制項，就係呢個專案一直喺度殺嗰樣嘢。
    if (paperKind_ === 'FULL_ONE') {
      openModal('要印紙本的人', nodes, [
        button('產生這一份', () => runPlainPaper(1), ''),
        button('取消', () => closeModal(), 'secondary')
      ]);
      return;
    }

    // ── 名單（共用元件）────────────────────────────────────
    //
    // 冇電郵嗰批排喺前面並且預設勾好；有電郵嗰批排喺後面，
    // 有啲長者兩樣都要，可以額外揀。
    const items = s.noEmail.map((p) => ({
      key: p.personId,
      label: p.nameTC,
      note: '（這一季 ' + p.cellCount + ' 格）',
      warn: '⚠ 查不到電郵'
    })).concat(s.withEmail.map((p) => ({
      key: p.personId,
      label: p.nameTC,
      note: '（這一季 ' + p.cellCount + ' 格，有電郵）',
      warn: ''
    })));

    const redraw = (kw) => renderPaperDialog(s, kw === undefined ? keyword : kw);

    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('查不到電郵的有 ' + s.noEmail.length + ' 位——預設全部已經選好'),
      make('div', {
        text: '有電郵的人也在下面，有些長者兩樣都要，可以額外選。',
        className: 'muted'
      })
    ]));

    const countNode = make('div', { className: 'ok-line strong' });
    const refreshCount = () => {
      const n = selectedPaperIds().length;
      countNode.textContent = paperKind_ === 'PLAIN'
        ? ('已選 ' + n + ' 位——即是要印 ' + n + ' 份。')
        : ('已選 ' + n + ' 位。');
    };
    refreshCount();

    pickListNodes({
      items: items,
      selected: paperSelection_,
      keyword: keyword,
      onRedraw: redraw,
      onToggle: refreshCount,
      emptyText: '這一季還沒有任何人有服侍。'
    }).forEach((n) => nodes.push(n));
    nodes.push(countNode);

    if (paperKind_ === 'PLAIN') {
      openModal('要印紙本的人', nodes, [
        button('產生這一份', () => runPlainPaper(selectedPaperIds().length), ''),
        button('取消', () => closeModal(), 'secondary')
      ].concat(pickListBulkButtons(items, paperSelection_, () => redraw())));
      return;
    }

    // ⚠️ 兩個出口都要講清楚會發生咩事——尤其係「寄到自己信箱」
    // 就算喺模擬模式都會真係寄。
    nodes.push(buildExtraEmailBox(paperExtra_,
      '那幾個地址會收到整份紙本包（同你自己收到那幾封一模一樣），不是個人版。'));

    nodes.push(make('div', { className: 'sec' }, [
      sectionTitle('兩個出口'),
      make('div', {
        text: '・下載：系統會產生每人一份 PDF，然後給你一條資料夾連結。'
          + '在 Google 雲端硬碟撳「下載」就會整個資料夾打包成 zip。',
        className: 'ok-line'
      }),
      make('div', {
        text: '・寄到自己信箱：全部 PDF 夾成信寄給你自己（不是寄給義工）。'
          + '這一封就算系統仍然在模擬模式，都會真的寄出。',
        className: 'ok-line'
      })
    ]));

    openModal('要印紙本的人', nodes, [
      button('產生並取得連結', () => runPaperGenerate(), ''),
      button('寄到自己信箱', () => runPaperEmail(), 'secondary'),
      button('取消', () => closeModal(), 'secondary')
    ].concat(pickListBulkButtons(items, paperSelection_, () => redraw())));
  }

  function selectedPaperIds() {
    return Object.keys(paperSelection_ || {}).filter((id) => paperSelection_[id] === true);
  }

  /**
   * G 組：不標示名字的那一份。
   *
   * ⚠️ 走的是 `apiGeneratePlainPaper()`，而佢入面用返
   * `buildFullRosterPdfBlob_()`——**冇另寫一套匯出**。
   * 嗰條路本來就完全冇經過 highlight（見 `PaperPack.gs` 檔尾嘅說明）。
   *
   * @param {number} copies 要印幾多份（只影響提示文字）
   */
  function runPlainPaper(copies) {
    runAction('產生紙本', async () => {
      const r = await callServerMutating('apiGeneratePlainPaper', currentQuarterId, copies);
      const nodes = [make('div', { text: '已完成', className: 'ok-head' })];

      const link = make('a', { text: '開啟這一份（' + r.fileName + '）', className: 'bigLink' });
      link.href = r.fileUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      nodes.push(link);

      nodes.push(make('div', { text: r.message, className: 'ok-line' }));
      nodes.push(make('div', {
        text: Number(r.copies) > 1
          ? ('打印的時候，份數選 ' + r.copies + '。')
          : '打印一張就可以。',
        className: 'ok-line strong'
      }));
      openModal('紙本 PDF', nodes, [button('知道了', () => closeModal(), '')]);
    });
  }

  function runPaperGenerate() {
    const ids = selectedPaperIds();
    if (ids.length === 0) {
      openModal('要印紙本的人', [para('一位都沒有選。')],
        [button('知道了', () => closeModal(), '')]);
      return;
    }
    runAction('產生個人 PDF', async () => {
      busyShow('正在產生個人 PDF', '共 ' + ids.length + ' 份，需時較長，不要關掉這一頁。');
      const r = await callServerMutating('apiGeneratePaperPack', currentQuarterId, ids);
      renderPaperResult(r);
    });
  }

  function renderPaperResult(r) {
    const nodes = [
      make('div', { text: r.done ? '已完成' : '做了一部分', className: 'ok-head' }),
      para(r.message)
    ];

    if (r.folderUrl) {
      const link = make('a', { text: '開啟資料夾（在裡面撳「下載」就會打包成 zip）', className: 'bigLink' });
      link.href = r.folderUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      nodes.push(link);
    }

    if (r.files && r.files.length > 0) {
      const box = make('div', { className: 'sec' }, [
        sectionTitle('逐個檔（只想印其中一兩位就用這裡）')
      ]);
      r.files.forEach((f) => {
        const a = make('a', { text: f.nameTC, className: 'sheetlink' });
        a.href = f.url;
        a.target = '_blank';
        a.rel = 'noopener';
        box.appendChild(make('div', { className: 'vio-row' }, [a]));
      });
      nodes.push(box);
    }

    // ⚠️ 搵唔到嘅要逐個講。靜靜略過 ⇒ 幹事少印一份，而且唔知少咗邊個。
    if (r.missing && r.missing.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [
        sectionTitle('這 ' + r.missing.length + ' 位找不到 PDF')
      ]);
      r.missing.forEach((m) => {
        box.appendChild(make('div', {
          text: (m.nameTC || m.personId) + '：' + m.reason, className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    if (r.errors && r.errors.length > 0) {
      const box = make('div', { className: 'sec sec-warn' }, [sectionTitle('產生時出過錯')]);
      r.errors.slice(0, 10).forEach((e) => {
        box.appendChild(make('div', {
          text: String(e && e.message ? e.message : e), className: 'vio-row'
        }));
      });
      nodes.push(box);
    }

    const actions = [button('知道了', () => closeModal(), '')];
    if (!r.done) {
      actions.unshift(button('繼續做餘下的', () => { closeModal(); runPaperGenerate(); }, ''));
    }
    openModal('紙本 PDF', nodes, actions);
  }

  function runPaperEmail() {
    const ids = selectedPaperIds();
    if (ids.length === 0) {
      openModal('要印紙本的人', [para('一位都沒有選。')],
        [button('知道了', () => closeModal(), '')]);
      return;
    }
    openConfirm({
      title: '寄到自己信箱',
      bodyNodes: [
        para('會把選好的 ' + ids.length + ' 位的個人 PDF，夾成信寄給你自己。'),
        make('div', { className: 'warnbox' }, [
          make('div', {
            text: '收件人永遠是你自己，不是義工。所以這一封就算系統仍然在模擬模式，'
              + '都會真的寄出。附件太多的話會自動分成幾封。',
            className: 'lines'
          })
        ]),
        // ⚠️ 第四十四輪批次 D 組：舊嗰句係「如果那幾份 PDF 還未產生過，
        // 先撳『產生並取得連結』」——即係系統明明知道欠邊幾份、
        // 明明有工具補得返，但叫幹事自己去撳多一粒掣。Ivan 就係喺呢度
        // 收到「一份個人 PDF 都找不到。」
        para('還未產生的，系統會在寄之前自己補產生，不用先撳「產生並取得連結」。'
          + '份數多的時候一次可能做不完，做不完會停下來講清楚還差多少，'
          + '再撳一次就會接住做。', 'muted')
      ],
      confirmLabel: '寄給我自己',
      onConfirm: () => {
        if (!commitExtraEmails(paperExtra_)) return;
        runAction('產生欠缺的 PDF 並寄出', async () => {
          const r = await callServerMutating(
            'apiEmailPaperPackToSelf', currentQuarterId, ids, paperExtra_.extraEmails);

          // ⚠️ 未做齊 ⇒ **一封都未寄**。呢個唔可以用「已寄出」個綠色頭
          // 嚟報——幹事見到綠色就會走去印，而信根本未到。
          const nodes = r.pending
            ? [make('div', { text: '還未寄出——還在補產生 PDF', className: 'warn-head' }),
              para(r.message)]
            : [make('div', { text: '已寄出', className: 'ok-head' }), para(r.message)];

          if (r.missing && r.missing.length > 0) {
            const box = make('div', { className: 'sec sec-warn' }, [
              sectionTitle('這 ' + r.missing.length + ' 位補不到 PDF，沒有夾進去')
            ]);
            r.missing.forEach((m) => {
              box.appendChild(make('div', {
                text: (m.nameTC || m.personId) + '：' + m.reason, className: 'vio-row'
              }));
            });
            nodes.push(box);
          }

          // 未做齊 ⇒ 直接俾一粒「接住做」，唔好要佢由頭撳過一次。
          const acts = [];
          if (r.pending) {
            acts.push(button('接住做餘下的', () => { closeModal(); runPaperEmail(); }, ''));
          }
          acts.push(button('知道了', () => closeModal(), r.pending ? 'secondary' : ''));
          openModal('寄到自己信箱', nodes, acts);
        });
      }
    });
  }
</script>
