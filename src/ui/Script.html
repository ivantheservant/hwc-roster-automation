  const el = (id) => document.getElementById(id);

  /* ============================================================

   *
   * 補一句就係第四次嘅溫床。所以改成三條**結構性**規則：
   *

   */

  /**

   * ⚠️ **只可以喺 `loadDashboard()` 入面賦值，只可以經 `getDashboard()` 讀。**
   */
  let dashboardState_ = null;

  /** 有寫入動作跑過但未刷新。`getDashboard()` 見到就會先刷新。 */
  let dashboardStale_ = false;

  /**

   *
   * ⚠️ **新增一個 api 而唔加入呢度，系統就會當佢會寫入。** 呢個方向係
   * 特登嘅（見上面）。加入之前請自己確認：佢真係一格都唔會寫。
   */
  const READ_ONLY_APIS = [
    'apiListQuarters',
    // 第三十九輪批次：主流程六步。三個都係純讀取——
    // apiGetMainFlowState 同 apiGetSendPlanSummary 全程 beginSheetReadMemo_()，
    // apiPlanEligibilitySheetApply 只係讀返張名單工作表同 Eligibility 做比對。
    'apiGetMainFlowState',
    'apiGetSendPlanSummary',
    // 第四十輪批次 A 組：「自己揀」嗰個名單。純讀取（只係讀 EmailRecipients
    // 同呢一版嘅派工，砌返該階段真正會收到信嘅人）。
    'apiGetSendCandidates',
    // 第四十一輪批次 B 組：〔檢查我的改動〕係唯讀——佢乜都唔改，
    // 呢一點喺畫面上都要講明（幹事撳完唔敢再撳第二次，驚改咗嘢）。
    'apiCheckMyChanges',
    'apiGetSuggestionState',
    'apiGetPaperListState',
    'apiPlanEligibilitySheetApply',
    'apiGetDashboardState',
    'apiGetThemePreference',
    'apiGenerateDraftPlan',
    'apiSaveAndConfirmPlan',
    'apiStep2Preview',
    'apiStep4GetPendingWarnings',
    'apiStep4GetMissingPdfWarnings',
    'apiStep4GetSendPreview',
    'apiStep5Plan',
    'apiListVersionsForRollback',
    'apiRollbackPlan',
    'apiListSpecialSundays',
    'apiWebListPreacherPending',
    'apiGetPreQuarterChecklist',
    'apiListUnavailable',
    'apiPreviewUnavailableImpact',
    'apiListPeople',
    'apiListAliases',
    'apiGetEligibilityMatrix',
    'apiGetPersonPostWeightMatrix',
    'apiListRoles',
    'apiRolesTermChangePlan',
    'apiRoleOverview',
    'apiListExclusions',
    'apiHwcasPreview',
    'apiListVersionsForZone4',
    'apiVerifyRosterForZone4',
    'apiListPendingBackfillCellsForZone4',
    'apiDraftReviewReportForZone4',
    'apiMakeupSendStages',
    'apiMakeupSendPlan',
    'apiAnnualQuartersPlan',
    'apiAnnualCombinedPlan',
    'apiListRuleReviewSheets',
    'apiRuleReviewImportPlan'
  ];

  // ── 伺服器呼叫 ───────────────────────────────────────────────

  /* ══════════════════════════════════════════════════════════════
   * 第四十五輪批次：送去伺服器之前，先清一次參數
   * ══════════════════════════════════════════════════════════════
   *
   * 現場錯誤：`Failed due to illegal value in property: 1`
   *
   * ⚠️ 第四十四輪把呢句判成 `Range.setValues()` 收到壞值——**判錯咗**。
   * 現場證據推翻咗：Apps Script 執行紀錄**完全冇呢一次執行**
   *（只有 `apiGetMainFlowState`／`apiGetDashboardState`／`apiListQuarters`／
   * `doGet`，全部 Completed）。即係後端從來冇被叫到。
   *
   * 真正嘅來源係 `google.script.run` 嘅**參數序列化**，喺 client 端、
   * 喺送出之前就拋。合法嘅只有原始型別、陣列、純物件；
   * `undefined`、函式、DOM 元素、事件物件、循環引用都唔合法。
   * 而 `property: N` 入面嗰個 `N` 係**第幾個參數**（由 0 數起）。
   *
   * 真正嗰個 bug：
   *
   *     stepButton('請系統幫我調整', openBuildSuggestion, {…})
   *     function openBuildSuggestion(startFrom) {…}
   *
   * `button()` 做嘅係 `addEventListener('click', onClick)`，所以
   * `openBuildSuggestion` 收到嘅第一個參數係一個 **MouseEvent**。
   * 跟住佢原封不動傳咗落去做第 1 個參數：
   *
   *     callServerMutating('apiBuildSuggestion', currentQuarterId, startFrom || '')
   *                                              ↑ 參數 0        ↑ 參數 1 ＝ MouseEvent
   *
   * ⇒ `Failed due to illegal value in property: 1`。一個字都冇差。
   *
   * ─────────────────────────────────────────────────────────────
   * 點解要有呢一層，而唔係淨係修好嗰一粒掣
   * ─────────────────────────────────────────────────────────────
   *
   * 因為 sandbox 拋嗰句**冇講邊個 API、冇講嗰個值係乜**。
   * 幹事見到一句英文；而我上一輪拎住同一句英文，查咗成個後端，
   * 修咗一堆冇問題嘅地方。
   *
   * 所以呢度做兩件事：
   *   一、送出之前**逐個參數行一次**，撞到唔合法嘅就喺 client 端
   *       即刻拋一個講得明嘅三段式錯（邊個 API、第幾個參數、
   *       入面邊一條路徑、嗰個值係乜嘢型別）。
   *   二、乾淨嘅就 `JSON.parse(JSON.stringify(...))` 清一次，
   *       剝走 prototype、getter 呢類唔會過得到 sandbox 嘅嘢。
   *
   * ⚠️ **次序唔可以掉轉。** `JSON.stringify()` 會把函式同 `undefined`
   * **靜靜噉刪走**（物件入面成條 key 消失、陣列入面變 `null`）。
   * 先清後驗嘅話，呢個 bug 就會由「拋一句睇唔明嘅英文」
   * 變成「靜靜傳咗個 null 上去」——更差。
   */

  /**
   * 「一個純物件」——`{}` 字面量或者 `Object.create(null)`，唔係
   * `Date`／`MouseEvent`／`Element`／自訂 class 嘅 instance。
   *
   * ⚠️ 用 constructor **名**，唔用 `proto !== Object.prototype`。
   * 一個由另一個 realm 造出嚟嘅普通物件（iframe、測試沙箱）
   * 有一個唔同嘅 `Object.prototype`，身分比較會把佢誤判。
   *
   * ⚠️ 呢個係**唯一**一個「純物件」嘅定義：`findIllegalServerValue_()`
   * 同 `plainObjectOrNull_()` 都行呢一個。寫兩份就一定會分岔，
   * 而分岔嘅後果係「擋得住嘅同清得走嘅唔係同一批」。
   *
   * @param {*} v 要驗嘅值
   * @returns {boolean} 係咪純物件
   */
  function isPlainObject_(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v)) return false;
    const proto = Object.getPrototypeOf(v);
    if (proto === null) return true;
    const ctor = proto.constructor;
    return !!ctor && ctor.name === 'Object';
  }

  /**
   * 第四十五輪批次：**一個「本來可以唔傳」嘅物件參數，一律收成純物件或者 `null`。**
   *
   * 兩個成因，同一句錯：
   *
   *   一、`undefined` **過唔到** `google.script.run`
   *       ——`openReview()` 冇參數噉叫，第 1 個參數就係 `undefined`
   *   二、直接綁做點擊處理嗰陣，收到嘅係一個 `MouseEvent`
   *       ——區一四粒大掣本來就係 `onClick: handlers[b.key]`
   *
   * 兩者都會變成 `Failed due to illegal value in property: 1`。
   *
   * 後端嗰邊 `resolveSendOptions_()` 做嘅係 `sendOptions || {}`，
   * 所以 `null` 同 `undefined` 對佢完全一樣——但 `null` 過得到，
   * `undefined` 過唔到。
   *
   * @param {*} v 呼叫端收到嘅嘢
   * @returns {?Object} 純物件本身；其餘一律 `null`
   */
  function plainObjectOrNull_(v) {
    return isPlainObject_(v) ? v : null;
  }

  /** 一個值嘅型別，講到幹事同開發者都睇得明。 */
  function describeIllegalValue_(v) {
    if (v === undefined) return 'undefined（沒有值）';
    if (typeof v === 'function') return '一個函式';
    if (typeof v === 'symbol') return '一個 Symbol';
    if (v && typeof v === 'object') {
      const name = (v.constructor && v.constructor.name) ? v.constructor.name : '物件';
      if (typeof v.nodeType === 'number') return '一個畫面元素（' + name + '）';
      return '一個 ' + name;
    }
    return String(typeof v);
  }

  /**
   * 一個值可唔可以過得到 `google.script.run`。
   *
   * ⚠️ 事件物件（`MouseEvent` 等）同 DOM 元素冇一個共通嘅簡單特徵，
   * 所以用「唔喺白名單就當唔合法」：原始型別、`null`、純陣列、
   * 純物件（`Object.prototype` 或者冇 prototype）先算合法。
   * 呢個係**刻意保守**——寧可誤報一個講得明嘅錯，
   * 都好過由 sandbox 拋一句冇人睇得明嘅英文。
   *
   * @param {*} value 要驗嘅值
   * @param {string} path 由參數開始嘅路徑，用嚟報位置
   * @param {Object[]} seen 已經行過嘅物件（捉循環引用）
   * @returns {?{path: string, what: string}} 冇問題回 null
   */
  function findIllegalServerValue_(value, path, seen) {
    if (value === null) return null;
    const t = typeof value;
    if (t === 'string' || t === 'number' || t === 'boolean') return null;
    if (t === 'undefined' || t === 'function' || t === 'symbol' || t === 'bigint') {
      return { path: path, what: describeIllegalValue_(value) };
    }

    // 由呢度開始一定係 object。
    if (seen.indexOf(value) !== -1) {
      return { path: path, what: '一個循環引用（自己指返自己）' };
    }
    seen.push(value);

    if (Array.isArray(value)) {
      for (let i = 0; i < value.length; i++) {
        const hit = findIllegalServerValue_(value[i], path + '[' + i + ']', seen);
        if (hit) return hit;
      }
      seen.pop();
      return null;
    }

    // ⚠️ 只放行**純物件**。`Date`／`MouseEvent`／`Element`／自訂 class
    // 全部落喺呢度——`Date` 亦都唔應該直接傳（sandbox 唔會保留佢），
    // 呼叫端要自己轉做字串。
    // 「純物件」嘅定義只有一個，喺 `isPlainObject_()`。
    if (!isPlainObject_(value)) {
      return { path: path, what: describeIllegalValue_(value) };
    }

    const keys = Object.keys(value);
    for (let k = 0; k < keys.length; k++) {
      const hit = findIllegalServerValue_(value[keys[k]], path + '.' + keys[k], seen);
      if (hit) return hit;
    }
    seen.pop();
    return null;
  }

  /**
   * 送出之前清一次。撞到清唔到嘅就拋一個**講得明**嘅錯。
   *
   * @param {string} fnName 要叫嘅後端函式名
   * @param {*[]} args 參數
   * @returns {*[]} 清乾淨、可以直接送出嘅參數
   */
  function sanitizeServerArgs_(fnName, args) {
    return args.map(function (arg, i) {
      const hit = findIllegalServerValue_(arg, '參數 ' + i, []);
      if (hit) {
        throw new Error(buildClientThreePart_(
          '程式錯誤：呼叫「' + fnName + '」的時候，' + hit.path
            + ' 是' + hit.what + '，這種東西送不到伺服器。',
          '伺服器一次都沒有被呼叫，所以什麼都沒有改動。',
          ['請把這一句連同你剛才撳過的掣告訴開發者',
            '最常見的成因是：一粒掣直接把一個「會收參數」的函式當成點擊處理'
              + '（那樣它收到的第一個參數會是滑鼠事件，不是你以為的那個值）']));
      }
      // 乾淨先清——`JSON` 一個來回剝走 prototype／getter 呢類
      // 過唔到 sandbox 嘅嘢。上面已經驗過，所以唔會靜靜刪走任何嘢。
      return arg === undefined ? arg : JSON.parse(JSON.stringify(arg));
    });
  }

  /**
   * client 端自己砌一個三段式訊息，格式同後端 `buildThreePartMessage_()` 一樣，
   * 所以 `showErrorModal()` 嗰個拆解器照樣拆得開。
   * @param {string} what 發生咗咩
   * @param {string} state 而家嘅情況
   * @param {string[]} howto 可以點做
   * @returns {string} 三段式訊息
   */
  function buildClientThreePart_(what, state, howto) {
    return '發生了什麼：' + what
      + '\n現在的情況：' + state
      + '\n你可以怎樣做：\n' + (howto || []).map(function (h) { return '・' + h; }).join('\n');
  }



  /**
   * 把 google.script.run 包成 Promise。
   * ⚠️ **全前端只有呢一個函式可以掂 `google.script.run`。**
   * 其餘一律經 `callServer()`／`callServerMutating()`，
   * 否則就繞過咗上面嗰道白名單關卡。
   */
  function callServerRaw_(fnName, ...args) {
    return new Promise((resolve, reject) => {
      // ⚠️ 第四十五輪批次：送出之前一定要清一次。
      // 喺 executor 入面拋 ⇒ 自動變成 reject，同其餘失敗一條路。
      const safeArgs = sanitizeServerArgs_(fnName, args);
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))))
        [fnName](...safeArgs);
    });
  }

  /** 唯讀呼叫。唔喺白名單就即刻拒絕——呢個係一個程式錯誤，唔係使用者錯。 */
  function callServer(fnName, ...args) {
    if (READ_ONLY_APIS.indexOf(fnName) === -1) {
      return Promise.reject(new Error(
        '程式錯誤：「' + fnName + '」不在唯讀白名單裡面。'
        + '會改動資料的呼叫要用 callServerMutating()（它會自動把狀態快取標記為過期）；'
        + '如果它真的一格都不會寫，請把它加入 READ_ONLY_APIS。'));
    }
    return callServerRaw_(fnName, ...args);
  }

  /**
   * 會改變伺服器狀態嘅呼叫。**成功之後即刻標記快取過期。**
   *
   * 唔喺呢度即場刷新，係因為有啲流程會連續叫幾十次（例如分批產生
   * 個人 PDF），每次都刷新就係幾十次多餘嘅來回。改成「標記過期」：
   *   ・`getDashboard()` 一讀就會先刷新（所以判斷永遠用新資料）
   *   ・`runAction()` 做完會刷新一次（所以畫面永遠跟住變）
   * 兩邊都係自動嘅，呼叫端唔使記得任何嘢。
   */
  async function callServerMutating(fnName, ...args) {
    const result = await callServerRaw_(fnName, ...args);
    dashboardStale_ = true;
    return result;
  }

  /**
   * 讀狀態快取嘅**唯一**入口。過期就先刷新再回。
   * @returns {Promise<?Object>} 未揀季度時會係 null
   */
  async function getDashboard() {
    if (dashboardStale_ || !dashboardState_) await loadDashboard({ keepModal: true });
    return dashboardState_;
  }

  /**
   * 講一句畀幹事聽。
   *
   * ⚠️ 第四十四輪批次 C 組：**彈窗開住嘅時候一定要寫入彈窗本身。**
   *
   * 重現：寄出 ▸ 寄給誰揀「自己選擇」▸ 一個都唔勾 ▸ 撳〔寄出〕。
   * 修正之前：`onConfirm` 叫 `setStatus('你選了「自己選擇」，但一位都
   * 沒有選。', true)` 然後 `return`。而 `#status` 喺畫面最頂、
   * 喺 `.modal-backdrop`（`position: fixed; inset: 0; z-index: 100`，
   * 半透明黑）**下面**——所以嗰句字寫咗，但一個像素都見唔到。
   * 幹事見到嘅係：**撳落去完全冇反應。**
   *
   * 呢個唔係得一個位。任何一句喺彈窗開住時講嘅話都一樣消失。
   * 所以修喺呢度（唯一入口），唔係逐個呼叫端補。
   *
   * @param {string} message 一句人話；空字串等於清走
   * @param {boolean=} isError 係咪錯誤（紅色）
   */
  function setStatus(message, isError) {
    const node = el('status');
    node.textContent = message || '';
    node.className = isError ? 'status error' : 'status';

    // 彈窗開住 ⇒ 頂嗰條睇唔到，一定要喺彈窗入面再講一次。
    const inModal = el('modalStatus');
    if (!inModal) return;
    if (modalOpen && message) {
      inModal.textContent = message;
      inModal.className = isError ? 'modal-status' : 'modal-status ok';
      inModal.hidden = false;
    } else {
      inModal.textContent = '';
      inModal.hidden = true;
    }
  }

  /* ══════════════════════════════════════════════════════════════
   * 第三十九輪批次 B 組：睇得見嘅載入回饋
   * ══════════════════════════════════════════════════════════════
   *
   * Ivan 明講：舊嗰句細灰字「重新整理…」睇唔出係做緊嘢定係做完咗。
   *
   * 呢一組函式做四件事：
   *   開始　　畫面中央出一塊牌，講明**做緊咩**（唔係一個轉圈）
   *   進行中　需時長嘅動作叫 `setProgress()` 報第幾批／共幾批
   *   完成　　明確講「已完成」，而且**停留 BUSY_DONE_MS 先收**
   *   失敗　　紅色，講人話（詳細錯誤仍然由 showErrorModal 負責）
   *
   * ⚠️ 個牌係 `runAction()` 自動開關嘅，呼叫端唔使記得任何嘢——
   * 同 `setBusy()` 一樣。唯一要主動叫嘅係 `setProgress()`。
   */

  /** 「已完成」停留幾耐先收。太短就等於冇顯示過。 */
  const BUSY_DONE_MS = 1100;

  let busyNode_ = null;
  let busyHideTimer_ = null;
  let busyTickTimer_ = null;
  let busyStartedAt_ = 0;

  function busyEnsure_() {
    if (busyNode_) return busyNode_;
    const fill = make('div', { className: 'busy-bar-fill', id: 'busyBarFill' });
    const bar = make('div', { className: 'busy-bar', id: 'busyBar' }, [fill]);
    bar.hidden = true;
    const card = make('div', { className: 'busy-card', id: 'busyCard' }, [
      make('div', { className: 'busy-title', id: 'busyTitle' }),
      make('div', { className: 'busy-sub', id: 'busySub' }),
      bar,
      // 第四十三輪批次 A 組：真嘅計時 ＋「會做嘅事」。
      make('div', { className: 'busy-elapsed', id: 'busyElapsed' }),
      make('div', { className: 'busy-steps', id: 'busySteps' })
    ]);
    busyNode_ = make('div', { className: 'busy-overlay', id: 'busyOverlay' }, [card]);
    busyNode_.hidden = true;
    document.body.appendChild(busyNode_);
    return busyNode_;
  }

  /**
   * 開始一個動作：畫面中央出牌。
   *
   * ═════════════════════════════════════════════════════════════════
   * ⚠️ 第四十三輪批次 A 組：三十幾秒嘅動作，一個轉圈唔夠
   * ═════════════════════════════════════════════════════════════════
   *
   * Ivan 講儲存要等三十幾秒。呢個牌要做到兩件事：
   *
   *   一、**真嘅計時**——「已經 12 秒」。個數字自己郁，佢就知道系統
   *   　　仲喺度做緊嘢，而唔係死咗。
   *   二、**列出會做嘅事**——讀取改動、檢查規則、建立新版本、
   *   　　重新發佈公開連結。
   *
   * ⚠️ 第二點刻意**唔扮成進度**：伺服器係一個請求，前端根本唔知道
   * 佢做到邊一步。逐步 highlight 就要靠一個計時器去猜，而猜出嚟嗰個
   * 「而家做緊第 3 步」係假嘅——同建議表嗰句假承諾同一種錯。
   * 所以標題寫「會做這幾件事」，唔係「進度」。
   *
   * @param {string} title 做緊咩（人話，例如「正在儲存職事表」）
   * @param {string=} sub 補充一句（可以慳）
   * @param {string[]=} steps 會做嘅事（可以慳）
   */
  function busyShow(title, sub, steps) {
    const node = busyEnsure_();
    if (busyHideTimer_) { clearTimeout(busyHideTimer_); busyHideTimer_ = null; }
    el('busyCard').className = 'busy-card';
    el('busyTitle').textContent = title || '處理中';
    el('busySub').textContent = sub || '請稍等，不要關掉這一頁。';
    el('busyBar').hidden = true;
    el('busyBarFill').style.width = '0';

    // ── 會做嘅事 ──────────────────────────────────────────────
    const stepBox = clear(el('busySteps'));
    const list = steps || [];
    stepBox.hidden = list.length === 0;
    if (list.length > 0) {
      stepBox.appendChild(make('div', { text: '會做這幾件事：' }));
      const ul = document.createElement('ul');
      list.forEach((t) => ul.appendChild(make('li', { text: t })));
      stepBox.appendChild(ul);
    }

    // ── 真嘅計時 ──────────────────────────────────────────────
    busyStartedAt_ = Date.now();
    el('busyElapsed').textContent = '已經 0 秒';
    if (busyTickTimer_) clearInterval(busyTickTimer_);
    busyTickTimer_ = setInterval(() => {
      if (!busyNode_ || busyNode_.hidden) return;
      const secs = Math.round((Date.now() - busyStartedAt_) / 1000);
      el('busyElapsed').textContent = secs >= 25
        // ⚠️ 二十五秒之後先講「通常要三十幾秒」。一開始就講，
        // 佢會覺得每一個動作都要等咁耐（大部分其實一兩秒）。
        ? ('已經 ' + secs + ' 秒　這一步通常要三十幾秒，不要關掉這一頁。')
        : ('已經 ' + secs + ' 秒');
    }, 1000);

    node.hidden = false;
  }

  /**
   * 需時長嘅動作報進度。**唔知總數就傳 0**，噉樣只出文字唔出進度條——
   * 出一條永遠唔郁嘅進度條比冇進度條更誤導。
   * @param {number} done 已完成
   * @param {number} total 總數（0 代表唔知）
   * @param {string=} label 一句人話（例如「第 2 批／共 5 批」）
   */
  function setProgress(done, total, label) {
    if (!busyNode_ || busyNode_.hidden) return;
    el('busySub').textContent = label
      || (total > 0 ? ('已完成 ' + done + ' ／ 共 ' + total) : ('已完成 ' + done));
    const hasBar = total > 0;
    el('busyBar').hidden = !hasBar;
    if (hasBar) {
      const pct = Math.max(0, Math.min(100, Math.round((done / total) * 100)));
      el('busyBarFill').style.width = pct + '%';
    }
  }

  /**
   * 收牌。`outcome` 為 'done'／'fail' 時會先顯示一句結論再停留一陣。
   * @param {string=} outcome 'done'｜'fail'｜其他（即刻收）
   * @param {string=} message 結論一句
   */
  function busyHide(outcome, message) {
    if (!busyNode_ || busyNode_.hidden) return;
    if (busyTickTimer_) { clearInterval(busyTickTimer_); busyTickTimer_ = null; }
    if (outcome !== 'done' && outcome !== 'fail') { busyNode_.hidden = true; return; }
    el('busyCard').className = 'busy-card ' + (outcome === 'done' ? 'is-done' : 'is-fail');
    el('busyTitle').textContent = message || (outcome === 'done' ? '已完成' : '沒有完成');
    el('busySub').textContent = outcome === 'done' ? '' : '下面會講清楚發生了什麼事。';
    el('busyBar').hidden = true;
    if (busyTickTimer_) { clearInterval(busyTickTimer_); busyTickTimer_ = null; }
    busyHideTimer_ = setTimeout(() => {
      busyHideTimer_ = null;
      if (busyNode_) busyNode_.hidden = true;
    }, BUSY_DONE_MS);
  }

  /**
   * 忙碌鎖。**由撳落去到彈出結果為止，整個介面唔可以撳到任何嘢。**
   *
   * ═════════════════════════════════════════════════════════════════
   * 第四十三輪批次 A 組：Ivan 現場撞到嘅嘢
   * ═════════════════════════════════════════════════════════════════
   *
   * > 撳「儲存我的修改」，等咗一陣，畫面好似重新整理咗，我可以自由撳
   * > 任何一粒掣。但再等三十幾秒，佢突然彈出「已儲存乜」。
   * > 呢個等待空隙好易令我誤撳其他掣，或者再撳一次儲存。
   *
   * ─────────────────────────────────────────────────────────────────
   * 點解舊寫法唔夠
   * ─────────────────────────────────────────────────────────────────
   *
   * 舊寫法係「逐粒 `<button>` 設 `disabled`」。三個窿：
   *
   *   一、**只鎖 `<button>`**。頂部嗰個季度下拉（`<select>`）、
   *   　　彈窗入面嘅輸入格、`<a class="bigLink">` 全部照樣撳得到。
   *   　　換一次季度會令成個畫面重畫，而後台仲做緊嘢。
   *
   *   二、**重畫就解鎖**。`loadDashboard()` 會 `clear()` 再重新
   *   　　`appendChild()`，新造出嚟嘅掣冇 `disabled`——即係只要動作期間
   *   　　有任何一次重畫，鎖就自己冇咗。
   *
   *   三、鎖同解鎖靠一個 `dataset` 旗標對數，對唔上就解錯。
   *
   * ─────────────────────────────────────────────────────────────────
   * 而家：**一個 body class，CSS 做鎖**
   * ─────────────────────────────────────────────────────────────────
   *
   * `document.body.classList.add('is-busy')`，而 CSS 用
   * `body.is-busy` 把成頁嘅 `pointer-events` 熄咗（見 `Style.html`）。
   *
   * ⚠️ 呢個做法**唔怕重畫**：新造出嚟嘅節點一樣喺 `body` 入面，
   * 一樣受嗰條規則管。呢個就係第二個窿嘅治本。
   *
   * ⚠️ 仲係要照樣設 `disabled`：淨靠 `pointer-events: none` 擋唔到
   * 鍵盤（Tab ＋ Enter）。兩層一齊做。
   *
   * @param {boolean} busy 鎖定定解鎖
   */
  function setBusy(busy) {
    // 第一層：CSS。**唔怕重畫**——見上面。
    document.body.classList.toggle('is-busy', !!busy);

    // 第二層：`disabled`，擋鍵盤。⚠️ 連 `select` 同 `input` 都要，
    // 唔止 `<button>`——頂部嗰個季度下拉就係一個 `<select>`。
    document.querySelectorAll('button, select, input, textarea').forEach((b) => {
      if (busy) {
        if (!b.disabled) b.dataset.busyDisabled = '1';
        b.disabled = true;
      } else if (b.dataset.busyDisabled === '1') {
        // 只解除「因為忙碌而停用」嗰啲，唔可以把本身就應該變灰嘅掣着返
        // ——否則跑完一個動作之後，唔夠條件撳嘅掣會突然變成可撳。
        delete b.dataset.busyDisabled;
        b.disabled = false;
      }
    });
  }

  /**
   * 忙碌期間有畫面重畫過 ⇒ 重新鎖一次新造出嚟嗰批節點。
   *
   * ⚠️ CSS 嗰層唔使理（`body.is-busy` 自動蓋住新節點），
   * 但 `disabled` 嗰層要補——新造嘅掣冇人幫佢設過。
   */
  function reapplyBusyLockIfNeeded_() {
    if (document.body.classList.contains('is-busy')) setBusy(true);
  }

  /**
   * 包住每個會呼叫伺服器嘅動作：忙碌狀態＋錯誤處理。
   *
   * ⚠️ **全部** async 動作都一定要包一層。冇包嘅話，失敗會變成一個
   * 冇人處理嘅 rejected promise——畫面毫無反應、亦冇錯誤訊息，
   * 幹事只會見到「撳咗冇反應」。
   */
  /**
   * 第四十五輪批次：**載入中嘅標題唔可以直接駁一個「失敗」落去。**
   *
   * 現場見到嘅視窗標題：
   *
   *     系統調整中，請稍候失敗
   *
   * 成因：`runAction(label, …)` 嗰個 `label` 係一個**進行中嘅講法**
   *（俾中央嗰塊忙碌牌用），而失敗嗰陣直接寫咗 `label + '失敗'`。
   * 兩者係兩件事：一個係「而家做緊乜」，一個係「邊一件事做唔到」。
   *
   * 全專案有六十幾個 `runAction()` 呼叫點，逐個改一次就一定有漏網。
   * 所以喺呢度（唯一嗰個出口）把進行中嗰啲尾巴剝走：
   *
   *     系統調整中，請稍候 → 系統調整 → 「系統調整」做不到
   *     儲存中             → 儲存     → 「儲存」做不到
   *     讀取資料           → 讀取資料 → 「讀取資料」做不到
   *
   * ⚠️ 剝完之後**唔可以變成空字串**（例如 label 本身就係「載入中」
   * 呢類極短嘅字）。空咗就退回一句通用嘅講法，唔可以出一個冇標題嘅視窗。
   *
   * @param {string} label `runAction()` 嗰個進行中嘅講法
   * @returns {string} 錯誤視窗嘅標題
   */
  function actionErrorTitle_(label) {
    const cleaned = String(label === undefined || label === null ? '' : label)
      .trim()
      .replace(/[，,]\s*請稍候$/, '')
      .replace(/\s*請稍候$/, '')
      .replace(/中$/, '')
      .replace(/[.。…]+$/, '')
      .trim();
    return cleaned ? ('「' + cleaned + '」做不到') : '這一步做不到';
  }

  async function runAction(label, action, steps) {
    setBusy(true);
    // 第三十九輪 B 組：細灰字留住（俾睇慣咗嘅人），但真正嘅回饋係中央嗰塊牌。
    setStatus(label + '…');
    busyShow(label, undefined, steps);
    let ok = false;
    try {
      await action();
      ok = true;
      setStatus('');
    } catch (err) {
      busyHide('fail');
      showErrorModal(actionErrorTitle_(label), err);
      setStatus('');
    } finally {
      // 階段 A：呢個動作期間有冇寫過嘢？有嘅話畫面（狀態卡、區一四粒掣、
      // 區二「還有 N 項未做」）一定要跟住變。
      //
      // 擺喺 `finally` 而唔係成功路徑：拋錯唔代表冇寫入——好多動作係
      // 「寫咗一半先失敗」。嗰種情況下畫面更加需要係最新嘅。
      //
      // 刷新自己失敗唔可以蓋過原本嗰個錯（幹事會見到一個同佢做過嘅事
      // 完全無關嘅訊息）。所以只寫一句灰字，唔開第二個彈窗。
      if (dashboardStale_) {
        try { await loadDashboard({ keepModal: true }); }
        catch (e) { setStatus('畫面上的數字可能不是最新的，請撳「重新整理」。', true); }
      }
      // ⚠️ 收牌一定要喺刷新之後——刷新本身可能要幾秒，
      // 喺嗰之前收牌就會出現「講咗已完成、但畫面仲係舊數字」嘅空窗。
      if (ok) busyHide('done');
      setBusy(false);
    }
  }

  // ── 細小 DOM 工具 ────────────────────────────────────────────

  function make(tag, opts, children) {
    const node = document.createElement(tag);
    opts = opts || {};
    // ⚠️ 一律用 textContent，唔用 innerHTML——人名／備註都係使用者輸入，
    // 用 innerHTML 就係開咗一條 XSS 路。
    if (opts.text !== undefined) node.textContent = opts.text;
    if (opts.className) node.className = opts.className;
    if (opts.id) node.id = opts.id;
    if (opts.title) node.title = opts.title;
    (children || []).forEach((c) => { if (c) node.appendChild(c); });
    return node;
  }
  function button(label, onClick, className) {
    const b = make('button', { text: label, className: className || '' });
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }
  function para(text, className) {
    return make('p', { text: text, className: className || 'lines' });
  }
  function sectionTitle(text) { return make('div', { text: text, className: 'sec-title' }); }
  function row(nodes, className) { return make('div', { className: className || 'row' }, nodes); }

  /** 一個唔會被 innerHTML 影響嘅清空。 */
  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /* ══════════════════════════════════════════════════════════════
   * 共用：可搜尋嘅多選名單
   * ══════════════════════════════════════════════════════════════
   *
   * 第四十一輪批次 E 組：Ivan 要求「寄給誰」揀「自己選擇」嗰陣，
   * 展開一個**同紙本嗰個一模一樣**嘅名單，而且**用同一個共用元件**。
   *
   * ⚠️ 寫兩份嘅後果唔係「多咗幾行碼」——係兩個地方會慢慢長得唔一樣。
   * 一邊加咗搜尋、另一邊冇；一邊顯示「這一季 N 格」、另一邊冇。
   * 幹事會覺得系統時好時壞，而其實只係佢用緊兩個唔同嘅畫面。
   *
   * @param {Object} o {
   *   items: [{key, label, note, warn}],   逐項要顯示咩
   *   selected: {key: true},                而家揀咗邊啲（會被直接改動）
   *   keyword: 搜尋字串,
   *   onRedraw: (keyword) => void,          搜尋之後重畫
   *   emptyText: 一個項目都冇嗰陣講咩
   * }
   * @returns {Node[]} 要塞入彈窗嘅節點
   */
  function pickListNodes(o) {
    const nodes = [];
    const k = String(o.keyword || '').trim();
    const matched = k
      ? o.items.filter((it) => String(it.label || '').indexOf(k) !== -1)
      : o.items;

    const search = document.createElement('input');
    search.type = 'text';
    search.placeholder = '搜尋姓名⋯⋯';
    search.value = k;
    search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); o.onRedraw(search.value); }
    });
    nodes.push(row([search, button('搜尋', () => o.onRedraw(search.value), 'secondary')]));

    if (o.items.length === 0) {
      nodes.push(make('div', { className: 'warnbox' }, [
        make('div', { text: o.emptyText || '一個人都找不到。', className: 'lines' })
      ]));
      return nodes;
    }
    if (matched.length === 0) {
      nodes.push(make('div', { text: '找不到符合的人。', className: 'muted' }));
      return nodes;
    }

    const box = make('div', { className: 'sec' });
    matched.forEach((it) => {
      const line = make('label', { className: 'check-row' });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      // ⚠️ 第四十四輪批次 B 組：勾唔到嘅要**真係勾唔到**。
      //
      // Ivan 明講「冇電郵嘅人要標示『冇電郵，收唔到信』，而且唔可以勾」。
      // 淨係喺後面加一行字而仲勾得到，佢會勾咗，然後以為嗰個人會收到
      // ——而系統會靜靜略過。一個勾得到但冇作用嘅勾，
      // 同一粒撳咗冇反應嘅掣係同一種錯。
      if (it.disabled) {
        cb.disabled = true;
        cb.checked = false;
        // 已經喺已選名單入面就要清走——否則佢之前勾過（或者由群組勾入）
        // 嗰個人會留喺 `selected` 入面，而畫面上顯示未勾。
        if (o.selected[it.key]) o.selected[it.key] = false;
        line.className = 'check-row muted';
      } else {
        cb.checked = o.selected[it.key] === true;
        cb.addEventListener('change', () => {
          o.selected[it.key] = cb.checked;
          if (o.onToggle) o.onToggle();
        });
      }
      line.appendChild(cb);
      line.appendChild(make('span', {
        text: it.label + (it.note ? ('　' + it.note) : '') + (it.warn ? ('　' + it.warn) : '')
      }));
      box.appendChild(line);
    });
    nodes.push(box);
    return nodes;
  }

  /**
   * 第四十二輪批次 D 組：**「這一次儲存了哪幾格」呢一段，三個出口共用。**
   *
   * ⚠️ 三個儲存出口（〔儲存我的修改〕、〔接受這個建議版本〕、
   * 套用申報）各寫一次嘅話，格式會慢慢長得唔一樣，
   * 而幹事會以為嗰個係三件唔同嘅事。
   *
   * ⚠️ 超過 10 格就只列頭 10 格，並且**明明白白講仲有幾多格**——
   * 靜靜截斷嘅話，佢會以為系統只動咗十格。
   *
   * @param {Object[]} changes `savedChanges`
   * @param {number=} fallbackCount 攞唔到明細嗰陣至少講返個數
   * @returns {Node[]} 可以直接 push 落彈窗嘅節點
   */
  const SAVED_CHANGE_ROW_LIMIT_UI = 10;

  function savedChangeNodes(changes, fallbackCount) {
    const list = changes || [];
    if (list.length === 0) {
      // 攞唔到明細都要講返個數——**唔可以乜都唔講**。
      if (fallbackCount > 0) {
        return [make('div', {
          text: '套用了 ' + fallbackCount + ' 格改動。', className: 'ok-line'
        })];
      }
      return [];
    }

    const box = make('div', { className: 'sec' }, [
      sectionTitle('這一次儲存了這 ' + list.length + ' 格')
    ]);
    list.slice(0, SAVED_CHANGE_ROW_LIMIT_UI).forEach((c) => {
      box.appendChild(make('div', {
        text: c.serviceDate + '　' + c.postNameTC
          + (Number(c.slotIndex) > 1 ? (' ' + c.slotIndex) : '')
          + '　' + c.fromName + ' → ' + c.toName
          // ⚠️ 申報帶嚟嗰啲一定要標出嚟。唔標嘅話，幹事會以為
          // 嗰幾格係佢自己改嘅——然後去搵一個唔存在嘅記憶。
          + (c.source === 'REQUEST' ? '（來自修改申報）' : ''),
        className: 'ok-line'
      }));
    });
    if (list.length > SAVED_CHANGE_ROW_LIMIT_UI) {
      box.appendChild(make('div', {
        text: '另有 ' + (list.length - SAVED_CHANGE_ROW_LIMIT_UI)
          + ' 格，完整清單見版本備註。',
        className: 'muted'
      }));
    }
    return [box];
  }

  /* ══════════════════════════════════════════════════════════════
   * 第四十三輪批次 F 組：自行輸入電郵（寄出 ＋ 紙本共用）
   * ══════════════════════════════════════════════════════════════
   *
   * Ivan：「寄出及處理紙本，可以自行輸入 email（可以入多個 emails）」
   *
   * ⚠️ 呢啲地址**唔會存入 `NameMapping`**，淨係影響今次。
   * 存入去就變成一個冇 PersonID、冇資格、冇服侍紀錄嘅「半個人」——
   * 而嗰種半個人喺呢個系統入面出過好多次事。
   *
   * ⚠️ 格式一唔啱就**即刻標紅**，唔係等佢撳落去先講。
   * 等到撳落去先講，佢已經行咗三步，要退返出嚟重做。
   */

  /** 一個寬鬆但夠用嘅電郵格式檢查。**同後端嗰個係同一套準則。** */
  function looksLikeEmail(text) {
    return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(text || '').trim());
  }

  /**
   * 把一段文字拆成一批電郵地址。逗號、分號、換行、空格都當成分隔。
   * @param {string} raw 幹事打嘅嘢
   * @returns {{valid: string[], invalid: string[]}}
   */
  function parseEmailList(raw) {
    const parts = String(raw || '').split(/[\s,;]+/)
      .map((x) => x.trim()).filter((x) => x !== '');
    const valid = [];
    const invalid = [];
    parts.forEach((p) => {
      // ⚠️ 重複嘅唔算錯，但只留一個——寄兩封一模一樣嘅信俾同一個人
      // 唔係佢想要嘅，而佢多數係貼上嗰陣重複咗。
      if (!looksLikeEmail(p)) { invalid.push(p); return; }
      if (valid.indexOf(p) === -1) valid.push(p);
    });
    return { valid: valid, invalid: invalid };
  }

  /**
   * 「自行輸入電郵」嗰格。**寄出同紙本兩個彈窗共用。**
   *
   * @param {Object} store 要把結果放落邊個物件（會寫 `extraEmails`／`extraEmailsRaw`）
   * @param {string} note 一句補充（兩邊講嘅嘢唔同）
   * @returns {Node}
   */
  function buildExtraEmailBox(store, note) {
    const box = make('div', { className: 'sec' }, [
      sectionTitle('另外自行輸入電郵（可以留空）')
    ]);
    const input = document.createElement('textarea');
    input.rows = 2;
    input.placeholder = 'someone@example.invalid, another@example.invalid';
    input.value = store.extraEmailsRaw || '';
    const msg = make('div', { className: 'muted' });

    const refresh = () => {
      const r = parseEmailList(input.value);
      input.classList.toggle('bad-input', r.invalid.length > 0);
      if (r.invalid.length > 0) {
        msg.className = 'vio-row';
        msg.textContent = '這 ' + r.invalid.length + ' 個看起來不是電郵地址：'
          + r.invalid.join('、');
      } else if (r.valid.length > 0) {
        msg.className = 'ok-line';
        msg.textContent = '會另外寄給這 ' + r.valid.length + ' 個地址。' + (note || '');
      } else {
        msg.className = 'muted';
        msg.textContent = '用逗號或者換行分開，可以入多過一個。' + (note || '');
      }
    };
    input.addEventListener('input', () => {
      store.extraEmailsRaw = input.value;
      refresh();
    });
    refresh();

    box.appendChild(input);
    box.appendChild(msg);
    box.appendChild(make('div', {
      text: '這幾個地址不會加入人員名單，只影響這一次。',
      className: 'muted'
    }));
    return box;
  }

  /**
   * 把輸入格的內容定下來。**格式不對就擋住，並且講明。**
   * @param {Object} store 同 `buildExtraEmailBox()` 那一個
   * @returns {boolean} 可不可以行落去
   */
  function commitExtraEmails(store) {
    const r = parseEmailList(store.extraEmailsRaw || '');
    if (r.invalid.length > 0) {
      setStatus('這 ' + r.invalid.length + ' 個看起來不是電郵地址：'
        + r.invalid.join('、') + '。改好或者刪走再撳一次。', true);
      return false;
    }
    store.extraEmails = r.valid;
    return true;
  }

  /** 全選／全不選那兩粒掣。兩個名單都要有——五十幾個人逐個撳唔現實。 */
  function pickListBulkButtons(items, selected, onRedraw) {
    return [
      button('全部選擇', () => {
        // ⚠️ 第四十四輪批次 B 組：勾唔到嗰啲唔可以由「全部選擇」偷偷勾入。
        items.forEach((it) => { if (!it.disabled) selected[it.key] = true; });
        onRedraw();
      }, 'secondary'),
      button('全部不選', () => {
        items.forEach((it) => { selected[it.key] = false; });
        onRedraw();
      }, 'secondary')
    ];
  }

  // ── 彈窗（規格 1.4）────────────────────────────────────────

  let modalOpen = false;

  /**
   * 開一個彈窗。**一個動作只有一個確認畫面。**
   * @param {string} title 標題
   * @param {Node[]} bodyNodes 內容
   * @param {Node[]} actionNodes 底部掣
   */
  function openModal(title, bodyNodes, actionNodes) {
    el('modalTitle').textContent = title;
    const body = clear(el('modalBody'));
    (bodyNodes || []).forEach((n) => { if (n) body.appendChild(n); });
    const actions = clear(el('modalActions'));
    (actionNodes || []).forEach((n) => { if (n) actions.appendChild(n); });
    // ⚠️ 第四十四輪批次 C 組：換一個彈窗就要清走上一個嘅訊息——
    // 留住嘅話，幹事會喺一個全新嘅彈窗上面見到一句同佢無關嘅紅字。
    clearModalStatus_();
    el('modalBackdrop').hidden = false;
    modalOpen = true;
    body.scrollTop = 0;
  }

  /** 第四十四輪批次 C 組：清走彈窗嗰條訊息列。 */
  function clearModalStatus_() {
    const node = el('modalStatus');
    if (!node) return;
    node.textContent = '';
    node.hidden = true;
  }

  function closeModal() {
    el('modalBackdrop').hidden = true;
    clear(el('modalBody'));
    clear(el('modalActions'));
    clearModalStatus_();
    modalOpen = false;
  }

  /** 關彈窗＋重新載入整頁狀態。動作完成／取消一律行呢個。 */
  async function closeModalAndRefresh() {
    closeModal();
    await runAction('重新整理', loadDashboard);
  }

  /**
   * 規格 1.4：確認畫面。
   *
   * @param {Object} opts
   *   `title` 標題／`bodyNodes` 內容（**一定要有數字**）／
   *   `confirmLabel` 確認掣文字／`onConfirm` 確認之後做咩／
   *   `requireTyping` 係咪要打字確認（只有不可逆動作先用）／
   *   `typingHint` 打字格上面嗰句提示
   */
  function openConfirm(opts) {
    const body = (opts.bodyNodes || []).slice();
    let input = null;

    if (opts.requireTyping) {
      const box = make('div', { className: 'confirm-typing' });
      box.appendChild(make('p', {
        text: opts.typingHint || '這個動作不可逆。確定的話，請在下面輸入「' + CONFIRM_PHRASE + '」兩個字：',
        className: 'lines'
      }));
      input = document.createElement('input');
      input.type = 'text';
      input.placeholder = CONFIRM_PHRASE;
      input.autocomplete = 'off';
      box.appendChild(input);
      body.push(box);
    }

    const confirmBtn = button(opts.confirmLabel || '確定', () => {
      const typed = input ? input.value.trim() : '';
      if (opts.requireTyping && typed !== CONFIRM_PHRASE) {
        // 前端呢層只係提早俾回饋；後端一樣會再驗一次，唔靠畫面做關卡。
        setStatus('請輸入「' + CONFIRM_PHRASE + '」兩個字才可以繼續。', true);
        if (input) input.focus();
        return;
      }
      setStatus('');
      opts.onConfirm(typed);
    }, opts.danger ? 'danger' : '');

    // 規格 1.4.5：確認畫面永遠有「取消」，取消＝零改動、零寄出。
    //
    // ⚠️ 第三十九輪批次 C 組：加咗三個**可選**參數，預設行為完全冇變。
    //   cancelLabel　　「取消」嗰粒掣寫咩字。有啲情況「取消」唔係最啱嘅講法
    //   　　　　　　　（例如「先去儲存」——嗰個係另一條路，唔係放棄）
    //   onCancel　　　撳嗰粒掣之後除咗關窗仲要做咩
    //   extraActions　中間插幾粒掣（例如「改為再寄一次審閱本」）
    //
    // ⚠️ 唔論點樣，**永遠都有一粒掣可以乜都唔做咁走**——
    // 一個冇出口嘅確認畫面等於逼人撳「確定」。
    const cancelBtn = button(opts.cancelLabel || '取消', () => {
      if (opts.onCancel) { opts.onCancel(); return; }
      closeModal();
    }, 'secondary');
    openModal(opts.title, body,
      [confirmBtn].concat(opts.extraActions || []).concat([cancelBtn]));
    if (input) input.focus();
  }

  // ── 錯誤顯示（規格 1.5）──────────────────────────────────────

  /**
   * 三段式錯誤。後端拋嘅訊息本身已經係三段式（`buildThreePartMessage_()`），
   * 所以呢度會嘗試拆返出嚟排靚；拆唔到就原文顯示。
   *
   * ⚠️ exception 原文唔會直接貼上畫面——收埋喺「複製技術詳情」後面。
   * 幹事睇到一串英文 stack trace 只會驚，幫唔到佢。
   */
  function showErrorModal(title, err) {
    const raw = err && err.message ? err.message : String(err);
    const nodes = [];
    const parsed = parseThreePartMessage(raw);

    if (parsed) {
      nodes.push(errorPart(ERR_LABEL_WHAT, parsed.what));
      nodes.push(errorPart('現在的情況', parsed.state));
      const doBox = make('div', { className: 'err-part' });
      doBox.appendChild(make('div', { text: '你可以怎樣做', className: 'err-label' }));
      const ul = make('ul', { className: 'err-list' });
      parsed.actions.forEach((a) => ul.appendChild(make('li', { text: a })));
      doBox.appendChild(ul);
      nodes.push(doBox);
    } else {
      // 拆唔到三段：唔好扮到有三段。誠實顯示原文，但仍然俾一條出路。
      nodes.push(errorPart(ERR_LABEL_WHAT, raw));
      nodes.push(errorPart('現在的情況',
        '這個動作沒有完成。系統沒有寄出任何電郵。'
        + '職事表有沒有被改動，要看下面的技術詳情或者去「檢查各版本派工紀錄」核對。'));
      const doBox = make('div', { className: 'err-part' });
      doBox.appendChild(make('div', { text: '你可以怎樣做', className: 'err-label' }));
      const ul = make('ul', { className: 'err-list' });
      ul.appendChild(make('li', { text: '重新整理再試一次' }));
      ul.appendChild(make('li', { text: '如果一直失敗，把下面的技術詳情複製給開發者' }));
      doBox.appendChild(ul);
      nodes.push(doBox);
    }

    nodes.push(buildTechDetails(raw));
    openModal(title, nodes, [button('知道了', () => closeModal(), '')]);
  }

  /**
   * 三段式訊息第一段嘅**顯示標籤**。
   *
   * ⚠️ 第四十一輪批次 I 組：本來寫「發生了什麼」。Ivan 實測講明
   * 「讀起嚟好似報告一件已經發生咗嘅事」——而好多時嗰一段講嘅係
   * 「呢一季仲未有公開連結」呢種**前置條件未夠**，根本冇嘢發生過。
   * 佢見到嗰四個字會即刻以為系統壞咗。
   *
   * ⚠️ 後端傳過嚟嗰個分隔標記**仍然係**「發生了什麼：」
   *（見 `buildThreePartMessage_()`）。嗰個係機器格式，唔係俾人睇嘅字：
   * 改咗佢就要同時改晒所有已經拋緊三段式訊息嘅地方，
   * 而漏一個就會變成「拆唔到三段」，畫面會退返去顯示原文。
   * 顯示標籤同機器標記分開，改字先至安全。
   */
  const ERR_LABEL_WHAT = '要留意';

  function errorPart(label, text) {
    return make('div', { className: 'err-part' }, [
      make('div', { text: label, className: 'err-label' }),
      make('div', { text: text, className: 'err-text' })
    ]);
  }

  /**
   * 三段式訊息 ⇒ 一組節點（**唔係錯誤**嗰種場合用，例如確認畫面）。
   *
   * ⚠️ 第四十二輪批次 E 組：以前呢啲地方直接 `para(rawMessage)`，
   * 於是「發生了什麼：」呢個**機器標記**原封不動印咗上畫面。
   * 拆唔到三段就照原文顯示——**唔可以扮到有三段**。
   *
   * @param {string} text 後端嘅三段式訊息
   * @returns {Node[]} 節點
   */
  function threePartNodes(text) {
    const parsed = parseThreePartMessage(String(text || ''));
    if (!parsed) return [para(String(text || ''))];
    const nodes = [errorPart(ERR_LABEL_WHAT, parsed.what), errorPart('現在的情況', parsed.state)];
    if (parsed.actions.length > 0) {
      const box = make('div', { className: 'err-part' });
      box.appendChild(make('div', { text: '你可以怎樣做', className: 'err-label' }));
      const ul = make('ul', { className: 'err-list' });
      parsed.actions.forEach((a) => ul.appendChild(make('li', { text: a })));
      box.appendChild(ul);
      nodes.push(box);
    }
    return nodes;
  }

  /** 把後端 `buildThreePartMessage_()` 出嚟嘅字串拆返三段。 */
  function parseThreePartMessage(raw) {
    if (raw.indexOf('發生了什麼：') === -1 || raw.indexOf('現在的情況：') === -1) return null;
    const whatStart = raw.indexOf('發生了什麼：') + '發生了什麼：'.length;
    const stateIdx = raw.indexOf('現在的情況：');
    const doIdx = raw.indexOf('你可以怎樣做：');
    const what = raw.slice(whatStart, stateIdx).trim();
    const state = raw.slice(stateIdx + '現在的情況：'.length, doIdx === -1 ? undefined : doIdx).trim();
    const actions = doIdx === -1 ? [] : raw.slice(doIdx + '你可以怎樣做：'.length)
      .split('\n')
      .map((s) => s.replace(/^[\s　]*[・·]\s*/, '').trim())
      .filter((s) => s !== '');
    return { what: what, state: state, actions: actions };
  }

  /** 「複製技術詳情」——預設收埋。 */
  function buildTechDetails(raw) {
    const wrap = make('div', { className: 'tech' });
    const btn = button('複製技術詳情', () => {
      const ta = document.createElement('textarea');
      ta.value = raw;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); setStatus('技術詳情已複製。'); }
      catch (e) { setStatus('複製不到，請自己選取下面的文字。', true); }
      document.body.removeChild(ta);
      pre.hidden = false;
    }, 'link');
    const pre = make('pre', { text: raw, className: 'tech-pre' });
    pre.hidden = true;
    wrap.appendChild(btn);
    wrap.appendChild(pre);
    return wrap;
  }

  // ── 共用小元件 ───────────────────────────────────────────────

  /** 一粒區一嘅大掣。變灰時下面一行灰字寫「怎樣才撳得到」（規格 1.6）。 */
  function bigButton(opts) {
    const card = make('div', { className: 'act ' + (opts.enabled ? 'act-on' : 'act-off') });
    const left = make('div', { className: 'act-main' }, [
      make('div', { text: opts.buttonName, className: 'act-name' }),
      make('div', { text: opts.dynamicText || '', className: 'act-desc' })
    ]);
    if (!opts.enabled && opts.disabledReason) {
      left.appendChild(make('div', { text: opts.disabledReason, className: 'act-why' }));
    }
    card.appendChild(left);

    const b = button(opts.buttonLabel || '開始', opts.onClick, opts.danger ? 'danger' : '');
    b.disabled = !opts.enabled;
    card.appendChild(b);
    return card;
  }

  /** 一節清單（有標題＋逐行）。空嘅時候唔顯示，避免畫面塞滿「0 筆」。 */
  function listSection(title, items, renderItem, emptyText) {
    if ((!items || items.length === 0) && !emptyText) return null;
    const box = make('div', { className: 'sec' }, [sectionTitle(title)]);
    if (!items || items.length === 0) {
      box.appendChild(make('div', { text: emptyText, className: 'muted' }));
      return box;
    }
    items.forEach((it) => box.appendChild(renderItem(it)));
    return box;
  }

  /** 顯示規則違反四組（規格步 1.5）。 */
  /* ── 第三十九輪批次 A 組第 3 步：確認清單要講人話 ───────────
   *
   * 原本一行係噉：
   *   `2027-07-11　主席#1　陳大文　HARD_ELIGIBILITY`
   *
   * 對幹事嚟講，`HARD_ELIGIBILITY` 同一串亂碼冇分別。改成：
   *   `7 月 11 日　主席　陳大文——他未做過主席`
   *
   * ⚠️ 對唔上嘅規則代號**照樣要印出嚟**，唔可以靜靜變成空白——
   * 印一個代號，最少查得返；印空白就等於話「呢一格冇問題」。
   */

  /** 規則代號 → 一句人話。對唔上就回原文（見上面）。 */
  const RULE_SENTENCE = {
    HARD_ELIGIBILITY: '他未做過這個崗位',
    HARD_DISTINCT_SLOT: '同一日這個崗位排了同一個人兩次',
    HARD_UNAVAILABLE: '他已經申報那一日不能服侍',
    HARD_COMMUNION_FIRST_SUNDAY: '這一週不設這個崗位',
    HARD_NO_AUTO_PREACHER: '這個崗位不由系統排，要你自己填',
    HARD_SPECIAL_SUNDAY_SKIP: '那一個主日是特別主日，這個崗位跳過',
    HARD_MUTEX_GROUP: '他同一日已經做了另一個不可以兼任的崗位',
    HARD_ROLE_REQUIRED: '這個崗位要求某個身分，他那一日沒有',
    HARD_PERSON_POST_EXCLUDED: '名單上寫明他暫時不做這個崗位',
    SEMI_NO_CONSECUTIVE: '他連續兩週都做這個崗位'
  };

  /**
   * `2027-07-11` → `7 月 11 日`。
   * ⚠️ 認唔出格式就回原文——**唔可以回空白**。
   */
  function humanDate(text) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(text || '').trim());
    if (!m) return String(text || '');
    return Number(m[2]) + ' 月 ' + Number(m[3]) + ' 日';
  }

  /** 一格違反 → 一句人話。 */
  function humanViolationLine(x) {
    const post = (x.postNameTC || x.postId || '');
    // 單一 slot 嘅崗位唔使寫 `#1`——嗰個編號對幹事冇意義。
    const slot = (Number(x.slotIndex) > 1) ? (' ' + x.slotIndex) : '';
    const who = x.personName ? ('　' + x.personName) : '';
    const why = RULE_SENTENCE[x.ruleId] || x.reason || x.ruleId || '';
    return humanDate(x.serviceDate) + '　' + post + slot + who
      + (why ? ('——' + why) : '');
  }

  function renderViolations(v) {
    const nodes = [];
    const describe = humanViolationLine;

    if (v.real && v.real.length > 0) {
      const box = make('div', { className: 'vio vio-hard' });
      box.appendChild(make('div', {
        text: '⚠️ 違反了一定要遵守的規則：' + v.real.length + ' 格',
        className: 'vio-head'
      }));
      v.real.forEach((x) => box.appendChild(make('div', { text: describe(x), className: 'vio-row' })));
      nodes.push(box);
    }
    if (v.released && v.released.length > 0) {
      const box = make('div', { className: 'vio vio-info' });
      box.appendChild(make('div', {
        text: 'ℹ️ 你之前已經放行過，或者是版本生成之後才新增的申報：'
          + v.released.length + ' 格（不用再處理）',
        className: 'vio-head'
      }));
      v.released.forEach((x) => box.appendChild(make('div', { text: describe(x), className: 'vio-row' })));
      nodes.push(box);
    }
    if (v.structural && v.structural.length > 0) {
      const box = make('div', { className: 'vio vio-info' });
      box.appendChild(make('div', {
        text: 'ℹ️ 這一週結構上本來就不適用：' + v.structural.length + ' 格（不用處理）',
        className: 'vio-head'
      }));
      nodes.push(box);
    }
    if (v.semiHard && v.semiHard.length > 0) {
      const box = make('div', { className: 'vio vio-warn' });
      box.appendChild(make('div', {
        text: '提示：' + v.semiHard.length + ' 格觸發了「盡量避免」的規則（例如連續兩週），'
          + '不會阻擋你繼續。',
        className: 'vio-head'
      }));
      v.semiHard.forEach((x) => box.appendChild(make('div', { text: describe(x), className: 'vio-row' })));
      nodes.push(box);
    }
    if (nodes.length === 0) {
      nodes.push(make('div', { text: '規則檢查：沒有發現任何問題 ✓', className: 'ok-line' }));
    }
    return make('div', {}, nodes);
  }

  // ── 頂部：季度、狀態卡 ───────────────────────────────────────

  async function loadQuarters() {
    const quarters = await callServer('apiListQuarters');
    const select = clear(el('quarter'));

    if (!quarters || quarters.length === 0) {
      el('statusCard').hidden = true;
      setStatus('Quarters 工作表沒有任何季度資料。請先在試算表建立季度，'
        + '或用選單「準備工作 ▸ 新增季度」。', true);
      return;
    }

    quarters.forEach((q) => {
      const option = document.createElement('option');
      option.value = q.quarterId;
      // 規格 1.1：寫人話，唔寫 2026T4
      option.textContent = (q.label || q.quarterId)
        + (q.startDate ? '（' + q.startDate + ' 開始）' : '');
      select.appendChild(option);
    });

    currentQuarterId = select.value;
    await loadDashboard();
  }

  /**
   * 全頁唯一嘅狀態來源。**唔可以逐粒掣各自打後端。**
   *
   * ⚠️ 階段 A：全前端**只有呢一個函式**可以賦值畀狀態快取。
   * @param {{keepModal: (boolean|undefined)}=} opts
   *   `keepModal` ＝ 唔好關現有彈窗。寫入動作之後嘅自動刷新會用，
   *   因為嗰陣時幹事仲喺一個畫面入面做緊嘢，關咗就等於打斷佢。
   */
  async function loadDashboard(opts) {
    if (!currentQuarterId) return;
    if (!(opts && opts.keepModal)) closeModal();
    dashboardState_ = await callServer('apiGetDashboardState', currentQuarterId);
    dashboardStale_ = false;
    renderTop(dashboardState_);
    // ⚠️ 第三十九輪批次 A 組：主流程要行喺最前——佢係幹事九成時間睇嘅嘢。
    //
    // 佢**唔可以**令成個載入失敗：主流程掛咗，落面四區同狀態卡照樣要出，
    // 否則幹事會見到一版接近空白嘅畫面而完全唔知發生咩事。
    // 所以獨立 try/catch，出事就喺主流程嗰格寫一句，其餘照畫。
    try {
      await renderMainFlow(dashboardState_);
    } catch (err) {
      const box = clear(el('mainFlowBody'));
      box.appendChild(make('div', { className: 'warnbox' }, [
        make('div', {
          text: '主流程畫不出來：' + (err && err.message ? err.message : String(err))
            + '　落面的功能仍然用得到。',
          className: 'lines'
        })
      ]));
    }
    renderZone1(dashboardState_);
    renderZone2Head(dashboardState_);
    renderZone4(dashboardState_);

    // ⚠️ 第四十三輪批次 A 組：**重畫完要重新鎖一次。**
    //
    // 呢個函式會 `clear()` 再 `appendChild()`，即係造出一批全新嘅掣，
    // 而嗰批新掣冇人幫佢哋設過 `disabled`。忙碌期間重畫過一次
    //（`runAction()` 嘅 `finally` 就會），鎖就自己冇咗一半
    // ——嗰個正正就係 Ivan 講嘅「畫面好似重新整理咗，我可以自由撳」。
    //
    // CSS 嗰層唔怕重畫（`body.is-busy` 自動蓋住新節點），
    // 但鍵盤嗰層要補返。
    reapplyBusyLockIfNeeded_();
  }

  function renderTop(d) {
    el('statusCard').hidden = false;
    el('statusText').textContent = d.statusText || '';

    const v = d.latestVersion;
    el('statusVersion').textContent = v
      ? ('目前第 ' + v.versionNo + ' 版　' + (v.createdAt || '') + '　' + (v.basisText || ''))
      : '這一季還沒有任何版本。';

    // 第二十五輪批次階段 A6：常駐「開啟職事表」連結。
    // 後端攞唔到工作表就會回空字串——**噉就唔畫個連結**，
    // 唔可以畫一條開唔到嘅連結出嚟（見 buildGridSheetUrl_() 嘅說明）。
    const linkBox = clear(el('statusLink'));
    if (v && v.sheetUrl) {
      const a = document.createElement('a');
      a.href = v.sheetUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '開啟職事表';
      a.className = 'sheetlink';
      linkBox.appendChild(a);
      linkBox.appendChild(make('span', {
        text: '（在新分頁打開，可以直接改格子）', className: 'muted'
      }));
      linkBox.hidden = false;
    } else {
      linkBox.hidden = true;
    }

    const badge = el('dryRunBadge');
    badge.hidden = !d.isDryRun;
    badge.textContent = '測試模式：不會真的寄出任何電郵';
    badge.className = 'badge badge-dryrun';
    // 第四十一輪批次 H 組：轉寄測試地址。同「測試模式」嗰個並排。
    //
    // ⚠️ 兩個係獨立嘅：DRY_RUN=TRUE 淨係模擬；轉寄地址有值就算 DRY_RUN=FALSE
    // 都會真係寄，只係全部寄去同一個地址。兩者可以同時出現。
    const redirect = el('mailRedirectBadge');
    const redirectText = String(d.mailRedirectBadge || '');
    redirect.hidden = redirectText === '';
    redirect.textContent = redirectText;
    redirect.className = 'badge badge-dryrun';
  }

  // ── 收摺區 ───────────────────────────────────────────────────

  /**
   * 第二十五輪批次階段 A：**「呢個區載入咗未」嘅唯一真相來源。**
   *
   * ─────────────────────────────────────────────────────────────
   * 呢度修緊嘅 bug（Ivan 實測撞到）
   * ─────────────────────────────────────────────────────────────
   *
   * 換季度之後，區二嘅標題（「還有 N 項未做」）正確更新咗，
   * 但下面五項清單仍然顯示上一個季度嘅數字。
   *
   * 成因：**同一個狀態有兩個旗標，換季度只重設咗其中一個。**
   *   `wireZoneToggle()` 內部有個 closure 變數 `loaded`
   *   `ScriptZone2.html` 另外有個 `zone2Loaded`
   * 換季度只重設咗後者，所以區二一開過之後，`onFirstOpen` 永遠唔會再叫。
   *
   * 呢個係本專案最危險嗰類 bug：**畫面顯示上一個季度嘅數字，
   * 但睇落完全正常**——冇錯誤、冇空白、冇任何訊號。
   *
   * ─────────────────────────────────────────────────────────────
   * 點解係一個物件而唔係「每次展開都重新攞」
   * ─────────────────────────────────────────────────────────────
   *
   * 「每次展開都重新攞」都解決到呢個 bug，但會令幹事每次摺埋再打開
   * 都等一次伺服器來回。保留快取、但令「清走快取」係**一個動作**，
   * 先係兩邊都啱。
   *
   * ⚠️ 關鍵設計：`resetAllZoneLoadState()` 係**整個物件掉走**，
   * 唔係逐個區列名重設。所以將來加區三、區四內容嗰陣，
   * **唔使記得去改重設嗰段**——漏改就係呢個 bug 再中一次。
   */
  let zoneLoadState = {};

  /** 換季度時叫。整個掉走，唔逐個列名——列名就會有漏。 */
  function resetAllZoneLoadState() {
    zoneLoadState = {};
  }

  /**
   * 標記一個區「已載入」，回傳**之前**係咪已經載入過。
   *
   * 俾唔行 `wireZoneToggle()` 嗰條路嘅情況用（例如 `setZoneOpen()`
   * 直接展開）。一律經呢度，就唔會有人喺自己個檔案另開一個旗標。
   * @param {string} bodyId 區身元素 id
   * @returns {boolean} true ＝ 之前已經載入過，唔使再做
   */
  function markZoneLoaded(bodyId) {
    const was = !!zoneLoadState[bodyId];
    zoneLoadState[bodyId] = true;
    return was;
  }

  /**
   * 接一個收摺區嘅開關。
   * @param {string} headId 區頭元素 id
   * @param {string} bodyId 區身元素 id
   * @param {?function()} onOpen 第一次展開（或者換季度之後第一次展開）時做嘅嘢
   */
  function wireZoneToggle(headId, bodyId, onOpen) {
    el(headId).addEventListener('click', () => {
      const body = el(bodyId);
      const willOpen = body.hidden;
      body.hidden = !willOpen;
      el(headId).setAttribute('aria-expanded', String(willOpen));
      // 用 bodyId 做 key——每個區天然唯一，唔使另外維護一份區名清單。
      if (willOpen && !zoneLoadState[bodyId] && onOpen) {
        zoneLoadState[bodyId] = true;
        // ⚠️ 一定要包 `runAction()`：`onOpen` 可以係 async（要 await
        // `getDashboard()`）。唔包嘅話失敗會變成一個冇人處理嘅 rejected
        // promise——區展開咗但係空白，冇任何錯誤訊息。
        runAction('載入', async () => { await onOpen(); });
      }
    });
  }

  function setZoneOpen(headId, bodyId, open) {
    el(bodyId).hidden = !open;
    el(headId).setAttribute('aria-expanded', String(open));
  }

  // ── 深色／淺色（沿用第十一輪嘅做法）──────────────────────────

  const THEME_STORAGE_KEY = 'hwcRosterTheme';
  let themeLocalStorageOk = true;

  function themeLocalStorageProbe() {
    try {
      window.localStorage.setItem('__hwcProbe__', '1');
      window.localStorage.removeItem('__hwcProbe__');
      return true;
    } catch (err) { return false; }
  }
  function currentEffectiveTheme() {
    const explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'dark' || explicit === 'light') return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme);
    else root.removeAttribute('data-theme');
    const btn = el('themeToggleBtn');
    if (btn) btn.textContent = currentEffectiveTheme() === 'dark' ? '☀️ 淺色模式' : '🌙 深色模式';
  }
  async function initThemeToggle() {
    themeLocalStorageOk = themeLocalStorageProbe();
    if (themeLocalStorageOk) {
      let stored = null;
      try { stored = window.localStorage.getItem(THEME_STORAGE_KEY); } catch (e) { stored = null; }
      applyTheme(stored || '');
    } else {
      try { applyTheme((await callServer('apiGetThemePreference')) || ''); }
      catch (e) { applyTheme(''); }
    }
    el('themeToggleBtn').addEventListener('click', () => {
      const next = currentEffectiveTheme() === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      if (themeLocalStorageOk) {
        try { window.localStorage.setItem(THEME_STORAGE_KEY, next); return; }
        catch (e) { themeLocalStorageOk = false; }
      }
      // 佢寫 UserProperties（唔係試算表），但一樣要行 mutating 呢條路——
      // 白名單嘅意思係「保證一格都唔會寫」，唔係「寫嘅嘢唔重要」。
      // 破一次例，下一個人就會覺得自己嗰個都可以破。
      callServerMutating('apiSetThemePreference', next).catch(() => {});
    });
  }
</script>
